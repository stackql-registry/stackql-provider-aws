name: Deploy provider microsite

on:
  push:
    branches: [stackql-provider]
    paths:
      - 'stackql_aws_provider/website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stackql_aws_provider/website
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: stackql_aws_provider/website/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Vendor shared Docusaurus config
        run: |
          rm -rf .shared-config
          git clone --depth 1 --branch main https://github.com/stackql/docusaurus-config.git .shared-config

      # 6,400+ SSG pages: parallel worker threads can exhaust the hosted
      # runner's memory and kill the runner agent mid-build ("The operation
      # was canceled"). Swap is the safety net; the env caps below bound
      # the SSG fan-out. Local builds are untouched.
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build site
        env:
          DOCUSAURUS_SSG_WORKER_THREAD_COUNT: '2'
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: stackql_aws_provider/website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
