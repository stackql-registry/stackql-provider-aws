name: Deploy provider microsite (CI build - manual fallback)

# The primary deploy path is LOCAL: `yarn build && yarn deploy` from
# website/ pushes the locally verified build/ to the gh-pages branch,
# which GitHub Pages serves directly (Settings -> Pages -> Deploy from a
# branch -> gh-pages). The site is 6,400+ SSG pages; building it on a
# hosted runner is memory-fragile, so this workflow no longer runs on
# push - it remains as a manually-triggered fallback only.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stackql_aws_provider/website
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: stackql_aws_provider/website/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Vendor shared Docusaurus config
        run: |
          rm -rf .shared-config
          git clone --depth 1 --branch main https://github.com/stackql/docusaurus-config.git .shared-config

      - name: Build site
        env:
          # bound the SSG worker fan-out - hosted runners have a fraction
          # of a dev machine's memory
          DOCUSAURUS_SSG_WORKER_THREAD_COUNT: '2'
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: stackql_aws_provider/website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
