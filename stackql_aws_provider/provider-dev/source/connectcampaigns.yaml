openapi: 3.0.0
info:
  version: '2021-01-30'
  title: AmazonConnectCampaignService
  description: AmazonConnectCampaignService
  x-serviceName: connect-campaigns
  x-serviceAlias: connectcampaigns
  x-protocol: rest-json
  x-apiVersion: '2021-01-30'
  x-endpointPrefix: connect-campaigns
  x-jsonVersion: '1.1'
servers:
- url: https://connect-campaigns.{region}.amazonaws.com
  variables:
    region:
      default: us-east-1
      description: AWS region
  description: Regional endpoint for connectcampaigns
paths:
  /campaigns:
    put:
      operationId: CreateCampaign
      description: Creates a campaign for the specified Amazon Connect account. This API is idempotent.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/CampaignName'
                connectInstanceId:
                  $ref: '#/components/schemas/InstanceId'
                dialerConfig:
                  $ref: '#/components/schemas/DialerConfig'
                outboundCallConfig:
                  $ref: '#/components/schemas/OutboundCallConfig'
                tags:
                  $ref: '#/components/schemas/TagMap'
              required:
              - name
              - connectInstanceId
              - dialerConfig
              - outboundCallConfig
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCampaignResponse'
      x-stackql-resource: campaigns
      x-stackql-method: create_campaign
      x-stackql-verb: INSERT
  /campaigns/{id}:
    delete:
      operationId: DeleteCampaign
      description: Deletes a campaign from the specified Amazon Connect account.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CampaignId'
      responses:
        '200':
          description: Success
      x-stackql-resource: campaigns
      x-stackql-method: delete_campaign
      x-stackql-verb: DELETE
    get:
      operationId: DescribeCampaign
      description: Describes the specific campaign.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CampaignId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeCampaignResponse'
      x-stackql-resource: campaigns
      x-stackql-method: describe_campaign
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.campaign
  /connect-instance/{connect_instance_id}/config:
    delete:
      operationId: DeleteConnectInstanceConfig
      description: Deletes a connect instance config from the specified AWS account.
      parameters:
      - name: connect_instance_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/InstanceId'
      responses:
        '200':
          description: Success
      x-stackql-resource: connect_instance_configs
      x-stackql-method: delete_connect_instance_config
      x-stackql-verb: DELETE
    get:
      operationId: GetConnectInstanceConfig
      description: Get the specific Connect instance config.
      parameters:
      - name: connect_instance_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/InstanceId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConnectInstanceConfigResponse'
      x-stackql-resource: connect_instance_configs
      x-stackql-method: get_connect_instance_config
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.connectInstanceConfig
  /connect-instance/{connect_instance_id}/onboarding:
    delete:
      operationId: DeleteInstanceOnboardingJob
      description: Delete the Connect Campaigns onboarding job for the specified Amazon Connect instance.
      parameters:
      - name: connect_instance_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/InstanceId'
      responses:
        '200':
          description: Success
      x-stackql-resource: instance_onboarding_jobs
      x-stackql-method: delete_instance_onboarding_job
      x-stackql-verb: DELETE
    get:
      operationId: GetInstanceOnboardingJobStatus
      description: Get the specific instance onboarding job status.
      parameters:
      - name: connect_instance_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/InstanceId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInstanceOnboardingJobStatusResponse'
      x-stackql-resource: instance_onboarding_job_status
      x-stackql-method: get_instance_onboarding_job_status
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.connectInstanceOnboardingJobStatus
    put:
      operationId: StartInstanceOnboardingJob
      description: Onboard the specific Amazon Connect instance to Connect Campaigns.
      parameters:
      - name: connect_instance_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                encryptionConfig:
                  $ref: '#/components/schemas/EncryptionConfig'
              required:
              - encryptionConfig
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartInstanceOnboardingJobResponse'
      x-stackql-resource: instance_onboarding_job
      x-stackql-method: start_instance_onboarding_job
      x-stackql-verb: EXEC
  /campaigns/{id}/state:
    get:
      operationId: GetCampaignState
      description: Get state of a campaign for the specified Amazon Connect account.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CampaignId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCampaignStateResponse'
      x-stackql-resource: campaign_states
      x-stackql-method: get_campaign_state
      x-stackql-verb: SELECT
  /campaigns-state:
    post:
      operationId: GetCampaignStateBatch
      description: Get state of campaigns for the specified Amazon Connect account.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaignIds:
                  $ref: '#/components/schemas/GetCampaignStateBatchRequestCampaignIdsList'
              required:
              - campaignIds
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCampaignStateBatchResponse'
      x-stackql-resource: campaign_state_batches
      x-stackql-method: get_campaign_state_batch
      x-stackql-verb: SELECT
  /campaigns-summary:
    post:
      operationId: ListCampaigns
      description: Provides summary information about the campaigns under the specified Amazon Connect account.
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                maxResults:
                  $ref: '#/components/schemas/MaxResults'
                nextToken:
                  $ref: '#/components/schemas/NextToken'
                filters:
                  $ref: '#/components/schemas/CampaignFilters'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCampaignsResponse'
      x-stackql-resource: campaigns
      x-stackql-method: list_campaigns
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.campaignSummaryList
      x-stackql-pagination-request-token-key: nextToken
      x-stackql-pagination-request-token-location: body
      x-stackql-pagination-response-token-key: $.nextToken
  /tags/{arn}:
    get:
      operationId: ListTagsForResource
      description: List tags for a resource.
      parameters:
      - name: arn
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Arn'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTagsForResourceResponse'
      x-stackql-resource: tags
      x-stackql-method: list_tags_for_resource
      x-stackql-verb: SELECT
    post:
      operationId: TagResource
      description: Tag a resource.
      parameters:
      - name: arn
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Arn'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  $ref: '#/components/schemas/TagMap'
              required:
              - tags
      responses:
        '200':
          description: Success
      x-stackql-resource: tags
      x-stackql-method: tag_resource
      x-stackql-verb: UPDATE
    delete:
      operationId: UntagResource
      description: Untag a resource.
      parameters:
      - name: arn
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Arn'
      - name: tagKeys
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/TagKeyList'
      responses:
        '200':
          description: Success
      x-stackql-resource: tags
      x-stackql-method: untag_resource
      x-stackql-verb: UPDATE
  /campaigns/{id}/pause:
    post:
      operationId: PauseCampaign
      description: Pauses a campaign for the specified Amazon Connect account.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CampaignId'
      responses:
        '200':
          description: Success
      x-stackql-resource: campaign
      x-stackql-method: pause_campaign
      x-stackql-verb: EXEC
  /campaigns/{id}/dial-requests:
    put:
      operationId: PutDialRequestBatch
      description: Creates dials requests for the specified campaign Amazon Connect account. This API is idempotent.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dialRequests:
                  $ref: '#/components/schemas/DialRequestList'
              required:
              - dialRequests
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutDialRequestBatchResponse'
      x-stackql-resource: dial_request_batches
      x-stackql-method: put_dial_request_batch
      x-stackql-verb: REPLACE
  /campaigns/{id}/resume:
    post:
      operationId: ResumeCampaign
      description: Stops a campaign for the specified Amazon Connect account.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CampaignId'
      responses:
        '200':
          description: Success
      x-stackql-resource: campaign
      x-stackql-method: resume_campaign
      x-stackql-verb: EXEC
  /campaigns/{id}/start:
    post:
      operationId: StartCampaign
      description: Starts a campaign for the specified Amazon Connect account.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CampaignId'
      responses:
        '200':
          description: Success
      x-stackql-resource: campaign
      x-stackql-method: start_campaign
      x-stackql-verb: EXEC
  /campaigns/{id}/stop:
    post:
      operationId: StopCampaign
      description: Stops a campaign for the specified Amazon Connect account.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CampaignId'
      responses:
        '200':
          description: Success
      x-stackql-resource: campaign
      x-stackql-method: stop_campaign
      x-stackql-verb: EXEC
  /campaigns/{id}/dialer-config:
    post:
      operationId: UpdateCampaignDialerConfig
      description: Updates the dialer config of a campaign. This API is idempotent.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dialerConfig:
                  $ref: '#/components/schemas/DialerConfig'
              required:
              - dialerConfig
      responses:
        '200':
          description: Success
      x-stackql-resource: campaigns
      x-stackql-method: update_campaign_dialer_config
      x-stackql-verb: UPDATE
  /campaigns/{id}/name:
    post:
      operationId: UpdateCampaignName
      description: Updates the name of a campaign. This API is idempotent.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/CampaignName'
              required:
              - name
      responses:
        '200':
          description: Success
      x-stackql-resource: campaigns
      x-stackql-method: update_campaign_name
      x-stackql-verb: UPDATE
  /campaigns/{id}/outbound-call-config:
    post:
      operationId: UpdateCampaignOutboundCallConfig
      description: Updates the outbound call config of a campaign. This API is idempotent.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CampaignId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                connectContactFlowId:
                  $ref: '#/components/schemas/ContactFlowId'
                connectSourcePhoneNumber:
                  $ref: '#/components/schemas/SourcePhoneNumber'
                answerMachineDetectionConfig:
                  $ref: '#/components/schemas/AnswerMachineDetectionConfig'
      responses:
        '200':
          description: Success
      x-stackql-resource: campaigns
      x-stackql-method: update_campaign_outbound_call_config
      x-stackql-verb: UPDATE
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    CampaignName:
      description: The name of an Amazon Connect Campaign name.
      type: string
      minLength: 1
      maxLength: 127
    InstanceId:
      description: Amazon Connect Instance Id
      type: string
      minLength: 0
      maxLength: 256
      pattern: '[a-zA-Z0-9_\-.]*'
    DialerConfig:
      description: The possible types of dialer config parameters
      type: object
      properties:
        progressiveDialerConfig:
          $ref: '#/components/schemas/ProgressiveDialerConfig'
        predictiveDialerConfig:
          $ref: '#/components/schemas/PredictiveDialerConfig'
        agentlessDialerConfig:
          $ref: '#/components/schemas/AgentlessDialerConfig'
    ProgressiveDialerConfig:
      description: Progressive Dialer config
      type: object
      properties:
        bandwidthAllocation:
          $ref: '#/components/schemas/BandwidthAllocation'
        dialingCapacity:
          $ref: '#/components/schemas/DialingCapacity'
      required:
      - bandwidthAllocation
    BandwidthAllocation:
      description: The bandwidth allocation of a queue resource.
      type: number
      format: double
      minimum: 0
      maximum: 1
    DialingCapacity:
      description: Allocates dialing capacity for this campaign between multiple active campaigns
      type: number
      format: double
      minimum: 0.01
      maximum: 1
    PredictiveDialerConfig:
      description: Predictive Dialer config
      type: object
      properties:
        bandwidthAllocation:
          $ref: '#/components/schemas/BandwidthAllocation'
        dialingCapacity:
          $ref: '#/components/schemas/DialingCapacity'
      required:
      - bandwidthAllocation
    AgentlessDialerConfig:
      description: Agentless Dialer config
      type: object
      properties:
        dialingCapacity:
          $ref: '#/components/schemas/DialingCapacity'
    OutboundCallConfig:
      description: The configuration used for outbound calls.
      type: object
      properties:
        connectContactFlowId:
          $ref: '#/components/schemas/ContactFlowId'
        connectSourcePhoneNumber:
          $ref: '#/components/schemas/SourcePhoneNumber'
        connectQueueId:
          $ref: '#/components/schemas/QueueId'
        answerMachineDetectionConfig:
          $ref: '#/components/schemas/AnswerMachineDetectionConfig'
      required:
      - connectContactFlowId
    ContactFlowId:
      description: The identifier of the contact flow for the outbound call.
      type: string
      minLength: 0
      maxLength: 500
    SourcePhoneNumber:
      description: The phone number associated with the Amazon Connect instance, in E.164 format. If you do not specify a
        source phone number, you must specify a queue.
      type: string
      minLength: 0
      maxLength: 100
    QueueId:
      description: The queue for the call. If you specify a queue, the phone displayed for caller ID is the phone number specified
        in the queue. If you do not specify a queue, the queue defined in the contact flow is used. If you do not specify
        a queue, you must specify a source phone number.
      type: string
      minLength: 0
      maxLength: 500
    AnswerMachineDetectionConfig:
      description: Answering Machine Detection config
      type: object
      properties:
        enableAnswerMachineDetection:
          $ref: '#/components/schemas/Boolean'
          description: Enable or disable answering machine detection
        awaitAnswerMachinePrompt:
          $ref: '#/components/schemas/Boolean'
          description: Enable or disable await answer machine prompt
      required:
      - enableAnswerMachineDetection
    Boolean:
      type: boolean
    TagMap:
      description: Tag map with key and value.
      type: object
      properties: {}
    CreateCampaignResponse:
      description: The response for Create Campaign API
      type: object
      properties:
        id:
          $ref: '#/components/schemas/CampaignId'
        arn:
          $ref: '#/components/schemas/CampaignArn'
        tags:
          type: object
          properties: {}
    CampaignId:
      description: Identifier representing a Campaign
      type: string
      minLength: 0
      maxLength: 256
      pattern: '[\S]*'
    CampaignArn:
      description: The resource name of an Amazon Connect campaign.
      type: string
      minLength: 20
      maxLength: 500
    DescribeCampaignResponse:
      description: DescribeCampaignResponse
      type: object
      properties:
        campaign:
          $ref: '#/components/schemas/Campaign'
    Campaign:
      description: An Amazon Connect campaign.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/CampaignId'
        arn:
          $ref: '#/components/schemas/CampaignArn'
        name:
          $ref: '#/components/schemas/CampaignName'
        connectInstanceId:
          $ref: '#/components/schemas/InstanceId'
        dialerConfig:
          $ref: '#/components/schemas/DialerConfig'
        outboundCallConfig:
          $ref: '#/components/schemas/OutboundCallConfig'
        tags:
          type: object
          properties: {}
      required:
      - id
      - arn
      - name
      - connectInstanceId
      - dialerConfig
      - outboundCallConfig
    GetCampaignStateResponse:
      description: GetCampaignStateResponse
      type: object
      properties:
        state:
          $ref: '#/components/schemas/CampaignState'
    CampaignState:
      description: State of a campaign
      type: string
      enum:
      - Initialized
      - Running
      - Paused
      - Stopped
      - Failed
    GetCampaignStateBatchRequestCampaignIdsList:
      description: List of CampaignId
      type: array
      items:
        $ref: '#/components/schemas/CampaignId'
    GetCampaignStateBatchResponse:
      description: GetCampaignStateBatchResponse
      type: object
      properties:
        successfulRequests:
          $ref: '#/components/schemas/SuccessfulCampaignStateResponseList'
        failedRequests:
          $ref: '#/components/schemas/FailedCampaignStateResponseList'
    SuccessfulCampaignStateResponseList:
      description: List of successful response of campaign state
      type: array
      items:
        $ref: '#/components/schemas/SuccessfulCampaignStateResponse'
    SuccessfulCampaignStateResponse:
      description: Successful response of campaign state
      type: object
      properties:
        campaignId:
          $ref: '#/components/schemas/CampaignId'
        state:
          $ref: '#/components/schemas/CampaignState'
    FailedCampaignStateResponseList:
      description: List of failed requests of campaign state
      type: array
      items:
        $ref: '#/components/schemas/FailedCampaignStateResponse'
    FailedCampaignStateResponse:
      description: Failed response of campaign state
      type: object
      properties:
        campaignId:
          $ref: '#/components/schemas/CampaignId'
        failureCode:
          $ref: '#/components/schemas/GetCampaignStateBatchFailureCode'
    GetCampaignStateBatchFailureCode:
      description: A predefined code indicating the error that caused the failure in getting state of campaigns
      type: string
      enum:
      - ResourceNotFound
      - UnknownError
    GetConnectInstanceConfigResponse:
      description: GetConnectInstanceConfigResponse
      type: object
      properties:
        connectInstanceConfig:
          $ref: '#/components/schemas/InstanceConfig'
    InstanceConfig:
      description: Instance config object
      type: object
      properties:
        connectInstanceId:
          $ref: '#/components/schemas/InstanceId'
        serviceLinkedRoleArn:
          $ref: '#/components/schemas/ServiceLinkedRoleArn'
        encryptionConfig:
          $ref: '#/components/schemas/EncryptionConfig'
      required:
      - connectInstanceId
      - serviceLinkedRoleArn
      - encryptionConfig
    ServiceLinkedRoleArn:
      description: Service linked role arn
      type: string
      minLength: 0
      maxLength: 256
    EncryptionConfig:
      description: Encryption config for Connect Instance. Note that sensitive data will always be encrypted. If disabled,
        service will perform encryption with its own key. If enabled, a KMS key id needs to be provided and KMS charges will
        apply. KMS is only type supported
      type: object
      properties:
        enabled:
          $ref: '#/components/schemas/Enabled'
        encryptionType:
          $ref: '#/components/schemas/EncryptionType'
        keyArn:
          $ref: '#/components/schemas/EncryptionKey'
      required:
      - enabled
    Enabled:
      description: Boolean to indicate if custom encryption has been enabled.
      type: boolean
    EncryptionType:
      description: Server-side encryption type.
      type: string
      enum:
      - KMS
    EncryptionKey:
      description: KMS key id/arn for encryption config.
      type: string
      minLength: 0
      maxLength: 500
    GetInstanceOnboardingJobStatusResponse:
      description: GetInstanceOnboardingJobStatusResponse
      type: object
      properties:
        connectInstanceOnboardingJobStatus:
          $ref: '#/components/schemas/InstanceOnboardingJobStatus'
    InstanceOnboardingJobStatus:
      description: Instance onboarding job status object
      type: object
      properties:
        connectInstanceId:
          $ref: '#/components/schemas/InstanceId'
        status:
          $ref: '#/components/schemas/InstanceOnboardingJobStatusCode'
        failureCode:
          $ref: '#/components/schemas/InstanceOnboardingJobFailureCode'
      required:
      - connectInstanceId
      - status
    InstanceOnboardingJobStatusCode:
      description: Enumeration of the possible states for instance onboarding job
      type: string
      enum:
      - IN_PROGRESS
      - SUCCEEDED
      - FAILED
    InstanceOnboardingJobFailureCode:
      description: Enumeration of the possible failure codes for instance onboarding job
      type: string
      enum:
      - EVENT_BRIDGE_ACCESS_DENIED
      - EVENT_BRIDGE_MANAGED_RULE_LIMIT_EXCEEDED
      - IAM_ACCESS_DENIED
      - KMS_ACCESS_DENIED
      - KMS_KEY_NOT_FOUND
      - INTERNAL_FAILURE
    MaxResults:
      description: The maximum number of results to return per page.
      type: integer
      minimum: 1
      maximum: 50
    NextToken:
      description: The token for the next set of results.
      type: string
      minLength: 0
      maxLength: 1000
    CampaignFilters:
      description: Filter model by type
      type: object
      properties:
        instanceIdFilter:
          $ref: '#/components/schemas/InstanceIdFilter'
    InstanceIdFilter:
      description: Connect instance identifier filter
      type: object
      properties:
        value:
          $ref: '#/components/schemas/InstanceId'
        operator:
          $ref: '#/components/schemas/InstanceIdFilterOperator'
      required:
      - value
      - operator
    InstanceIdFilterOperator:
      description: Operators for Connect instance identifier filter
      type: string
      enum:
      - Eq
    ListCampaignsResponse:
      description: ListCampaignsResponse
      type: object
      properties:
        nextToken:
          $ref: '#/components/schemas/NextToken'
        campaignSummaryList:
          $ref: '#/components/schemas/CampaignSummaryList'
    CampaignSummaryList:
      description: A list of Amazon Connect campaigns.
      type: array
      items:
        $ref: '#/components/schemas/CampaignSummary'
    CampaignSummary:
      description: An Amazon Connect campaign summary.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/CampaignId'
        arn:
          $ref: '#/components/schemas/CampaignArn'
        name:
          $ref: '#/components/schemas/CampaignName'
        connectInstanceId:
          $ref: '#/components/schemas/InstanceId'
      required:
      - id
      - arn
      - name
      - connectInstanceId
    Arn:
      description: Arn
      type: string
      minLength: 20
      maxLength: 500
      pattern: arn:.*
    ListTagsForResourceResponse:
      description: ListTagsForResponse
      type: object
      properties:
        tags:
          type: object
          properties: {}
    DialRequestList:
      description: A list of dial requests.
      type: array
      items:
        $ref: '#/components/schemas/DialRequest'
    DialRequest:
      description: A dial request for a campaign.
      type: object
      properties:
        clientToken:
          $ref: '#/components/schemas/ClientToken'
        phoneNumber:
          $ref: '#/components/schemas/DestinationPhoneNumber'
        expirationTime:
          $ref: '#/components/schemas/TimeStamp'
        attributes:
          type: object
          properties: {}
      required:
      - clientToken
      - phoneNumber
      - expirationTime
      - attributes
    ClientToken:
      description: Client provided parameter used for idempotency. Its value must be unique for each request.
      type: string
      minLength: 0
      maxLength: 200
      pattern: '[a-zA-Z0-9_\-.]*'
    DestinationPhoneNumber:
      description: The phone number of the customer, in E.164 format.
      type: string
      minLength: 0
      maxLength: 20
      pattern: '[\d\-+]*'
    TimeStamp:
      description: Timestamp with no UTC offset or timezone
      type: string
      format: date-time
    PutDialRequestBatchResponse:
      description: PutDialRequestBatchResponse
      type: object
      properties:
        successfulRequests:
          $ref: '#/components/schemas/SuccessfulRequestList'
        failedRequests:
          $ref: '#/components/schemas/FailedRequestList'
    SuccessfulRequestList:
      description: A list of successful requests identified by the unique client token.
      type: array
      items:
        $ref: '#/components/schemas/SuccessfulRequest'
    SuccessfulRequest:
      description: A successful request identified by the unique client token.
      type: object
      properties:
        clientToken:
          $ref: '#/components/schemas/ClientToken'
        id:
          $ref: '#/components/schemas/DialRequestId'
    DialRequestId:
      description: Identifier representing a Dial request
      type: string
      minLength: 0
      maxLength: 256
      pattern: '[a-zA-Z0-9_\-.]*'
    FailedRequestList:
      description: A list of failed requests.
      type: array
      items:
        $ref: '#/components/schemas/FailedRequest'
    FailedRequest:
      description: A failed request identified by the unique client token.
      type: object
      properties:
        clientToken:
          $ref: '#/components/schemas/ClientToken'
        id:
          $ref: '#/components/schemas/DialRequestId'
        failureCode:
          $ref: '#/components/schemas/FailureCode'
    FailureCode:
      description: A predefined code indicating the error that caused the failure.
      type: string
      enum:
      - InvalidInput
      - RequestThrottled
      - UnknownError
    StartInstanceOnboardingJobResponse:
      description: The response for StartInstanceOnboardingJob API.
      type: object
      properties:
        connectInstanceOnboardingJobStatus:
          $ref: '#/components/schemas/InstanceOnboardingJobStatus'
    TagKeyList:
      description: List of tag keys.
      type: array
      items:
        $ref: '#/components/schemas/TagKey'
    TagKey:
      description: Tag key.
      type: string
      minLength: 1
      maxLength: 128
      pattern: (?!aws:)[a-zA-Z+-=._:/]+
