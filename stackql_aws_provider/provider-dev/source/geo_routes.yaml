          description: 'Position in World Geodetic System (WGS 84) format: [longitude, latitude].'
        StationDetails:
          $ref: '#/components/schemas/RouteStationDetails'
          description: Details about the station.
        Type:
          $ref: '#/components/schemas/RouteTransitPlaceType'
          description: The type of the place.
        WaypointIndex:
          $ref: '#/components/schemas/RouteTransitPlaceWaypointIndexInteger'
          description: Index of the waypoint in the request.
      required:
      - Position
    RouteTransitPlaceType:
      type: string
      enum:
      - Station
    RouteTransitPlaceWaypointIndexInteger:
      type: integer
      minimum: 0
    RouteTransitTripStatus:
      type: string
      enum:
      - Added
      - Cancelled
      - Replaced
      - Scheduled
    RouteTransitBeforeTravelStepList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTransitBeforeTravelStep'
    RouteTransitBeforeTravelStep:
      description: A step that must be performed before the travel portion of the leg.
      type: object
      properties:
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the step. Unit: seconds'
        Instruction:
          $ref: '#/components/schemas/SensitiveString'
          description: Brief description of the step in the requested language.
        Type:
          $ref: '#/components/schemas/RouteTransitBeforeTravelStepType'
          description: Type of the step.
      required:
      - Duration
      - Type
    RouteTransitBeforeTravelStepType:
      type: string
      enum:
      - Board
    RouteTransitDeparture:
      description: Details corresponding to the departure for the leg.
      type: object
      properties:
        Delay:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'The delay from the scheduled departure time. Unit: seconds'
        Place:
          $ref: '#/components/schemas/RouteTransitPlace'
          description: Place details corresponding to the departure.
        Status:
          $ref: '#/components/schemas/RouteTransitTripStatus'
          description: The status of the departure.
        Time:
          $ref: '#/components/schemas/TimestampWithTimezoneOffset'
          description: The departure time.
      required:
      - Place
    RouteTransitIncidentList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTransitIncident'
    RouteTransitIncident:
      description: An incident describes disruptions on the transit route.
      type: object
      properties:
        Description:
          $ref: '#/components/schemas/SensitiveString'
          description: A human readable description of the incident.
        Effect:
          $ref: '#/components/schemas/RouteTransitIncidentEffect'
          description: The effect of the incident on the transit service.
        EndTime:
          $ref: '#/components/schemas/TimestampWithTimezoneOffset'
          description: The end time of the incident.
        StartTime:
          $ref: '#/components/schemas/TimestampWithTimezoneOffset'
          description: The start time of the incident.
        Type:
          $ref: '#/components/schemas/RouteTransitIncidentType'
          description: Type of the incident.
        Url:
          $ref: '#/components/schemas/SensitiveString'
          description: URL to the original incident published at the agency website.
      required:
      - Effect
      - Type
    RouteTransitIncidentEffect:
      type: string
      enum:
      - Delayed
      - Detoured
      - Other
      - ServiceAdded
      - ServiceCancelled
      - ServiceModified
      - ServiceReduced
      - StopMoved
    RouteTransitIncidentType:
      type: string
      enum:
      - Accident
      - Construction
      - Demonstration
      - Holiday
      - Maintenance
      - MedicalEmergency
      - Other
      - PoliceActivity
      - Strike
      - TechnicalProblem
      - Weather
    RouteTransitIntermediateStopList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTransitIntermediateStop'
    RouteTransitIntermediateStop:
      description: An intermediate stop between departure and destination of the transit route.
      type: object
      properties:
        Attributes:
          $ref: '#/components/schemas/RouteTransitIntermediateStopAttributeList'
          description: Attributes of the intermediate stop.
        Departure:
          $ref: '#/components/schemas/RouteTransitDeparture'
          description: Departure details for the intermediate stop.
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the stop. Unit: seconds'
        GeometryOffset:
          $ref: '#/components/schemas/RouteTransitIntermediateStopGeometryOffsetInteger'
          description: Offset in the leg geometry corresponding to the start of this stop.
        Transport:
          $ref: '#/components/schemas/RouteTransitTransportModeDetails'
          description: Transport mode details at the intermediate stop.
      required:
      - Departure
      - Duration
    RouteTransitIntermediateStopAttributeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTransitIntermediateStopAttribute'
    RouteTransitIntermediateStopAttribute:
      type: string
      enum:
      - NoEntry
      - NoExit
    RouteTransitIntermediateStopGeometryOffsetInteger:
      type: integer
      minimum: 0
    RouteTransitTransportModeDetails:
      description: Transport mode details for the transit leg.
      type: object
      properties:
        Accessibility:
          $ref: '#/components/schemas/RouteAccessibilityAvailabilityDetails'
          description: Wheelchair accessibility information for the transit vehicle.
        Color:
          $ref: '#/components/schemas/HexColor'
          description: Color of the transport polyline and background for the transport name.
        Headsign:
          $ref: '#/components/schemas/SensitiveString'
          description: Transit route headsign.
        LongRouteName:
          $ref: '#/components/schemas/SensitiveString'
          description: Long name of the transit route.
        Mode:
          $ref: '#/components/schemas/RouteTransitMode'
          description: Mode of the transit transport.
        RouteName:
          $ref: '#/components/schemas/SensitiveString'
          description: Transit route name.
        ShortRouteName:
          $ref: '#/components/schemas/SensitiveString'
          description: Short name of the transit route.
        TextColor:
          $ref: '#/components/schemas/HexColor'
          description: Color of the transport name text.
      required:
      - Mode
    HexColor:
      type: string
      pattern: .*#[0-9A-Fa-f]{6}.*
    RouteTransitNextDepartureList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTransitNextDeparture'
    RouteTransitNextDeparture:
      description: Details about the next available departure for the transit service.
      type: object
      properties:
        Delay:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'The delay from the scheduled departure time. Unit: seconds'
        PlatformName:
          $ref: '#/components/schemas/SensitiveString'
          description: Platform name or number for the departure.
        Status:
          $ref: '#/components/schemas/RouteTransitTripStatus'
          description: The status of the departure.
        Time:
          $ref: '#/components/schemas/TimestampWithTimezoneOffset'
          description: The departure time.
        Transport:
          $ref: '#/components/schemas/RouteTransitTransportModeDetails'
          description: Transport mode details for this departure.
      required:
      - Time
    RouteTransitNoticeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTransitNotice'
    RouteTransitNotice:
      description: A notice that indicates an issue that occurred during route calculation.
      type: object
      properties:
        Code:
          $ref: '#/components/schemas/RouteTransitNoticeCode'
          description: Code corresponding to the issue.
        Impact:
          $ref: '#/components/schemas/RouteNoticeImpact'
          description: Impact corresponding to the issue. While Low impact notices can be safely ignored, High impact notices
            must be evaluated further to determine the impact.
      required:
      - Code
    RouteTransitNoticeCode:
      type: string
      enum:
      - AccuratePolylineUnavailable
      - IntermediateStopsUnavailable
      - NoSchedule
      - Other
      - PotentialViolatedVehicleRestrictionUsage
      - ScheduledTimes
      - SeasonalClosure
      - ViolatedAvoidFerry
      - ViolatedAvoidRailFerry
      - ViolatedExcludedTransitMode
      - ViolatedVehicleRestriction
      - ViolatedAvoidAreas
    RouteTransitSpanList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTransitSpan'
    RouteTransitSpan:
      description: Span computed for the requested SpanAdditionalFeatures.
      type: object
      properties:
        Country:
          $ref: '#/components/schemas/CountryCode3'
          description: 3 letter Country code corresponding to the Span.
        Distance:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'Distance of the computed span. This feature doesn''t split a span, but is always computed on a span
            split by other properties. Unit: meters'
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the computed span. This feature doesn''t split a span, but is always computed on a span
            split by other properties. Unit: seconds'
        GeometryOffset:
          $ref: '#/components/schemas/RouteTransitSpanGeometryOffsetInteger'
          description: Offset in the leg geometry corresponding to the start of this span.
        Names:
          $ref: '#/components/schemas/LocalizedStringList'
          description: Names of the transit span in available languages.
        Region:
          $ref: '#/components/schemas/RouteTransitSpanRegionString'
          description: 2-3 letter Region code corresponding to the Span. This is either a province or a state.
    RouteTransitSpanGeometryOffsetInteger:
      type: integer
      minimum: 0
    RouteTransitSpanRegionString:
      type: string
      minLength: 0
      maxLength: 3
    RouteTransitSummary:
      description: Summary of the transit leg.
      type: object
      properties:
        Overview:
          $ref: '#/components/schemas/RouteTransitOverviewSummary'
          description: Summary including duration and distance for the entire leg.
        TravelOnly:
          $ref: '#/components/schemas/RouteTransitTravelOnlySummary'
          description: Summary including duration and distance for the travel portion of the leg only.
    RouteTransitOverviewSummary:
      description: Summary including duration and distance for the entire leg.
      type: object
      properties:
        Distance:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'Distance of the entire leg. Unit: meters'
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the entire leg. Unit: seconds'
      required:
      - Distance
      - Duration
    RouteTransitTravelOnlySummary:
      description: Summary including duration and distance for the travel portion of the leg only.
      type: object
      properties:
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the travel portion of the transit leg. Unit: seconds'
      required:
      - Duration
    RouteTransitTravelStepList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTransitTravelStep'
    RouteTransitTravelStep:
      description: A step that must be performed during the travel portion of the leg.
      type: object
      properties:
        Distance:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'Distance of the step. Unit: meters'
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the step. Unit: seconds'
        GeometryOffset:
          $ref: '#/components/schemas/RouteTransitTravelStepGeometryOffsetInteger'
          description: Offset in the leg geometry corresponding to the start of this step.
        Instruction:
          $ref: '#/components/schemas/SensitiveString'
          description: Brief description of the step in the requested language.
        Type:
          $ref: '#/components/schemas/RouteTransitTravelStepType'
          description: Type of the step.
      required:
      - Duration
      - Type
    RouteTransitTravelStepGeometryOffsetInteger:
      type: integer
      minimum: 0
    RouteTransitTravelStepType:
      type: string
      enum:
      - Depart
    RouteMajorRoadLabelsList:
      type: array
      items:
        $ref: '#/components/schemas/RouteMajorRoadLabel'
    RouteMajorRoadLabel:
      description: Important labels including names and route numbers that differentiate the current route from the alternatives
        presented.
      type: object
      properties:
        RoadName:
          $ref: '#/components/schemas/LocalizedString'
          description: Name of the road (localized).
        RouteNumber:
          $ref: '#/components/schemas/RouteNumber'
          description: Route number of the road.
    RouteSummary:
      description: Summarized details for the leg including travel steps only. The Distance for the travel only portion of
        the journey is the same as the Distance within the Overview summary.
      type: object
      properties:
        Distance:
          $ref: '#/components/schemas/DistanceMeters'
          description: Distance of the route.
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the route. Unit: seconds'
        Tolls:
          $ref: '#/components/schemas/RouteTollSummary'
          description: Toll summary for the complete route.
    RouteTollSummary:
      description: The toll summary for the complete route.
      type: object
      properties:
        Total:
          $ref: '#/components/schemas/RouteTollPriceSummary'
          description: Total toll summary for the complete route. Total is the only summary available today.
    RouteTollPriceSummary:
      description: Summary of the route and toll price.
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency code corresponding to the price. This is the same as Currency specified in the request.
        Estimate:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: If the price is an estimate or an exact value.
        Range:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: If the price is a range or an exact value. If any of the toll fares making up the route is a range,
            the overall price is also a range.
        RangeValue:
          $ref: '#/components/schemas/RouteTollPriceValueRange'
          description: Price range with a minimum and maximum value, if a range.
        Value:
          $ref: '#/components/schemas/RouteTollPriceSummaryValueDouble'
          description: Exact price, if not a range.
      required:
      - Currency
      - Estimate
      - Range
      - Value
    RouteTollPriceSummaryValueDouble:
      type: number
      format: double
      minimum: 0.0
    WaypointOptimizationAvoidanceOptions:
      description: Specifies options for areas to avoid. This is a best-effort avoidance setting, meaning the router will
        try to honor the avoidance preferences but may still include restricted areas if no feasible alternative route exists.
        If avoidance options are not followed, the response will indicate that the avoidance criteria were violated.
      type: object
      properties:
        Areas:
          $ref: '#/components/schemas/WaypointOptimizationAvoidanceOptionsAreasList'
          description: Areas to be avoided.
        CarShuttleTrains:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoidance options for cars-shuttles-trains.
        ControlledAccessHighways:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid controlled access highways while calculating the route.
        DirtRoads:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid dirt roads while calculating the route.
        Ferries:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoidance options for ferries.
        TollRoads:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoids roads where the specified toll transponders are the only mode of payment.
        Tunnels:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid tunnels while calculating the route.
        UTurns:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid U-turns for calculation on highways and motorways.
    WaypointOptimizationAvoidanceOptionsAreasList:
      type: array
      items:
        $ref: '#/components/schemas/WaypointOptimizationAvoidanceArea'
    WaypointOptimizationAvoidanceArea:
      description: The area to be avoided.
      type: object
      properties:
        Geometry:
          $ref: '#/components/schemas/WaypointOptimizationAvoidanceAreaGeometry'
          description: Geometry of the area to be avoided.
      required:
      - Geometry
    WaypointOptimizationAvoidanceAreaGeometry:
      description: Geometry of the area to be avoided.
      type: object
      properties:
        BoundingBox:
          $ref: '#/components/schemas/BoundingBox'
          description: Geometry defined as a bounding box. The first pair represents the X and Y coordinates (longitude and
            latitude,) of the southwest corner of the bounding box; the second pair represents the X and Y coordinates (longitude
            and latitude) of the northeast corner.
    WaypointOptimizationClusteringOptions:
      description: Options for WaypointOptimizationClustering.
      type: object
      properties:
        Algorithm:
          $ref: '#/components/schemas/WaypointOptimizationClusteringAlgorithm'
          description: The algorithm to be used. DrivingDistance assigns all the waypoints that are within driving distance
            of each other into a single cluster. TopologySegment assigns all the waypoints that are within the same topology
            segment into a single cluster. A Topology segment is a linear stretch of road between two junctions.
        DrivingDistanceOptions:
          $ref: '#/components/schemas/WaypointOptimizationDrivingDistanceOptions'
          description: Driving distance options to be used when the clustering algorithm is DrivingDistance.
      required:
      - Algorithm
    WaypointOptimizationClusteringAlgorithm:
      type: string
      enum:
      - DrivingDistance
      - TopologySegment
    WaypointOptimizationDrivingDistanceOptions:
      description: Driving distance related options.
      type: object
      properties:
        DrivingDistance:
          $ref: '#/components/schemas/WaypointOptimizationDrivingDistanceOptionsDrivingDistanceLong'
          description: DrivingDistance assigns all the waypoints that are within driving distance of each other into a single
            cluster.
      required:
      - DrivingDistance
    WaypointOptimizationDrivingDistanceOptionsDrivingDistanceLong:
      type: integer
      format: int64
      minimum: 5
      maximum: 50000
    WaypointOptimizationDestinationOptions:
      description: Destination related options.
      type: object
      properties:
        AccessHours:
          $ref: '#/components/schemas/WaypointOptimizationAccessHours'
          description: Access hours corresponding to when a waypoint can be visited.
        AppointmentTime:
          $ref: '#/components/schemas/TimestampWithTimezoneOffset'
          description: Appointment time at the destination.
        Heading:
          $ref: '#/components/schemas/Heading'
          description: GPS Heading at the position.
        Id:
          $ref: '#/components/schemas/WaypointId'
          description: The waypoint Id.
        ServiceDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Service time spent at the destination. At an appointment, the service time should be the appointment
            duration. Unit: seconds'
        SideOfStreet:
          $ref: '#/components/schemas/WaypointOptimizationSideOfStreetOptions'
          description: Options to configure matching the provided position to a side of the street.
    WaypointOptimizationAccessHours:
      description: Access hours corresponding to when a destination can be visited.
      type: object
      properties:
        From:
          $ref: '#/components/schemas/WaypointOptimizationAccessHoursEntry'
          description: Contains the ID of the starting waypoint in this connection.
        To:
          $ref: '#/components/schemas/WaypointOptimizationAccessHoursEntry'
          description: Contains the ID of the ending waypoint in this connection.
      required:
      - From
      - To
    WaypointOptimizationAccessHoursEntry:
      description: Hours of entry.
      type: object
      properties:
        DayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
          description: Day of the week.
        TimeOfDay:
          $ref: '#/components/schemas/TimeOfDay'
          description: Time of the day.
      required:
      - DayOfWeek
      - TimeOfDay
    DayOfWeek:
      type: string
      enum:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
    TimeOfDay:
      type: string
      pattern: ([0-1]?[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](Z|[+-]([0-1]?[0-9]|2[0-3]):[0-5][0-9])
    WaypointId:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '[^,;!]+'
    WaypointOptimizationSideOfStreetOptions:
      description: Options to configure matching the provided position to a side of the street.
      type: object
      properties:
        Position:
          $ref: '#/components/schemas/Position'
          description: 'Position in World Geodetic System (WGS 84) format: [longitude, latitude].'
        UseWith:
          $ref: '#/components/schemas/SideOfStreetMatchingStrategy'
          description: 'Strategy that defines when the side of street position should be used. AnyStreet will always use the
            provided position. Default value: DividedStreetOnly'
      required:
      - Position
    WaypointOptimizationDriverOptions:
      description: Driver related options.
      type: object
      properties:
        RestCycles:
          $ref: '#/components/schemas/WaypointOptimizationRestCycles'
          description: Driver work-rest schedules defined by a short and long cycle. A rest needs to be taken after the short
            work duration. The short cycle can be repeated until you hit the long work duration, at which point the long rest
            duration should be taken before restarting.
        RestProfile:
          $ref: '#/components/schemas/WaypointOptimizationRestProfile'
          description: Pre defined rest profiles for a driver schedule. The only currently supported profile is EU.
        TreatServiceTimeAs:
          $ref: '#/components/schemas/WaypointOptimizationServiceTimeTreatment'
          description: If the service time provided at a waypoint/destination should be considered as rest or work. This contributes
            to the total time breakdown returned within the response.
    WaypointOptimizationRestCycles:
      description: Resting phase of the cycle.
      type: object
      properties:
        LongCycle:
          $ref: '#/components/schemas/WaypointOptimizationRestCycleDurations'
          description: Long cycle for a driver work-rest schedule.
        ShortCycle:
          $ref: '#/components/schemas/WaypointOptimizationRestCycleDurations'
          description: Short cycle for a driver work-rest schedule
      required:
      - LongCycle
      - ShortCycle
    WaypointOptimizationRestCycleDurations:
      description: 'Driver work-rest schedules defined by a short and long cycle. A rest needs to be taken after the short
        work duration. The short cycle can be repeated until you hit the long work duration, at which point the long rest
        duration should be taken before restarting. Unit: seconds'
      type: object
      properties:
        RestDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Resting phase of the cycle. Unit: seconds'
        WorkDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Working phase of the cycle. Unit: seconds'
      required:
      - RestDuration
      - WorkDuration
    WaypointOptimizationRestProfile:
      description: Pre defined rest profiles for a driver schedule. The only currently supported profile is EU.
      type: object
      properties:
        Profile:
          $ref: '#/components/schemas/WaypointOptimizationRestProfileProfileString'
          description: Pre defined rest profiles for a driver schedule. The only currently supported profile is EU.
      required:
      - Profile
    WaypointOptimizationRestProfileProfileString:
      type: string
      minLength: 2
      maxLength: 2
    WaypointOptimizationServiceTimeTreatment:
      type: string
      enum:
      - Rest
      - Work
    WaypointOptimizationExclusionOptions:
      description: Specifies strict exclusion options for the route calculation. This setting mandates that the router will
        avoid any routes that include the specified options, rather than merely attempting to minimize them.
      type: object
      properties:
        Countries:
          $ref: '#/components/schemas/CountryCodeList'
          description: List of countries to be avoided defined by two-letter or three-letter country codes.
      required:
      - Countries
    WaypointOptimizationSequencingObjective:
      type: string
      enum:
      - FastestRoute
      - ShortestRoute
    WaypointOptimizationOriginOptions:
      description: Origin related options.
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/WaypointId'
          description: The Origin Id.
    WaypointOptimizationTrafficOptions:
      description: Options related to traffic.
      type: object
      properties:
        Usage:
          $ref: '#/components/schemas/TrafficUsage'
          description: 'Determines if traffic should be used or ignored while calculating the route. Default value: UseTrafficData'
    WaypointOptimizationTravelMode:
      type: string
      enum:
      - Car
      - Pedestrian
      - Scooter
      - Truck
    WaypointOptimizationTravelModeOptions:
      description: Travel mode related options for the provided travel mode.
      type: object
      properties:
        Pedestrian:
          $ref: '#/components/schemas/WaypointOptimizationPedestrianOptions'
          description: Travel mode options when the provided travel mode is Pedestrian.
        Truck:
          $ref: '#/components/schemas/WaypointOptimizationTruckOptions'
          description: Travel mode options when the provided travel mode is Truck.
    WaypointOptimizationPedestrianOptions:
      description: Options related to a pedestrian.
      type: object
      properties:
        Speed:
          $ref: '#/components/schemas/WaypointOptimizationPedestrianOptionsSpeedDouble'
          description: 'Walking speed. Unit: kilometers per hour'
    WaypointOptimizationPedestrianOptionsSpeedDouble:
      type: number
      format: double
      minimum: 1.8
      maximum: 7.2
    WaypointOptimizationTruckOptions:
      description: Travel mode options when the provided travel mode is Truck.
      type: object
      properties:
        GrossWeight:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Gross weight of the vehicle including trailers, and goods at capacity. Unit: kilograms'
        HazardousCargos:
          $ref: '#/components/schemas/WaypointOptimizationHazardousCargoTypeList'
          description: List of Hazardous cargo contained in the vehicle.
        Height:
          $ref: '#/components/schemas/WaypointOptimizationTruckOptionsHeightLong'
          description: 'Height of the vehicle. Unit: centimeters'
        Length:
          $ref: '#/components/schemas/WaypointOptimizationTruckOptionsLengthLong'
          description: 'Length of the vehicle. Unit: centimeters'
        Trailer:
          $ref: '#/components/schemas/WaypointOptimizationTrailerOptions'
          description: Trailer options corresponding to the vehicle.
        TruckType:
          $ref: '#/components/schemas/WaypointOptimizationTruckType'
          description: 'The type of truck: LightTruck for smaller delivery vehicles, StraightTruck for rigid body trucks,
            or Tractor for tractor-trailer combinations.'
        TunnelRestrictionCode:
          $ref: '#/components/schemas/TunnelRestrictionCode'
          description: 'The tunnel restriction code. Tunnel categories in this list indicate the restrictions which apply
            to certain tunnels in Great Britain. They relate to the types of dangerous goods that can be transported through
            them. Tunnel Category B Risk Level: Limited risk Restrictions: Few restrictions Tunnel Category C Risk Level:
            Medium risk Restrictions: Some restrictions Tunnel Category D Risk Level: High risk Restrictions: Many restrictions
            occur Tunnel Category E Risk Level: Very high risk Restrictions: Restricted tunnel'
        WeightPerAxle:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Heaviest weight per axle irrespective of the axle type or the axle group. Meant for usage in countries
            where the differences in axle types or axle groups are not distinguished. Unit: kilograms'
        Width:
          $ref: '#/components/schemas/WaypointOptimizationTruckOptionsWidthLong'
          description: 'Width of the vehicle. Unit: centimeters'
    WaypointOptimizationHazardousCargoTypeList:
      type: array
      items:
        $ref: '#/components/schemas/WaypointOptimizationHazardousCargoType'
    WaypointOptimizationHazardousCargoType:
      type: string
      enum:
      - Combustible
      - Corrosive
      - Explosive
      - Flammable
      - Gas
      - HarmfulToWater
      - Organic
      - Other
      - Poison
      - PoisonousInhalation
