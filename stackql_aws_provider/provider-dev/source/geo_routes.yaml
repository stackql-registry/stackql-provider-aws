      maxLength: 3
    RouteSpanRoadAttributeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteSpanRoadAttribute'
    RouteSpanRoadAttribute:
      type: string
      enum:
      - Bridge
      - BuiltUpArea
      - ControlledAccessHighway
      - DirtRoad
      - DividedRoad
      - Motorway
      - PrivateRoad
      - Ramp
      - RightHandTraffic
      - Roundabout
      - Tunnel
      - UnderConstruction
    RouteNumberList:
      type: array
      items:
        $ref: '#/components/schemas/RouteNumber'
    RouteNumber:
      description: The route number.
      type: object
      properties:
        Direction:
          $ref: '#/components/schemas/RouteDirection'
          description: Directional identifier of the route.
        Language:
          $ref: '#/components/schemas/LanguageTag'
          description: List of languages for instructions corresponding to the route number.
        Value:
          $ref: '#/components/schemas/SensitiveString'
          description: The route number.
      required:
      - Value
    RouteDirection:
      type: string
