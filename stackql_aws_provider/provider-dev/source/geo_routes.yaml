      - Explosive
      - Flammable
      - Gas
      - HarmfulToWater
      - Organic
      - Other
      - Poison
      - PoisonousInhalation
      - Radioactive
    RouteTruckOptionsHeightLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 5000
    RouteTruckOptionsHeightAboveFirstAxleLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 5000
    RouteTruckOptionsLengthLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 30000
    RouteTruckOptionsMaxSpeedDouble:
      type: number
      format: double
      minimum: 3.6
      maximum: 252.0
    RouteTruckOptionsOccupancyInteger:
      type: integer
      minimum: 1
    RouteTruckOptionsTireCountInteger:
      type: integer
      minimum: 1
      maximum: 255
    RouteTrailerOptions:
      description: Trailer options corresponding to the vehicle.
      type: object
      properties:
        AxleCount:
          $ref: '#/components/schemas/RouteTrailerOptionsAxleCountInteger'
          description: Total number of axles of the vehicle.
        TrailerCount:
          $ref: '#/components/schemas/RouteTrailerOptionsTrailerCountInteger'
          description: 'Number of trailers attached to the vehicle. Default value: 0'
    RouteTrailerOptionsAxleCountInteger:
      type: integer
      minimum: 1
    RouteTrailerOptionsTrailerCountInteger:
      type: integer
      minimum: 1
      maximum: 255
    RouteTruckType:
      type: string
      enum:
      - LightTruck
      - StraightTruck
      - Tractor
    RouteTruckOptionsTunnelRestrictionCodeString:
      type: string
      minLength: 0
      maxLength: 20
    RouteTruckOptionsWidthLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 5000
