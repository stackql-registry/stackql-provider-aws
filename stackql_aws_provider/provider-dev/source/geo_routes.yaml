    RouteVehicleNoticeDetailList:
      type: array
      items:
        $ref: '#/components/schemas/RouteVehicleNoticeDetail'
    RouteVehicleNoticeDetail:
      description: Additional details of the notice.
      type: object
      properties:
        Title:
          $ref: '#/components/schemas/SensitiveString'
          description: The notice title.
        ViolatedConstraints:
          $ref: '#/components/schemas/RouteViolatedConstraints'
          description: Any violated constraints.
    RouteViolatedConstraints:
      description: This property contains a summary of violated constraints.
      type: object
      properties:
        AllHazardsRestricted:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: This restriction applies to truck cargo, where the resulting route excludes roads on which hazardous
            materials are prohibited from being transported.
        AxleCount:
          $ref: '#/components/schemas/RouteNoticeDetailRange'
          description: Total number of axles of the vehicle.
        HazardousCargos:
          $ref: '#/components/schemas/RouteHazardousCargoTypeList'
          description: List of Hazardous cargo contained in the vehicle.
        MaxHeight:
          $ref: '#/components/schemas/DimensionCentimeters'
          description: The maximum height of the vehicle.
        MaxKpraLength:
          $ref: '#/components/schemas/DimensionCentimeters'
          description: 'The maximum Kpra length of the vehicle. Unit: centimeters'
        MaxLength:
          $ref: '#/components/schemas/DimensionCentimeters'
          description: The maximum length of the vehicle.
        MaxPayloadCapacity:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'The maximum load capacity of the vehicle. Unit: kilograms'
        MaxWeight:
          $ref: '#/components/schemas/RouteWeightConstraint'
          description: 'The maximum weight of the route. Unit: kilograms'
        MaxWeightPerAxle:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'The maximum weight per axle of the vehicle. Unit: kilograms'
        MaxWeightPerAxleGroup:
          $ref: '#/components/schemas/WeightPerAxleGroup'
          description: 'The maximum weight per axle group of the vehicle. Unit: kilograms'
        MaxWidth:
          $ref: '#/components/schemas/DimensionCentimeters'
          description: The maximum width of the vehicle.
        Occupancy:
          $ref: '#/components/schemas/RouteNoticeDetailRange'
          description: 'The number of occupants in the vehicle. Default value: 1'
        RestrictedTimes:
          $ref: '#/components/schemas/String'
          description: Access radius restrictions based on time.
        TimeDependent:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: The time dependent constraint.
        TrailerCount:
          $ref: '#/components/schemas/RouteNoticeDetailRange'
          description: 'Number of trailers attached to the vehicle. Default value: 0'
        TravelMode:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Travel mode corresponding to the leg.
        TruckRoadType:
          $ref: '#/components/schemas/String'
          description: Truck road type identifiers. BK1 through BK4 apply only to Sweden. A2,A4,B2,B4,C,D,ET2,ET4 apply only
            to Mexico. There are currently no other supported values as of 26th April 2024.
        TruckType:
          $ref: '#/components/schemas/RouteTruckType'
          description: 'The type of truck: LightTruck for smaller delivery vehicles, StraightTruck for rigid body trucks,
            or Tractor for tractor-trailer combinations.'
        TunnelRestrictionCode:
          $ref: '#/components/schemas/TunnelRestrictionCode'
          description: 'The tunnel restriction code. Tunnel categories in this list indicate the restrictions which apply
            to certain tunnels in Great Britain. They relate to the types of dangerous goods that can be transported through
            them. Tunnel Category B Risk Level: Limited risk Restrictions: Few restrictions Tunnel Category C Risk Level:
            Medium risk Restrictions: Some restrictions Tunnel Category D Risk Level: High risk Restrictions: Many restrictions
            occur Tunnel Category E Risk Level: Very high risk Restrictions: Restricted tunnel'
      required:
      - HazardousCargos
    RouteNoticeDetailRange:
      description: Notice Detail that is a range.
      type: object
      properties:
        Min:
          $ref: '#/components/schemas/RouteNoticeDetailRangeMinInteger'
          description: Minimum value for the range.
        Max:
          $ref: '#/components/schemas/RouteNoticeDetailRangeMaxInteger'
          description: Maximum value for the range.
    RouteNoticeDetailRangeMinInteger:
      type: integer
      minimum: 0
    RouteNoticeDetailRangeMaxInteger:
      type: integer
      minimum: 0
    RouteWeightConstraint:
      description: 'The weight constraint for the route. Unit: kilograms'
      type: object
      properties:
        Type:
          $ref: '#/components/schemas/RouteWeightConstraintType'
          description: The type of constraint.
        Value:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'The constraint value. Unit: kilograms'
      required:
      - Type
      - Value
    RouteWeightConstraintType:
      type: string
      enum:
      - Current
      - Gross
      - Unknown
    RouteVehicleSpanList:
      type: array
      items:
        $ref: '#/components/schemas/RouteVehicleSpan'
    RouteVehicleSpan:
      description: Span computed for the requested SpanAdditionalFeatures.
      type: object
      properties:
        BestCaseDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the computed span without traffic congestion. Unit: seconds'
        CarAccess:
          $ref: '#/components/schemas/RouteSpanCarAccessAttributeList'
          description: Access attributes for a car corresponding to the span.
        Country:
          $ref: '#/components/schemas/CountryCode3'
          description: 3 letter Country code corresponding to the Span.
        Distance:
          $ref: '#/components/schemas/DistanceMeters'
          description: Distance of the computed span. This feature doesn't split a span, but is always computed on a span
            split by other properties.
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the computed span. This feature doesn''t split a span, but is always computed on a span
            split by other properties. Unit: seconds'
        DynamicSpeed:
          $ref: '#/components/schemas/RouteSpanDynamicSpeedDetails'
          description: 'Dynamic speed details corresponding to the span. Unit: kilometers per hour'
        FunctionalClassification:
          $ref: '#/components/schemas/RouteVehicleSpanFunctionalClassificationInteger'
          description: 'A numerical value indicating the functional classification of the road segment corresponding to the
            span. Classification values are part of the hierarchical network that helps determine a logical and efficient
            route, and have the following definitions: Roads that allow for high volume, maximum speed traffic movement between
            and through major metropolitan areas. Roads that are used to channel traffic to functional class 1 roads for travel
            between and through cities in the shortest amount of time. Roads that intersect functional class 2 roads and provide
            a high volume of traffic movement at a lower level of mobility than functional class 2 roads. Roads that provide
            for a high volume of traffic movement at moderate speeds between neighborhoods. Roads with volume and traffic
            movement below the level of any other functional class.'
        Gate:
          $ref: '#/components/schemas/RouteSpanGateAttribute'
          description: Attributes corresponding to a gate. The gate is present at the end of the returned span.
        GeometryOffset:
          $ref: '#/components/schemas/RouteVehicleSpanGeometryOffsetInteger'
          description: Offset in the leg geometry corresponding to the start of this span.
        Incidents:
          $ref: '#/components/schemas/IndexList'
          description: Incidents corresponding to the span. These index into the Incidents in the parent Leg.
        Names:
          $ref: '#/components/schemas/LocalizedStringList'
          description: Provides an array of names of the vehicle span in available languages.
        Notices:
          $ref: '#/components/schemas/IndexList'
          description: Notices are additional information returned that indicate issues that occurred during route calculation.
        RailwayCrossing:
          $ref: '#/components/schemas/RouteSpanRailwayCrossingAttribute'
          description: Attributes corresponding to a railway crossing. The gate is present at the end of the returned span.
        Region:
          $ref: '#/components/schemas/RouteVehicleSpanRegionString'
          description: 2-3 letter Region code corresponding to the Span. This is either a province or a state.
        RoadAttributes:
          $ref: '#/components/schemas/RouteSpanRoadAttributeList'
          description: Attributes for the road segment corresponding to the span.
        RouteNumbers:
          $ref: '#/components/schemas/RouteNumberList'
          description: Designated route name or number corresponding to the span.
        ScooterAccess:
          $ref: '#/components/schemas/RouteSpanScooterAccessAttributeList'
          description: Access attributes for a scooter corresponding to the span.
        SpeedLimit:
          $ref: '#/components/schemas/RouteSpanSpeedLimitDetails'
          description: 'Speed limit details corresponding to the span. Unit: kilometers per hour'
        TollSystems:
          $ref: '#/components/schemas/IndexList'
          description: Toll systems are authorities that collect payments for the toll.
        TruckAccess:
          $ref: '#/components/schemas/RouteSpanTruckAccessAttributeList'
          description: Access attributes for a truck corresponding to the span.
        TruckRoadTypes:
          $ref: '#/components/schemas/IndexList'
          description: Truck road type identifiers. BK1 through BK4 apply only to Sweden. A2,A4,B2,B4,C,D,ET2,ET4 apply only
            to Mexico. There are currently no other supported values as of 26th April 2024.
        TypicalDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the computed span under typical traffic congestion. Unit: seconds'
        Zones:
          $ref: '#/components/schemas/IndexList'
          description: Zones corresponding to this leg of the route.
    RouteSpanCarAccessAttributeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteSpanCarAccessAttribute'
    RouteSpanCarAccessAttribute:
      type: string
      enum:
      - Allowed
      - NoThroughTraffic
      - TollRoad
    RouteVehicleSpanFunctionalClassificationInteger:
      type: integer
      minimum: 1
      maximum: 5
    RouteSpanGateAttribute:
      type: string
      enum:
      - Emergency
      - KeyAccess
      - PermissionRequired
    RouteVehicleSpanGeometryOffsetInteger:
      type: integer
      minimum: 0
    RouteSpanRailwayCrossingAttribute:
      type: string
      enum:
      - Protected
      - Unprotected
    RouteVehicleSpanRegionString:
      type: string
      minLength: 0
      maxLength: 3
    RouteSpanScooterAccessAttributeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteSpanScooterAccessAttribute'
    RouteSpanScooterAccessAttribute:
      type: string
      enum:
      - Allowed
      - NoThroughTraffic
      - TollRoad
    RouteSpanTruckAccessAttributeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteSpanTruckAccessAttribute'
    RouteSpanTruckAccessAttribute:
      type: string
      enum:
      - Allowed
      - NoThroughTraffic
      - TollRoad
    RouteVehicleSummary:
      description: Summarized details of the route.
      type: object
      properties:
        Overview:
          $ref: '#/components/schemas/RouteVehicleOverviewSummary'
          description: Summarized details for the leg including before travel, travel and after travel steps.
        TravelOnly:
          $ref: '#/components/schemas/RouteVehicleTravelOnlySummary'
          description: Summarized details for the leg including travel steps only. The Distance for the travel only portion
            of the journey is in meters
    RouteVehicleOverviewSummary:
      description: Summary including duration and distance for the entire leg.
      type: object
      properties:
        BestCaseDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Total duration in free flowing traffic, which is the best case or shortest duration possible to cover
            the leg. Unit: seconds'
        Distance:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'Distance of the entire leg. Unit: meters'
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the entire leg. Unit: seconds'
        TypicalDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the leg under typical traffic congestion. Unit: seconds'
      required:
      - Distance
      - Duration
    RouteVehicleTravelOnlySummary:
      description: Summarized details of the route.
      type: object
      properties:
        BestCaseDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Total duration in free flowing traffic, which is the best case or shortest duration possible to cover
            the leg. Unit: seconds'
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the step. Unit: seconds'
        TypicalDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the leg under typical traffic congestion. Unit: seconds'
      required:
      - Duration
    RouteTollList:
      type: array
      items:
        $ref: '#/components/schemas/RouteToll'
    RouteToll:
      description: Provides details about toll information along a route, including the payment sites, applicable toll rates,
        toll systems, and the country associated with the toll collection.
      type: object
      properties:
        Country:
          $ref: '#/components/schemas/CountryCode3'
          description: The alpha-2 or alpha-3 character code for the country.
        PaymentSites:
          $ref: '#/components/schemas/RouteTollPaymentSiteList'
          description: Locations or sites where the toll fare is collected.
        Rates:
          $ref: '#/components/schemas/RouteTollRateList'
          description: Toll rates that need to be paid to travel this leg of the route.
        Systems:
          $ref: '#/components/schemas/IndexList'
          description: Toll systems are authorities that collect payments for the toll.
      required:
      - PaymentSites
      - Rates
      - Systems
    RouteTollPaymentSiteList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTollPaymentSite'
    RouteTollPaymentSite:
      description: Locations or sites where the toll fare is collected.
      type: object
      properties:
        Name:
          $ref: '#/components/schemas/String'
          description: Name of the payment site.
        Position:
          $ref: '#/components/schemas/Position23'
          description: 'Position in World Geodetic System (WGS 84) format: [longitude, latitude].'
      required:
      - Position
    RouteTollRateList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTollRate'
    RouteTollRate:
      description: The toll rate.
      type: object
      properties:
        ApplicableTimes:
          $ref: '#/components/schemas/SensitiveString'
          description: Time when the rate is valid.
        ConvertedPrice:
          $ref: '#/components/schemas/RouteTollPrice'
          description: Price in the converted currency as specified in the request.
        Id:
          $ref: '#/components/schemas/SensitiveString'
          description: The Toll rate Id.
        LocalPrice:
          $ref: '#/components/schemas/RouteTollPrice'
          description: Price in the local regional currency.
        Name:
          $ref: '#/components/schemas/SensitiveString'
          description: The name of the toll.
        Pass:
          $ref: '#/components/schemas/RouteTollPass'
          description: Details if the toll rate can be a pass that supports multiple trips.
        PaymentMethods:
          $ref: '#/components/schemas/RouteTollPaymentMethodList'
          description: Accepted payment methods at the toll.
        Transponders:
          $ref: '#/components/schemas/RouteTransponderList'
          description: Transponders for which this toll can be applied.
      required:
      - Id
      - LocalPrice
      - Name
      - PaymentMethods
      - Transponders
    RouteTollPrice:
      description: The toll price.
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency code corresponding to the price. This is the same as Currency specified in the request.
        Estimate:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: If the price is an estimate or an exact value.
        PerDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration for which the price corresponds to. Unit: seconds'
        Range:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: If the price is a range or an exact value. If any of the toll fares making up the route is a range,
            the overall price is also a range.
        RangeValue:
          $ref: '#/components/schemas/RouteTollPriceValueRange'
          description: Price range with a minimum and maximum value, if a range.
        Value:
          $ref: '#/components/schemas/RouteTollPriceValueDouble'
          description: Exact price, if not a range.
      required:
      - Currency
      - Estimate
      - Range
      - Value
    RouteTollPriceValueRange:
      description: Price range with a minimum and maximum value, if a range.
      type: object
      properties:
        Min:
          $ref: '#/components/schemas/RouteTollPriceValueRangeMinDouble'
          description: Minimum price.
        Max:
          $ref: '#/components/schemas/RouteTollPriceValueRangeMaxDouble'
          description: Maximum price.
      required:
      - Min
      - Max
    RouteTollPriceValueRangeMinDouble:
      type: number
      format: double
      minimum: 0.0
    RouteTollPriceValueRangeMaxDouble:
      type: number
      format: double
      minimum: 0.0
    RouteTollPriceValueDouble:
      type: number
      format: double
      minimum: 0.0
    RouteTollPass:
      description: Details if the toll rate can be a pass that supports multiple trips.
      type: object
      properties:
        IncludesReturnTrip:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: If the pass includes the rate for the return leg of the trip.
        SeniorPass:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: If the pass is only valid for senior persons.
        TransferCount:
          $ref: '#/components/schemas/RouteTollPassTransferCountInteger'
          description: If the toll pass can be transferred, and how many times.
        TripCount:
          $ref: '#/components/schemas/RouteTollPassTripCountInteger'
          description: Number of trips the pass is valid for.
        ValidityPeriod:
          $ref: '#/components/schemas/RouteTollPassValidityPeriod'
          description: Period for which the pass is valid.
    RouteTollPassTransferCountInteger:
      type: integer
      minimum: 0
    RouteTollPassTripCountInteger:
      type: integer
      minimum: 0
    RouteTollPassValidityPeriod:
      description: Period for which the pass is valid.
      type: object
      properties:
        Period:
          $ref: '#/components/schemas/RouteTollPassValidityPeriodType'
          description: Validity period.
        PeriodCount:
          $ref: '#/components/schemas/RouteTollPassValidityPeriodPeriodCountInteger'
          description: Counts for the validity period.
      required:
      - Period
    RouteTollPassValidityPeriodType:
      type: string
      enum:
      - Annual
      - Days
      - ExtendedAnnual
      - Minutes
      - Months
    RouteTollPassValidityPeriodPeriodCountInteger:
      type: integer
      minimum: 0
    RouteTollPaymentMethodList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTollPaymentMethod'
    RouteTollPaymentMethod:
      type: string
      enum:
