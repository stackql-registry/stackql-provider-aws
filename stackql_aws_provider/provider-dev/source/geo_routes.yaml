      description: Interpolated geometry for the snapped route that is overlay-able onto a map.
      type: object
      properties:
        LineString:
          $ref: '#/components/schemas/LineString'
          description: An ordered list of positions used to plot a route on a map. LineString and Polyline are mutually exclusive
            properties.
        Polyline:
          $ref: '#/components/schemas/Polyline'
          description: An ordered list of positions used to plot a route on a map in a lossy compression format. LineString
            and Polyline are mutually exclusive properties.
