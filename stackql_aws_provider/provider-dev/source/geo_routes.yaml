          description: Position of the TracePoint provided within the request, at the same index.
        SnappedPosition:
          $ref: '#/components/schemas/Position'
          description: Snapped position of the TracePoint provided within the request, at the same index.
      required:
      - Confidence
      - OriginalPosition
      - SnappedPosition
    RoadSnapSnappedTracePointConfidenceDouble:
      type: number
      format: double
      minimum: 0
      maximum: 1
