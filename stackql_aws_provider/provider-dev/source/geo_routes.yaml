        EnabledFor:
          $ref: '#/components/schemas/RouteIntermodalEnabledLegsList'
          description: 'Specifies the portion of the route for which this leg type is enabled. By default, the leg type is
            enabled for all legs. Valid values: FirstLeg - Enable this leg type for the first non-pedestrian leg of the route.
            LastLeg - Enable this leg type for the last non-pedestrian leg of the route. EntireRoute - Enable this leg type
            for the entire route. None - Disable this leg type entirely.'
        ExcludedModes:
          $ref: '#/components/schemas/RouteVehicleModeList'
          description: Excluded vehicle transport modes when calculating the route. By default, all transport modes are allowed.
            Cannot be used together with AllowedModes.
    RouteVehicleModeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteVehicleMode'
    RouteVehicleMode:
      type: string
      enum:
      - All
      - Car
    RouteTransitOptions:
      description: Options related to transit routing. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps
        customers.
      type: object
      properties:
        AccessibilityAttributes:
          $ref: '#/components/schemas/RouteAccessibilityAttributeList'
          description: Accessibility attributes to consider when calculating the route.
        AllowedModes:
          $ref: '#/components/schemas/RouteTransitModeList'
          description: Allowed transit transport modes when calculating the route. By default, all transport modes are allowed.
            Cannot be used together with ExcludedModes.
        ExcludedModes:
          $ref: '#/components/schemas/RouteTransitModeList'
          description: Excluded transit transport modes when calculating the route. By default, all transport modes are allowed.
            Cannot be used together with AllowedModes.
        MaxTransfers:
          $ref: '#/components/schemas/RouteTransitOptionsMaxTransfersInteger'
          description: Maximum number of transfers allowed when calculating the route.
        Pedestrian:
          $ref: '#/components/schemas/RouteTransitPedestrianOptions'
          description: Options for the pedestrian leg of the transit route.
    RouteTransitOptionsMaxTransfersInteger:
      type: integer
      minimum: 0
      maximum: 6
    RouteTransitPedestrianOptions:
      description: Options for the pedestrian leg of the transit route.
      type: object
      properties:
        MaxDistance:
          $ref: '#/components/schemas/RouteTransitPedestrianOptionsMaxDistanceLong'
          description: 'Maximum walking distance allowed. Unit: meters'
        Speed:
          $ref: '#/components/schemas/RouteTransitPedestrianOptionsSpeedDouble'
          description: 'Walking speed. Unit: kilometers per hour'
    RouteTransitPedestrianOptionsMaxDistanceLong:
      type: integer
      format: int64
      maximum: 6000
    RouteTransitPedestrianOptionsSpeedDouble:
      type: number
      format: double
      minimum: 1.8
      maximum: 7.2
    RouteTravelStepType:
      type: string
      enum:
      - Default
      - TurnByTurn
    RouteWaypointList:
      type: array
      items:
        $ref: '#/components/schemas/RouteWaypoint'
    RouteWaypoint:
      description: Waypoint between the Origin and Destination.
      type: object
      properties:
        AvoidActionsForDistance:
          $ref: '#/components/schemas/RouteWaypointAvoidActionsForDistanceLong'
          description: Avoids actions for the provided distance. This is typically to consider for users in moving vehicles
            who may not have sufficient time to make an action at an origin or a destination. Not supported in ap-southeast-1
            and ap-southeast-5 regions for GrabMaps customers.
        AvoidUTurns:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid U-turns for calculation on highways and motorways. Not supported in ap-southeast-1 and ap-southeast-5
            regions for GrabMaps customers.
        Heading:
          $ref: '#/components/schemas/Heading'
          description: GPS Heading at the position. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps
            customers.
        Matching:
          $ref: '#/components/schemas/RouteMatchingOptions'
          description: Options to configure matching the provided position to the road network. Not supported in ap-southeast-1
            and ap-southeast-5 regions for GrabMaps customers.
        PassThrough:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: If the waypoint should not be treated as a stop. If yes, the waypoint is passed through and doesn't
            split the route into different legs. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps customers.
        Position:
          $ref: '#/components/schemas/Position'
          description: 'Position in World Geodetic System (WGS 84) format: [longitude, latitude].'
        SideOfStreet:
          $ref: '#/components/schemas/RouteSideOfStreetOptions'
          description: Options to configure matching the provided position to a side of the street. Not supported in ap-southeast-1
            and ap-southeast-5 regions for GrabMaps customers.
        StopDuration:
          $ref: '#/components/schemas/RouteWaypointStopDurationLong'
          description: 'Duration of the stop. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps customers.
            Unit: seconds'
      required:
      - Position
    RouteWaypointAvoidActionsForDistanceLong:
      type: integer
      format: int64
      maximum: 2000
    RouteWaypointStopDurationLong:
      type: integer
      format: int64
      maximum: 49999
    CalculateRoutesResponse:
      type: object
      properties:
        LegGeometryFormat:
          $ref: '#/components/schemas/GeometryFormat'
          description: Specifies the format of the geometry returned for each leg of the route.
        Notices:
          $ref: '#/components/schemas/RouteResponseNoticeList'
          description: Notices are additional information returned that indicate issues that occurred during route calculation.
            Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps customers.
        PricingBucket:
          $ref: '#/components/schemas/String'
          description: The pricing bucket for which the query is charged at.
        Routes:
          $ref: '#/components/schemas/RouteList'
          description: The path from the origin to the destination.
      required:
      - LegGeometryFormat
      - Notices
      - PricingBucket
      - Routes
    RouteResponseNoticeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteResponseNotice'
    RouteResponseNotice:
      description: Notices are additional information returned that indicate issues that occurred during route calculation.
      type: object
      properties:
        Code:
          $ref: '#/components/schemas/RouteResponseNoticeCode'
          description: Code corresponding to the issue.
        Impact:
          $ref: '#/components/schemas/RouteNoticeImpact'
          description: Impact corresponding to the issue. While Low impact notices can be safely ignored, High impact notices
            must be evaluated further to determine the impact.
      required:
      - Code
    RouteResponseNoticeCode:
      type: string
      enum:
      - MainLanguageNotFound
      - Other
      - TravelTimeExceedsDriverWorkHours
      - TransitDataUnavailable
      - TransitRouteUnavailable
      - NoTransitStationsFound
    RouteNoticeImpact:
      type: string
      enum:
      - High
      - Low
    RouteList:
      type: array
      items:
        $ref: '#/components/schemas/Route'
    Route:
      description: The route.
      type: object
      properties:
        Legs:
          $ref: '#/components/schemas/RouteLegList'
          description: A leg is a section of a route from one waypoint to the next. A leg could be of type Vehicle, Pedestrian
            or Ferry. Legs of different types could occur together within a single route. For example, a car employing the
            use of a Ferry will contain Vehicle legs corresponding to journey on land, and Ferry legs corresponding to the
            journey via Ferry.
        MajorRoadLabels:
          $ref: '#/components/schemas/RouteMajorRoadLabelsList'
          description: Important labels including names and route numbers that differentiate the current route from the alternatives
            presented.
        Summary:
          $ref: '#/components/schemas/RouteSummary'
          description: Summarized details of the leg.
      required:
      - Legs
      - MajorRoadLabels
    RouteLegList:
      type: array
      items:
        $ref: '#/components/schemas/RouteLeg'
    RouteLeg:
      description: A leg is a section of a route from one waypoint to the next. A leg could be of type Vehicle, Pedestrian
        or Ferry. Legs of different types could occur together within a single route. For example, a car employing the use
        of a Ferry will contain Vehicle legs corresponding to journey on land, and Ferry legs corresponding to the journey
        via Ferry.
      type: object
      properties:
        FerryLegDetails:
          $ref: '#/components/schemas/RouteFerryLegDetails'
          description: FerryLegDetails is populated when the Leg type is Ferry, and provides additional information that is
            specific to ferry travel. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps customers.
        Geometry:
          $ref: '#/components/schemas/RouteLegGeometry'
          description: Geometry of the area to be avoided.
        Language:
          $ref: '#/components/schemas/LanguageTag'
          description: List of languages for instructions within steps in the response. Not supported in ap-southeast-1 and
            ap-southeast-5 regions for GrabMaps customers.
        PedestrianLegDetails:
          $ref: '#/components/schemas/RoutePedestrianLegDetails'
          description: Details related to the pedestrian leg.
        TravelMode:
          $ref: '#/components/schemas/RouteLegTravelMode'
          description: 'Specifies the mode of transport when calculating a route. Used in estimating the speed of travel and
            road compatibility. Default value: Car'
        Type:
          $ref: '#/components/schemas/RouteLegType'
          description: Type of the leg.
        VehicleLegDetails:
          $ref: '#/components/schemas/RouteVehicleLegDetails'
          description: Details related to the vehicle leg.
        RentalLegDetails:
          $ref: '#/components/schemas/RouteRentalLegDetails'
          description: Details related to the rental leg. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps
            customers.
        TaxiLegDetails:
          $ref: '#/components/schemas/RouteTaxiLegDetails'
          description: Details related to the taxi leg. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps
            customers.
        TransitLegDetails:
          $ref: '#/components/schemas/RouteTransitLegDetails'
          description: Details related to the transit leg.
      required:
      - Geometry
      - TravelMode
      - Type
    RouteFerryLegDetails:
      description: FerryLegDetails is populated when the Leg type is Ferry, and provides additional information that is specific
        to ferry travel.
      type: object
      properties:
        AfterTravelSteps:
          $ref: '#/components/schemas/RouteFerryAfterTravelStepList'
          description: Steps of a leg that must be performed after the travel portion of the leg.
        Arrival:
          $ref: '#/components/schemas/RouteFerryArrival'
          description: Details corresponding to the arrival for the leg.
        BeforeTravelSteps:
          $ref: '#/components/schemas/RouteFerryBeforeTravelStepList'
          description: Steps of a leg that must be performed before the travel portion of the leg.
        Departure:
          $ref: '#/components/schemas/RouteFerryDeparture'
          description: Details corresponding to the departure for the leg.
        Notices:
          $ref: '#/components/schemas/RouteFerryNoticeList'
          description: Notices are additional information returned that indicate issues that occurred during route calculation.
        PassThroughWaypoints:
          $ref: '#/components/schemas/RoutePassThroughWaypointList'
          description: Waypoints that were passed through during the leg. This includes the waypoints that were configured
            with the PassThrough option.
        RouteName:
          $ref: '#/components/schemas/SensitiveString'
          description: Route name of the ferry line.
        Spans:
          $ref: '#/components/schemas/RouteFerrySpanList'
          description: Spans that were computed for the requested SpanAdditionalFeatures.
        Summary:
          $ref: '#/components/schemas/RouteFerrySummary'
          description: Summarized details of the leg.
        TravelSteps:
          $ref: '#/components/schemas/RouteFerryTravelStepList'
          description: Steps of a leg that must be performed before the travel portion of the leg.
      required:
      - AfterTravelSteps
      - Arrival
      - BeforeTravelSteps
      - Departure
      - Notices
      - PassThroughWaypoints
      - Spans
      - TravelSteps
    RouteFerryAfterTravelStepList:
      type: array
      items:
        $ref: '#/components/schemas/RouteFerryAfterTravelStep'
    RouteFerryAfterTravelStep:
      description: Steps of a leg that must be performed after the travel portion of the leg.
      type: object
      properties:
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the step. Unit: seconds'
        Instruction:
          $ref: '#/components/schemas/SensitiveString'
          description: Brief description of the step in the requested language. Only available when the TravelStepType is
            Default.
        Type:
          $ref: '#/components/schemas/RouteFerryAfterTravelStepType'
          description: Type of the step.
      required:
      - Duration
      - Type
    RouteFerryAfterTravelStepType:
      type: string
      enum:
      - Deboard
    RouteFerryArrival:
      description: Details corresponding to the arrival for the leg.
      type: object
      properties:
        Place:
          $ref: '#/components/schemas/RouteFerryPlace'
          description: Place details corresponding to the arrival.
        Time:
          $ref: '#/components/schemas/TimestampWithTimezoneOffset'
          description: The arrival time.
      required:
      - Place
    RouteFerryPlace:
      description: Position provided in the request.
      type: object
      properties:
        Name:
          $ref: '#/components/schemas/SensitiveString'
          description: The name of the place.
        OriginalPosition:
          $ref: '#/components/schemas/Position23'
          description: Position provided in the request.
        Position:
          $ref: '#/components/schemas/Position23'
          description: 'Position in World Geodetic System (WGS 84) format: [longitude, latitude].'
        WaypointIndex:
          $ref: '#/components/schemas/RouteFerryPlaceWaypointIndexInteger'
          description: Index of the waypoint in the request.
      required:
      - Position
    Position23:
      type: array
      items:
        $ref: '#/components/schemas/Double'
    RouteFerryPlaceWaypointIndexInteger:
      type: integer
      minimum: 0
    RouteFerryBeforeTravelStepList:
      type: array
      items:
        $ref: '#/components/schemas/RouteFerryBeforeTravelStep'
    RouteFerryBeforeTravelStep:
      description: Steps of a leg that must be performed before the travel portion of the leg.
      type: object
      properties:
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the step. Unit: seconds'
        Instruction:
          $ref: '#/components/schemas/SensitiveString'
          description: Brief description of the step in the requested language. Only available when the TravelStepType is
            Default.
        Type:
          $ref: '#/components/schemas/RouteFerryBeforeTravelStepType'
          description: Type of the step.
      required:
      - Duration
      - Type
    RouteFerryBeforeTravelStepType:
      type: string
      enum:
      - Board
    RouteFerryDeparture:
      description: Details corresponding to the departure for the leg.
      type: object
      properties:
        Place:
          $ref: '#/components/schemas/RouteFerryPlace'
          description: Place details corresponding to the departure.
        Time:
          $ref: '#/components/schemas/TimestampWithTimezoneOffset'
          description: The departure time.
      required:
      - Place
    RouteFerryNoticeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteFerryNotice'
    RouteFerryNotice:
      description: Notices are additional information returned that indicate issues that occurred during route calculation.
      type: object
      properties:
        Code:
          $ref: '#/components/schemas/RouteFerryNoticeCode'
          description: Code corresponding to the issue.
        Impact:
          $ref: '#/components/schemas/RouteNoticeImpact'
          description: Impact corresponding to the issue. While Low impact notices can be safely ignored, High impact notices
            must be evaluated further to determine the impact.
      required:
      - Code
    RouteFerryNoticeCode:
      type: string
      enum:
      - AccuratePolylineUnavailable
      - NoSchedule
      - Other
      - ViolatedAvoidFerry
      - ViolatedAvoidRailFerry
      - SeasonalClosure
      - PotentialViolatedVehicleRestrictionUsage
      - ViolatedAvoidAreas
      - ViolatedVehicleRestriction
    RoutePassThroughWaypointList:
      type: array
      items:
        $ref: '#/components/schemas/RoutePassThroughWaypoint'
    RoutePassThroughWaypoint:
      description: If the waypoint should be treated as a stop. If yes, the route is split up into different legs around the
        stop.
      type: object
      properties:
        GeometryOffset:
          $ref: '#/components/schemas/RoutePassThroughWaypointGeometryOffsetInteger'
          description: Offset in the leg geometry corresponding to the start of this step.
        Place:
          $ref: '#/components/schemas/RoutePassThroughPlace'
          description: Place details corresponding to the pass-through waypoint.
      required:
      - Place
    RoutePassThroughWaypointGeometryOffsetInteger:
      type: integer
      minimum: 0
    RoutePassThroughPlace:
      description: The place where the waypoint is passed through and not treated as a stop.
      type: object
      properties:
        OriginalPosition:
          $ref: '#/components/schemas/Position23'
          description: Position provided in the request.
        Position:
          $ref: '#/components/schemas/Position23'
          description: 'Position in World Geodetic System (WGS 84) format: [longitude, latitude].'
        WaypointIndex:
          $ref: '#/components/schemas/RoutePassThroughPlaceWaypointIndexInteger'
          description: Index of the waypoint in the request.
      required:
      - Position
    RoutePassThroughPlaceWaypointIndexInteger:
      type: integer
      minimum: 0
    RouteFerrySpanList:
      type: array
      items:
        $ref: '#/components/schemas/RouteFerrySpan'
    RouteFerrySpan:
      description: Span computed for the requested SpanAdditionalFeatures.
      type: object
      properties:
        Country:
          $ref: '#/components/schemas/CountryCode3'
          description: 3 letter Country code corresponding to the Span.
        Distance:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'Distance of the computed span. This feature doesn''t split a span, but is always computed on a span
            split by other properties. Unit: meters'
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the computed span. This feature doesn''t split a span, but is always computed on a span
            split by other properties. Unit: seconds'
        GeometryOffset:
          $ref: '#/components/schemas/RouteFerrySpanGeometryOffsetInteger'
          description: Offset in the leg geometry corresponding to the start of this span.
        Names:
          $ref: '#/components/schemas/LocalizedStringList'
          description: Names of the ferry span in available languages.
        Region:
          $ref: '#/components/schemas/RouteFerrySpanRegionString'
          description: 2-3 letter Region code corresponding to the Span. This is either a province or a state.
    CountryCode3:
      type: string
      minLength: 3
      maxLength: 3
      pattern: '[A-Z]{3}'
    RouteFerrySpanGeometryOffsetInteger:
      type: integer
      minimum: 0
    LocalizedStringList:
      type: array
      items:
        $ref: '#/components/schemas/LocalizedString'
    LocalizedString:
      description: The localized string.
      type: object
      properties:
        Language:
          $ref: '#/components/schemas/LanguageTag'
          description: A list of BCP 47 compliant language codes for the results to be rendered in. The request uses the regional
            default as the fallback if the requested language can't be provided.
        Value:
          $ref: '#/components/schemas/SensitiveString'
          description: The value of the localized string.
      required:
      - Value
    RouteFerrySpanRegionString:
      type: string
      minLength: 0
      maxLength: 3
    RouteFerrySummary:
      description: Summarized details for the leg including travel steps only. The Distance for the travel only portion of
        the journey is the same as the Distance within the Overview summary.
      type: object
      properties:
        Overview:
          $ref: '#/components/schemas/RouteFerryOverviewSummary'
          description: Summarized details for the leg including before travel, travel and after travel steps.
        TravelOnly:
          $ref: '#/components/schemas/RouteFerryTravelOnlySummary'
          description: Summarized details for the leg including travel steps only. The Distance for the travel only portion
            of the journey is in meters
    RouteFerryOverviewSummary:
      description: Summary including duration and distance for the entire leg.
      type: object
      properties:
        Distance:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'Distance of the entire leg. Unit: meters'
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the entire leg. Unit: seconds'
      required:
      - Distance
      - Duration
    RouteFerryTravelOnlySummary:
      description: Summarized details for the leg including travel steps only. The Distance for the travel only portion of
        the journey is the same as the Distance within the Overview summary.
      type: object
      properties:
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Total duration in free flowing traffic, which is the best case or shortest duration possible to cover
            the leg. Unit: seconds'
      required:
      - Duration
    RouteFerryTravelStepList:
      type: array
      items:
        $ref: '#/components/schemas/RouteFerryTravelStep'
    RouteFerryTravelStep:
      description: Steps of a leg that must be performed during the travel portion of the leg.
      type: object
      properties:
        Distance:
          $ref: '#/components/schemas/DistanceMeters'
          description: Distance of the step.
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the step. Unit: seconds'
        GeometryOffset:
          $ref: '#/components/schemas/RouteFerryTravelStepGeometryOffsetInteger'
          description: Offset in the leg geometry corresponding to the start of this step.
        Instruction:
          $ref: '#/components/schemas/SensitiveString'
          description: Brief description of the step in the requested language. Only available when the TravelStepType is
            Default.
        Type:
          $ref: '#/components/schemas/RouteFerryTravelStepType'
          description: Type of the step.
      required:
      - Duration
      - Type
    RouteFerryTravelStepGeometryOffsetInteger:
      type: integer
      minimum: 0
    RouteFerryTravelStepType:
      type: string
      enum:
      - Depart
      - Continue
      - Arrive
    RouteLegGeometry:
      description: The returned Route leg geometry.
      type: object
      properties:
        LineString:
          $ref: '#/components/schemas/LineString'
          description: An ordered list of positions used to plot a route on a map. LineString and Polyline are mutually exclusive
            properties.
        Polyline:
          $ref: '#/components/schemas/Polyline'
          description: An ordered list of positions used to plot a route on a map in a lossy compression format. LineString
            and Polyline are mutually exclusive properties.
    RoutePedestrianLegDetails:
      description: Details that are specific to a pedestrian leg.
      type: object
      properties:
        AfterTravelSteps:
          $ref: '#/components/schemas/RoutePedestrianAfterTravelStepList'
          description: Steps of a leg that must be performed after the travel portion of the leg.
        Arrival:
          $ref: '#/components/schemas/RoutePedestrianArrival'
          description: Details corresponding to the arrival for the leg.
        Departure:
          $ref: '#/components/schemas/RoutePedestrianDeparture'
          description: Details corresponding to the departure for the leg.
        Notices:
          $ref: '#/components/schemas/RoutePedestrianNoticeList'
          description: Notices are additional information returned that indicate issues that occurred during route calculation.
            Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps customers.
        PassThroughWaypoints:
          $ref: '#/components/schemas/RoutePassThroughWaypointList'
          description: Waypoints that were passed through during the leg. This includes the waypoints that were configured
            with the PassThrough option.
        Spans:
          $ref: '#/components/schemas/RoutePedestrianSpanList'
          description: Spans that were computed for the requested SpanAdditionalFeatures. Not supported in ap-southeast-1
            and ap-southeast-5 regions for GrabMaps customers.
        Summary:
          $ref: '#/components/schemas/RoutePedestrianSummary'
          description: Summarized details of the leg.
        TravelSteps:
          $ref: '#/components/schemas/RoutePedestrianTravelStepList'
          description: Steps of a leg that must be performed before the travel portion of the leg.
      required:
      - AfterTravelSteps
      - Arrival
      - Departure
      - Notices
      - PassThroughWaypoints
      - Spans
      - TravelSteps
    RoutePedestrianAfterTravelStepList:
      type: array
      items:
        $ref: '#/components/schemas/RoutePedestrianAfterTravelStep'
    RoutePedestrianAfterTravelStep:
      description: Steps of a leg that must be performed after the travel portion of the leg.
      type: object
      properties:
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the step. Unit: seconds'
        Instruction:
          $ref: '#/components/schemas/SensitiveString'
          description: Brief description of the step in the requested language. Only available when the TravelStepType is
            Default.
        Type:
          $ref: '#/components/schemas/RoutePedestrianAfterTravelStepType'
          description: Type of the step.
      required:
      - Duration
      - Type
    RoutePedestrianAfterTravelStepType:
      type: string
      enum:
      - Wait
    RoutePedestrianArrival:
      description: 'Details corresponding to the arrival for a leg. Time format:YYYY-MM-DDThh:mm:ss.sssZ | YYYY-MM-DDThh:mm:ss.sss+hh:mm
        Examples: 2020-04-22T17:57:24Z 2020-04-22T17:57:24+02:00'
      type: object
      properties:
        Place:
          $ref: '#/components/schemas/RoutePedestrianPlace'
          description: Place details corresponding to the arrival.
        Time:
          $ref: '#/components/schemas/TimestampWithTimezoneOffset'
          description: The arrival time.
      required:
      - Place
    RoutePedestrianPlace:
      description: Place details corresponding to the arrival or departure.
      type: object
      properties:
        AccessPointDetails:
          $ref: '#/components/schemas/RouteAccessPointDetails'
          description: Details of the access point.
        Name:
          $ref: '#/components/schemas/SensitiveString'
          description: The name of the place.
        OriginalPosition:
          $ref: '#/components/schemas/Position23'
          description: Position provided in the request.
        Position:
          $ref: '#/components/schemas/Position23'
          description: 'Position in World Geodetic System (WGS 84) format: [longitude, latitude].'
        SideOfStreet:
          $ref: '#/components/schemas/RouteSideOfStreet'
          description: Options to configure matching the provided position to a side of the street.
        StationDetails:
          $ref: '#/components/schemas/RouteStationDetails'
          description: Details about the station.
        Type:
          $ref: '#/components/schemas/RoutePedestrianPlaceType'
          description: The type of the place.
        WaypointIndex:
          $ref: '#/components/schemas/RoutePedestrianPlaceWaypointIndexInteger'
          description: Index of the waypoint in the request.
      required:
      - Position
    RouteAccessPointDetails:
      description: Details of the access point.
      type: object
      properties:
        Accessibility:
          $ref: '#/components/schemas/RouteAccessibilityAvailabilityDetails'
          description: Wheelchair accessibility information for the access point.
    RouteAccessibilityAvailabilityDetails:
      description: Details about the availability of accessibility features.
      type: object
      properties:
        Wheelchair:
          $ref: '#/components/schemas/RouteAccessibilityAvailability'
          description: Wheelchair accessibility status.
    RouteAccessibilityAvailability:
      type: string
      enum:
      - Available
      - Limited
      - Unavailable
      - Unknown
    RouteSideOfStreet:
      type: string
      enum:
      - Left
      - Right
    RouteStationDetails:
      description: Details about the station.
      type: object
      properties:
        Accessibility:
          $ref: '#/components/schemas/RouteAccessibilityAvailabilityDetails'
          description: Wheelchair accessibility information for the station.
        PlatformName:
          $ref: '#/components/schemas/SensitiveString'
          description: Platform name or number.
        ShortName:
          $ref: '#/components/schemas/SensitiveString'
          description: Short text or a number that identifies the station.
    RoutePedestrianPlaceType:
      type: string
      enum:
      - AccessPoint
      - DockingStation
      - ParkingLot
      - Station
    RoutePedestrianPlaceWaypointIndexInteger:
      type: integer
      minimum: 0
    RoutePedestrianDeparture:
