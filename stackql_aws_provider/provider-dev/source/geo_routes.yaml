openapi: 3.0.0
info:
  version: '2020-11-19'
  title: Amazon Location Service Routes V2
  description: Amazon Location Service Routes V2
  x-serviceName: geo-routes
  x-serviceAlias: geo_routes
  x-protocol: rest-json
  x-apiVersion: '2020-11-19'
  x-endpointPrefix: geo-routes
servers:
- url: https://geo-routes.{region}.amazonaws.com
  variables:
    region:
      default: us-east-1
      description: AWS region
  description: Regional endpoint for geo-routes
paths:
  /v2/isolines:
    post:
      operationId: CalculateIsolines
      description: 'Calculates areas that can be reached within specified time or distance thresholds from a given point.
        For example, you can use this operation to determine the area within a 30-minute drive of a store location, find neighborhoods
        within walking distance of a school, or identify delivery zones based on drive time. Isolines (also known as isochrones
        for time-based calculations) are useful for various applications including: Service area visualization - Show customers
        the area you can serve within promised delivery times Site selection - Analyze potential business locations based
        on population within travel distance Site selection - Determine areas that can be reached within specified response
        times Route preferences such as avoiding toll roads or ferries are treated as preferences rather than absolute restrictions.
        If a viable route cannot be calculated while honoring all preferences, some may be ignored. For more information,
        see Calculate isolines in the Amazon Location Service Developer Guide.'
      parameters:
      - name: key
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ApiKey'
        description: An Amazon Location Service API Key with access to this action. If omitted, the request must be signed
          using Signature Version 4.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Allow:
                  $ref: '#/components/schemas/IsolineAllowOptions'
                ArrivalTime:
                  $ref: '#/components/schemas/TimestampWithTimezoneOffset'
                Avoid:
                  $ref: '#/components/schemas/IsolineAvoidanceOptions'
                DepartNow:
                  $ref: '#/components/schemas/SensitiveBoolean'
                DepartureTime:
                  $ref: '#/components/schemas/TimestampWithTimezoneOffset'
                Destination:
                  $ref: '#/components/schemas/Position'
                DestinationOptions:
                  $ref: '#/components/schemas/IsolineDestinationOptions'
                IsolineGeometryFormat:
                  $ref: '#/components/schemas/GeometryFormat'
                IsolineGranularity:
                  $ref: '#/components/schemas/IsolineGranularityOptions'
                OptimizeIsolineFor:
                  $ref: '#/components/schemas/IsolineOptimizationObjective'
                OptimizeRoutingFor:
                  $ref: '#/components/schemas/RoutingObjective'
                Origin:
                  $ref: '#/components/schemas/Position'
                OriginOptions:
                  $ref: '#/components/schemas/IsolineOriginOptions'
                Thresholds:
                  $ref: '#/components/schemas/IsolineThresholds'
                Traffic:
                  $ref: '#/components/schemas/IsolineTrafficOptions'
                TravelMode:
                  $ref: '#/components/schemas/IsolineTravelMode'
                TravelModeOptions:
                  $ref: '#/components/schemas/IsolineTravelModeOptions'
              required:
              - Thresholds
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateIsolinesResponse'
      x-stackql-resource: calculate_isolines
      x-stackql-method: calculate_isolines
      x-stackql-verb: EXEC
  /v2/route-matrix:
    post:
      operationId: CalculateRouteMatrix
      description: Use CalculateRouteMatrix to compute results for all pairs of Origins to Destinations. Each row corresponds
        to one entry in Origins. Each entry in the row corresponds to the route from that entry in Origins to an entry in
        Destinations positions. For more information, see Calculate route matrix in the Amazon Location Service Developer
        Guide.
      parameters:
      - name: key
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ApiKey'
        description: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must
          be provided when making a request.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Allow:
                  $ref: '#/components/schemas/RouteMatrixAllowOptions'
                Avoid:
                  $ref: '#/components/schemas/RouteMatrixAvoidanceOptions'
                DepartNow:
                  $ref: '#/components/schemas/SensitiveBoolean'
                DepartureTime:
                  $ref: '#/components/schemas/TimestampWithTimezoneOffset'
                Destinations:
                  $ref: '#/components/schemas/CalculateRouteMatrixRequestDestinationsList'
                Exclude:
                  $ref: '#/components/schemas/RouteMatrixExclusionOptions'
                OptimizeRoutingFor:
                  $ref: '#/components/schemas/RoutingObjective'
                Origins:
                  $ref: '#/components/schemas/CalculateRouteMatrixRequestOriginsList'
                RoutingBoundary:
                  $ref: '#/components/schemas/RouteMatrixBoundary'
                Traffic:
                  $ref: '#/components/schemas/RouteMatrixTrafficOptions'
                TravelMode:
                  $ref: '#/components/schemas/RouteMatrixTravelMode'
                TravelModeOptions:
                  $ref: '#/components/schemas/RouteMatrixTravelModeOptions'
              required:
              - Destinations
              - Origins
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateRouteMatrixResponse'
      x-stackql-resource: calculate_route_matrix
      x-stackql-method: calculate_route_matrix
      x-stackql-verb: EXEC
  /v2/routes:
    post:
      operationId: CalculateRoutes
      description: 'CalculateRoutes computes routes given the following required parameters: Origin and Destination. For more
        information, see Calculate routes in the Amazon Location Service Developer Guide.'
      parameters:
      - name: key
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ApiKey'
        description: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must
          be provided when making a request.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Allow:
                  $ref: '#/components/schemas/RouteAllowOptions'
                ArrivalTime:
                  $ref: '#/components/schemas/TimestampWithTimezoneOffset'
                Avoid:
                  $ref: '#/components/schemas/RouteAvoidanceOptions'
                DepartNow:
                  $ref: '#/components/schemas/SensitiveBoolean'
                DepartureTime:
                  $ref: '#/components/schemas/TimestampWithTimezoneOffset'
                Destination:
                  $ref: '#/components/schemas/Position'
                DestinationOptions:
                  $ref: '#/components/schemas/RouteDestinationOptions'
                Driver:
                  $ref: '#/components/schemas/RouteDriverOptions'
                Exclude:
                  $ref: '#/components/schemas/RouteExclusionOptions'
                InstructionsMeasurementSystem:
                  $ref: '#/components/schemas/MeasurementSystem'
                Languages:
                  $ref: '#/components/schemas/CalculateRoutesRequestLanguagesList'
                LegAdditionalFeatures:
                  $ref: '#/components/schemas/RouteLegAdditionalFeatureList'
                LegGeometryFormat:
                  $ref: '#/components/schemas/GeometryFormat'
                MaxAlternatives:
                  $ref: '#/components/schemas/CalculateRoutesRequestMaxAlternativesInteger'
                OptimizeRoutingFor:
                  $ref: '#/components/schemas/RoutingObjective'
                Origin:
                  $ref: '#/components/schemas/Position'
                OriginOptions:
                  $ref: '#/components/schemas/RouteOriginOptions'
                SpanAdditionalFeatures:
                  $ref: '#/components/schemas/RouteSpanAdditionalFeatureList'
                Tolls:
                  $ref: '#/components/schemas/RouteTollOptions'
                Traffic:
                  $ref: '#/components/schemas/RouteTrafficOptions'
                TravelMode:
                  $ref: '#/components/schemas/RouteTravelMode'
                TravelModeOptions:
                  $ref: '#/components/schemas/RouteTravelModeOptions'
                TravelStepType:
                  $ref: '#/components/schemas/RouteTravelStepType'
                Waypoints:
                  $ref: '#/components/schemas/RouteWaypointList'
              required:
              - Destination
              - Origin
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateRoutesResponse'
      x-stackql-resource: calculate_routes
      x-stackql-method: calculate_routes
      x-stackql-verb: EXEC
  /v2/optimize-waypoints:
    post:
      operationId: OptimizeWaypoints
      description: OptimizeWaypoints calculates the optimal order to travel between a set of waypoints to minimize either
        the travel time or the distance travelled during the journey, based on road network restrictions and the traffic pattern
        data. For more information, see Optimize waypoints in the Amazon Location Service Developer Guide.
      parameters:
      - name: key
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ApiKey'
        description: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must
          be provided when making a request.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Avoid:
                  $ref: '#/components/schemas/WaypointOptimizationAvoidanceOptions'
                Clustering:
                  $ref: '#/components/schemas/WaypointOptimizationClusteringOptions'
                DepartureTime:
                  $ref: '#/components/schemas/TimestampWithTimezoneOffset'
                Destination:
                  $ref: '#/components/schemas/Position'
                DestinationOptions:
                  $ref: '#/components/schemas/WaypointOptimizationDestinationOptions'
                Driver:
                  $ref: '#/components/schemas/WaypointOptimizationDriverOptions'
                Exclude:
                  $ref: '#/components/schemas/WaypointOptimizationExclusionOptions'
                OptimizeSequencingFor:
                  $ref: '#/components/schemas/WaypointOptimizationSequencingObjective'
                Origin:
                  $ref: '#/components/schemas/Position'
                OriginOptions:
                  $ref: '#/components/schemas/WaypointOptimizationOriginOptions'
                Traffic:
                  $ref: '#/components/schemas/WaypointOptimizationTrafficOptions'
                TravelMode:
                  $ref: '#/components/schemas/WaypointOptimizationTravelMode'
                TravelModeOptions:
                  $ref: '#/components/schemas/WaypointOptimizationTravelModeOptions'
                Waypoints:
                  $ref: '#/components/schemas/WaypointOptimizationWaypointList'
              required:
              - Origin
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizeWaypointsResponse'
      x-stackql-resource: optimize_waypoints
      x-stackql-method: optimize_waypoints
      x-stackql-verb: EXEC
  /v2/snap-to-roads:
    post:
      operationId: SnapToRoads
      description: SnapToRoads matches GPS trace to roads most likely traveled on. For more information, see Snap to Roads
        in the Amazon Location Service Developer Guide.
      parameters:
      - name: key
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ApiKey'
        description: 'Optional: The API key to be used for authorization. Either an API key or valid SigV4 signature must
          be provided when making a request.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                SnappedGeometryFormat:
                  $ref: '#/components/schemas/GeometryFormat'
                SnapRadius:
                  $ref: '#/components/schemas/SnapToRoadsRequestSnapRadiusLong'
                TracePoints:
                  $ref: '#/components/schemas/SnapToRoadsRequestTracePointsList'
                TravelMode:
                  $ref: '#/components/schemas/RoadSnapTravelMode'
                TravelModeOptions:
                  $ref: '#/components/schemas/RoadSnapTravelModeOptions'
              required:
              - TracePoints
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapToRoadsResponse'
      x-stackql-resource: snap_to_roads
      x-stackql-method: snap_to_roads
      x-stackql-verb: EXEC
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    ApiKey:
      type: string
      minLength: 0
      maxLength: 1000
    IsolineAllowOptions:
      description: Special road types or features that should be considered available for routing. For example, this attribute
        can be used to allow the use of HOV (high-occupancy vehicle) or HOT (high-occupancy toll) lanes, even if they would
        otherwise not be.
      type: object
      properties:
        Hot:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: 'When true, allows the use of HOT (high-occupancy toll) lanes, which may affect travel times and reachable
            areas. Default value: false'
        Hov:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: 'When true, allows the use of HOV (high-occupancy vehicle) lanes, which may affect travel times and
            reachable areas. Default value: false'
    SensitiveBoolean:
      type: boolean
    TimestampWithTimezoneOffset:
      type: string
      pattern: ([1-2][0-9]{3})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):([0-5][0-9]):([0-5][0-9]|60)(\.[0-9]{0,9})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])
    IsolineAvoidanceOptions:
      description: Specifies features of the road network to avoid when calculating reachable areas. These preferences guide
        route calculations but may be overridden when no reasonable alternative exists. For example, if avoiding toll roads
        would make an area unreachable, toll roads may still be used. Avoidance options include physical features (like ferries
        and tunnels), road characteristics (like dirt roads and highways), and regulated areas (like congestion zones). They
        can be combined to match specific routing needs, such as avoiding both toll roads and ferries.
      type: object
      properties:
        Areas:
          $ref: '#/components/schemas/IsolineAvoidanceAreaList'
          description: Specifies geographic areas to avoid where possible. Routes may still pass through these areas if no
            reasonable alternative exists.
        CarShuttleTrains:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Indicates a preference to avoid car shuttle trains (auto trains) where possible. These may still be
            included if no reasonable alternative route exists.
        ControlledAccessHighways:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Indicates a preference to avoid controlled-access highways (such as interstate highways or motorways)
            where possible. If a viable route cannot be calculated using only local roads, controlled-access highways may
            still be included.
        DirtRoads:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Indicates a preference to avoid unpaved or dirt roads where possible. Routes may still include dirt
            roads if no reasonable paved alternative exists.
        Ferries:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Indicates a preference to avoid ferries where possible. If a viable route cannot be calculated without
            using ferries, they may still be included.
        SeasonalClosure:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Indicates a preference to avoid roads that may be subject to seasonal closures where possible. These
            roads may still be included if no reasonable year-round alternative exists.
        TollRoads:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Indicates a preference to avoid toll roads where possible. If a viable route cannot be calculated without
            using toll roads, they may still be included.
        TollTransponders:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Indicates a preference to avoid roads that require electronic toll collection transponders where possible.
            These roads may still be included if no viable alternative route exists.
        TruckRoadTypes:
          $ref: '#/components/schemas/TruckRoadTypeList'
          description: For truck travel modes, indicates specific road classification types in Sweden ( BK1 through BK4) and
            Mexico (A2, A4, B2, B4, C, D, ET2, ET4) to avoid where possible. These road types may still be used if no reasonable
            alternative exists. There are currently no other supported values as of 26th April 2024.
        Tunnels:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Indicates a preference to avoid tunnels where possible. If a viable route cannot be calculated without
            using tunnels, they may still be included.
        UTurns:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Indicates a preference to avoid U-turns where possible. U-turns may still be included if necessary
            to reach certain areas or when no reasonable alternative exists.
        ZoneCategories:
          $ref: '#/components/schemas/IsolineAvoidanceZoneCategoryList'
          description: Indicates types of regulated zones (such as congestion pricing or environmental zones) to avoid where
            possible. Routes may still pass through these zones if no reasonable alternative exists.
    IsolineAvoidanceAreaList:
      type: array
      items:
        $ref: '#/components/schemas/IsolineAvoidanceArea'
    IsolineAvoidanceArea:
      description: Defines an area to avoid when calculating routes. Consists of a primary geometry to avoid, with the ability
        to specify exception areas within that geometry where travel is permitted.
      type: object
      properties:
        Except:
          $ref: '#/components/schemas/IsolineAvoidanceAreaGeometryList'
          description: Areas within the primary avoidance geometry where travel is allowed. For example, you might want to
            avoid a neighborhood but allow travel on a major road that passes through it.
        Geometry:
          $ref: '#/components/schemas/IsolineAvoidanceAreaGeometry'
          description: The primary area to avoid, specified using a bounding box, corridor, polygon, or polyline corridor.
      required:
      - Geometry
    IsolineAvoidanceAreaGeometryList:
      type: array
      items:
        $ref: '#/components/schemas/IsolineAvoidanceAreaGeometry'
    IsolineAvoidanceAreaGeometry:
      description: Defines an area to avoid during calculations using one of several supported geometry types. The service
        will prefer routes that avoid these areas when possible.
      type: object
      properties:
        BoundingBox:
          $ref: '#/components/schemas/BoundingBox'
          description: 'A rectangular area defined by its southwest and northeast corners: [min longitude, min latitude, max
            longitude, max latitude].'
        Corridor:
          $ref: '#/components/schemas/Corridor'
          description: A buffer zone around a line, defined by a series of coordinates and a radius in meters.
        Polygon:
          $ref: '#/components/schemas/IsolineAvoidanceAreaGeometryPolygonList'
          description: A polygon defined by a list of coordinate rings. The first ring defines the outer boundary; subsequent
            rings will be ignored.
        PolylineCorridor:
          $ref: '#/components/schemas/PolylineCorridor'
          description: A buffer zone around a compressed polyline, defined by an encoded polyline string and a radius in meters.
            For more information on polyline encoding, see https://github.com/aws-geospatial/polyline.
        PolylinePolygon:
          $ref: '#/components/schemas/IsolineAvoidanceAreaGeometryPolylinePolygonList'
          description: A polygon defined by encoded polyline strings. The first string defines the outer boundary; subsequent
            strings will be ignored. For more information on polyline encoding, see https://github.com/aws-geospatial/polyline.
    BoundingBox:
      type: array
      items:
        $ref: '#/components/schemas/Double'
    Double:
      type: number
      format: double
    Corridor:
      description: Geometry defined as a corridor - a LineString with a radius that defines the width of the corridor.
      type: object
      properties:
        LineString:
          $ref: '#/components/schemas/LineString'
          description: An ordered list of positions used to plot a route on a map. LineString and Polyline are mutually exclusive
            properties.
        Radius:
          $ref: '#/components/schemas/Integer'
          description: Radius that defines the width of the corridor.
      required:
      - LineString
      - Radius
    LineString:
      type: array
      items:
        $ref: '#/components/schemas/Position'
    Position:
      type: array
      items:
        $ref: '#/components/schemas/Double'
    Integer:
      type: integer
    IsolineAvoidanceAreaGeometryPolygonList:
      type: array
      items:
        $ref: '#/components/schemas/LinearRing'
    LinearRing:
      type: array
      items:
        $ref: '#/components/schemas/Position'
    PolylineCorridor:
      description: Geometry defined as an encoded corridor - an encoded polyline with a radius that defines the width of the
        corridor.
      type: object
      properties:
        Polyline:
          $ref: '#/components/schemas/Polyline'
          description: An ordered list of positions used to plot a route on a map in a lossy compression format. LineString
            and Polyline are mutually exclusive properties.
        Radius:
          $ref: '#/components/schemas/Integer'
          description: 'Considers all roads within the provided radius to match the provided destination to. The roads that
            are considered are determined by the provided Strategy. Unit: meters'
      required:
      - Polyline
      - Radius
    Polyline:
      type: string
      minLength: 1
    IsolineAvoidanceAreaGeometryPolylinePolygonList:
      type: array
      items:
        $ref: '#/components/schemas/PolylineRing'
    PolylineRing:
      type: string
      minLength: 1
    TruckRoadTypeList:
      type: array
      items:
        $ref: '#/components/schemas/TruckRoadType'
    TruckRoadType:
      type: string
      minLength: 1
      maxLength: 3
    IsolineAvoidanceZoneCategoryList:
      type: array
      items:
        $ref: '#/components/schemas/IsolineAvoidanceZoneCategory'
    IsolineAvoidanceZoneCategory:
      description: Types of regulated zones that may affect routing.
      type: object
      properties:
        Category:
          $ref: '#/components/schemas/IsolineZoneCategory'
          description: 'The type of regulated zone: CongestionPricing for toll zones based on traffic levels, Environmental
            for low-emission zones, or Vignette for areas requiring special permits or stickers.'
    IsolineZoneCategory:
      type: string
      enum:
      - CongestionPricing
      - Environmental
      - Vignette
    IsolineDestinationOptions:
      description: Options that control how the destination point is interpreted and matched to the road network when calculating
        reachable areas. This affects which roads are considered accessible near the destination and how the final approach
        is calculated.
      type: object
      properties:
        AvoidActionsForDistance:
          $ref: '#/components/schemas/DistanceMeters'
          description: The distance in meters from the destination point within which certain routing actions (such as U-turns
            or left turns across traffic) are restricted. This helps generate more practical routes by avoiding potentially
            dangerous maneuvers near the endpoint.
        Heading:
          $ref: '#/components/schemas/Heading'
          description: The initial direction of travel in degrees (0-360, where 0 is north). This can affect which road segments
            are considered accessible from the starting point.
        Matching:
          $ref: '#/components/schemas/IsolineMatchingOptions'
          description: Controls how the destination point is matched to the road network, including search radius and name-based
            matching preferences.
        SideOfStreet:
          $ref: '#/components/schemas/IsolineSideOfStreetOptions'
          description: Specifies which side of the street should be considered accessible, which is important when building
            entrances or parking access points are only reachable from one side of the road.
    DistanceMeters:
      type: integer
      format: int64
      minimum: 0
      maximum: 4294967295
    Heading:
      type: number
      format: double
      minimum: 0.0
      maximum: 360.0
    IsolineMatchingOptions:
      description: Controls how origin and destination points are matched to the road network when they don't fall exactly
        on a road. Matching options help ensure realistic routing by connecting points to appropriate roads.
      type: object
      properties:
        NameHint:
          $ref: '#/components/schemas/SensitiveString'
          description: The expected street name near the point. Helps disambiguate matching when multiple roads are within
            range.
        OnRoadThreshold:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'The maximum distance in meters that a point can be from a road while still being considered "on" that
            road. Points further than this distance require explicit matching. Unit: meters'
        Radius:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'The maximum distance in meters to search for roads to match to. Points with no roads within this radius
            will fail to match. The roads that are considered within this radius are determined by the specified Strategy
            Unit: meters'
        Strategy:
          $ref: '#/components/schemas/MatchingStrategy'
          description: Determines how points are matched to the road network. MatchAny finds the nearest viable road segment,
            while MatchMostSignificantRoad prioritizes major roads.
    SensitiveString:
      type: string
    MatchingStrategy:
      type: string
      enum:
      - MatchAny
      - MatchMostSignificantRoad
    IsolineSideOfStreetOptions:
      description: Controls how points are matched to specific sides of streets. This is important when the side of the street
        matters for accessibility - for example, when building entrances or parking lot access points can only be reached
        from one side of a divided road.
      type: object
      properties:
        Position:
          $ref: '#/components/schemas/Position'
          description: The [longitude, latitude] coordinates of the point that should be matched to a specific side of the
            street.
        UseWith:
          $ref: '#/components/schemas/SideOfStreetMatchingStrategy'
          description: 'Controls whether side-of-street matching is applied to any street (AnyStreet) or only to divided roads
            (DividedStreetOnly). This is important when the exact side of the street matters - for example, if a building
            entrance is only accessible from one side of a divided highway, or if a parking lot can only be entered from northbound
            lanes. Without correct side-of-street matching, travel time estimates may be inaccurate because they don''t account
            for necessary U-turns or detours to reach the correct side. Default value: DividedStreetOnly'
      required:
      - Position
    SideOfStreetMatchingStrategy:
      type: string
      enum:
      - AnyStreet
      - DividedStreetOnly
    GeometryFormat:
      type: string
      enum:
      - FlexiblePolyline
      - Simple
    IsolineGranularityOptions:
      description: Controls the detail level and smoothness of generated isolines. More detailed isolines provide better visual
        representation of reachable areas but require more processing time and result in larger responses.
      type: object
      properties:
        MaxPoints:
          $ref: '#/components/schemas/IsolineGranularityOptionsMaxPointsInteger'
          description: The maximum number of points used to define each isoline. Higher values create smoother, more detailed
            shapes.
        MaxResolution:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'The maximum distance in meters between points along the isoline. Smaller values create more detailed
            shapes. Unit: meters'
    IsolineGranularityOptionsMaxPointsInteger:
      type: integer
      minimum: 31
    IsolineOptimizationObjective:
      type: string
      enum:
      - AccurateCalculation
      - BalancedCalculation
      - FastCalculation
    RoutingObjective:
      type: string
      enum:
      - FastestRoute
      - ShortestRoute
    IsolineOriginOptions:
      description: Options that control how the origin point is interpreted when calculating reachable areas. These options
        affect which roads are considered accessible from the starting point and how initial routing decisions are made.
      type: object
      properties:
        AvoidActionsForDistance:
          $ref: '#/components/schemas/DistanceMeters'
          description: The distance in meters from the origin point within which certain routing actions (such as U-turns
            or left turns across traffic) are restricted. This helps generate more practical routes by avoiding potentially
            dangerous maneuvers near the starting point.
        Heading:
          $ref: '#/components/schemas/Heading'
          description: Initial direction of travel in degrees (0-360, where 0 is north). This affects which road segments
            are considered accessible from the starting point and is particularly useful when the origin is on a divided road
            or at a complex intersection.
        Matching:
          $ref: '#/components/schemas/IsolineMatchingOptions'
          description: Controls how the origin point is matched to the road network, including search radius and matching
            strategy.
        SideOfStreet:
          $ref: '#/components/schemas/IsolineSideOfStreetOptions'
          description: Controls which side of the street is considered accessible from the origin point, particularly important
            for divided roads where building entrances or parking access may only be available from one direction.
    IsolineThresholds:
      description: Specifies the time or distance limits used to calculate reachable areas. You can provide up to five thresholds
        for a single type to generate multiple isolines in a single request. For example, you might request areas reachable
        within 5, 10, and 15 minutes, or within 1, 2, and 5 kilometers.
      type: object
      properties:
        Distance:
          $ref: '#/components/schemas/DistanceThresholdList'
          description: List of travel distances in meters. For example, [1000, 2000, 5000] would calculate areas reachable
            within 1, 2, and 5 kilometers.
        Time:
          $ref: '#/components/schemas/TimeThresholdList'
          description: List of travel times in seconds. For example, [300, 600, 900] would calculate areas reachable within
            5, 10, and 15 minutes.
    DistanceThresholdList:
      type: array
      items:
        $ref: '#/components/schemas/DistanceThresholdListMemberLong'
    DistanceThresholdListMemberLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 300000
    TimeThresholdList:
      type: array
      items:
        $ref: '#/components/schemas/TimeThresholdListMemberLong'
    TimeThresholdListMemberLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 10800
    IsolineTrafficOptions:
      description: Controls how real-time and historical traffic data is used when calculating reachable areas. This affects
        both the size and shape of isolines by accounting for expected travel speeds based on congestion patterns.
      type: object
      properties:
        FlowEventThresholdOverride:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'The duration in seconds that real-time congestion data is considered valid before reverting to historical
            traffic patterns. This helps balance between using current conditions and more predictable historical data when
            calculating travel times. Unit: seconds'
        Usage:
          $ref: '#/components/schemas/TrafficUsage'
          description: 'Controls whether traffic data is used in calculations. UseTrafficData considers both real-time congestion
            and historical patterns, while IgnoreTrafficData calculates routes based solely on road types and speed limits.
            Using traffic data provides more accurate real-world estimates but may produce different results at different
            times of day. Default value: UseTrafficData'
    DurationSeconds:
      type: integer
      format: int64
      minimum: 0
      maximum: 4294967295
    TrafficUsage:
      type: string
      enum:
      - IgnoreTrafficData
      - UseTrafficData
    IsolineTravelMode:
      type: string
      enum:
      - Car
      - Pedestrian
      - Scooter
      - Truck
    IsolineTravelModeOptions:
      description: Mode-specific routing options that further refine how reachable areas are calculated. Options are only
        considered when they match the selected travel mode.
      type: object
      properties:
        Car:
          $ref: '#/components/schemas/IsolineCarOptions'
          description: Options specific to passenger vehicle routing (Car, such as vehicle characteristics and license plate
            restrictions.
        Scooter:
          $ref: '#/components/schemas/IsolineScooterOptions'
          description: Options specific to scooter routing (Scooter, such as vehicle characteristics and license plate restrictions.
            When using the Scooter travel mode, controlled-access highways are automatically avoided unless explicitly allowed.
        Truck:
          $ref: '#/components/schemas/IsolineTruckOptions'
          description: Options specific to commercial truck routing (Truck, including vehicle dimensions, weight limits, and
            hazardous cargo specifications.
    IsolineCarOptions:
      description: Vehicle characteristics and preferences that affect routing for passenger cars. This includes vehicle type,
        occupancy, and speed restrictions that may influence which roads can be used and expected travel times.
      type: object
      properties:
        EngineType:
          $ref: '#/components/schemas/IsolineEngineType'
          description: The type of engine powering the vehicle, which may affect route calculation due to road restrictions
            or vehicle characteristics. INTERNAL_COMBUSTION—Standard gasoline or diesel engine. ELECTRIC—Battery electric
            vehicle. PLUGIN_HYBRID—Combination of electric and internal combustion engines with plug-in charging capability.
        LicensePlate:
          $ref: '#/components/schemas/IsolineVehicleLicensePlate'
          description: License plate information used in regions where road access or routing restrictions are based on license
            plate numbers.
        MaxSpeed:
          $ref: '#/components/schemas/IsolineCarOptionsMaxSpeedDouble'
          description: 'The maximum speed of the vehicle in kilometers per hour. When specified, routes will not include roads
            with higher speed limits. Valid values range from 3.6 km/h (1 m/s) to 252 km/h (70 m/s). Unit: kilometers per
            hour'
        Occupancy:
          $ref: '#/components/schemas/IsolineCarOptionsOccupancyInteger'
          description: 'The number of occupants in the vehicle. This can affect route calculations by enabling the use of
            high-occupancy vehicle (HOV) lanes where minimum occupancy requirements are met. Default value: 1'
    IsolineEngineType:
      type: string
      enum:
      - Electric
      - InternalCombustion
      - PluginHybrid
    IsolineVehicleLicensePlate:
      description: License plate information used in regions where road access or routing restrictions are based on license
        plate numbers.
      type: object
      properties:
        LastCharacter:
          $ref: '#/components/schemas/IsolineVehicleLicensePlateLastCharacterString'
          description: The last character of the vehicle's license plate. Used to determine road access restrictions in regions
            with license plate-based traffic management systems.
    IsolineVehicleLicensePlateLastCharacterString:
      type: string
      minLength: 1
      maxLength: 1
    IsolineCarOptionsMaxSpeedDouble:
      type: number
      format: double
      minimum: 3.6
      maximum: 252.0
    IsolineCarOptionsOccupancyInteger:
      type: integer
      minimum: 1
    IsolineScooterOptions:
      description: Vehicle characteristics that affect which roads and paths can be used when calculating reachable areas
        for scooters. This includes areas such as bike lanes, shared paths, and roads where scooters are permitted.
      type: object
      properties:
        EngineType:
          $ref: '#/components/schemas/IsolineEngineType'
          description: The type of engine powering the vehicle, which may affect route calculation due to road restrictions
            or vehicle characteristics. INTERNAL_COMBUSTION—Standard gasoline or diesel engine. ELECTRIC—Battery electric
            vehicle. PLUGIN_HYBRID—Combination of electric and internal combustion engines with plug-in charging capability.
        LicensePlate:
          $ref: '#/components/schemas/IsolineVehicleLicensePlate'
          description: License plate information used in regions where road access or routing restrictions are based on license
            plate numbers.
        MaxSpeed:
          $ref: '#/components/schemas/IsolineScooterOptionsMaxSpeedDouble'
          description: 'The maximum speed of the vehicle in kilometers per hour. When specified, routes will not include roads
            with higher speed limits. Valid values range from 3.6 km/h (1 m/s) to 252 km/h (70 m/s). Unit: kilometers per
            hour'
        Occupancy:
          $ref: '#/components/schemas/IsolineScooterOptionsOccupancyInteger'
          description: 'The number of occupants in the vehicle. This can affect route calculations by enabling the use of
            high-occupancy vehicle (HOV) lanes where minimum occupancy requirements are met. Default value: 1'
    IsolineScooterOptionsMaxSpeedDouble:
      type: number
      format: double
      minimum: 3.6
      maximum: 252.0
    IsolineScooterOptionsOccupancyInteger:
      type: integer
      minimum: 1
    IsolineTruckOptions:
      description: Vehicle characteristics and restrictions that affect which roads can be used when calculating reachable
        areas for trucks. These details ensure that routes respect physical limitations and legal requirements. These apply
        when the provided travel mode is Truck
      type: object
      properties:
        AxleCount:
          $ref: '#/components/schemas/IsolineTruckOptionsAxleCountInteger'
          description: The total number of axles on the vehicle. Required for certain road restrictions and weight limit calculations.
        EngineType:
          $ref: '#/components/schemas/IsolineEngineType'
          description: The type of engine powering the vehicle, which may affect route calculation due to road restrictions
            or vehicle characteristics. INTERNAL_COMBUSTION—Standard gasoline or diesel engine. ELECTRIC—Battery electric
            vehicle. PLUGIN_HYBRID—Combination of electric and internal combustion engines with plug-in charging capability.
        GrossWeight:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'The gross vehicle weight (the maximum weight a vehicle can safely operate at, as specified by the
            manufacturer) in kilograms. Used to avoid roads with weight restrictions and ensure compliance with maximum allowed
            vehicle weight regulations. Unit: kilograms'
        HazardousCargos:
          $ref: '#/components/schemas/IsolineHazardousCargoTypeList'
          description: Types of hazardous materials being transported. This affects which roads and tunnels can be used based
            on local regulations. Combustible—Materials that can burn readily Corrosive—Materials that can destroy or irreversibly
            damage other substances Explosive—Materials that can produce an explosion by chemical reaction Flammable—Materials
            that can easily ignite Gas—Hazardous materials in gaseous form HarmfulToWater—Materials that pose a risk to water
            sources if released Organic—Hazardous organic compounds Other—Hazardous materials not covered by other categories
            Poison—Toxic materials PoisonousInhalation—Materials that are toxic when inhaled Radioactive—Materials that emit
            ionizing radiation
        Height:
          $ref: '#/components/schemas/IsolineTruckOptionsHeightLong'
          description: 'The vehicle height in centimeters. Used to avoid routes with low bridges or other height restrictions.
            Unit: centimeters'
        HeightAboveFirstAxle:
          $ref: '#/components/schemas/IsolineTruckOptionsHeightAboveFirstAxleLong'
          description: 'The height in centimeters measured from the ground to the highest point above the first axle. Used
            for specific bridge and tunnel clearance restrictions. Unit: centimeters'
        KpraLength:
          $ref: '#/components/schemas/DimensionCentimeters'
          description: 'The kingpin to rear axle (KPRA) length in centimeters. Used to determine if the vehicle can safely
            navigate turns and intersections. Unit: centimeters'
        Length:
          $ref: '#/components/schemas/IsolineTruckOptionsLengthLong'
          description: 'The total vehicle length in centimeters. Used to avoid roads with length restrictions and determine
            if the vehicle can safely navigate turns. Unit: centimeters'
        LicensePlate:
          $ref: '#/components/schemas/IsolineVehicleLicensePlate'
          description: License plate information used in regions where road access or routing restrictions are based on license
            plate numbers.
        MaxSpeed:
          $ref: '#/components/schemas/IsolineTruckOptionsMaxSpeedDouble'
          description: 'The maximum speed in kilometers per hour at which the vehicle can or is permitted to travel. This
            affects travel time calculations and may result in different reachable areas compared to using default speed limits.
            Value must be between 3.6 and 252 kilometers per hour. Unit: kilometers per hour'
        Occupancy:
          $ref: '#/components/schemas/IsolineTruckOptionsOccupancyInteger'
          description: 'The number of occupants in the vehicle. This can affect route calculations by enabling the use of
            high-occupancy vehicle (HOV) lanes where minimum occupancy requirements are met. Default value: 1'
        PayloadCapacity:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'The maximum cargo weight in kilograms that the vehicle (including attached trailers) is rated to carry.
            Unit: kilograms'
        TireCount:
          $ref: '#/components/schemas/IsolineTruckOptionsTireCountInteger'
          description: The total number of tires on the vehicle.
        Trailer:
          $ref: '#/components/schemas/IsolineTrailerOptions'
          description: Optional specifications for attached trailers. When provided, trailer characteristics affect route
            calculations to ensure compliance with trailer-specific restrictions such as length limits, weight distribution
            requirements, and access restrictions for multi-trailer configurations.
        TruckType:
          $ref: '#/components/schemas/IsolineTruckType'
          description: 'The type of truck: LightTruck for smaller delivery vehicles, StraightTruck for rigid body trucks,
            or Tractor for tractor-trailer combinations.'
        TunnelRestrictionCode:
          $ref: '#/components/schemas/TunnelRestrictionCode'
          description: 'The tunnel restriction code. Tunnel categories in this list indicate the restrictions which apply
            to certain tunnels in Great Britain. They relate to the types of dangerous goods that can be transported through
            them. Tunnel Category B Risk Level: Limited risk Restrictions: Few restrictions Tunnel Category C Risk Level:
            Medium risk Restrictions: Some restrictions Tunnel Category D Risk Level: High risk Restrictions: Many restrictions
            occur Tunnel Category E Risk Level: Very high risk Restrictions: Restricted tunnel'
        WeightPerAxle:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'The heaviest weight per axle in kilograms, regardless of axle type or grouping. Used for roads with
            axle-weight restrictions in regions where regulations don''t distinguish between different axle configurations.
            Unit: kilograms'
        WeightPerAxleGroup:
          $ref: '#/components/schemas/WeightPerAxleGroup'
          description: 'Specifies the total weight for different axle group configurations. Used in regions where regulations
            set different weight limits based on axle group types. Unit: kilograms'
        Width:
          $ref: '#/components/schemas/IsolineTruckOptionsWidthLong'
          description: 'The vehicle width in centimeters. Used to avoid routes with width restrictions. Unit: centimeters'
    IsolineTruckOptionsAxleCountInteger:
      type: integer
      minimum: 2
      maximum: 255
    WeightKilograms:
      type: integer
      format: int64
      minimum: 0
      maximum: 4294967295
    IsolineHazardousCargoTypeList:
      type: array
      items:
        $ref: '#/components/schemas/IsolineHazardousCargoType'
    IsolineHazardousCargoType:
      type: string
      enum:
      - Combustible
      - Corrosive
      - Explosive
      - Flammable
      - Gas
      - HarmfulToWater
      - Organic
      - Other
      - Poison
      - PoisonousInhalation
      - Radioactive
    IsolineTruckOptionsHeightLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 5000
    IsolineTruckOptionsHeightAboveFirstAxleLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 5000
    DimensionCentimeters:
      type: integer
      format: int64
      minimum: 0
      maximum: 4294967295
    IsolineTruckOptionsLengthLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 30000
    IsolineTruckOptionsMaxSpeedDouble:
      type: number
      format: double
      minimum: 3.6
      maximum: 252.0
    IsolineTruckOptionsOccupancyInteger:
      type: integer
      minimum: 1
    IsolineTruckOptionsTireCountInteger:
      type: integer
      minimum: 1
      maximum: 255
    IsolineTrailerOptions:
      description: Additional specifications when the vehicle includes one or more trailers.
      type: object
      properties:
        AxleCount:
          $ref: '#/components/schemas/IsolineTrailerOptionsAxleCountInteger'
          description: The total number of axles across all trailers. Used for weight distribution calculations and road restrictions.
        TrailerCount:
          $ref: '#/components/schemas/IsolineTrailerOptionsTrailerCountInteger'
          description: 'The number of trailers being pulled. Affects which roads can be used based on local regulations. Default
            value: 0'
    IsolineTrailerOptionsAxleCountInteger:
      type: integer
      minimum: 1
    IsolineTrailerOptionsTrailerCountInteger:
      type: integer
      minimum: 1
      maximum: 255
    IsolineTruckType:
      type: string
      enum:
      - LightTruck
      - StraightTruck
      - Tractor
    TunnelRestrictionCode:
      type: string
      minLength: 1
      maxLength: 1
    WeightPerAxleGroup:
      description: 'Specifies the total weight for different axle group configurations. Used in regions where regulations
        set different weight limits based on axle group types. Unit: kilograms'
      type: object
      properties:
        Single:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Total weight in kilograms for single axle configurations. Unit: kilograms'
        Tandem:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Total weight in kilograms for tandem (two adjacent) axle configurations. Unit: kilograms'
        Triple:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Total weight in kilograms for triple (three adjacent) axle configurations. Unit: kilograms'
        Quad:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Total weight in kilograms for quad (four adjacent) axle configurations. Unit: kilograms'
        Quint:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Total weight in kilograms for quint (five adjacent) axle configurations. Unit: kilograms'
    IsolineTruckOptionsWidthLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 5000
    CalculateIsolinesResponse:
      type: object
      properties:
        ArrivalTime:
          $ref: '#/components/schemas/TimestampWithTimezoneOffset'
          description: 'Time of arrival at the destination, used for traffic calculations. This attribute is returned only
            if the Destination and ArrivalTime attributes were provided in the request. Time format: YYYY-MM-DDThh:mm:ss.sssZ
            | YYYY-MM-DDThh:mm:ss.sss+hh:mm Examples: 2020-04-22T17:57:24Z 2020-04-22T17:57:24+02:00'
        DepartureTime:
          $ref: '#/components/schemas/TimestampWithTimezoneOffset'
          description: 'Time of departure from the origin, used for traffic calculations. This attribute is returned when
            Origin was provided in the request and either a specific departure time was requested (DepartureTime) or DepartNow
            was set to true. Time format: YYYY-MM-DDThh:mm:ss.sssZ | YYYY-MM-DDThh:mm:ss.sss+hh:mm Examples: 2020-04-22T17:57:24Z
            2020-04-22T17:57:24+02:00'
        IsolineGeometryFormat:
          $ref: '#/components/schemas/GeometryFormat'
          description: The format of the returned geometries, matching the format specified in the request. Either FlexiblePolyline
            for compact encoding or Simple for GeoJSON-compatible coordinates. Default value:FlexiblePolyline
        Isolines:
          $ref: '#/components/schemas/IsolineList'
          description: Reachable areas, or isolines, for each threshold specified in the request.
        PricingBucket:
          $ref: '#/components/schemas/String'
          description: The pricing bucket applied to this calculation. Different buckets apply based on the travel mode and
            thresholds used.
        SnappedDestination:
          $ref: '#/components/schemas/Position'
          description: The actual point on the road network used for calculations, which may differ from the requested destination
            if Destination was not directly on a road.
        SnappedOrigin:
          $ref: '#/components/schemas/Position'
          description: The actual point on the road network used for calculations, which may differ from the requested origin
            if Origin was not directly on a road.
      required:
      - IsolineGeometryFormat
      - Isolines
      - PricingBucket
    IsolineList:
      type: array
      items:
        $ref: '#/components/schemas/Isoline'
    Isoline:
      description: Represents a single reachable area calculated for a specific threshold.
      type: object
      properties:
        Connections:
          $ref: '#/components/schemas/IsolineConnectionList'
          description: Lines connecting separate parts of the reachable area that can be reached within the same threshold.
            These occur when areas are reachable but not contiguous, such as when separated by water or unroutable areas.
            When present, these lines represent actual transportation network segments (such as ferry routes or bridges) that
            connect the separated areas.
        DistanceThreshold:
          $ref: '#/components/schemas/DistanceMeters'
          description: The travel distance in meters used to calculate this isoline, if distance-based thresholds were specified
            in the request.
        Geometries:
          $ref: '#/components/schemas/IsolineShapeGeometryList'
          description: The shapes that define the reachable area, provided in the requested geometry format.
        TimeThreshold:
          $ref: '#/components/schemas/DurationSeconds'
          description: The travel time in seconds used to calculate this isoline, if time-based thresholds were specified
            in the request.
      required:
      - Connections
      - Geometries
    IsolineConnectionList:
      type: array
      items:
        $ref: '#/components/schemas/IsolineConnection'
    IsolineConnection:
      description: Represents a segment of the transportation network that connects separate parts of a reachable area. These
        connections show how discontinuous areas are linked, such as by ferry routes or bridges crossing unroutable terrain.
      type: object
      properties:
        FromPolygonIndex:
          $ref: '#/components/schemas/IsolineConnectionFromPolygonIndexInteger'
          description: The index of the starting polygon in the isoline's Geometries list.
        Geometry:
          $ref: '#/components/schemas/IsolineConnectionGeometry'
          description: The shape of the connection, representing the actual path through the transportation network that links
            the polygons.
        ToPolygonIndex:
          $ref: '#/components/schemas/IsolineConnectionToPolygonIndexInteger'
          description: The index of the ending polygon in the isoline's Geometries list.
      required:
      - FromPolygonIndex
      - Geometry
      - ToPolygonIndex
    IsolineConnectionFromPolygonIndexInteger:
      type: integer
      minimum: 0
    IsolineConnectionGeometry:
      description: Represents the geometry of connections between non-contiguous parts of an isoline. These connections can
        be provided in either coordinate pairs (LineString) or encoded (Polyline) format, matching the format specified in
        the request.
      type: object
      properties:
        LineString:
          $ref: '#/components/schemas/LineString'
          description: A series of [longitude, latitude] coordinate pairs defining the connection path when Simple geometry
            format is requested. These coordinates can be directly used as the coordinates array in a GeoJSON LineString without
            transformation. LineString and Polyline are mutually exclusive properties.
        Polyline:
          $ref: '#/components/schemas/Polyline'
          description: An encoded representation of the connection path when FlexiblePolyline geometry format is requested.
            This provides a more compact representation suitable for transmission and storage. To convert to GeoJSON, first
            decode to obtain coordinate pairs, then use those coordinates as the coordinates array in a GeoJSON LineString.
            LineString and Polyline are mutually exclusive properties.
    IsolineConnectionToPolygonIndexInteger:
      type: integer
      minimum: 0
    IsolineShapeGeometryList:
      type: array
      items:
        $ref: '#/components/schemas/IsolineShapeGeometry'
    IsolineShapeGeometry:
      description: Represents the shape of a reachable area. The geometry can be provided either as coordinate pairs (Polygon)
        or in encoded format (PolylinePolygon), matching the format specified in the request.
      type: object
      properties:
        Polygon:
          $ref: '#/components/schemas/LinearRings'
          description: A series of coordinate rings defining the reachable area when Simple geometry format is requested.
            Each ring is a list of [longitude, latitude] coordinate pairs. The first ring defines the outer boundary; subsequent
            rings define holes representing unreachable areas. Polygon and PolylinePolygon are mutually exclusive properties.
        PolylinePolygon:
          $ref: '#/components/schemas/PolylineRingList'
          description: An encoded representation of the reachable area when FlexiblePolyline geometry format is requested.
            Provides a compact representation suitable for transmission and storage. The first string defines the outer boundary;
            subsequent strings define holes representing unreachable areas. For more information on polyline encoding, see
            https://github.com/aws-geospatial/polyline. Polygon and PolylinePolygon are mutually exclusive properties.
    LinearRings:
      type: array
      items:
        $ref: '#/components/schemas/LinearRing'
    PolylineRingList:
      type: array
      items:
        $ref: '#/components/schemas/PolylineRing'
    String:
      type: string
    RouteMatrixAllowOptions:
      description: Allow Options related to the route matrix.
      type: object
      properties:
        Hot:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: 'Allow Hot (High Occupancy Toll) lanes while calculating the route. Default value: false'
        Hov:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: 'Allow Hov (High Occupancy vehicle) lanes while calculating the route. Default value: false'
    RouteMatrixAvoidanceOptions:
      description: Specifies options for areas to avoid when calculating the route. This is a best-effort avoidance setting,
        meaning the router will try to honor the avoidance preferences but may still include restricted areas if no feasible
        alternative route exists. If avoidance options are not followed, the response will indicate that the avoidance criteria
        were violated.
      type: object
      properties:
        Areas:
          $ref: '#/components/schemas/RouteMatrixAvoidanceOptionsAreasList'
          description: Areas to be avoided.
        CarShuttleTrains:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid car-shuttle-trains while calculating the route.
        ControlledAccessHighways:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid controlled access highways while calculating the route.
        DirtRoads:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid dirt roads while calculating the route.
        Ferries:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid ferries while calculating the route.
        TollRoads:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoids roads where the specified toll transponders are the only mode of payment.
        TollTransponders:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoids roads where the specified toll transponders are the only mode of payment.
        TruckRoadTypes:
          $ref: '#/components/schemas/TruckRoadTypeList'
          description: Truck road type identifiers. BK1 through BK4 apply only to Sweden. A2,A4,B2,B4,C,D,ET2,ET4 apply only
            to Mexico. There are currently no other supported values as of 26th April 2024.
        Tunnels:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid tunnels while calculating the route.
        UTurns:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid U-turns for calculation on highways and motorways.
        ZoneCategories:
          $ref: '#/components/schemas/RouteMatrixAvoidanceZoneCategoryList'
          description: Zone categories to be avoided.
    RouteMatrixAvoidanceOptionsAreasList:
      type: array
      items:
        $ref: '#/components/schemas/RouteMatrixAvoidanceArea'
    RouteMatrixAvoidanceArea:
      description: Area to be avoided.
      type: object
      properties:
        Geometry:
          $ref: '#/components/schemas/RouteMatrixAvoidanceAreaGeometry'
          description: Geometry of the area to be avoided.
      required:
      - Geometry
    RouteMatrixAvoidanceAreaGeometry:
      description: Geometry of the area to be avoided.
      type: object
      properties:
        BoundingBox:
          $ref: '#/components/schemas/BoundingBox'
          description: Geometry defined as a bounding box. The first pair represents the X and Y coordinates (longitude and
            latitude,) of the southwest corner of the bounding box; the second pair represents the X and Y coordinates (longitude
            and latitude) of the northeast corner.
        Polygon:
          $ref: '#/components/schemas/RouteMatrixAvoidanceAreaGeometryPolygonList'
          description: Geometry defined as a polygon with only one linear ring.
        PolylinePolygon:
          $ref: '#/components/schemas/RouteMatrixAvoidanceAreaGeometryPolylinePolygonList'
          description: A list of Isoline PolylinePolygon, for each isoline PolylinePolygon, it contains PolylinePolygon of
            the first linear ring (the outer ring) and from second item to the last item (the inner rings). For more information
            on polyline encoding, see https://github.com/aws-geospatial/polyline.
    RouteMatrixAvoidanceAreaGeometryPolygonList:
      type: array
      items:
        $ref: '#/components/schemas/LinearRing'
    RouteMatrixAvoidanceAreaGeometryPolylinePolygonList:
      type: array
      items:
        $ref: '#/components/schemas/PolylineRing'
    RouteMatrixAvoidanceZoneCategoryList:
      type: array
      items:
        $ref: '#/components/schemas/RouteMatrixAvoidanceZoneCategory'
    RouteMatrixAvoidanceZoneCategory:
      description: Zone categories to be avoided.
      type: object
      properties:
        Category:
          $ref: '#/components/schemas/RouteMatrixZoneCategory'
          description: Zone category to be avoided.
    RouteMatrixZoneCategory:
      type: string
      enum:
      - CongestionPricing
      - Environmental
      - Vignette
    CalculateRouteMatrixRequestDestinationsList:
      type: array
      items:
        $ref: '#/components/schemas/RouteMatrixDestination'
    RouteMatrixDestination:
      description: The route destination.
      type: object
      properties:
        Options:
          $ref: '#/components/schemas/RouteMatrixDestinationOptions'
          description: Destination related options. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps
            customers.
        Position:
          $ref: '#/components/schemas/Position'
          description: 'Position in World Geodetic System (WGS 84) format: [longitude, latitude].'
      required:
      - Position
    RouteMatrixDestinationOptions:
      description: Options related to the destination.
      type: object
      properties:
        AvoidActionsForDistance:
          $ref: '#/components/schemas/RouteMatrixDestinationOptionsAvoidActionsForDistanceLong'
          description: Avoids actions for the provided distance. This is typically to consider for users in moving vehicles
            who may not have sufficient time to make an action at an origin or a destination.
        Heading:
          $ref: '#/components/schemas/Heading'
          description: GPS Heading at the position.
        Matching:
          $ref: '#/components/schemas/RouteMatrixMatchingOptions'
          description: Options to configure matching the provided position to the road network.
        SideOfStreet:
          $ref: '#/components/schemas/RouteMatrixSideOfStreetOptions'
          description: Options to configure matching the provided position to a side of the street.
    RouteMatrixDestinationOptionsAvoidActionsForDistanceLong:
      type: integer
      format: int64
      minimum: 0
    RouteMatrixMatchingOptions:
      description: Matching options.
      type: object
      properties:
        NameHint:
          $ref: '#/components/schemas/SensitiveString'
          description: Attempts to match the provided position to a road similar to the provided name.
        OnRoadThreshold:
          $ref: '#/components/schemas/RouteMatrixMatchingOptionsOnRoadThresholdLong'
          description: 'If the distance to a highway/bridge/tunnel/sliproad is within threshold, the waypoint will be snapped
            to the highway/bridge/tunnel/sliproad. Unit: meters'
        Radius:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'Considers all roads within the provided radius to match the provided destination to. The roads that
            are considered are determined by the provided Strategy. Unit: meters'
        Strategy:
          $ref: '#/components/schemas/MatchingStrategy'
          description: Strategy that defines matching of the position onto the road network. MatchAny considers all roads
            possible, whereas MatchMostSignificantRoad matches to the most significant road.
    RouteMatrixMatchingOptionsOnRoadThresholdLong:
      type: integer
      format: int64
      minimum: 0
    RouteMatrixSideOfStreetOptions:
      description: Options to configure matching the provided position to a side of the street.
      type: object
      properties:
        Position:
          $ref: '#/components/schemas/Position'
          description: 'Position in World Geodetic System (WGS 84) format: [longitude, latitude].'
        UseWith:
          $ref: '#/components/schemas/SideOfStreetMatchingStrategy'
          description: 'Strategy that defines when the side of street position should be used. AnyStreet will always use the
            provided position. Default value: DividedStreetOnly'
      required:
      - Position
    RouteMatrixExclusionOptions:
      description: Specifies strict exclusion options for the route calculation. This setting mandates that the router will
        avoid any routes that include the specified options, rather than merely attempting to minimize them.
      type: object
      properties:
        Countries:
          $ref: '#/components/schemas/CountryCodeList'
          description: List of countries to be avoided defined by two-letter or three-letter country codes.
      required:
      - Countries
    CountryCodeList:
      type: array
      items:
        $ref: '#/components/schemas/CountryCode'
    CountryCode:
      type: string
      minLength: 2
      maxLength: 3
      pattern: ([A-Z]{2}|[A-Z]{3})
    CalculateRouteMatrixRequestOriginsList:
      type: array
      items:
        $ref: '#/components/schemas/RouteMatrixOrigin'
    RouteMatrixOrigin:
      description: 'The start position for the route in World Geodetic System (WGS 84) format: [longitude, latitude].'
      type: object
      properties:
        Options:
          $ref: '#/components/schemas/RouteMatrixOriginOptions'
          description: Origin related options. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps customers.
        Position:
          $ref: '#/components/schemas/Position'
          description: 'Position in World Geodetic System (WGS 84) format: [longitude, latitude].'
      required:
      - Position
    RouteMatrixOriginOptions:
      description: Origin related options.
      type: object
      properties:
        AvoidActionsForDistance:
          $ref: '#/components/schemas/RouteMatrixOriginOptionsAvoidActionsForDistanceLong'
          description: Avoids actions for the provided distance. This is typically to consider for users in moving vehicles
            who may not have sufficient time to make an action at an origin or a destination.
        Heading:
          $ref: '#/components/schemas/Heading'
          description: GPS Heading at the position.
        Matching:
          $ref: '#/components/schemas/RouteMatrixMatchingOptions'
          description: Options to configure matching the provided position to the road network.
        SideOfStreet:
          $ref: '#/components/schemas/RouteMatrixSideOfStreetOptions'
          description: Options to configure matching the provided position to a side of the street.
    RouteMatrixOriginOptionsAvoidActionsForDistanceLong:
      type: integer
      format: int64
      minimum: 0
    RouteMatrixBoundary:
      description: Boundary within which the matrix is to be calculated. All data, origins and destinations outside the boundary
        are considered invalid.
      type: object
      properties:
        Geometry:
          $ref: '#/components/schemas/RouteMatrixBoundaryGeometry'
          description: Geometry of the area to be avoided.
        Unbounded:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: No restrictions in terms of a routing boundary, and is typically used for longer routes.
    RouteMatrixBoundaryGeometry:
      description: Geometry of the routing boundary.
      type: object
      properties:
        AutoCircle:
          $ref: '#/components/schemas/RouteMatrixAutoCircle'
          description: AutoCircle requests the route matrix service to define a Circle boundary that best attempts to include
            most waypoints (Origins and Destinations) using the AutoCircle settings. Any waypoints outside of the auto-defined
            Circle boundary will be considered out of the routing boundary, which results in a route matrix entry error. AutoCircle
            is only used in the request to configure a Circle for the route calculation. The derived Circle will also be provided
            in the response.
        Circle:
          $ref: '#/components/schemas/Circle'
          description: Geometry defined as a circle. The circle defines the routing boundary area. Any waypoints outside the
            circle will result in a route matrix entry error. You can specify a Circle directly in the request, or it will
            be auto-derived when AutoCircle is used. When AutoCircle is set in the request, the response routing boundary
            will return Circle derived from the AutoCircle settings.
        BoundingBox:
          $ref: '#/components/schemas/BoundingBox'
          description: Geometry defined as a bounding box. The first pair represents the X and Y coordinates (longitude and
            latitude,) of the southwest corner of the bounding box; the second pair represents the X and Y coordinates (longitude
            and latitude) of the northeast corner. Diagonal distance of the bounding box must be less than or equal to 400,000
            meters.
        Polygon:
          $ref: '#/components/schemas/RouteMatrixBoundaryGeometryPolygonList'
          description: Geometry defined as a polygon with only one linear ring. A linear ring is a closed sequence of four
            or more coordinates. The first and last coordinates are the same, forming a closed boundary. Each coordinate is
            a position in [longitude, latitude] format. The structure is an array of linear rings (only 1 allowed). Each linear
            ring is an array of coordinates (minimum 4), and each coordinate is an array of two doubles [longitude, latitude].
            Maximum distance between any two vertices must be less than or equal to 400,000 meters.
    RouteMatrixAutoCircle:
      description: AutoCircle requests the route matrix service to define a Circle boundary that best attempts to include
        most waypoints (Origins and Destinations) using the AutoCircle settings. Any waypoints outside of the auto-defined
        Circle boundary will be considered out of the routing boundary, which results in a route matrix entry error. AutoCircle
        is only used in the request to configure a Circle for the route calculation. The derived Circle will also be provided
        in the response.
      type: object
      properties:
        Margin:
          $ref: '#/components/schemas/RouteMatrixAutoCircleMarginLong'
          description: The minimal distance, in meters, between any waypoint and the perimeter of the circle auto-defined
            for the boundary. Some margin is usually recommended so that the routing has enough leeway to travel from one
            waypoint to another optimally without conflicting with the routing boundary. The total of MaxRadius and Margin
            must be less than or equal to 200,000 meters.
        MaxRadius:
          $ref: '#/components/schemas/RouteMatrixAutoCircleMaxRadiusLong'
          description: The maximum radius, in meters, that the auto-defined Circle boundary should have, before the Margin
            distance is added to the circle. The total of MaxRadius and Margin must be less than or equal to 200,000 meters.
    RouteMatrixAutoCircleMarginLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 200000
    RouteMatrixAutoCircleMaxRadiusLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 200000
    Circle:
      description: Geometry defined as a circle. The circle defines the routing boundary area. Any waypoints outside the circle
        will result in a route matrix entry error. You can specify a Circle directly in the request, or it will be auto-derived
        when AutoCircle is used. When AutoCircle is set in the request, the response routing boundary will return Circle derived
        from the AutoCircle settings.
      type: object
      properties:
        Center:
          $ref: '#/components/schemas/Position'
          description: 'Center of the Circle in World Geodetic System (WGS 84) format: [longitude, latitude]. Example: [-123.1174,
            49.2847] represents the position with longitude -123.1174 and latitude 49.2847.'
        Radius:
          $ref: '#/components/schemas/SensitiveDouble'
          description: 'Radius of the Circle. Unit: meters Valid Range: Minimum value of 0. Maximum value of 200000.'
      required:
      - Center
      - Radius
    SensitiveDouble:
      type: number
      format: double
    RouteMatrixBoundaryGeometryPolygonList:
      type: array
      items:
        $ref: '#/components/schemas/LinearRing'
    RouteMatrixTrafficOptions:
      description: Traffic related options.
      type: object
      properties:
        FlowEventThresholdOverride:
          $ref: '#/components/schemas/DurationSeconds'
          description: Duration for which flow traffic is considered valid. For this period, the flow traffic is used over
            historical traffic data. Flow traffic refers to congestion, which changes very quickly. Duration in seconds for
            which flow traffic event would be considered valid. While flow traffic event is valid it will be used over the
            historical traffic data.
        Usage:
          $ref: '#/components/schemas/TrafficUsage'
          description: 'Determines if traffic should be used or ignored while calculating the route. Default value: UseTrafficData'
    RouteMatrixTravelMode:
      type: string
      enum:
      - Car
      - Pedestrian
      - Scooter
      - Truck
    RouteMatrixTravelModeOptions:
      description: Travel mode related options for the provided travel mode.
      type: object
      properties:
        Car:
          $ref: '#/components/schemas/RouteMatrixCarOptions'
          description: Travel mode options when the provided travel mode is Car.
        Scooter:
          $ref: '#/components/schemas/RouteMatrixScooterOptions'
          description: Travel mode options when the provided travel mode is Scooter. When travel mode is set to Scooter, then
            the avoidance option ControlledAccessHighways defaults to true.
        Truck:
          $ref: '#/components/schemas/RouteMatrixTruckOptions'
          description: Travel mode options when the provided travel mode is Truck.
    RouteMatrixCarOptions:
      description: Travel mode options when the provided travel mode is Car.
      type: object
      properties:
        LicensePlate:
          $ref: '#/components/schemas/RouteMatrixVehicleLicensePlate'
          description: The vehicle License Plate.
        MaxSpeed:
          $ref: '#/components/schemas/RouteMatrixCarOptionsMaxSpeedDouble'
          description: 'Maximum speed Unit: kilometers per hour'
        Occupancy:
          $ref: '#/components/schemas/RouteMatrixCarOptionsOccupancyInteger'
          description: 'The number of occupants in the vehicle. Default value: 1'
    RouteMatrixVehicleLicensePlate:
      description: The vehicle License Plate.
      type: object
      properties:
        LastCharacter:
          $ref: '#/components/schemas/RouteMatrixVehicleLicensePlateLastCharacterString'
          description: The last character of the License Plate.
    RouteMatrixVehicleLicensePlateLastCharacterString:
      type: string
      minLength: 1
      maxLength: 1
    RouteMatrixCarOptionsMaxSpeedDouble:
      type: number
      format: double
      minimum: 3.6
      maximum: 252.0
    RouteMatrixCarOptionsOccupancyInteger:
      type: integer
      minimum: 1
    RouteMatrixScooterOptions:
      description: Travel mode options when the provided travel mode is Scooter.
      type: object
      properties:
        LicensePlate:
          $ref: '#/components/schemas/RouteMatrixVehicleLicensePlate'
          description: The vehicle License Plate.
        MaxSpeed:
          $ref: '#/components/schemas/RouteMatrixScooterOptionsMaxSpeedDouble'
          description: 'Maximum speed. Unit: kilometers per hour'
        Occupancy:
          $ref: '#/components/schemas/RouteMatrixScooterOptionsOccupancyInteger'
          description: 'The number of occupants in the vehicle. Default value: 1'
    RouteMatrixScooterOptionsMaxSpeedDouble:
      type: number
      format: double
      minimum: 3.6
      maximum: 252.0
    RouteMatrixScooterOptionsOccupancyInteger:
      type: integer
      minimum: 1
    RouteMatrixTruckOptions:
      description: Travel mode options when the provided travel mode is Truck.
      type: object
      properties:
        AxleCount:
          $ref: '#/components/schemas/RouteMatrixTruckOptionsAxleCountInteger'
          description: Total number of axles of the vehicle.
        GrossWeight:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Gross weight of the vehicle including trailers, and goods at capacity. Unit: kilograms'
        HazardousCargos:
          $ref: '#/components/schemas/RouteMatrixHazardousCargoTypeList'
          description: List of Hazardous cargo contained in the vehicle.
        Height:
          $ref: '#/components/schemas/RouteMatrixTruckOptionsHeightLong'
          description: 'Height of the vehicle. Unit: centimeters'
        KpraLength:
          $ref: '#/components/schemas/DimensionCentimeters'
          description: 'Kingpin to rear axle length of the vehicle Unit: centimeters'
        Length:
          $ref: '#/components/schemas/RouteMatrixTruckOptionsLengthLong'
          description: 'Length of the vehicle. Unit: centimeters'
        LicensePlate:
          $ref: '#/components/schemas/RouteMatrixVehicleLicensePlate'
          description: The vehicle License Plate.
        MaxSpeed:
          $ref: '#/components/schemas/RouteMatrixTruckOptionsMaxSpeedDouble'
          description: 'Maximum speed Unit: kilometers per hour'
        Occupancy:
          $ref: '#/components/schemas/RouteMatrixTruckOptionsOccupancyInteger'
          description: 'The number of occupants in the vehicle. Default value: 1'
        PayloadCapacity:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Payload capacity of the vehicle and trailers attached. Unit: kilograms'
        Trailer:
          $ref: '#/components/schemas/RouteMatrixTrailerOptions'
          description: Trailer options corresponding to the vehicle.
        TruckType:
          $ref: '#/components/schemas/RouteMatrixTruckType'
          description: 'The type of truck: LightTruck for smaller delivery vehicles, StraightTruck for rigid body trucks,
            or Tractor for tractor-trailer combinations.'
        TunnelRestrictionCode:
          $ref: '#/components/schemas/TunnelRestrictionCode'
          description: 'The tunnel restriction code. Tunnel categories in this list indicate the restrictions which apply
            to certain tunnels in Great Britain. They relate to the types of dangerous goods that can be transported through
            them. Tunnel Category B Risk Level: Limited risk Restrictions: Few restrictions Tunnel Category C Risk Level:
            Medium risk Restrictions: Some restrictions Tunnel Category D Risk Level: High risk Restrictions: Many restrictions
            occur Tunnel Category E Risk Level: Very high risk Restrictions: Restricted tunnel'
        WeightPerAxle:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Heaviest weight per axle irrespective of the axle type or the axle group. Meant for usage in countries
            where the differences in axle types or axle groups are not distinguished. Unit: kilograms'
        WeightPerAxleGroup:
          $ref: '#/components/schemas/WeightPerAxleGroup'
          description: Specifies the total weight for the specified axle group. Meant for usage in countries that have different
            regulations based on the axle group type.
        Width:
          $ref: '#/components/schemas/RouteMatrixTruckOptionsWidthLong'
          description: 'Width of the vehicle. Unit: centimeters'
    RouteMatrixTruckOptionsAxleCountInteger:
      type: integer
      minimum: 2
      maximum: 255
    RouteMatrixHazardousCargoTypeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteMatrixHazardousCargoType'
    RouteMatrixHazardousCargoType:
      type: string
      enum:
      - Combustible
      - Corrosive
      - Explosive
      - Flammable
      - Gas
      - HarmfulToWater
      - Organic
      - Other
      - Poison
      - PoisonousInhalation
      - Radioactive
    RouteMatrixTruckOptionsHeightLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 5000
    RouteMatrixTruckOptionsLengthLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 30000
    RouteMatrixTruckOptionsMaxSpeedDouble:
      type: number
      format: double
      minimum: 3.6
      maximum: 252.0
    RouteMatrixTruckOptionsOccupancyInteger:
      type: integer
      minimum: 1
    RouteMatrixTrailerOptions:
      description: Trailer options corresponding to the vehicle.
      type: object
      properties:
        TrailerCount:
          $ref: '#/components/schemas/RouteMatrixTrailerOptionsTrailerCountInteger'
          description: 'Number of trailers attached to the vehicle. Default value: 0'
    RouteMatrixTrailerOptionsTrailerCountInteger:
      type: integer
      minimum: 0
      maximum: 255
    RouteMatrixTruckType:
      type: string
      enum:
      - LightTruck
      - StraightTruck
      - Tractor
    RouteMatrixTruckOptionsWidthLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 5000
    CalculateRouteMatrixResponse:
      type: object
      properties:
        ErrorCount:
          $ref: '#/components/schemas/CalculateRouteMatrixResponseErrorCountInteger'
          description: The count of error results in the route matrix. If this number is 0, all routes were calculated successfully.
        PricingBucket:
          $ref: '#/components/schemas/String'
          description: The pricing bucket for which the query is charged at.
        RouteMatrix:
          $ref: '#/components/schemas/RouteMatrix'
          description: The calculated route matrix containing the results for all pairs of Origins to Destination positions.
            Each row corresponds to one entry in Origins. Each entry in the row corresponds to the route from that entry in
            Origins to an entry in Destination positions.
        RoutingBoundary:
          $ref: '#/components/schemas/RouteMatrixBoundary'
          description: Boundary within which the matrix is to be calculated. All data, origins and destinations outside the
            boundary are considered invalid. When AutoCircle is set in the request, the response routing boundary will return
            Circle derived from the AutoCircle settings.
      required:
      - ErrorCount
      - PricingBucket
      - RouteMatrix
      - RoutingBoundary
    CalculateRouteMatrixResponseErrorCountInteger:
      type: integer
      minimum: 0
    RouteMatrix:
      type: array
      items:
        $ref: '#/components/schemas/RouteMatrixRow'
    RouteMatrixRow:
      type: array
      items:
        $ref: '#/components/schemas/RouteMatrixEntry'
    RouteMatrixEntry:
      description: The calculated route matrix containing the results for all pairs of Origins to Destination positions. Each
        row corresponds to one entry in Origins. Each entry in the row corresponds to the route from that entry in Origins
        to an entry in Destination positions.
      type: object
      properties:
        Distance:
          $ref: '#/components/schemas/DistanceMeters'
          description: The total distance of travel for the route.
        Duration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'The expected duration of travel for the route. Unit: seconds'
        Error:
          $ref: '#/components/schemas/RouteMatrixErrorCode'
          description: Error code that occurred during calculation of the route.
      required:
      - Distance
      - Duration
    RouteMatrixErrorCode:
      type: string
      enum:
      - NoMatch
      - NoMatchDestination
      - NoMatchOrigin
      - NoRoute
      - OutOfBounds
      - OutOfBoundsDestination
      - OutOfBoundsOrigin
      - Other
      - Violation
    RouteAllowOptions:
      description: Features that are allowed while calculating a route.
      type: object
      properties:
        Hot:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: 'Allow Hot (High Occupancy Toll) lanes while calculating the route. Default value: false'
        Hov:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: 'Allow Hov (High Occupancy vehicle) lanes while calculating the route. Default value: false'
    RouteAvoidanceOptions:
      description: Specifies options for areas to avoid when calculating the route. This is a best-effort avoidance setting,
        meaning the router will try to honor the avoidance preferences but may still include restricted areas if no feasible
        alternative route exists. If avoidance options are not followed, the response will indicate that the avoidance criteria
        were violated.
      type: object
      properties:
        Areas:
          $ref: '#/components/schemas/RouteAvoidanceAreaList'
          description: Areas to be avoided. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps customers.
        CarShuttleTrains:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid car-shuttle-trains while calculating the route. Not supported in ap-southeast-1 and ap-southeast-5
            regions for GrabMaps customers.
        ControlledAccessHighways:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid controlled access highways while calculating the route.
        DirtRoads:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid dirt roads while calculating the route. Not supported in ap-southeast-1 and ap-southeast-5 regions
            for GrabMaps customers.
        Ferries:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid ferries while calculating the route.
        SeasonalClosure:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid roads that have seasonal closure while calculating the route. Not supported in ap-southeast-1
            and ap-southeast-5 regions for GrabMaps customers.
        TollRoads:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoids roads where the specified toll transponders are the only mode of payment.
        TollTransponders:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoids roads where the specified toll transponders are the only mode of payment. Not supported in ap-southeast-1
            and ap-southeast-5 regions for GrabMaps customers.
        TruckRoadTypes:
          $ref: '#/components/schemas/TruckRoadTypeList'
          description: Truck road type identifiers. BK1 through BK4 apply only to Sweden. A2,A4,B2,B4,C,D,ET2,ET4 apply only
            to Mexico. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps customers. There are currently
            no other supported values as of 26th April 2024.
        Tunnels:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid tunnels while calculating the route. Not supported in ap-southeast-1 and ap-southeast-5 regions
            for GrabMaps customers.
        UTurns:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid U-turns for calculation on highways and motorways. Not supported in ap-southeast-1 and ap-southeast-5
            regions for GrabMaps customers.
        ZoneCategories:
          $ref: '#/components/schemas/RouteAvoidanceZoneCategoryList'
          description: Zone categories to be avoided. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps
            customers.
    RouteAvoidanceAreaList:
      type: array
      items:
        $ref: '#/components/schemas/RouteAvoidanceArea'
    RouteAvoidanceArea:
      description: Areas to be avoided.
      type: object
      properties:
        Except:
          $ref: '#/components/schemas/RouteAvoidanceAreaGeometryList'
          description: Exceptions to the provided avoidance geometry, to be included while calculating the route.
        Geometry:
          $ref: '#/components/schemas/RouteAvoidanceAreaGeometry'
      required:
      - Geometry
    RouteAvoidanceAreaGeometryList:
      type: array
      items:
        $ref: '#/components/schemas/RouteAvoidanceAreaGeometry'
    RouteAvoidanceAreaGeometry:
      description: Geometry of the area to be avoided.
      type: object
      properties:
        Corridor:
          $ref: '#/components/schemas/Corridor'
          description: Geometry defined as a corridor - a LineString with a radius that defines the width of the corridor.
        BoundingBox:
          $ref: '#/components/schemas/BoundingBox'
          description: Geometry defined as a bounding box. The first pair represents the X and Y coordinates (longitude and
            latitude,) of the southwest corner of the bounding box; the second pair represents the X and Y coordinates (longitude
            and latitude) of the northeast corner.
        Polygon:
          $ref: '#/components/schemas/RouteAvoidanceAreaGeometryPolygonList'
          description: Geometry defined as a polygon with only one linear ring.
        PolylineCorridor:
          $ref: '#/components/schemas/PolylineCorridor'
          description: Geometry defined as an encoded corridor - an encoded polyline with a radius that defines the width
            of the corridor.
        PolylinePolygon:
          $ref: '#/components/schemas/RouteAvoidanceAreaGeometryPolylinePolygonList'
          description: A list of Isoline PolylinePolygon, for each isoline PolylinePolygon, it contains PolylinePolygon of
            the first linear ring (the outer ring) and from 2nd item to the last item (the inner rings). For more information
            on polyline encoding, see https://github.com/aws-geospatial/polyline.
    RouteAvoidanceAreaGeometryPolygonList:
      type: array
      items:
        $ref: '#/components/schemas/LinearRing'
    RouteAvoidanceAreaGeometryPolylinePolygonList:
      type: array
      items:
        $ref: '#/components/schemas/PolylineRing'
    RouteAvoidanceZoneCategoryList:
      type: array
      items:
        $ref: '#/components/schemas/RouteAvoidanceZoneCategory'
    RouteAvoidanceZoneCategory:
      description: Zone categories to be avoided. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps
        customers.
      type: object
      properties:
        Category:
          $ref: '#/components/schemas/RouteZoneCategory'
          description: Zone category to be avoided.
      required:
      - Category
    RouteZoneCategory:
      type: string
      enum:
      - CongestionPricing
      - Environmental
      - Vignette
    RouteDestinationOptions:
      description: Options related to the destination.
      type: object
      properties:
        AvoidActionsForDistance:
          $ref: '#/components/schemas/RouteDestinationOptionsAvoidActionsForDistanceLong'
          description: The distance in meters from the destination point within which certain routing actions (such as U-turns
            or left turns across traffic) are restricted. This helps generate more practical routes by avoiding potentially
            dangerous maneuvers near the endpoint.
        AvoidUTurns:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid U-turns for calculation on highways and motorways.
        Heading:
          $ref: '#/components/schemas/Heading'
          description: GPS Heading at the position.
        Matching:
          $ref: '#/components/schemas/RouteMatchingOptions'
          description: Options to configure matching the provided position to the road network.
        SideOfStreet:
          $ref: '#/components/schemas/RouteSideOfStreetOptions'
          description: Options to configure matching the provided position to a side of the street.
        StopDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Duration of the stop. Unit: seconds'
    RouteDestinationOptionsAvoidActionsForDistanceLong:
      type: integer
      format: int64
      maximum: 2000
    RouteMatchingOptions:
      description: Options related to route matching.
      type: object
      properties:
        NameHint:
          $ref: '#/components/schemas/RouteMatchingOptionsNameHintString'
          description: Attempts to match the provided position to a road similar to the provided name.
        OnRoadThreshold:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'If the distance to a highway/bridge/tunnel/sliproad is within threshold, the waypoint will be snapped
            to the highway/bridge/tunnel/sliproad. Unit: meters'
        Radius:
          $ref: '#/components/schemas/DistanceMeters'
          description: 'Considers all roads within the provided radius to match the provided destination to. The roads that
            are considered are determined by the provided Strategy. Unit: meters'
        Strategy:
          $ref: '#/components/schemas/MatchingStrategy'
          description: Strategy that defines matching of the position onto the road network. MatchAny considers all roads
            possible, whereas MatchMostSignificantRoad matches to the most significant road.
    RouteMatchingOptionsNameHintString:
      type: string
      minLength: 0
      maxLength: 100
    RouteSideOfStreetOptions:
      description: Options to configure matching the provided position to a side of the street.
      type: object
      properties:
        Position:
          $ref: '#/components/schemas/Position'
          description: 'Position in World Geodetic System (WGS 84) format: [longitude, latitude].'
        UseWith:
          $ref: '#/components/schemas/SideOfStreetMatchingStrategy'
          description: 'Strategy that defines when the side of street position should be used. Default value: DividedStreetOnly'
      required:
      - Position
    RouteDriverOptions:
      description: Driver related options.
      type: object
      properties:
        Schedule:
          $ref: '#/components/schemas/RouteDriverScheduleIntervalList'
          description: Driver work-rest schedule. Stops are added to fulfil the provided rest schedule.
    RouteDriverScheduleIntervalList:
      type: array
      items:
        $ref: '#/components/schemas/RouteDriverScheduleInterval'
    RouteDriverScheduleInterval:
      description: Interval of the driver work-rest schedule. Stops are added to fulfil the provided rest schedule.
      type: object
      properties:
        DriveDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Maximum allowed driving time before stopping to rest. Unit: seconds'
        RestDuration:
          $ref: '#/components/schemas/DurationSeconds'
          description: 'Resting time before the driver can continue driving. Unit: seconds'
      required:
      - DriveDuration
      - RestDuration
    RouteExclusionOptions:
      description: Specifies strict exclusion options for the route calculation. This setting mandates that the router will
        avoid any routes that include the specified options, rather than merely attempting to minimize them.
      type: object
      properties:
        Countries:
          $ref: '#/components/schemas/CountryCodeList'
          description: List of countries to be avoided defined by two-letter or three-letter country codes.
      required:
      - Countries
    MeasurementSystem:
      type: string
      enum:
      - Metric
      - Imperial
    CalculateRoutesRequestLanguagesList:
      type: array
      items:
        $ref: '#/components/schemas/LanguageTag'
    LanguageTag:
      type: string
      minLength: 2
      maxLength: 35
    RouteLegAdditionalFeatureList:
      type: array
      items:
        $ref: '#/components/schemas/RouteLegAdditionalFeature'
    RouteLegAdditionalFeature:
      type: string
      enum:
      - Elevation
      - Incidents
      - PassThroughWaypoints
      - Summary
      - Tolls
      - TravelStepInstructions
      - TruckRoadTypes
      - TypicalDuration
      - Zones
      - Bookings
      - IntermediateStops
      - NextDepartures
    CalculateRoutesRequestMaxAlternativesInteger:
      type: integer
      minimum: 0
      maximum: 5
    RouteOriginOptions:
      description: Origin related options.
      type: object
      properties:
        AvoidActionsForDistance:
          $ref: '#/components/schemas/RouteOriginOptionsAvoidActionsForDistanceLong'
          description: Avoids actions for the provided distance. This is typically to consider for users in moving vehicles
            who may not have sufficient time to make an action at an origin or a destination.
        AvoidUTurns:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Avoid U-turns for calculation on highways and motorways.
        Heading:
          $ref: '#/components/schemas/Heading'
          description: GPS Heading at the position.
        Matching:
          $ref: '#/components/schemas/RouteMatchingOptions'
          description: Options to configure matching the provided position to the road network.
        SideOfStreet:
          $ref: '#/components/schemas/RouteSideOfStreetOptions'
          description: Options to configure matching the provided position to a side of the street.
    RouteOriginOptionsAvoidActionsForDistanceLong:
      type: integer
      format: int64
      maximum: 2000
    RouteSpanAdditionalFeatureList:
      type: array
      items:
        $ref: '#/components/schemas/RouteSpanAdditionalFeature'
    RouteSpanAdditionalFeature:
      type: string
      enum:
      - BestCaseDuration
      - CarAccess
      - Country
      - Distance
      - Duration
      - DynamicSpeed
      - FunctionalClassification
      - Gates
      - Incidents
      - Names
      - Notices
      - PedestrianAccess
      - RailwayCrossings
      - Region
      - RoadAttributes
      - RouteNumbers
      - ScooterAccess
      - SpeedLimit
      - TollSystems
      - TruckAccess
      - TruckRoadTypes
      - TypicalDuration
      - Zones
      - Consumption
    RouteTollOptions:
      description: Options related to Tolls on a route.
      type: object
      properties:
        AllTransponders:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Specifies if the user has valid transponder with access to all toll systems. This impacts toll calculation,
            and if true the price with transponders is used.
        AllVignettes:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: Specifies if the user has valid vignettes with access for all toll roads. If a user has a vignette
            for a toll road, then toll cost for that road is omitted since no further payment is necessary.
        Currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency code corresponding to the price. This is the same as Currency specified in the request.
        EmissionType:
          $ref: '#/components/schemas/RouteEmissionType'
          description: 'Emission type of the vehicle for toll cost calculation. Valid values: Euro1, Euro2, Euro3, Euro4,
            Euro5, Euro6, EuroEev'
        VehicleCategory:
          $ref: '#/components/schemas/RouteTollVehicleCategory'
          description: Vehicle category for toll cost calculation.
    CurrencyCode:
      type: string
      minLength: 3
      maxLength: 3
      pattern: '[A-Z]{3}'
    RouteEmissionType:
      description: 'Type of the emission. Valid values: Euro1, Euro2, Euro3, Euro4, Euro5, Euro6, EuroEev'
      type: object
      properties:
        Co2EmissionClass:
          $ref: '#/components/schemas/SensitiveString'
          description: The CO 2 emission classes.
        Type:
          $ref: '#/components/schemas/SensitiveString'
          description: 'Type of the emission. Valid values: Euro1, Euro2, Euro3, Euro4, Euro5, Euro6, EuroEev'
      required:
      - Type
    RouteTollVehicleCategory:
      type: string
      enum:
      - Minibus
    RouteTrafficOptions:
      description: Traffic options for the route.
      type: object
      properties:
        FlowEventThresholdOverride:
          $ref: '#/components/schemas/DurationSeconds'
          description: Duration for which flow traffic is considered valid. For this period, the flow traffic is used over
            historical traffic data. Flow traffic refers to congestion, which changes very quickly. Duration in seconds for
            which flow traffic event would be considered valid. While flow traffic event is valid it will be used over the
            historical traffic data.
        Usage:
          $ref: '#/components/schemas/TrafficUsage'
          description: 'Specifies how traffic data should be used when calculating routes. Default Value: UseTrafficData Traffic
            data usage depends on the time parameters in your route request: When Usage is set to UseTrafficData: If DepartNow
            is set to true, or if you specify DepartureTime or ArrivalTime, then all traffic data is considered (including
            live traffic and closures). If DepartNow, DepartureTime, and ArrivalTime are all unspecified, then only long-term
            closures are considered, regardless of this setting. When Usage is set to IgnoreTrafficData, then all traffic
            data is ignored regardless of the time parameters in your route request.'
    RouteTravelMode:
      type: string
      enum:
      - Car
      - Pedestrian
      - Scooter
      - Truck
      - Intermodal
      - Transit
    RouteTravelModeOptions:
      description: Travel mode related options for the provided travel mode.
      type: object
      properties:
        Car:
          $ref: '#/components/schemas/RouteCarOptions'
          description: Travel mode options when the provided travel mode is Car.
        Pedestrian:
          $ref: '#/components/schemas/RoutePedestrianOptions'
          description: Travel mode options when the provided travel mode is Pedestrian.
        Scooter:
          $ref: '#/components/schemas/RouteScooterOptions'
          description: Travel mode options when the provided travel mode is Scooter. When travel mode is set to Scooter, then
            the avoidance option ControlledAccessHighways defaults to true.
        Truck:
          $ref: '#/components/schemas/RouteTruckOptions'
          description: Travel mode options when the provided travel mode is Truck.
        Intermodal:
          $ref: '#/components/schemas/RouteIntermodalOptions'
          description: Travel mode options when the provided travel mode is Intermodal. Not supported in ap-southeast-1 and
            ap-southeast-5 regions for GrabMaps customers.
        Transit:
          $ref: '#/components/schemas/RouteTransitOptions'
          description: Travel mode options when the provided travel mode is Transit. Not supported in ap-southeast-1 and ap-southeast-5
            regions for GrabMaps customers.
    RouteCarOptions:
      description: Travel mode options when the provided travel mode is Car. For GrabMaps customers, ap-southeast-1 and ap-southeast-5
        regions support only LicensePlate options.
      type: object
      properties:
        EngineType:
          $ref: '#/components/schemas/RouteEngineType'
          description: Engine type of the vehicle. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps
            customers.
        LicensePlate:
          $ref: '#/components/schemas/RouteVehicleLicensePlate'
          description: The vehicle License Plate.
        MaxSpeed:
          $ref: '#/components/schemas/RouteCarOptionsMaxSpeedDouble'
          description: 'Maximum speed specified. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps customers.
            Unit: kilometers per hour'
        Occupancy:
          $ref: '#/components/schemas/RouteCarOptionsOccupancyInteger'
          description: 'The number of occupants in the vehicle. Not supported in ap-southeast-1 and ap-southeast-5 regions
            for GrabMaps customers. Default value: 1'
    RouteEngineType:
      type: string
      enum:
      - Electric
      - InternalCombustion
      - PluginHybrid
    RouteVehicleLicensePlate:
      description: License plate information of the vehicle. Currently, only the last character is used where license plate
        based controlled access is enforced.
      type: object
      properties:
        LastCharacter:
          $ref: '#/components/schemas/RouteVehicleLicensePlateLastCharacterString'
          description: The last character of the License Plate.
    RouteVehicleLicensePlateLastCharacterString:
      type: string
      minLength: 1
      maxLength: 1
    RouteCarOptionsMaxSpeedDouble:
      type: number
      format: double
      minimum: 3.6
      maximum: 252.0
    RouteCarOptionsOccupancyInteger:
      type: integer
      minimum: 1
    RoutePedestrianOptions:
      description: Options related to the pedestrian. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps
        customers.
      type: object
      properties:
        Speed:
          $ref: '#/components/schemas/RoutePedestrianOptionsSpeedDouble'
          description: Walking speed in Kilometers per hour.
    RoutePedestrianOptionsSpeedDouble:
      type: number
      format: double
      minimum: 1.8
      maximum: 7.2
    RouteScooterOptions:
      description: Travel mode options when the provided travel mode is Scooter. For GrabMaps customers, ap-southeast-1 and
        ap-southeast-5 regions support only LicensePlate options.
      type: object
      properties:
        EngineType:
          $ref: '#/components/schemas/RouteEngineType'
          description: Engine type of the vehicle. Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps
            customers.
        LicensePlate:
          $ref: '#/components/schemas/RouteVehicleLicensePlate'
          description: The vehicle License Plate.
        MaxSpeed:
          $ref: '#/components/schemas/RouteScooterOptionsMaxSpeedDouble'
          description: 'Maximum speed Not supported in ap-southeast-1 and ap-southeast-5 regions for GrabMaps customers. Unit:
            kilometers per hour'
        Occupancy:
          $ref: '#/components/schemas/RouteScooterOptionsOccupancyInteger'
          description: 'The number of occupants in the vehicle. Not supported in ap-southeast-1 and ap-southeast-5 regions
            for GrabMaps customers. Default value: 1'
    RouteScooterOptionsMaxSpeedDouble:
      type: number
      format: double
      minimum: 3.6
      maximum: 252.0
    RouteScooterOptionsOccupancyInteger:
      type: integer
      minimum: 1
    RouteTruckOptions:
      description: Travel mode options when the provided travel mode is Truck. Not supported in ap-southeast-1 and ap-southeast-5
        regions for GrabMaps customers.
      type: object
      properties:
        AxleCount:
          $ref: '#/components/schemas/RouteTruckOptionsAxleCountInteger'
          description: Total number of axles of the vehicle.
        EngineType:
          $ref: '#/components/schemas/RouteEngineType'
          description: Engine type of the vehicle.
        GrossWeight:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Gross weight of the vehicle including trailers, and goods at capacity. Unit: kilograms'
        HazardousCargos:
          $ref: '#/components/schemas/RouteHazardousCargoTypeList'
          description: List of Hazardous cargo contained in the vehicle.
        Height:
          $ref: '#/components/schemas/RouteTruckOptionsHeightLong'
          description: 'Height of the vehicle. Unit: centimeters'
        HeightAboveFirstAxle:
          $ref: '#/components/schemas/RouteTruckOptionsHeightAboveFirstAxleLong'
          description: 'Height of the vehicle above its first axle. Unit: centimeters'
        KpraLength:
          $ref: '#/components/schemas/DimensionCentimeters'
          description: 'Kingpin to rear axle length of the vehicle. Unit: centimeters'
        Length:
          $ref: '#/components/schemas/RouteTruckOptionsLengthLong'
          description: 'Length of the vehicle. Unit: c'
        LicensePlate:
          $ref: '#/components/schemas/RouteVehicleLicensePlate'
          description: The vehicle License Plate.
        MaxSpeed:
          $ref: '#/components/schemas/RouteTruckOptionsMaxSpeedDouble'
          description: 'Maximum speed Unit: kilometers per hour'
        Occupancy:
          $ref: '#/components/schemas/RouteTruckOptionsOccupancyInteger'
          description: 'The number of occupants in the vehicle. Default value: 1'
        PayloadCapacity:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Payload capacity of the vehicle and trailers attached. Unit: kilograms'
        TireCount:
          $ref: '#/components/schemas/RouteTruckOptionsTireCountInteger'
          description: Number of tires on the vehicle.
        Trailer:
          $ref: '#/components/schemas/RouteTrailerOptions'
          description: Trailer options corresponding to the vehicle.
        TruckType:
          $ref: '#/components/schemas/RouteTruckType'
          description: 'The type of truck: LightTruck for smaller delivery vehicles, StraightTruck for rigid body trucks,
            or Tractor for tractor-trailer combinations.'
        TunnelRestrictionCode:
          $ref: '#/components/schemas/RouteTruckOptionsTunnelRestrictionCodeString'
          description: 'The tunnel restriction code. Tunnel categories in this list indicate the restrictions which apply
            to certain tunnels in Great Britain. They relate to the types of dangerous goods that can be transported through
            them. Tunnel Category B Risk Level: Limited risk Restrictions: Few restrictions Tunnel Category C Risk Level:
            Medium risk Restrictions: Some restrictions Tunnel Category D Risk Level: High risk Restrictions: Many restrictions
            occur Tunnel Category E Risk Level: Very high risk Restrictions: Restricted tunnel'
        WeightPerAxle:
          $ref: '#/components/schemas/WeightKilograms'
          description: 'Heaviest weight per axle irrespective of the axle type or the axle group. Meant for usage in countries
            where the differences in axle types or axle groups are not distinguished. Unit: kilograms'
        WeightPerAxleGroup:
          $ref: '#/components/schemas/WeightPerAxleGroup'
          description: 'Specifies the total weight for the specified axle group. Meant for usage in countries that have different
            regulations based on the axle group type. Unit: kilograms'
        Width:
          $ref: '#/components/schemas/RouteTruckOptionsWidthLong'
          description: 'Width of the vehicle. Unit: centimeters'
    RouteTruckOptionsAxleCountInteger:
      type: integer
      minimum: 2
      maximum: 255
    RouteHazardousCargoTypeList:
