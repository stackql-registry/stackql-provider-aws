        Pedestrian:
          $ref: '#/components/schemas/RouteIntermodalPedestrianOptions'
          description: Options for the pedestrian leg of the intermodal route.
        Rental:
          $ref: '#/components/schemas/RouteIntermodalRentalOptions'
          description: Options for the rental leg of the intermodal route.
        Taxi:
          $ref: '#/components/schemas/RouteIntermodalTaxiOptions'
          description: Options for the taxi leg of the intermodal route.
        Transit:
          $ref: '#/components/schemas/RouteIntermodalTransitOptions'
          description: Options for the transit leg of the intermodal route.
        Vehicle:
          $ref: '#/components/schemas/RouteIntermodalVehicleOptions'
          description: Options for the vehicle leg of the intermodal route.
    RouteAccessibilityAttributeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteAccessibilityAttribute'
    RouteAccessibilityAttribute:
      type: string
      enum:
      - Wheelchair
    RouteIntermodalOptionsMaxTransfersInteger:
      type: integer
      minimum: 0
      maximum: 6
    RouteIntermodalPedestrianOptions:
