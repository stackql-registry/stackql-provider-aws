        Spans:
          $ref: '#/components/schemas/RouteVehicleSpanList'
          description: Spans that were computed for the requested SpanAdditionalFeatures. Not supported in ap-southeast-1
            and ap-southeast-5 regions for GrabMaps customers.
        Summary:
