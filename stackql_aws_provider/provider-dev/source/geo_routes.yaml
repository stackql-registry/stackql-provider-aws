      - Airplane
      - All
      - Bus
      - BusRapidTransit
      - CityTrain
      - Ferry
      - FunicularRailway
      - HighSpeedTrain
      - IntercityTrain
      - InterregionalTrain
      - LightRail
      - Monorail
      - PrivateBus
      - RegionalTrain
      - Subway
    RouteIntermodalVehicleOptions:
