          description: Specifies the format of the geometry returned for each leg of the route.
        SnappedTracePoints:
          $ref: '#/components/schemas/RoadSnapSnappedTracePointList'
          description: The trace points snapped onto the road network.
      required:
      - Notices
      - PricingBucket
      - SnappedGeometryFormat
      - SnappedTracePoints
