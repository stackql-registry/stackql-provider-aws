      - West
    RouteSpanSpeedLimitDetails:
      description: 'Details about the speed limit corresponding to the span. Unit: kilometers per hour'
      type: object
      properties:
        MaxSpeed:
          $ref: '#/components/schemas/SpeedKilometersPerHour'
          description: 'Maximum speed. Unit: kilometers per hour'
        Unlimited:
          $ref: '#/components/schemas/SensitiveBoolean'
          description: If the span doesn't have a speed limit like the Autobahn.
    RoutePedestrianSummary:
      description: Summarized details for the leg including before travel, travel and after travel steps.
      type: object
      properties:
        Overview:
          $ref: '#/components/schemas/RoutePedestrianOverviewSummary'
          description: Summarized details for the leg including before travel, travel and after travel steps.
        TravelOnly:
          $ref: '#/components/schemas/RoutePedestrianTravelOnlySummary'
          description: Summarized details for the leg including travel steps only. The Distance for the travel only portion
            of the journey is in meters
