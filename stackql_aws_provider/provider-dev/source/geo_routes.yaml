      type: object
      properties:
        MaxDistance:
          $ref: '#/components/schemas/RouteIntermodalPedestrianOptionsMaxDistanceLong'
          description: 'Maximum walking distance allowed. Unit: meters'
        Speed:
          $ref: '#/components/schemas/RouteIntermodalPedestrianOptionsSpeedDouble'
          description: 'Walking speed. Unit: kilometers per hour'
    RouteIntermodalPedestrianOptionsMaxDistanceLong:
      type: integer
      format: int64
      minimum: 0
      maximum: 6000
    RouteIntermodalPedestrianOptionsSpeedDouble:
      type: number
      format: double
      minimum: 1.8
      maximum: 7.2
    RouteIntermodalRentalOptions:
      description: Options for the rental leg of the intermodal route.
      type: object
      properties:
        AllowedModes:
          $ref: '#/components/schemas/RouteRentalModeList'
          description: Allowed rental transport modes when calculating the route. By default, all transport modes are allowed.
            Cannot be used together with ExcludedModes.
        EnabledFor:
          $ref: '#/components/schemas/RouteIntermodalEnabledLegsList'
          description: 'Specifies the portion of the route for which this leg type is enabled. By default, the leg type is
            enabled for all legs. Valid values: FirstLeg - Enable this leg type for the first non-pedestrian leg of the route.
            LastLeg - Enable this leg type for the last non-pedestrian leg of the route. EntireRoute - Enable this leg type
            for the entire route. None - Disable this leg type entirely.'
        ExcludedModes:
          $ref: '#/components/schemas/RouteRentalModeList'
          description: Excluded rental transport modes when calculating the route. By default, all transport modes are allowed.
            Cannot be used together with AllowedModes.
    RouteRentalModeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteRentalMode'
    RouteRentalMode:
      type: string
      enum:
      - All
      - Car
    RouteIntermodalEnabledLegsList:
      type: array
      items:
        $ref: '#/components/schemas/RouteIntermodalEnabledLegs'
    RouteIntermodalEnabledLegs:
      type: string
      enum:
      - FirstLeg
      - LastLeg
      - EntireRoute
      - None
    RouteIntermodalTaxiOptions:
