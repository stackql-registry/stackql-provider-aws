      type: array
      items:
        $ref: '#/components/schemas/RoadSnapNotice'
    RoadSnapNotice:
      description: Notices provide information around factors that may have influenced snapping in a manner atypical to the
        standard use cases.
      type: object
      properties:
        Code:
          $ref: '#/components/schemas/RoadSnapNoticeCode'
          description: Code corresponding to the issue.
        Title:
          $ref: '#/components/schemas/SensitiveString'
          description: The notice title.
        TracePointIndexes:
          $ref: '#/components/schemas/RoadSnapTracePointIndexList'
          description: TracePoint indices for which the provided notice code corresponds to.
      required:
      - Code
      - Title
      - TracePointIndexes
