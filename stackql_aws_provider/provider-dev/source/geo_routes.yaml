          description: Brief description of the step in the requested language. Only available when the TravelStepType is
            Default.
        KeepStepDetails:
          $ref: '#/components/schemas/RouteKeepStepDetails'
          description: Details that are specific to a Keep step.
        NextRoad:
          $ref: '#/components/schemas/RouteRoad'
