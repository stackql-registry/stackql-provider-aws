        EnabledFor:
          $ref: '#/components/schemas/RouteIntermodalEnabledLegsList'
          description: 'Specifies the portion of the route for which this leg type is enabled. By default, the leg type is
            enabled for all legs. Valid values: FirstLeg - Enable this leg type for the first non-pedestrian leg of the route.
            LastLeg - Enable this leg type for the last non-pedestrian leg of the route. EntireRoute - Enable this leg type
            for the entire route. None - Disable this leg type entirely.'
        ExcludedModes:
          $ref: '#/components/schemas/RouteTaxiModeList'
          description: Excluded taxi transport modes when calculating the route. By default, all transport modes are allowed.
            Cannot be used together with AllowedModes.
    RouteTaxiModeList:
      type: array
      items:
        $ref: '#/components/schemas/RouteTaxiMode'
    RouteTaxiMode:
      type: string
      enum:
      - All
      - Car
    RouteIntermodalTransitOptions:
      description: Options for the transit leg of the intermodal route.
      type: object
      properties:
        AllowedModes:
          $ref: '#/components/schemas/RouteTransitModeList'
          description: Allowed transit transport modes when calculating the route. By default, all transport modes are allowed.
