          default: CloudHsmFrontendService.ListLunaClients
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              type: object
              properties:
                NextToken:
                  $ref: '#/components/schemas/PaginationToken'
                  description: The NextToken value from a previous call to ListLunaClients. Pass null if this is the first
