          application/x-amz-json-1.1:
            schema:
              type: object
              properties:
                ClientArn:
                  $ref: '#/components/schemas/ClientArn'
                  description: The ARN of the client.
                CertificateFingerprint:
                  $ref: '#/components/schemas/CertificateFingerprint'
                  description: The certificate fingerprint.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeLunaClientResponse'
      x-stackql-resource: luna_clients
      x-stackql-method: describe_luna_client
      x-stackql-verb: SELECT
  /GetConfig:
    post:
      operationId: GetConfig
      description: This is documentation for AWS CloudHSM Classic. For more information, see AWS CloudHSM Classic FAQs, the
        AWS CloudHSM Classic User Guide, and the AWS CloudHSM Classic API Reference. For information about the current version
        of AWS CloudHSM, see AWS CloudHSM, the AWS CloudHSM User Guide, and the AWS CloudHSM API Reference. Gets the configuration
        files necessary to connect to all high availability partition groups the client is associated with.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - CloudHsmFrontendService.GetConfig
          default: CloudHsmFrontendService.GetConfig
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              type: object
              properties:
                ClientArn:
                  $ref: '#/components/schemas/ClientArn'
                  description: The ARN of the client.
                ClientVersion:
                  $ref: '#/components/schemas/ClientVersion'
                  description: The client version.
                HapgList:
                  $ref: '#/components/schemas/HapgList'
                  description: A list of ARNs that identify the high-availability partition groups that are associated with
                    the client.
              required:
              - ClientArn
              - ClientVersion
              - HapgList
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConfigResponse'
      x-stackql-resource: configs
      x-stackql-method: get_config
      x-stackql-verb: SELECT
  /ListAvailableZones:
    post:
      operationId: ListAvailableZones
      description: This is documentation for AWS CloudHSM Classic. For more information, see AWS CloudHSM Classic FAQs, the
        AWS CloudHSM Classic User Guide, and the AWS CloudHSM Classic API Reference. For information about the current version
        of AWS CloudHSM, see AWS CloudHSM, the AWS CloudHSM User Guide, and the AWS CloudHSM API Reference. Lists the Availability
        Zones that have available AWS CloudHSM capacity.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - CloudHsmFrontendService.ListAvailableZones
          default: CloudHsmFrontendService.ListAvailableZones
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              type: object
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAvailableZonesResponse'
      x-stackql-resource: available_zones
      x-stackql-method: list_available_zones
      x-stackql-verb: SELECT
  /ListHapgs:
    post:
      operationId: ListHapgs
      description: This is documentation for AWS CloudHSM Classic. For more information, see AWS CloudHSM Classic FAQs, the
        AWS CloudHSM Classic User Guide, and the AWS CloudHSM Classic API Reference. For information about the current version
        of AWS CloudHSM, see AWS CloudHSM, the AWS CloudHSM User Guide, and the AWS CloudHSM API Reference. Lists the high-availability
        partition groups for the account. This operation supports pagination with the use of the NextToken member. If more
        results are available, the NextToken member of the response contains a token that you pass in the next call to ListHapgs
        to retrieve the next set of items.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - CloudHsmFrontendService.ListHapgs
          default: CloudHsmFrontendService.ListHapgs
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              type: object
              properties:
                NextToken:
                  $ref: '#/components/schemas/PaginationToken'
                  description: The NextToken value from a previous call to ListHapgs. Pass null if this is the first call.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHapgsResponse'
      x-stackql-resource: hapgs
      x-stackql-method: list_hapgs
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.HapgList
  /ListHsms:
    post:
      operationId: ListHsms
      description: This is documentation for AWS CloudHSM Classic. For more information, see AWS CloudHSM Classic FAQs, the
        AWS CloudHSM Classic User Guide, and the AWS CloudHSM Classic API Reference. For information about the current version
        of AWS CloudHSM, see AWS CloudHSM, the AWS CloudHSM User Guide, and the AWS CloudHSM API Reference. Retrieves the
        identifiers of all of the HSMs provisioned for the current customer. This operation supports pagination with the use
        of the NextToken member. If more results are available, the NextToken member of the response contains a token that
        you pass in the next call to ListHsms to retrieve the next set of items.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - CloudHsmFrontendService.ListHsms
          default: CloudHsmFrontendService.ListHsms
      requestBody:
        required: true
        content:
          application/x-amz-json-1.1:
            schema:
              type: object
              properties:
                NextToken:
                  $ref: '#/components/schemas/PaginationToken'
                  description: The NextToken value from a previous call to ListHsms. Pass null if this is the first call.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHsmsResponse'
      x-stackql-resource: hsms
      x-stackql-method: list_hsms
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.HsmList
  /ListLunaClients:
    post:
      operationId: ListLunaClients
      description: This is documentation for AWS CloudHSM Classic. For more information, see AWS CloudHSM Classic FAQs, the
        AWS CloudHSM Classic User Guide, and the AWS CloudHSM Classic API Reference. For information about the current version
