openapi: 3.0.0
info:
  version: '2017-05-13'
  title: Amazon SageMaker Runtime
  description: Amazon SageMaker Runtime
  x-serviceName: sagemaker
  x-serviceAlias: sagemaker_runtime
  x-protocol: rest-json
  x-apiVersion: '2017-05-13'
  x-endpointPrefix: runtime.sagemaker
  x-jsonVersion: '1.1'
servers:
- url: https://runtime.sagemaker.{region}.amazonaws.com
  variables:
    region:
      default: us-east-1
      description: AWS region
  description: Regional endpoint for sagemaker-runtime
paths:
  /endpoints/{endpoint_name}/invocations:
    post:
      operationId: InvokeEndpoint
      description: After you deploy a model into production using Amazon SageMaker AI hosting services, your client applications
        use this API to get inferences from the model hosted at the specified endpoint. For an overview of Amazon SageMaker
        AI, see How It Works. Amazon SageMaker AI strips all POST headers except those supported by the API. Amazon SageMaker
        AI might add additional headers. You should not rely on the behavior of headers outside those enumerated in the request
        syntax. Calls to InvokeEndpoint are authenticated by using Amazon Web Services Signature Version 4. For information,
        see Authenticating Requests (Amazon Web Services Signature Version 4) in the Amazon S3 API Reference. A customer's
        model containers must respond to requests within 60 seconds. The model itself can have a maximum processing time of
        60 seconds before responding to invocations. If your model is going to take 50-60 seconds of processing time, the
        SDK socket timeout should be set to be 70 seconds. Endpoints are scoped to an individual account, and are not public.
        The URL does not contain the account ID, but Amazon SageMaker AI determines the account ID from the authentication
        token that is supplied by the caller.
      parameters:
      - name: endpoint_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EndpointName'
        description: The name of the endpoint that you specified when you created the endpoint using the CreateEndpoint API.
      - name: Content-Type
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Header'
        description: The MIME type of the input data in the request body.
      - name: Accept
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Header'
        description: The desired MIME type of the inference response from the model container.
      - name: X-Amzn-SageMaker-Custom-Attributes
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/CustomAttributesHeader'
        description: 'Provides additional information about a request for an inference submitted to a model hosted at an Amazon
          SageMaker AI endpoint. The information is an opaque value that is forwarded verbatim. You could use this value,
          for example, to provide an ID that you can use to track a request or to provide other metadata that a service endpoint
          was programmed to process. The value must consist of no more than 1024 visible US-ASCII characters as specified
          in Section 3.3.6. Field Value Components of the Hypertext Transfer Protocol (HTTP/1.1). The code in your model is
          responsible for setting or updating any custom attributes in the response. If your code does not set this value
          in the response, an empty value is returned. For example, if a custom attribute represents the trace ID, your model
          can prepend the custom attribute with Trace ID: in your post-processing function. This feature is currently supported
          in the Amazon Web Services SDKs but not in the Amazon SageMaker AI Python SDK.'
      - name: X-Amzn-SageMaker-Target-Model
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/TargetModelHeader'
        description: The model to request for inference when invoking a multi-model endpoint.
      - name: X-Amzn-SageMaker-Target-Variant
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/TargetVariantHeader'
        description: Specify the production variant to send the inference request to when invoking an endpoint that is running
          two or more variants. Note that this parameter overrides the default behavior for the endpoint, which is to distribute
          the invocation traffic based on the variant weights. For information about how to use variant targeting to perform
          a/b testing, see Test models in production
      - name: X-Amzn-SageMaker-Target-Container-Hostname
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/TargetContainerHostnameHeader'
        description: If the endpoint hosts multiple containers and is configured to use direct invocation, this parameter
          specifies the host name of the container to invoke.
      - name: X-Amzn-SageMaker-Inference-Id
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/InferenceId'
        description: If you provide a value, it is added to the captured data when you enable data capture on the endpoint.
          For information about data capture, see Capture Data.
      - name: X-Amzn-SageMaker-Enable-Explanations
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/EnableExplanationsHeader'
        description: An optional JMESPath expression used to override the EnableExplanations parameter of the ClarifyExplainerConfig
          API. See the EnableExplanations section in the developer guide for more information.
      - name: X-Amzn-SageMaker-Inference-Component
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/InferenceComponentHeader'
        description: If the endpoint hosts one or more inference components, this parameter specifies the name of inference
          component to invoke.
      - name: X-Amzn-SageMaker-Session-Id
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/SessionIdOrNewSessionConstantHeader'
        description: 'Creates a stateful session or identifies an existing one. You can do one of the following: Create a
          stateful session by specifying the value NEW_SESSION. Send your request to an existing stateful session by specifying
          the ID of that session. With a stateful session, you can send multiple requests to a stateful model. When you create
          a session with a stateful model, the model must create the session ID and set the expiration time. The model must
          also provide that information in the response to your request. You can get the ID and timestamp from the NewSessionId
          response parameter. For any subsequent request where you specify that session ID, SageMaker AI routes the request
          to the same instance that supports the session.'
      - name: X-Amzn-SageMaker-Prefix-Aware-Id
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/PrefixAwareIdHeader'
        description: An optional, stable identifier that serves as a routing hint for prefix-aware routing. The service routes
          requests with the same prefix and the same identifier to the same instance. If requests from different applications
          might have the same prompt prefix, set a different identifier for each application to differentiate their routing
          decisions. Applies only to endpoints configured with a RoutingStrategy of PREFIX_AWARE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Body:
                  $ref: '#/components/schemas/BodyBlob'
              required:
              - Body
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeEndpointOutput'
      x-stackql-resource: endpoint
      x-stackql-method: invoke_endpoint
      x-stackql-verb: EXEC
  /endpoints/{endpoint_name}/async-invocations:
    post:
      operationId: InvokeEndpointAsync
      description: After you deploy a model into production using Amazon SageMaker AI hosting services, your client applications
        use this API to get inferences from the model hosted at the specified endpoint in an asynchronous manner. Inference
        requests sent to this API are enqueued for asynchronous processing. The processing of the inference request may or
        may not complete before you receive a response from this API. The response from this API will not contain the result
        of the inference request but contain information about where you can locate it. Amazon SageMaker AI strips all POST
        headers except those supported by the API. Amazon SageMaker AI might add additional headers. You should not rely on
        the behavior of headers outside those enumerated in the request syntax. Calls to InvokeEndpointAsync are authenticated
        by using Amazon Web Services Signature Version 4. For information, see Authenticating Requests (Amazon Web Services
        Signature Version 4) in the Amazon S3 API Reference.
      parameters:
      - name: endpoint_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EndpointName'
        description: The name of the endpoint that you specified when you created the endpoint using the CreateEndpoint API.
      - name: X-Amzn-SageMaker-Content-Type
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Header'
        description: The MIME type of the input data in the request body.
      - name: X-Amzn-SageMaker-Accept
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Header'
        description: The desired MIME type of the inference response from the model container.
      - name: X-Amzn-SageMaker-Custom-Attributes
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/CustomAttributesHeader'
        description: 'Provides additional information about a request for an inference submitted to a model hosted at an Amazon
          SageMaker AI endpoint. The information is an opaque value that is forwarded verbatim. You could use this value,
          for example, to provide an ID that you can use to track a request or to provide other metadata that a service endpoint
          was programmed to process. The value must consist of no more than 1024 visible US-ASCII characters as specified
          in Section 3.3.6. Field Value Components of the Hypertext Transfer Protocol (HTTP/1.1). The code in your model is
          responsible for setting or updating any custom attributes in the response. If your code does not set this value
          in the response, an empty value is returned. For example, if a custom attribute represents the trace ID, your model
          can prepend the custom attribute with Trace ID: in your post-processing function. This feature is currently supported
          in the Amazon Web Services SDKs but not in the Amazon SageMaker AI Python SDK.'
      - name: X-Amzn-SageMaker-Inference-Id
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/InferenceId'
        description: The identifier for the inference request. Amazon SageMaker AI will generate an identifier for you if
          none is specified.
      - name: X-Amzn-SageMaker-InputLocation
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/InputLocationHeader'
        description: The Amazon S3 URI where the inference request payload is stored.
      - name: X-Amzn-SageMaker-S3OutputPathExtension
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/S3OutputPathExtensionHeader'
        description: The path extension that is appended to the Amazon S3 output path where the inference response payload
          is stored.
      - name: X-Amzn-SageMaker-Filename
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/FilenameHeader'
        description: The filename for the inference response payload stored in Amazon S3. If not specified, Amazon SageMaker
          AI generates a filename based on the inference ID.
      - name: X-Amzn-SageMaker-RequestTTLSeconds
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/RequestTTLSecondsHeader'
        description: Maximum age in seconds a request can be in the queue before it is marked as expired. The default is 6
          hours, or 21,600 seconds.
      - name: X-Amzn-SageMaker-InvocationTimeoutSeconds
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/InvocationTimeoutSecondsHeader'
        description: Maximum amount of time in seconds a request can be processed before it is marked as expired. The default
          is 15 minutes, or 900 seconds.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                Body:
                  $ref: '#/components/schemas/AsyncBodyBlob'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeEndpointAsyncOutput'
      x-stackql-resource: endpoint_async
      x-stackql-method: invoke_endpoint_async
      x-stackql-verb: EXEC
  /endpoints/{endpoint_name}/invocations-response-stream:
    post:
      operationId: InvokeEndpointWithResponseStream
      description: 'Invokes a model at the specified endpoint to return the inference response as a stream. The inference
        stream provides the response payload incrementally as a series of parts. Before you can get an inference stream, you
        must have access to a model that''s deployed using Amazon SageMaker AI hosting services, and the container for that
        model must support inference streaming. For more information that can help you use this API, see the following sections
        in the Amazon SageMaker AI Developer Guide: For information about how to add streaming support to a model, see How
        Containers Serve Requests. For information about how to process the streaming response, see Invoke real-time endpoints.
        Before you can use this operation, your IAM permissions must allow the sagemaker:InvokeEndpoint action. For more information
        about Amazon SageMaker AI actions for IAM policies, see Actions, resources, and condition keys for Amazon SageMaker
        AI in the IAM Service Authorization Reference. Amazon SageMaker AI strips all POST headers except those supported
        by the API. Amazon SageMaker AI might add additional headers. You should not rely on the behavior of headers outside
        those enumerated in the request syntax. Calls to InvokeEndpointWithResponseStream are authenticated by using Amazon
        Web Services Signature Version 4. For information, see Authenticating Requests (Amazon Web Services Signature Version
        4) in the Amazon S3 API Reference.'
      parameters:
      - name: endpoint_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EndpointName'
        description: The name of the endpoint that you specified when you created the endpoint using the CreateEndpoint API.
      - name: Content-Type
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Header'
        description: The MIME type of the input data in the request body.
      - name: X-Amzn-SageMaker-Accept
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/Header'
        description: The desired MIME type of the inference response from the model container.
      - name: X-Amzn-SageMaker-Custom-Attributes
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/CustomAttributesHeader'
        description: 'Provides additional information about a request for an inference submitted to a model hosted at an Amazon
          SageMaker AI endpoint. The information is an opaque value that is forwarded verbatim. You could use this value,
          for example, to provide an ID that you can use to track a request or to provide other metadata that a service endpoint
          was programmed to process. The value must consist of no more than 1024 visible US-ASCII characters as specified
          in Section 3.3.6. Field Value Components of the Hypertext Transfer Protocol (HTTP/1.1). The code in your model is
          responsible for setting or updating any custom attributes in the response. If your code does not set this value
          in the response, an empty value is returned. For example, if a custom attribute represents the trace ID, your model
          can prepend the custom attribute with Trace ID: in your post-processing function. This feature is currently supported
          in the Amazon Web Services SDKs but not in the Amazon SageMaker AI Python SDK.'
      - name: X-Amzn-SageMaker-Target-Variant
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/TargetVariantHeader'
        description: Specify the production variant to send the inference request to when invoking an endpoint that is running
          two or more variants. Note that this parameter overrides the default behavior for the endpoint, which is to distribute
          the invocation traffic based on the variant weights. For information about how to use variant targeting to perform
          a/b testing, see Test models in production
      - name: X-Amzn-SageMaker-Target-Container-Hostname
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/TargetContainerHostnameHeader'
        description: If the endpoint hosts multiple containers and is configured to use direct invocation, this parameter
          specifies the host name of the container to invoke.
      - name: X-Amzn-SageMaker-Inference-Id
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/InferenceId'
        description: An identifier that you assign to your request.
      - name: X-Amzn-SageMaker-Inference-Component
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/InferenceComponentHeader'
        description: If the endpoint hosts one or more inference components, this parameter specifies the name of inference
          component to invoke for a streaming response.
      - name: X-Amzn-SageMaker-Session-Id
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/SessionIdHeader'
        description: The ID of a stateful session to handle your request. You can't create a stateful session by using the
          InvokeEndpointWithResponseStream action. Instead, you can create one by using the InvokeEndpoint action. In your
          request, you specify NEW_SESSION for the SessionId request parameter. The response to that request provides the
          session ID for the NewSessionId response parameter.
      - name: X-Amzn-SageMaker-Prefix-Aware-Id
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/PrefixAwareIdHeader'
        description: An optional, stable identifier that serves as a routing hint for prefix-aware routing. The service routes
          requests with the same prefix and the same identifier to the same instance. If requests from different applications
          might have the same prompt prefix, set a different identifier for each application to differentiate their routing
          decisions. Applies only to endpoints configured with a RoutingStrategy of PREFIX_AWARE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Body:
                  $ref: '#/components/schemas/BodyBlob'
              required:
              - Body
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeEndpointWithResponseStreamOutput'
      x-stackql-resource: endpoint_with_response_stream
      x-stackql-method: invoke_endpoint_with_response_stream
      x-stackql-verb: EXEC
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    EndpointName:
      type: string
      maxLength: 63
      pattern: ^[a-zA-Z0-9](-*[a-zA-Z0-9])*
    Header:
      type: string
      maxLength: 1024
      pattern: \p{ASCII}*
    CustomAttributesHeader:
      type: string
      maxLength: 1024
      pattern: \p{ASCII}*
    TargetModelHeader:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: \A\S[\p{Print}]*\z
    TargetVariantHeader:
      type: string
      maxLength: 63
      pattern: ^[a-zA-Z0-9](-*[a-zA-Z0-9])*
    TargetContainerHostnameHeader:
      type: string
      maxLength: 63
      pattern: ^[a-zA-Z0-9](-*[a-zA-Z0-9])*
    InferenceId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: \A\S[\p{Print}]*\z
    EnableExplanationsHeader:
      type: string
      minLength: 1
      maxLength: 64
      pattern: .*
    InferenceComponentHeader:
      type: string
      maxLength: 63
      pattern: ^[a-zA-Z0-9]([\-a-zA-Z0-9]*[a-zA-Z0-9])?$
    SessionIdOrNewSessionConstantHeader:
      type: string
      maxLength: 256
      pattern: ^(NEW_SESSION)$|^[a-zA-Z0-9](-*[a-zA-Z0-9])*$
    PrefixAwareIdHeader:
      type: string
      minLength: 1
      maxLength: 64
      pattern: \A\S[\p{Print}]*\z
    BodyBlob:
      type: string
      format: byte
      maxLength: 6291456
    InvokeEndpointOutput:
      type: object
      properties:
        Body:
          $ref: '#/components/schemas/BodyBlob'
          description: Includes the inference provided by the model. For information about the format of the response body,
            see Common Data Formats-Inference. If the explainer is activated, the body includes the explanations provided
            by the model. For more information, see the Response section under Invoke the Endpoint in the Developer Guide.
        ContentType:
          $ref: '#/components/schemas/Header'
          description: The MIME type of the inference returned from the model container.
        InvokedProductionVariant:
          $ref: '#/components/schemas/Header'
          description: Identifies the production variant that was invoked.
        CustomAttributes:
          $ref: '#/components/schemas/CustomAttributesHeader'
          description: 'Provides additional information in the response about the inference returned by a model hosted at
            an Amazon SageMaker AI endpoint. The information is an opaque value that is forwarded verbatim. You could use
            this value, for example, to return an ID received in the CustomAttributes header of a request or other metadata
            that a service endpoint was programmed to produce. The value must consist of no more than 1024 visible US-ASCII
            characters as specified in Section 3.3.6. Field Value Components of the Hypertext Transfer Protocol (HTTP/1.1).
            If the customer wants the custom attribute returned, the model must set the custom attribute to be included on
            the way back. The code in your model is responsible for setting or updating any custom attributes in the response.
            If your code does not set this value in the response, an empty value is returned. For example, if a custom attribute
            represents the trace ID, your model can prepend the custom attribute with Trace ID: in your post-processing function.
            This feature is currently supported in the Amazon Web Services SDKs but not in the Amazon SageMaker AI Python
            SDK.'
        NewSessionId:
          $ref: '#/components/schemas/NewSessionResponseHeader'
          description: If you created a stateful session with your request, the ID and expiration time that the model assigns
            to that session.
        ClosedSessionId:
          $ref: '#/components/schemas/SessionIdHeader'
          description: If you closed a stateful session with your request, the ID of that session.
      required:
      - Body
    NewSessionResponseHeader:
      type: string
      maxLength: 256
      pattern: ^[a-zA-Z0-9](-*[a-zA-Z0-9])*;\sExpires=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
    SessionIdHeader:
      type: string
      maxLength: 256
      pattern: ^[a-zA-Z0-9](-*[a-zA-Z0-9])*$
    InputLocationHeader:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: ^(https|s3)://([^/]+)/?(.*)$
    S3OutputPathExtensionHeader:
      type: string
      minLength: 1
      maxLength: 512
      pattern: ^(?!s3:|https:)[a-zA-Z0-9!_.*'()/-]+$
    FilenameHeader:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^(?!.*\..*\.)[a-zA-Z0-9][a-zA-Z0-9-_\.]*$
    RequestTTLSecondsHeader:
      type: integer
      minimum: 60
      maximum: 21600
    InvocationTimeoutSecondsHeader:
      type: integer
      minimum: 1
      maximum: 3600
    AsyncBodyBlob:
      type: string
      format: byte
      maxLength: 128000
    InvokeEndpointAsyncOutput:
      type: object
      properties:
        InferenceId:
          $ref: '#/components/schemas/Header'
          description: Identifier for an inference request. This will be the same as the InferenceId specified in the input.
            Amazon SageMaker AI will generate an identifier for you if you do not specify one.
        OutputLocation:
          $ref: '#/components/schemas/Header'
          description: The Amazon S3 URI where the inference response payload is stored.
        FailureLocation:
          $ref: '#/components/schemas/Header'
          description: The Amazon S3 URI where the inference failure response payload is stored.
    InvokeEndpointWithResponseStreamOutput:
      type: object
      properties:
        Body:
          $ref: '#/components/schemas/ResponseStream'
        ContentType:
          $ref: '#/components/schemas/Header'
          description: The MIME type of the inference returned from the model container.
        InvokedProductionVariant:
          $ref: '#/components/schemas/Header'
          description: Identifies the production variant that was invoked.
        CustomAttributes:
          $ref: '#/components/schemas/CustomAttributesHeader'
          description: 'Provides additional information in the response about the inference returned by a model hosted at
            an Amazon SageMaker AI endpoint. The information is an opaque value that is forwarded verbatim. You could use
            this value, for example, to return an ID received in the CustomAttributes header of a request or other metadata
            that a service endpoint was programmed to produce. The value must consist of no more than 1024 visible US-ASCII
            characters as specified in Section 3.3.6. Field Value Components of the Hypertext Transfer Protocol (HTTP/1.1).
            If the customer wants the custom attribute returned, the model must set the custom attribute to be included on
            the way back. The code in your model is responsible for setting or updating any custom attributes in the response.
            If your code does not set this value in the response, an empty value is returned. For example, if a custom attribute
            represents the trace ID, your model can prepend the custom attribute with Trace ID: in your post-processing function.
            This feature is currently supported in the Amazon Web Services SDKs but not in the Amazon SageMaker AI Python
            SDK.'
      required:
      - Body
    ResponseStream:
      description: A stream of payload parts. Each part contains a portion of the response for a streaming inference request.
      type: object
      properties:
        PayloadPart:
          $ref: '#/components/schemas/PayloadPart'
          description: A wrapper for pieces of the payload that's returned in response to a streaming inference request. A
            streaming inference response consists of one or more payload parts.
        ModelStreamError:
          $ref: '#/components/schemas/ModelStreamError'
          description: 'An error occurred while streaming the response body. This error can have the following error codes:
            ModelInvocationTimeExceeded The model failed to finish sending the response within the timeout period allowed
            by Amazon SageMaker AI. StreamBroken The Transmission Control Protocol (TCP) connection between the client and
            the model was reset or closed.'
        InternalStreamFailure:
          $ref: '#/components/schemas/InternalStreamFailure'
          description: The stream processing failed because of an unknown error, exception or failure. Try your request again.
    PayloadPart:
      description: A wrapper for pieces of the payload that's returned in response to a streaming inference request. A streaming
        inference response consists of one or more payload parts.
      type: object
      properties:
        Bytes:
          $ref: '#/components/schemas/PartBlob'
          description: A blob that contains part of the response for your streaming inference request.
    PartBlob:
      type: string
      format: byte
    ModelStreamError:
      description: 'An error occurred while streaming the response body. This error can have the following error codes: ModelInvocationTimeExceeded
        The model failed to finish sending the response within the timeout period allowed by Amazon SageMaker AI. StreamBroken
        The Transmission Control Protocol (TCP) connection between the client and the model was reset or closed.'
      type: object
      properties:
        Message:
          $ref: '#/components/schemas/Message'
        ErrorCode:
          $ref: '#/components/schemas/ErrorCode'
          description: 'This error can have the following error codes: ModelInvocationTimeExceeded The model failed to finish
            sending the response within the timeout period allowed by Amazon SageMaker AI. StreamBroken The Transmission Control
            Protocol (TCP) connection between the client and the model was reset or closed.'
    Message:
