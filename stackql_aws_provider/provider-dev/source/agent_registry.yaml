openapi: 3.0.0
info:
  version: '2025-12-01'
  title: Agent Registry
  description: Agent Registry
  x-serviceName: agent-registry
  x-serviceAlias: agent_registry
  x-protocol: rest-json
  x-apiVersion: '2025-12-01'
  x-endpointPrefix: agent-registry
servers:
- url: https://agent-registry.{region}.amazonaws.com
  variables:
    region:
      default: us-east-1
      description: AWS region
  description: Regional endpoint for agent-registry
paths:
  /discoverable-records-batch:
    post:
      operationId: BatchGetDiscoverableRegistryRecord
      description: Retrieves multiple discoverable registry records by ID from a single registry. Records that cannot be retrieved
        are reported individually in the errors list rather than failing the entire request.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  $ref: '#/components/schemas/BatchGetDiscoverableRegistryRecordRequestEntriesList'
              required:
              - entries
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGetDiscoverableRegistryRecordResponse'
      x-stackql-resource: discoverable_registry_records
      x-stackql-method: batch_get_discoverable_registry_record
      x-stackql-verb: SELECT
  /registries/{registry_id}/discoverable-records-list:
    post:
      operationId: ListDiscoverableRegistryRecords
      description: Lists the discoverable registry records in a registry. You can optionally filter and paginate the results.
      parameters:
      - name: registry_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RegistryIdentifier'
        description: The identifier of the registry whose discoverable records are listed. You can provide either the full
          Amazon Resource Name (ARN) or the registry ID.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                maxResults:
                  $ref: '#/components/schemas/ListDiscoverableRegistryRecordsRequestMaxResultsInteger'
                nextToken:
                  $ref: '#/components/schemas/ListDiscoverableRegistryRecordsRequestNextTokenString'
                filters:
                  $ref: '#/components/schemas/RegistryRecordFilterList'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDiscoverableRegistryRecordsResponse'
      x-stackql-resource: discoverable_registry_records
      x-stackql-method: list_discoverable_registry_records
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.registryRecords
      x-stackql-pagination-request-token-key: nextToken
      x-stackql-pagination-request-token-location: body
      x-stackql-pagination-response-token-key: $.nextToken
  /discoverable-records-search:
    post:
      operationId: SearchDiscoverableRegistryRecords
      description: Searches the discoverable registry records in a registry using a natural language query. Returns metadata
        for the matching records ordered by relevance.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                searchQuery:
                  $ref: '#/components/schemas/SearchQuery'
                registryIds:
                  $ref: '#/components/schemas/SearchDiscoverableRegistryRecordsRequestRegistryIdsList'
                maxResults:
                  $ref: '#/components/schemas/SearchDiscoverableRegistryRecordsRequestMaxResultsInteger'
                filters:
                  $ref: '#/components/schemas/MetadataFilterExpression'
              required:
              - searchQuery
              - registryIds
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDiscoverableRegistryRecordsResponse'
      x-stackql-resource: discoverable_registry_records
      x-stackql-method: search_discoverable_registry_records
      x-stackql-verb: SELECT
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    BatchGetDiscoverableRegistryRecordRequestEntriesList:
      type: array
      items:
        $ref: '#/components/schemas/RegistryRecordsEntry'
    RegistryRecordsEntry:
      description: Binds one registry to the record IDs requested from it.
      type: object
      properties:
        registryId:
          $ref: '#/components/schemas/RegistryIdentifier'
          description: The identifier of the registry to retrieve the records from. You can provide either the full Amazon
            Resource Name (ARN) or the registry ID.
        recordIds:
          $ref: '#/components/schemas/RegistryRecordsEntryRecordIdsList'
          description: The record IDs to retrieve from the registry. You can specify 1 through 100 record IDs.
      required:
      - registryId
      - recordIds
    RegistryIdentifier:
      description: Registry identifier that accepts either ARN or ID format
      type: string
      minLength: 1
      maxLength: 2048
      pattern: (arn:aws(-[^:]+)?:agent-registry:[a-z0-9-]+:[0-9]{12}:registry/)?[a-zA-Z0-9]{12,16}
    RegistryRecordsEntryRecordIdsList:
      type: array
      items:
        $ref: '#/components/schemas/RecordIdentifier'
    RecordIdentifier:
      description: Record identifier that accepts either ARN or ID format
      type: string
      minLength: 1
      maxLength: 2048
      pattern: (arn:aws(-[^:]+)?:agent-registry:[a-z0-9-]+:[0-9]{12}:registry/[a-zA-Z0-9]{12,16}/record/)?[a-zA-Z0-9]{12}
    BatchGetDiscoverableRegistryRecordResponse:
      type: object
      properties:
        registryRecords:
          $ref: '#/components/schemas/RegistryRecordSummaryList'
          description: The records that were successfully retrieved. Each record correlates to the request by its recordId.
        errors:
          $ref: '#/components/schemas/BatchGetDiscoverableRegistryRecordErrorList'
          description: The per-record errors for records that could not be retrieved. This list is empty when all requested
            records were returned.
      required:
      - registryRecords
      - errors
    RegistryRecordSummaryList:
      type: array
      items:
        $ref: '#/components/schemas/RegistryRecordSummary'
    RegistryRecordSummary:
      description: Summary information about a registry record, including its descriptors.
      type: object
      properties:
        registryArn:
          $ref: '#/components/schemas/RegistryArn'
          description: The Amazon Resource Name (ARN) of the parent registry that owns the record.
        recordArn:
          $ref: '#/components/schemas/RegistryRecordArn'
          description: The Amazon Resource Name (ARN) of the registry record.
        recordId:
          $ref: '#/components/schemas/RegistryRecordId'
          description: The unique identifier of the registry record.
        name:
          $ref: '#/components/schemas/RegistryRecordName'
          description: The name of the registry record. Names are unique within a registry.
        description:
          $ref: '#/components/schemas/Description'
          description: A human-readable description of the registry record. Use this field to explain the record's purpose
            or content to consumers discovering it in the registry.
        displayName:
          $ref: '#/components/schemas/RegistryRecordDisplayName'
          description: The human-readable display name of the registry record.
        recordType:
          $ref: '#/components/schemas/RecordType'
          description: The type of the registry record. MCP is a Model Context Protocol server record, AGENT is an Agent-to-Agent
            (A2A) agent card record, SKILL is an agent skills definition record, and CUSTOM is a record with a custom descriptor.
        descriptors:
          $ref: '#/components/schemas/Descriptors'
          description: The protocol-specific descriptors that describe how to connect to and use the record.
        recordVersion:
          $ref: '#/components/schemas/RegistryRecordVersion'
          description: The version identifier of the registry record.
        status:
          $ref: '#/components/schemas/RegistryRecordStatus'
          description: The lifecycle status of the registry record. A record is DRAFT before it is submitted, PENDING_APPROVAL
            while awaiting curator review, and APPROVED once it is approved and discoverable. REJECTED and DEPRECATED records
            are not discoverable. The CREATING, UPDATING, CREATE_FAILED, and UPDATE_FAILED values reflect the state of an
            in-progress or failed asynchronous change.
        createdAt:
          $ref: '#/components/schemas/DateTimestamp'
          description: The timestamp when the registry record was created.
        updatedAt:
          $ref: '#/components/schemas/DateTimestamp'
          description: The timestamp when the registry record was last updated.
      required:
      - registryArn
      - recordArn
      - recordId
      - name
      - recordType
      - descriptors
      - recordVersion
      - status
      - createdAt
      - updatedAt
    RegistryArn:
      description: Registry Amazon Resource Name
      type: string
      minLength: 46
      maxLength: 2048
      pattern: arn:aws(-[^:]+)?:agent-registry:[a-z0-9-]+:[0-9]{12}:registry/[a-zA-Z0-9]{12,16}
    RegistryRecordArn:
      description: Registry Record Amazon Resource Name
      type: string
      minLength: 1
      maxLength: 2048
      pattern: arn:aws(-[^:]+)?:agent-registry:[a-z0-9-]+:[0-9]{12}:registry/[a-zA-Z0-9]{12,16}/record/[a-zA-Z0-9]{12}
    RegistryRecordId:
      description: Registry Record unique identifier - 12-character alphanumeric string
      type: string
      minLength: 12
      maxLength: 12
      pattern: '[a-zA-Z0-9]{12}'
    RegistryRecordName:
      description: Registry Record name
      type: string
      minLength: 1
      maxLength: 255
      pattern: '[a-zA-Z0-9][a-zA-Z0-9_\-\.\/]*'
    Description:
      description: Description of the Resource
      type: string
      minLength: 1
      maxLength: 4096
    RegistryRecordDisplayName:
      description: Display name for a registry record
      type: string
      minLength: 1
      maxLength: 255
    RecordType:
      description: Record type enum for registry record classification
      type: string
      enum:
      - MCP
      - AGENT
      - CUSTOM
      - SKILL
      - GATEWAY
    Descriptors:
      description: The protocol-specific descriptors that describe how to connect to and use the registry record.
      type: object
      properties:
        mcpServer:
          $ref: '#/components/schemas/McpServerDescriptor'
          description: The MCP server descriptor, populated when the record type is MCP.
        a2aAgentCard:
          $ref: '#/components/schemas/A2aAgentCardDescriptor'
          description: The A2A agent card descriptor, populated when the record type is AGENT.
        agentSkillsDefinition:
          $ref: '#/components/schemas/AgentSkillsDefinitionDescriptor'
          description: The agent skills definition descriptor, populated when the record type is SKILL.
        custom:
          $ref: '#/components/schemas/CustomDescriptor'
          description: The custom descriptor, populated when the record type is CUSTOM.
        http:
          $ref: '#/components/schemas/HttpDescriptor'
          description: The HTTP descriptor, populated when the record exposes an HTTP endpoint.
        agui:
          $ref: '#/components/schemas/AgUiDescriptor'
          description: The AG-UI descriptor, populated when the record exposes an AG-UI protocol endpoint.
    McpServerDescriptor:
      description: Descriptor that defines the content of an MCP (Model Context Protocol) server registry record, including
        the server definition and its tool definitions. The content is validated against the MCP protocol schema.
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DescriptorData'
          description: The MCP server descriptor content, serialized as descriptor payload data.
        dataSchemaVersion:
          $ref: '#/components/schemas/DataSchemaVersion'
          description: The schema version of the descriptor payload.
        additionalData:
          $ref: '#/components/schemas/McpServerAdditionalData'
          description: Additional data associated with the MCP server descriptor, such as tool definitions.
        source:
          $ref: '#/components/schemas/DescriptorSource'
          description: The source location from which the MCP (Model Context Protocol) server descriptor content was retrieved.
    DescriptorData:
      description: Descriptor payload data
      type: string
      minLength: 1
      maxLength: 102400
    DataSchemaVersion:
      description: Version of the descriptor type schema
      type: string
      minLength: 1
      maxLength: 255
    McpServerAdditionalData:
      description: Additional data for an MCP server descriptor
      type: object
      properties:
        tools:
          $ref: '#/components/schemas/McpToolsDescriptor'
          description: The MCP tools descriptor that defines the tools exposed by the MCP server.
    McpToolsDescriptor:
      description: MCP tools descriptor containing tool definitions
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DescriptorData'
          description: The MCP tools descriptor content, serialized as descriptor payload data.
        dataSchemaVersion:
          $ref: '#/components/schemas/DataSchemaVersion'
          description: The schema version of the descriptor payload.
    DescriptorSource:
      description: The source location from which a descriptor's content was retrieved.
      type: object
      properties:
        fromUrl:
          $ref: '#/components/schemas/DescriptorSourceFromUrl'
          description: The URL-based descriptor source, populated when descriptor content is synchronized from a URL.
    DescriptorSourceFromUrl:
      description: A URL-based descriptor source that identifies where descriptor content is retrieved from.
      type: object
      properties:
        url:
          $ref: '#/components/schemas/DescriptorSourceUrl'
          description: The URL from which the descriptor content is retrieved.
      required:
      - url
    DescriptorSourceUrl:
      description: URL source for descriptor content
      type: string
      minLength: 1
      maxLength: 2048
      pattern: https://.*
    A2aAgentCardDescriptor:
      description: Descriptor that defines the content of an A2A (Agent-to-Agent) agent card registry record. The content
        is validated against the A2A protocol schema.
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DescriptorData'
          description: The A2A agent card content, serialized as descriptor payload data.
        dataSchemaVersion:
          $ref: '#/components/schemas/DataSchemaVersion'
          description: The schema version of the descriptor payload.
        source:
          $ref: '#/components/schemas/DescriptorSource'
          description: The source location from which the A2A (Agent-to-Agent) agent card descriptor content was retrieved.
    AgentSkillsDefinitionDescriptor:
      description: Descriptor that defines an agent skills registry record and its associated content.
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DescriptorData'
          description: The agent skills definition content, serialized as descriptor payload data.
        dataSchemaVersion:
          $ref: '#/components/schemas/DataSchemaVersion'
          description: The schema version of the descriptor payload.
        additionalData:
          $ref: '#/components/schemas/AgentSkillsAdditionalData'
          description: Additional data for the agent skills definition, such as the skills markdown descriptor.
    AgentSkillsAdditionalData:
      description: Additional data for an agent skills definition descriptor.
      type: object
      properties:
        skillMd:
          $ref: '#/components/schemas/AgentSkillsMdDescriptor'
          description: The agent skills markdown descriptor associated with the agent skills definition.
    AgentSkillsMdDescriptor:
      description: Markdown-format descriptor containing an agent skills document.
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DescriptorData'
          description: The agent skills markdown content, serialized as descriptor payload data.
        dataSchemaVersion:
          $ref: '#/components/schemas/DataSchemaVersion'
          description: The schema version of the descriptor payload.
        source:
          $ref: '#/components/schemas/DescriptorSource'
          description: The source location from which the agent skills markdown content was retrieved.
    CustomDescriptor:
      description: Custom descriptor for user-defined content
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DescriptorData'
          description: The custom descriptor content, serialized as descriptor payload data.
    HttpDescriptor:
      description: 'A descriptor for a registry record that exposes an HTTP endpoint. This descriptor is source-only: it identifies
        where the endpoint is located and carries no descriptor payload data or schema version.'
      type: object
      properties:
        source:
          $ref: '#/components/schemas/DescriptorSource'
          description: The source location of the HTTP endpoint.
    AgUiDescriptor:
      description: 'A descriptor for a registry record that exposes an AG-UI protocol endpoint. This descriptor is source-only:
        it identifies where the endpoint is located and carries no descriptor payload data or schema version.'
      type: object
      properties:
        source:
          $ref: '#/components/schemas/DescriptorSource'
          description: The source location of the AG-UI protocol endpoint.
    RegistryRecordVersion:
      description: Version of the registry record
      type: string
      minLength: 1
      maxLength: 255
      pattern: '[a-zA-Z0-9.-]+'
    RegistryRecordStatus:
      description: Registry record status
      type: string
      enum:
      - DRAFT
      - PENDING_APPROVAL
      - APPROVED
      - REJECTED
      - DEPRECATED
      - CREATING
      - UPDATING
      - CREATE_FAILED
      - UPDATE_FAILED
    DateTimestamp:
      description: Timestamp in ISO 8601 date-time format
      type: string
      format: date-time
    BatchGetDiscoverableRegistryRecordErrorList:
      type: array
      items:
        $ref: '#/components/schemas/BatchGetDiscoverableRegistryRecordError'
    BatchGetDiscoverableRegistryRecordError:
      description: Describes why a requested record could not be retrieved.
      type: object
      properties:
        registryId:
          $ref: '#/components/schemas/RegistryIdentifier'
          description: The identifier of the registry the record was requested from, echoed from the request.
        recordId:
          $ref: '#/components/schemas/RecordIdentifier'
          description: The identifier of the record that could not be retrieved, echoed from the request in the same format
            that you supplied (ARN or record ID).
        errorCode:
          $ref: '#/components/schemas/BatchGetDiscoverableRegistryRecordErrorCode'
          description: The machine-readable reason that the record could not be retrieved.
        message:
          $ref: '#/components/schemas/String'
          description: An optional human-readable detail about the error. Do not parse this value programmatically.
      required:
      - registryId
      - recordId
      - errorCode
    BatchGetDiscoverableRegistryRecordErrorCode:
      type: string
      enum:
      - RESOURCE_NOT_FOUND
      - ACCESS_DENIED
      - INTERNAL_ERROR
    String:
      type: string
    ListDiscoverableRegistryRecordsRequestMaxResultsInteger:
      type: integer
      minimum: 1
      maximum: 100
    ListDiscoverableRegistryRecordsRequestNextTokenString:
      type: string
      minLength: 1
      maxLength: 4096
    RegistryRecordFilterList:
      description: The list of filters applied to a ListDiscoverableRegistryRecords request.
      type: array
      items:
        $ref: '#/components/schemas/RegistryRecordFilter'
    RegistryRecordFilter:
      description: A single filter applied to a ListDiscoverableRegistryRecords request.
      type: object
      properties:
        name:
          $ref: '#/components/schemas/RegistryRecordFilterName'
          description: The attribute to filter on.
        values:
          $ref: '#/components/schemas/DiscoverableFilterValues'
          description: The values to match for the attribute.
      required:
      - name
      - values
    RegistryRecordFilterName:
      description: The attribute to filter registry records on.
      type: string
      enum:
      - recordType
      - descriptorType
    DiscoverableFilterValues:
      type: array
      items:
        $ref: '#/components/schemas/FilterValue'
    FilterValue:
      description: A single filter value. Constrained by length only; the accepted set of values is filter-specific and validated
        server-side so enum-style values such as READY or AWS_IAM are accepted.
      type: string
      minLength: 1
      maxLength: 255
    ListDiscoverableRegistryRecordsResponse:
      type: object
      properties:
        registryRecords:
          $ref: '#/components/schemas/DiscoverableRegistryRecordSummaryList'
          description: The page of discoverable registry record summaries.
        nextToken:
          $ref: '#/components/schemas/String'
          description: The pagination token to pass to a subsequent request to retrieve the next page of results. This field
            is absent when there are no more results.
      required:
      - registryRecords
    DiscoverableRegistryRecordSummaryList:
      type: array
      items:
        $ref: '#/components/schemas/DiscoverableRegistryRecordSummary'
    DiscoverableRegistryRecordSummary:
      description: Summary information about a discoverable registry record returned by ListDiscoverableRegistryRecords. This
        summary does not include descriptors.
      type: object
      properties:
        registryArn:
          $ref: '#/components/schemas/RegistryArn'
          description: The Amazon Resource Name (ARN) of the parent registry that owns the record.
        recordArn:
          $ref: '#/components/schemas/RegistryRecordArn'
          description: The Amazon Resource Name (ARN) of the registry record.
        recordId:
          $ref: '#/components/schemas/RegistryRecordId'
          description: The unique identifier of the registry record.
        name:
          $ref: '#/components/schemas/RegistryRecordName'
          description: The name of the registry record. Names are unique within a registry.
        description:
          $ref: '#/components/schemas/Description'
          description: A human-readable description of the registry record. Use this field to explain the record's purpose
            or content to consumers discovering it in the registry.
        displayName:
          $ref: '#/components/schemas/RegistryRecordDisplayName'
          description: The human-readable display name of the registry record.
        recordType:
          $ref: '#/components/schemas/RecordType'
          description: The type of the registry record. MCP is a Model Context Protocol server record, AGENT is an Agent-to-Agent
            (A2A) agent card record, SKILL is an agent skills definition record, and CUSTOM is a record with a custom descriptor.
        recordVersion:
          $ref: '#/components/schemas/RegistryRecordVersion'
          description: The version identifier of the registry record.
        status:
          $ref: '#/components/schemas/RegistryRecordStatus'
          description: The lifecycle status of the registry record. A record is DRAFT before it is submitted, PENDING_APPROVAL
            while awaiting curator review, and APPROVED once it is approved and discoverable. REJECTED and DEPRECATED records
            are not discoverable. The CREATING, UPDATING, CREATE_FAILED, and UPDATE_FAILED values reflect the state of an
            in-progress or failed asynchronous change.
        createdAt:
          $ref: '#/components/schemas/DateTimestamp'
          description: The timestamp when the registry record was created.
        updatedAt:
          $ref: '#/components/schemas/DateTimestamp'
          description: The timestamp when the registry record was last updated.
        descriptorTypes:
          $ref: '#/components/schemas/DescriptorTypeList'
          description: The descriptor types that are present on this registry record. Each value corresponds to a descriptor
            entry key on the approved record.
      required:
      - registryArn
      - recordArn
      - recordId
      - name
      - recordType
      - recordVersion
      - status
      - createdAt
      - updatedAt
    DescriptorTypeList:
      type: array
      items:
        $ref: '#/components/schemas/String'
    SearchQuery:
      type: string
      minLength: 0
      maxLength: 256
    SearchDiscoverableRegistryRecordsRequestRegistryIdsList:
      type: array
      items:
        $ref: '#/components/schemas/RegistryIdentifier'
    SearchDiscoverableRegistryRecordsRequestMaxResultsInteger:
      type: integer
      minimum: 1
      maximum: 20
    MetadataFilterExpression:
      type: object
    SearchDiscoverableRegistryRecordsResponse:
      type: object
      properties:
        registryRecords:
          $ref: '#/components/schemas/RegistryRecordSummaryList'
          description: The registry records that match the search query, ordered by relevance.
      required:
      - registryRecords
