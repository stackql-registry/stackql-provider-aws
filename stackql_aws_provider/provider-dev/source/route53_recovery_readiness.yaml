openapi: 3.0.0
info:
  version: '2019-12-02'
  title: AWS Route53 Recovery Readiness
  description: AWS Route53 Recovery Readiness
  x-serviceName: route53-recovery-readiness
  x-serviceAlias: route53_recovery_readiness
  x-protocol: rest-json
  x-apiVersion: '2019-12-02'
  x-endpointPrefix: route53-recovery-readiness
  x-jsonVersion: '1.1'
servers:
- url: https://route53-recovery-readiness.{region}.amazonaws.com
  variables:
    region:
      default: us-east-1
      description: AWS region
  description: Regional endpoint for route53-recovery-readiness
paths:
  /cells:
    post:
      operationId: CreateCell
      description: Creates a cell in an account.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                CellName:
                  $ref: '#/components/schemas/__string'
                Cells:
                  $ref: '#/components/schemas/__listOf__string'
                Tags:
                  $ref: '#/components/schemas/Tags'
              required:
              - CellName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCellResponse'
      x-stackql-resource: cells
      x-stackql-method: create_cell
      x-stackql-verb: INSERT
    get:
      operationId: ListCells
      description: Lists the cells for an account.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The number of objects that you want to return with this call.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/__string'
        description: The token that identifies which batch of results you want to see.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCellsResponse'
      x-stackql-resource: cells
      x-stackql-method: list_cells
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.Cells
      x-stackql-pagination-request-token-key: nextToken
      x-stackql-pagination-request-token-location: query
      x-stackql-pagination-response-token-key: $.NextToken
  /crossaccountauthorizations:
    post:
      operationId: CreateCrossAccountAuthorization
      description: Creates a cross-account readiness authorization. This lets you authorize another account to work with Route
        53 Application Recovery Controller, for example, to check the readiness status of resources in a separate account.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                CrossAccountAuthorization:
                  $ref: '#/components/schemas/CrossAccountAuthorization'
              required:
              - CrossAccountAuthorization
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCrossAccountAuthorizationResponse'
      x-stackql-resource: cross_account_authorizations
      x-stackql-method: create_cross_account_authorization
      x-stackql-verb: INSERT
    get:
      operationId: ListCrossAccountAuthorizations
      description: Lists the cross-account readiness authorizations that are in place for an account.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The number of objects that you want to return with this call.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/__string'
        description: The token that identifies which batch of results you want to see.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCrossAccountAuthorizationsOutputDisplay'
      x-stackql-resource: cross_account_authorizations
      x-stackql-method: list_cross_account_authorizations
      x-stackql-verb: SELECT
      x-stackql-responseEnvelope: ListCrossAccountAuthorizationsOutputDisplay
      x-stackql-responseObjectKey: $.line_items
      x-stackql-transform-type: golang_template_json_v0.3.0
      x-stackql-transform-body: '{{- $lst := index . "CrossAccountAuthorizations" -}}{{- $tok := index . "NextToken" -}}{"line_items":
        [{{- if eq (kindOf $lst) "slice" -}}{{- range $i, $v := $lst -}}{{- if $i }},{{ end }}{"cross_account_authorization":
        {{ toJson $v }}}{{- end -}}{{- end -}}]{{- if $tok }}, "NextToken": {{ toJson $tok }}{{- end }}}'
      x-stackql-pagination-request-token-key: nextToken
      x-stackql-pagination-request-token-location: query
      x-stackql-pagination-response-token-key: $.NextToken
  /readinesschecks:
    post:
      operationId: CreateReadinessCheck
      description: Creates a readiness check in an account. A readiness check monitors a resource set in your application,
        such as a set of Amazon Aurora instances, that Application Recovery Controller is auditing recovery readiness for.
        The audits run once every minute on every resource that's associated with a readiness check.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ReadinessCheckName:
                  $ref: '#/components/schemas/__string'
                ResourceSetName:
                  $ref: '#/components/schemas/__string'
                Tags:
                  $ref: '#/components/schemas/Tags'
              required:
              - ReadinessCheckName
              - ResourceSetName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReadinessCheckResponse'
      x-stackql-resource: readiness_checks
      x-stackql-method: create_readiness_check
      x-stackql-verb: INSERT
    get:
      operationId: ListReadinessChecks
      description: Lists the readiness checks for an account.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The number of objects that you want to return with this call.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/__string'
        description: The token that identifies which batch of results you want to see.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReadinessChecksResponse'
      x-stackql-resource: readiness_checks
      x-stackql-method: list_readiness_checks
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.ReadinessChecks
      x-stackql-pagination-request-token-key: nextToken
      x-stackql-pagination-request-token-location: query
      x-stackql-pagination-response-token-key: $.NextToken
  /recoverygroups:
    post:
      operationId: CreateRecoveryGroup
      description: Creates a recovery group in an account. A recovery group corresponds to an application and includes a list
        of the cells that make up the application.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Cells:
                  $ref: '#/components/schemas/__listOf__string'
                RecoveryGroupName:
                  $ref: '#/components/schemas/__string'
                Tags:
                  $ref: '#/components/schemas/Tags'
              required:
              - RecoveryGroupName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRecoveryGroupResponse'
      x-stackql-resource: recovery_groups
      x-stackql-method: create_recovery_group
      x-stackql-verb: INSERT
    get:
      operationId: ListRecoveryGroups
      description: Lists the recovery groups in an account.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The number of objects that you want to return with this call.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/__string'
        description: The token that identifies which batch of results you want to see.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRecoveryGroupsResponse'
      x-stackql-resource: recovery_groups
      x-stackql-method: list_recovery_groups
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.RecoveryGroups
      x-stackql-pagination-request-token-key: nextToken
      x-stackql-pagination-request-token-location: query
      x-stackql-pagination-response-token-key: $.NextToken
  /resourcesets:
    post:
      operationId: CreateResourceSet
      description: Creates a resource set. A resource set is a set of resources of one type that span multiple cells. You
        can associate a resource set with a readiness check to monitor the resources for failover readiness.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ResourceSetName:
                  $ref: '#/components/schemas/__string'
                ResourceSetType:
                  $ref: '#/components/schemas/__stringPatternAWSAZaZ09AZaZ09'
                Resources:
                  $ref: '#/components/schemas/__listOfResource'
                Tags:
                  $ref: '#/components/schemas/Tags'
              required:
              - ResourceSetName
              - ResourceSetType
              - Resources
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResourceSetResponse'
      x-stackql-resource: resource_sets
      x-stackql-method: create_resource_set
      x-stackql-verb: INSERT
    get:
      operationId: ListResourceSets
      description: Lists the resource sets in an account.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The number of objects that you want to return with this call.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/__string'
        description: The token that identifies which batch of results you want to see.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResourceSetsResponse'
      x-stackql-resource: resource_sets
      x-stackql-method: list_resource_sets
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.ResourceSets
      x-stackql-pagination-request-token-key: nextToken
      x-stackql-pagination-request-token-location: query
      x-stackql-pagination-response-token-key: $.NextToken
  /cells/{cell_name}:
    delete:
      operationId: DeleteCell
      description: Delete a cell. When successful, the response code is 204, with no response body.
      parameters:
      - name: cell_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the cell.
      responses:
        '204':
          description: Success
      x-stackql-resource: cells
      x-stackql-method: delete_cell
      x-stackql-verb: DELETE
    get:
      operationId: GetCell
      description: Gets information about a cell including cell name, cell Amazon Resource Name (ARN), ARNs of nested cells
        for this cell, and a list of those cell ARNs with their associated recovery group ARNs.
      parameters:
      - name: cell_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the cell.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCellResponse'
      x-stackql-resource: cells
      x-stackql-method: get_cell
      x-stackql-verb: SELECT
    put:
      operationId: UpdateCell
      description: Updates a cell to replace the list of nested cells with a new list of nested cells.
      parameters:
      - name: cell_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the cell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Cells:
                  $ref: '#/components/schemas/__listOf__string'
              required:
              - Cells
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCellResponse'
      x-stackql-resource: cells
      x-stackql-method: update_cell
      x-stackql-verb: UPDATE
  /crossaccountauthorizations/{cross_account_authorization}:
    delete:
      operationId: DeleteCrossAccountAuthorization
      description: Deletes cross account readiness authorization.
      parameters:
      - name: cross_account_authorization
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The cross-account authorization.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCrossAccountAuthorizationResponse'
      x-stackql-resource: cross_account_authorizations
      x-stackql-method: delete_cross_account_authorization
      x-stackql-verb: DELETE
  /readinesschecks/{readiness_check_name}:
    delete:
      operationId: DeleteReadinessCheck
      description: Deletes a readiness check.
      parameters:
      - name: readiness_check_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: Name of a readiness check.
      responses:
        '204':
          description: Success
      x-stackql-resource: readiness_checks
      x-stackql-method: delete_readiness_check
      x-stackql-verb: DELETE
    get:
      operationId: GetReadinessCheck
      description: Gets details about a readiness check.
      parameters:
      - name: readiness_check_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: Name of a readiness check.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReadinessCheckResponse'
      x-stackql-resource: readiness_checks
      x-stackql-method: get_readiness_check
      x-stackql-verb: SELECT
    put:
      operationId: UpdateReadinessCheck
      description: Updates a readiness check.
      parameters:
      - name: readiness_check_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: Name of a readiness check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ResourceSetName:
                  $ref: '#/components/schemas/__string'
              required:
              - ResourceSetName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateReadinessCheckResponse'
      x-stackql-resource: readiness_checks
      x-stackql-method: update_readiness_check
      x-stackql-verb: UPDATE
  /recoverygroups/{recovery_group_name}:
    delete:
      operationId: DeleteRecoveryGroup
      description: Deletes a recovery group.
      parameters:
      - name: recovery_group_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of a recovery group.
      responses:
        '204':
          description: Success
      x-stackql-resource: recovery_groups
      x-stackql-method: delete_recovery_group
      x-stackql-verb: DELETE
    get:
      operationId: GetRecoveryGroup
      description: Gets details about a recovery group, including a list of the cells that are included in it.
      parameters:
      - name: recovery_group_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of a recovery group.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecoveryGroupResponse'
      x-stackql-resource: recovery_groups
      x-stackql-method: get_recovery_group
      x-stackql-verb: SELECT
    put:
      operationId: UpdateRecoveryGroup
      description: Updates a recovery group.
      parameters:
      - name: recovery_group_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of a recovery group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Cells:
                  $ref: '#/components/schemas/__listOf__string'
              required:
              - Cells
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRecoveryGroupResponse'
      x-stackql-resource: recovery_groups
      x-stackql-method: update_recovery_group
      x-stackql-verb: UPDATE
  /resourcesets/{resource_set_name}:
    delete:
      operationId: DeleteResourceSet
      description: Deletes a resource set.
      parameters:
      - name: resource_set_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: Name of a resource set.
      responses:
        '204':
          description: Success
      x-stackql-resource: resource_sets
      x-stackql-method: delete_resource_set
      x-stackql-verb: DELETE
    get:
      operationId: GetResourceSet
      description: Displays the details about a resource set, including a list of the resources in the set.
      parameters:
      - name: resource_set_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: Name of a resource set.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResourceSetResponse'
      x-stackql-resource: resource_sets
      x-stackql-method: get_resource_set
      x-stackql-verb: SELECT
    put:
      operationId: UpdateResourceSet
      description: Updates a resource set.
      parameters:
      - name: resource_set_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: Name of a resource set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ResourceSetType:
                  $ref: '#/components/schemas/__stringPatternAWSAZaZ09AZaZ09'
                Resources:
                  $ref: '#/components/schemas/__listOfResource'
              required:
              - ResourceSetType
              - Resources
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResourceSetResponse'
      x-stackql-resource: resource_sets
      x-stackql-method: update_resource_set
      x-stackql-verb: UPDATE
  /recoverygroups/{recovery_group_name}/architectureRecommendations:
    get:
      operationId: GetArchitectureRecommendations
      description: Gets recommendations about architecture designs for improving resiliency for an application, based on a
        recovery group.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The number of objects that you want to return with this call.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/__string'
        description: The token that identifies which batch of results you want to see.
      - name: recovery_group_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of a recovery group.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetArchitectureRecommendationsResponse'
      x-stackql-resource: architecture_recommendations
      x-stackql-method: get_architecture_recommendations
      x-stackql-verb: SELECT
  /cellreadiness/{cell_name}:
    get:
      operationId: GetCellReadinessSummary
      description: Gets readiness for a cell. Aggregates the readiness of all the resources that are associated with the cell
        into a single value.
      parameters:
      - name: cell_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the cell.
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The number of objects that you want to return with this call.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/__string'
        description: The token that identifies which batch of results you want to see.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCellReadinessSummaryResponse'
      x-stackql-resource: cell_readiness_summaries
      x-stackql-method: get_cell_readiness_summary
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.ReadinessChecks
      x-stackql-pagination-request-token-key: nextToken
      x-stackql-pagination-request-token-location: query
      x-stackql-pagination-response-token-key: $.NextToken
  /readinesschecks/{readiness_check_name}/resource/{resource_identifier}/status:
    get:
      operationId: GetReadinessCheckResourceStatus
      description: Gets individual readiness status for a readiness check. To see the overall readiness status for a recovery
        group, that considers the readiness status for all the readiness checks in the recovery group, use GetRecoveryGroupReadinessSummary.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The number of objects that you want to return with this call.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/__string'
        description: The token that identifies which batch of results you want to see.
      - name: readiness_check_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: Name of a readiness check.
      - name: resource_identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The resource identifier, which is the Amazon Resource Name (ARN) or the identifier generated for the
          resource by Application Recovery Controller (for example, for a DNS target resource).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReadinessCheckResourceStatusResponse'
      x-stackql-resource: readiness_check_resource_status
      x-stackql-method: get_readiness_check_resource_status
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.Rules
      x-stackql-pagination-request-token-key: nextToken
      x-stackql-pagination-request-token-location: query
      x-stackql-pagination-response-token-key: $.NextToken
  /readinesschecks/{readiness_check_name}/status:
    get:
      operationId: GetReadinessCheckStatus
      description: Gets the readiness status for an individual readiness check. To see the overall readiness status for a
        recovery group, that considers the readiness status for all the readiness checks in a recovery group, use GetRecoveryGroupReadinessSummary.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The number of objects that you want to return with this call.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/__string'
        description: The token that identifies which batch of results you want to see.
      - name: readiness_check_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: Name of a readiness check.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReadinessCheckStatusResponse'
      x-stackql-resource: readiness_check_status
      x-stackql-method: get_readiness_check_status
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.Resources
      x-stackql-pagination-request-token-key: nextToken
      x-stackql-pagination-request-token-location: query
      x-stackql-pagination-response-token-key: $.NextToken
  /recoverygroupreadiness/{recovery_group_name}:
    get:
      operationId: GetRecoveryGroupReadinessSummary
      description: Displays a summary of information about a recovery group's readiness status. Includes the readiness checks
        for resources in the recovery group and the readiness status of each one.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The number of objects that you want to return with this call.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/__string'
        description: The token that identifies which batch of results you want to see.
      - name: recovery_group_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of a recovery group.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecoveryGroupReadinessSummaryResponse'
      x-stackql-resource: recovery_group_readiness_summaries
      x-stackql-method: get_recovery_group_readiness_summary
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.ReadinessChecks
      x-stackql-pagination-request-token-key: nextToken
      x-stackql-pagination-request-token-location: query
      x-stackql-pagination-response-token-key: $.NextToken
  /rules:
    get:
      operationId: ListRules
      description: Lists all readiness rules, or lists the readiness rules for a specific resource type.
