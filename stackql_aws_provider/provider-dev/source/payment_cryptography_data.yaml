        Amex:
          $ref: '#/components/schemas/AmexAttributes'
          description: Parameters to derive the confidentiality and integrity keys for a payment card using Amex derivation
            method.
        Visa:
          $ref: '#/components/schemas/VisaAttributes'
          description: Parameters to derive the confidentiality and integrity keys for a a payment card using Visa derivation
            method.
        Emv2000:
          $ref: '#/components/schemas/Emv2000Attributes'
          description: Parameters to derive the confidentiality and integrity keys for a payment card using Emv2000 derivation
            method.
        Mastercard:
          $ref: '#/components/schemas/MasterCardAttributes'
          description: Parameters to derive the confidentiality and integrity keys for a payment card using Mastercard derivation
            method.
    EmvCommonAttributes:
      description: Parameters to derive the confidentiality and integrity keys for an Emv common payment card.
      type: object
      properties:
        MajorKeyDerivationMode:
          $ref: '#/components/schemas/MajorKeyDerivationMode'
          description: The method to use when deriving the master key for the payment card.
        PrimaryAccountNumber:
          $ref: '#/components/schemas/PrimaryAccountNumberType'
          description: The Primary Account Number (PAN) of the cardholder.
        PanSequenceNumber:
          $ref: '#/components/schemas/NumberLengthEquals2'
          description: A number that identifies and differentiates payment cards with the same Primary Account Number (PAN).
            Typically 00 is used, if no value is provided by the terminal.
        ApplicationCryptogram:
          $ref: '#/components/schemas/ApplicationCryptogramType'
          description: The application cryptogram for the current transaction that is provided by the terminal during transaction
            processing.
        Mode:
          $ref: '#/components/schemas/EmvEncryptionMode'
          description: The block cipher method to use for encryption.
        PinBlockPaddingType:
          $ref: '#/components/schemas/PinBlockPaddingType'
          description: The padding to be added to the PIN block prior to encryption. Padding type should be ISO_IEC_7816_4,
            if PinBlockLengthPosition is set to FRONT_OF_PIN_BLOCK. No padding is required, if PinBlockLengthPosition is set
            to NONE.
        PinBlockLengthPosition:
          $ref: '#/components/schemas/PinBlockLengthPosition'
          description: Specifies if PIN block length should be added to front of the pin block. If value is set to FRONT_OF_PIN_BLOCK,
            then PIN block padding type should be ISO_IEC_7816_4.
