openapi: 3.0.0
info:
  version: '2022-02-03'
  title: Payment Cryptography Data Plane
  description: Payment Cryptography Data Plane
  x-serviceName: payment-cryptography
  x-serviceAlias: payment_cryptography_data
  x-protocol: rest-json
  x-apiVersion: '2022-02-03'
  x-endpointPrefix: dataplane.payment-cryptography
servers:
- url: https://dataplane.payment-cryptography.{region}.amazonaws.com
  variables:
    region:
      default: us-east-1
      description: AWS region
  description: Regional endpoint for payment-cryptography-data
paths:
  /keys/{key_identifier}/decrypt:
    post:
      operationId: DecryptData
      description: 'Decrypts ciphertext data to plaintext using a symmetric (TDES, AES), asymmetric (RSA), or derived (DUKPT
        or EMV) encryption key scheme. For more information, see Decrypt data in the Amazon Web Services Payment Cryptography
        User Guide. You can use an decryption key generated within Amazon Web Services Payment Cryptography, or you can import
        your own decryption key by calling ImportKey. For this operation, the key must have KeyModesOfUse set to Decrypt.
        In asymmetric decryption, Amazon Web Services Payment Cryptography decrypts the ciphertext using the private component
        of the asymmetric encryption key pair. For data encryption outside of Amazon Web Services Payment Cryptography, you
        can export the public component of the asymmetric key pair by calling GetPublicCertificate. This operation also supports
        dynamic keys, allowing you to pass a dynamic decryption key as a TR-31 WrappedKeyBlock. This can be used when key
        material is frequently rotated, such as during every card transaction, and there is need to avoid importing short-lived
        keys into Amazon Web Services Payment Cryptography. To decrypt using dynamic keys, the keyARN is the Key Encryption
        Key (KEK) of the TR-31 wrapped decryption key material. The incoming wrapped key shall have a key purpose of D0 with
        a mode of use of B or D. For more information, see Using Dynamic Keys in the Amazon Web Services Payment Cryptography
        User Guide. For symmetric and DUKPT decryption, Amazon Web Services Payment Cryptography supports TDES and AES algorithms.
        For EMV decryption, Amazon Web Services Payment Cryptography supports TDES algorithms. For asymmetric decryption,
        Amazon Web Services Payment Cryptography supports RSA. When you use TDES or TDES DUKPT, the ciphertext data length
        must be a multiple of 8 bytes. For AES or AES DUKPT, the ciphertext data length must be a multiple of 16 bytes. For
        RSA, it sould be equal to the key size unless padding is enabled. For information about valid keys for this operation,
        see Understanding key attributes and Key types for specific data operations in the Amazon Web Services Payment Cryptography
        User Guide. Cross-account use: This operation can''t be used across different Amazon Web Services accounts. Related
        operations: EncryptData GetPublicCertificate ImportKey'
      parameters:
      - name: key_identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/KeyArnOrKeyAliasType'
        description: The keyARN of the encryption key that Amazon Web Services Payment Cryptography uses for ciphertext decryption.
          When a WrappedKeyBlock is provided, this value will be the identifier to the key wrapping key. Otherwise, it is
          the key identifier used to perform the operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                CipherText:
                  $ref: '#/components/schemas/CipherTextType'
                DecryptionAttributes:
                  $ref: '#/components/schemas/EncryptionDecryptionAttributes'
                WrappedKey:
                  $ref: '#/components/schemas/WrappedKey'
              required:
              - CipherText
              - DecryptionAttributes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecryptDataOutput'
      x-stackql-resource: decrypt_data
      x-stackql-method: decrypt_data
      x-stackql-verb: EXEC
  /keys/{key_identifier}/encrypt:
    post:
      operationId: EncryptData
      description: 'Encrypts plaintext data to ciphertext using a symmetric (TDES, AES), asymmetric (RSA), or derived (DUKPT
        or EMV) encryption key scheme. For more information, see Encrypt data in the Amazon Web Services Payment Cryptography
        User Guide. You can generate an encryption key within Amazon Web Services Payment Cryptography by calling CreateKey.
        You can import your own encryption key by calling ImportKey. For this operation, the key must have KeyModesOfUse set
        to Encrypt. In asymmetric encryption, plaintext is encrypted using public component. You can import the public component
        of an asymmetric key pair created outside Amazon Web Services Payment Cryptography by calling ImportKey. This operation
        also supports dynamic keys, allowing you to pass a dynamic encryption key as a TR-31 WrappedKeyBlock. This can be
        used when key material is frequently rotated, such as during every card transaction, and there is need to avoid importing
        short-lived keys into Amazon Web Services Payment Cryptography. To encrypt using dynamic keys, the keyARN is the Key
        Encryption Key (KEK) of the TR-31 wrapped encryption key material. The incoming wrapped key shall have a key purpose
        of D0 with a mode of use of B or D. For more information, see Using Dynamic Keys in the Amazon Web Services Payment
        Cryptography User Guide. For symmetric and DUKPT encryption, Amazon Web Services Payment Cryptography supports TDES
        and AES algorithms. For EMV encryption, Amazon Web Services Payment Cryptography supports TDES algorithms.For asymmetric
        encryption, Amazon Web Services Payment Cryptography supports RSA. When you use TDES or TDES DUKPT, the plaintext
        data length must be a multiple of 8 bytes. For AES or AES DUKPT, the plaintext data length must be a multiple of 16
        bytes. For RSA, it sould be equal to the key size unless padding is enabled. To encrypt using DUKPT, you must already
        have a BDK (Base Derivation Key) key in your account with KeyModesOfUse set to DeriveKey, or you can generate a new
        DUKPT key by calling CreateKey. To encrypt using EMV, you must already have an IMK (Issuer Master Key) key in your
        account with KeyModesOfUse set to DeriveKey. For information about valid keys for this operation, see Understanding
        key attributes and Key types for specific data operations in the Amazon Web Services Payment Cryptography User Guide.
        Cross-account use: This operation can''t be used across different Amazon Web Services accounts. Related operations:
        DecryptData GetPublicCertificate ImportKey ReEncryptData'
      parameters:
      - name: key_identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/KeyArnOrKeyAliasType'
        description: The keyARN of the encryption key that Amazon Web Services Payment Cryptography uses for plaintext encryption.
          When a WrappedKeyBlock is provided, this value will be the identifier to the key wrapping key. Otherwise, it is
          the key identifier used to perform the operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                PlainText:
                  $ref: '#/components/schemas/PlainTextType'
                EncryptionAttributes:
                  $ref: '#/components/schemas/EncryptionDecryptionAttributes'
                WrappedKey:
                  $ref: '#/components/schemas/WrappedKey'
              required:
              - PlainText
              - EncryptionAttributes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptDataOutput'
      x-stackql-resource: encrypt_data
      x-stackql-method: encrypt_data
      x-stackql-verb: EXEC
  /as2805kekvalidation/generate:
    post:
      operationId: GenerateAs2805KekValidation
      description: 'Establishes node-to-node initialization between payment processing nodes such as an acquirer, issuer or
        payment network using Australian Standard 2805 (AS2805). During node-to-node initialization, both communicating nodes
        must validate that they possess the correct Key Encrypting Keys (KEKs) before proceeding with session key exchange.
        In AS2805, the sending KEK (KEKs) of one node corresponds to the receiving KEK (KEKr) of its partner node. Each node
        uses its KEK to encrypt and decrypt session keys exchanged between the nodes. A KEK can be created or imported into
        Amazon Web Services Payment Cryptography using either the CreateKey or ImportKey operations. The node initiating communication
        can use GenerateAS2805KekValidation to generate a combined KEK validation request and KEK validation response to send
        to the partnering node for validation. When invoked, the API internally generates a random sending key encrypted under
        KEKs and provides a receiving key encrypted under KEKr as response. The initiating node sends the response returned
        by this API to its partner for validation. For information about valid keys for this operation, see Understanding
        key attributes and Key types for specific data operations in the Amazon Web Services Payment Cryptography User Guide.
        Cross-account use: This operation can''t be used across different Amazon Web Services accounts.'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                KeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                KekValidationType:
                  $ref: '#/components/schemas/As2805KekValidationType'
                RandomKeySendVariantMask:
                  $ref: '#/components/schemas/RandomKeySendVariantMask'
              required:
              - KeyIdentifier
              - KekValidationType
              - RandomKeySendVariantMask
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateAs2805KekValidationOutput'
      x-stackql-resource: as2805_kek_validation
      x-stackql-method: generate_as2805_kek_validation
      x-stackql-verb: EXEC
  /cardvalidationdata/generate:
    post:
      operationId: GenerateCardValidationData
      description: 'Generates card-related validation data using algorithms such as Card Verification Values (CVV/CVV2), Dynamic
        Card Verification Values (dCVV/dCVV2), or Card Security Codes (CSC). For more information, see Generate card data
        in the Amazon Web Services Payment Cryptography User Guide. This operation generates a CVV or CSC value that is printed
        on a payment credit or debit card during card production. The CVV or CSC, PAN (Primary Account Number) and expiration
        date of the card are required to check its validity during transaction processing. To begin this operation, a CVK
        (Card Verification Key) encryption key is required. You can use CreateKey or ImportKey to establish a CVK within Amazon
        Web Services Payment Cryptography. The KeyModesOfUse should be set to Generate and Verify for a CVK encryption key.
        For information about valid keys for this operation, see Understanding key attributes and Key types for specific data
        operations in the Amazon Web Services Payment Cryptography User Guide. Cross-account use: This operation can''t be
        used across different Amazon Web Services accounts. Related operations: ImportKey VerifyCardValidationData'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                KeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                PrimaryAccountNumber:
                  $ref: '#/components/schemas/PrimaryAccountNumberType'
                GenerationAttributes:
                  $ref: '#/components/schemas/CardGenerationAttributes'
                ValidationDataLength:
                  $ref: '#/components/schemas/IntegerRangeBetween3And5Type'
              required:
              - KeyIdentifier
              - PrimaryAccountNumber
              - GenerationAttributes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateCardValidationDataOutput'
      x-stackql-resource: card_validation_data
      x-stackql-method: generate_card_validation_data
      x-stackql-verb: EXEC
  /mac/generate:
    post:
      operationId: GenerateMac
      description: 'Generates a Message Authentication Code (MAC) cryptogram within Amazon Web Services Payment Cryptography.
        You can use this operation to authenticate card-related data by using known data values to generate MAC for data validation
        between the sending and receiving parties. This operation uses message data, a secret encryption key and MAC algorithm
        to generate a unique MAC value for transmission. The receiving party of the MAC must use the same message data, secret
        encryption key and MAC algorithm to reproduce another MAC value for comparision. You can use this operation to generate
        a DUPKT, CMAC, HMAC or EMV MAC by setting generation attributes and algorithm to the associated values. The MAC generation
        encryption key must have valid values for KeyUsage such as TR31_M7_HMAC_KEY for HMAC generation, and the key must
        have KeyModesOfUse set to Generate. For information about valid keys for this operation, see Understanding key attributes
        and Key types for specific data operations in the Amazon Web Services Payment Cryptography User Guide. Cross-account
        use: This operation can''t be used across different Amazon Web Services accounts. Related operations: VerifyMac'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                KeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                MessageData:
                  $ref: '#/components/schemas/MessageDataType'
                GenerationAttributes:
                  $ref: '#/components/schemas/MacAttributes'
                MacLength:
                  $ref: '#/components/schemas/IntegerRangeBetween4And16'
              required:
              - KeyIdentifier
              - MessageData
              - GenerationAttributes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateMacOutput'
      x-stackql-resource: mac
      x-stackql-method: generate_mac
      x-stackql-verb: EXEC
  /macemvpinchange/generate:
    post:
      operationId: GenerateMacEmvPinChange
      description: 'Generates an issuer script mac for EMV payment cards that use offline PINs as the cardholder verification
        method (CVM). This operation generates an authenticated issuer script response by appending the incoming message data
        (APDU command) with the target encrypted PIN block in ISO2 format. The command structure and method to send the issuer
        script update to the card is not defined by this operation and is typically determined by the applicable payment card
        scheme. The primary inputs to this operation include the incoming new encrypted pinblock, PIN encryption key (PEK),
        issuer master key (IMK), primary account number (PAN), and the payment card derivation method. The operation uses
        two issuer master keys - secure messaging for confidentiality (IMK-SMC) and secure messaging for integrity (IMK-SMI).
        The SMC key is used to internally derive a key to secure the pin, while SMI key is used to internally derive a key
        to authenticate the script reponse as per the EMV 4.4 - Book 2 - Security and Key Management specification. This operation
        supports Amex, EMV2000, EMVCommon, Mastercard and Visa derivation methods, each requiring specific input parameters.
        Users must follow the specific derivation method and input parameters defined by the respective payment card scheme.
        Use GenerateMac operation when sending a script update to an EMV card that does not involve PIN change. When assigning
        IAM permissions, it is important to understand that EncryptData using EMV keys and GenerateMac perform similar functions
        to this command. Cross-account use: This operation can''t be used across different Amazon Web Services accounts. Related
        operations: EncryptData GenerateMac'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NewPinPekIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                NewEncryptedPinBlock:
                  $ref: '#/components/schemas/PinBlockLengthEquals16'
                PinBlockFormat:
                  $ref: '#/components/schemas/PinBlockFormatForEmvPinChange'
                SecureMessagingIntegrityKeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                SecureMessagingConfidentialityKeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                MessageData:
                  $ref: '#/components/schemas/CommandMessageDataType'
                DerivationMethodAttributes:
                  $ref: '#/components/schemas/DerivationMethodAttributes'
              required:
              - NewPinPekIdentifier
              - NewEncryptedPinBlock
              - PinBlockFormat
              - SecureMessagingIntegrityKeyIdentifier
              - SecureMessagingConfidentialityKeyIdentifier
              - MessageData
              - DerivationMethodAttributes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateMacEmvPinChangeOutput'
      x-stackql-resource: mac_emv_pin_change
      x-stackql-method: generate_mac_emv_pin_change
      x-stackql-verb: EXEC
  /pindata/generate:
    post:
      operationId: GeneratePinData
      description: 'Generates pin-related data such as PIN, PIN Verification Value (PVV), PIN Block, and PIN Offset during
        new card issuance or reissuance. For more information, see Generate PIN data in the Amazon Web Services Payment Cryptography
        User Guide. PIN data is never transmitted in clear to or from Amazon Web Services Payment Cryptography. This operation
        generates PIN, PVV, or PIN Offset and then encrypts it using Pin Encryption Key (PEK) to create an EncryptedPinBlock
        for transmission from Amazon Web Services Payment Cryptography. This operation uses a separate Pin Verification Key
        (PVK) for VISA PVV generation. Using ECDH key exchange, you can receive cardholder selectable PINs into Amazon Web
        Services Payment Cryptography. The ECDH derived key protects the incoming PIN block. You can also use it for reveal
        PIN, wherein the generated PIN block is protected by the ECDH derived key before transmission from Amazon Web Services
        Payment Cryptography. For more information on establishing ECDH derived keys, see the Generating keys in the Amazon
        Web Services Payment Cryptography User Guide. For information about valid keys for this operation, see Understanding
        key attributes and Key types for specific data operations in the Amazon Web Services Payment Cryptography User Guide.
        Cross-account use: This operation can''t be used across different Amazon Web Services accounts. Related operations:
        GenerateCardValidationData TranslatePinData VerifyPinData'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                GenerationKeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                EncryptionKeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                GenerationAttributes:
                  $ref: '#/components/schemas/PinGenerationAttributes'
                PinDataLength:
                  $ref: '#/components/schemas/IntegerRangeBetween4And12'
                PrimaryAccountNumber:
                  $ref: '#/components/schemas/PrimaryAccountNumberType'
                PinBlockFormat:
                  $ref: '#/components/schemas/PinBlockFormatForPinData'
                EncryptionWrappedKey:
                  $ref: '#/components/schemas/WrappedKey'
              required:
              - GenerationKeyIdentifier
              - EncryptionKeyIdentifier
              - GenerationAttributes
              - PinBlockFormat
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratePinDataOutput'
      x-stackql-resource: pin_data
      x-stackql-method: generate_pin_data
      x-stackql-verb: EXEC
  /keys/{incoming_key_identifier}/reencrypt:
    post:
      operationId: ReEncryptData
      description: 'Re-encrypt ciphertext using DUKPT or Symmetric data encryption keys. You can either generate an encryption
        key within Amazon Web Services Payment Cryptography by calling CreateKey or import your own encryption key by calling
        ImportKey. The KeyArn for use with this operation must be in a compatible key state with KeyModesOfUse set to Encrypt.
        This operation also supports dynamic keys, allowing you to pass a dynamic encryption key as a TR-31 WrappedKeyBlock.
        This can be used when key material is frequently rotated, such as during every card transaction, and there is need
        to avoid importing short-lived keys into Amazon Web Services Payment Cryptography. To re-encrypt using dynamic keys,
        the keyARN is the Key Encryption Key (KEK) of the TR-31 wrapped encryption key material. The incoming wrapped key
        shall have a key purpose of D0 with a mode of use of B or D. For more information, see Using Dynamic Keys in the Amazon
        Web Services Payment Cryptography User Guide. For symmetric and DUKPT encryption, Amazon Web Services Payment Cryptography
        supports TDES and AES algorithms. To encrypt using DUKPT, a DUKPT key must already exist within your account with
        KeyModesOfUse set to DeriveKey or a new DUKPT can be generated by calling CreateKey. For information about valid keys
        for this operation, see Understanding key attributes and Key types for specific data operations in the Amazon Web
        Services Payment Cryptography User Guide. Cross-account use: This operation can''t be used across different Amazon
        Web Services accounts. Related operations: DecryptData EncryptData GetPublicCertificate ImportKey'
      parameters:
      - name: incoming_key_identifier
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/KeyArnOrKeyAliasType'
        description: The keyARN of the encryption key of incoming ciphertext data. When a WrappedKeyBlock is provided, this
          value will be the identifier to the key wrapping key. Otherwise, it is the key identifier used to perform the operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OutgoingKeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                CipherText:
                  $ref: '#/components/schemas/CipherTextType'
                IncomingEncryptionAttributes:
                  $ref: '#/components/schemas/ReEncryptionAttributes'
                OutgoingEncryptionAttributes:
                  $ref: '#/components/schemas/ReEncryptionAttributes'
                IncomingWrappedKey:
                  $ref: '#/components/schemas/WrappedKey'
                OutgoingWrappedKey:
                  $ref: '#/components/schemas/WrappedKey'
              required:
              - OutgoingKeyIdentifier
              - CipherText
              - IncomingEncryptionAttributes
              - OutgoingEncryptionAttributes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReEncryptDataOutput'
      x-stackql-resource: re_encrypt_data
      x-stackql-method: re_encrypt_data
      x-stackql-verb: EXEC
  /keymaterial/translate:
    post:
      operationId: TranslateKeyMaterial
      description: 'Translates an cryptographic key between different wrapping keys without importing the key into Amazon
        Web Services Payment Cryptography. This operation can be used when key material is frequently rotated, such as during
        every card transaction, and there is a need to avoid importing short-lived keys into Amazon Web Services Payment Cryptography.
        It translates short-lived transaction keys such as PEK generated for each transaction and wrapped with an ECDH derived
        wrapping key to another KEK wrapping key. Before using this operation, you must first request the public key certificate
        of the ECC key pair generated within Amazon Web Services Payment Cryptography to establish an ECDH key agreement.
        In TranslateKeyData, the service uses its own ECC key pair, public certificate of receiving ECC key pair, and the
        key derivation parameters to generate a derived key. The service uses this derived key to unwrap the incoming transaction
        key received as a TR31WrappedKeyBlock and re-wrap using a user provided KEK to generate an outgoing Tr31WrappedKeyBlock.
        For information about valid keys for this operation, see Understanding key attributes and Key types for specific data
        operations in the Amazon Web Services Payment Cryptography User Guide. Cross-account use: This operation can''t be
        used across different Amazon Web Services accounts. Related operations: CreateKey GetPublicCertificate ImportKey'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                IncomingKeyMaterial:
                  $ref: '#/components/schemas/IncomingKeyMaterial'
                OutgoingKeyMaterial:
                  $ref: '#/components/schemas/OutgoingKeyMaterial'
                KeyCheckValueAlgorithm:
                  $ref: '#/components/schemas/KeyCheckValueAlgorithm'
              required:
              - IncomingKeyMaterial
              - OutgoingKeyMaterial
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslateKeyMaterialOutput'
      x-stackql-resource: translate_key_material
      x-stackql-method: translate_key_material
      x-stackql-verb: EXEC
  /pindata/translate:
    post:
      operationId: TranslatePinData
      description: 'Translates encrypted PIN block from and to ISO 9564 formats 0,1,3,4. For more information, see Translate
        PIN data in the Amazon Web Services Payment Cryptography User Guide. PIN block translation involves changing a PIN
        block from one encryption key to another and optionally change its format. PIN block translation occurs entirely within
        the HSM boundary and PIN data never enters or leaves Amazon Web Services Payment Cryptography in clear text. The encryption
        key transformation can be from PEK (Pin Encryption Key) to BDK (Base Derivation Key) for DUKPT or from BDK for DUKPT
        to PEK. Amazon Web Services Payment Cryptography also supports use of dynamic keys and ECDH (Elliptic Curve Diffie-Hellman)
        based key exchange for this operation. Dynamic keys allow you to pass a PEK as a TR-31 WrappedKeyBlock. They can be
        used when key material is frequently rotated, such as during every card transaction, and there is need to avoid importing
        short-lived keys into Amazon Web Services Payment Cryptography. To translate PIN block using dynamic keys, the keyARN
        is the Key Encryption Key (KEK) of the TR-31 wrapped PEK. The incoming wrapped key shall have a key purpose of P0
        with a mode of use of B or D. For more information, see Using Dynamic Keys in the Amazon Web Services Payment Cryptography
        User Guide. Using ECDH key exchange, you can receive cardholder selectable PINs into Amazon Web Services Payment Cryptography.
        The ECDH derived key protects the incoming PIN block, which is translated to a PEK encrypted PIN block for use within
        the service. You can also use ECDH for reveal PIN, wherein the service translates the PIN block from PEK to a ECDH
        derived encryption key. For more information on establishing ECDH derived keys, see the Creating keys in the Amazon
        Web Services Payment Cryptography User Guide. The allowed combinations of PIN block format translations are guided
        by PCI. It is important to note that not all encrypted PIN block formats (example, format 1) require PAN (Primary
        Account Number) as input. And as such, PIN block format that requires PAN (example, formats 0,3,4) cannot be translated
        to a format (format 1) that does not require a PAN for generation. For information about valid keys for this operation,
        see Understanding key attributes and Key types for specific data operations in the Amazon Web Services Payment Cryptography
        User Guide. Amazon Web Services Payment Cryptography currently supports ISO PIN block 4 translation for PIN block
        built using legacy PAN length. That is, PAN is the right most 12 digits excluding the check digits. Cross-account
        use: This operation can''t be used across different Amazon Web Services accounts. Related operations: GeneratePinData
        VerifyPinData'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                IncomingKeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                OutgoingKeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                IncomingTranslationAttributes:
                  $ref: '#/components/schemas/TranslationIsoFormats'
                OutgoingTranslationAttributes:
                  $ref: '#/components/schemas/TranslationIsoFormats'
                EncryptedPinBlock:
                  $ref: '#/components/schemas/HexEvenLengthBetween16And32'
                IncomingDukptAttributes:
                  $ref: '#/components/schemas/DukptDerivationAttributes'
                OutgoingDukptAttributes:
                  $ref: '#/components/schemas/DukptDerivationAttributes'
                IncomingWrappedKey:
                  $ref: '#/components/schemas/WrappedKey'
                OutgoingWrappedKey:
                  $ref: '#/components/schemas/WrappedKey'
                IncomingAs2805Attributes:
                  $ref: '#/components/schemas/As2805PekDerivationAttributes'
              required:
              - IncomingKeyIdentifier
              - OutgoingKeyIdentifier
              - IncomingTranslationAttributes
              - OutgoingTranslationAttributes
              - EncryptedPinBlock
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatePinDataOutput'
      x-stackql-resource: translate_pin_data
      x-stackql-method: translate_pin_data
      x-stackql-verb: EXEC
  /cryptogram/verify:
    post:
      operationId: VerifyAuthRequestCryptogram
      description: 'Verifies Authorization Request Cryptogram (ARQC) for a EMV chip payment card authorization. For more information,
        see Verify auth request cryptogram in the Amazon Web Services Payment Cryptography User Guide. ARQC generation is
        done outside of Amazon Web Services Payment Cryptography and is typically generated on a point of sale terminal for
        an EMV chip card to obtain payment authorization during transaction time. For ARQC verification, you must first import
        the ARQC generated outside of Amazon Web Services Payment Cryptography by calling ImportKey. This operation uses the
        imported ARQC and an major encryption key (DUKPT) created by calling CreateKey to either provide a boolean ARQC verification
        result or provide an APRC (Authorization Response Cryptogram) response using Method 1 or Method 2. The ARPC_METHOD_1
        uses AuthResponseCode to generate ARPC and ARPC_METHOD_2 uses CardStatusUpdate to generate ARPC. For information about
        valid keys for this operation, see Understanding key attributes and Key types for specific data operations in the
        Amazon Web Services Payment Cryptography User Guide. Cross-account use: This operation can''t be used across different
        Amazon Web Services accounts. Related operations: VerifyCardValidationData VerifyPinData'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                KeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                TransactionData:
                  $ref: '#/components/schemas/TransactionDataType'
                AuthRequestCryptogram:
                  $ref: '#/components/schemas/AuthRequestCryptogramType'
                MajorKeyDerivationMode:
                  $ref: '#/components/schemas/MajorKeyDerivationMode'
                SessionKeyDerivationAttributes:
                  $ref: '#/components/schemas/SessionKeyDerivation'
                AuthResponseAttributes:
                  $ref: '#/components/schemas/CryptogramAuthResponse'
              required:
              - KeyIdentifier
              - TransactionData
              - AuthRequestCryptogram
              - MajorKeyDerivationMode
              - SessionKeyDerivationAttributes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyAuthRequestCryptogramOutput'
      x-stackql-resource: auth_request_cryptogram
      x-stackql-method: verify_auth_request_cryptogram
      x-stackql-verb: EXEC
  /cardvalidationdata/verify:
    post:
      operationId: VerifyCardValidationData
      description: 'Verifies card-related validation data using algorithms such as Card Verification Values (CVV/CVV2), Dynamic
        Card Verification Values (dCVV/dCVV2) and Card Security Codes (CSC). For more information, see Verify card data in
        the Amazon Web Services Payment Cryptography User Guide. This operation validates the CVV or CSC codes that is printed
        on a payment credit or debit card during card payment transaction. The input values are typically provided as part
        of an inbound transaction to an issuer or supporting platform partner. Amazon Web Services Payment Cryptography uses
        CVV or CSC, PAN (Primary Account Number) and expiration date of the card to check its validity during transaction
        processing. In this operation, the CVK (Card Verification Key) encryption key for use with card data verification
        is same as the one in used for GenerateCardValidationData. For information about valid keys for this operation, see
        Understanding key attributes and Key types for specific data operations in the Amazon Web Services Payment Cryptography
        User Guide. Cross-account use: This operation can''t be used across different Amazon Web Services accounts. Related
        operations: GenerateCardValidationData VerifyAuthRequestCryptogram VerifyPinData'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                KeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                PrimaryAccountNumber:
                  $ref: '#/components/schemas/PrimaryAccountNumberType'
                VerificationAttributes:
                  $ref: '#/components/schemas/CardVerificationAttributes'
                ValidationData:
                  $ref: '#/components/schemas/ValidationDataType'
              required:
              - KeyIdentifier
              - PrimaryAccountNumber
              - VerificationAttributes
              - ValidationData
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyCardValidationDataOutput'
      x-stackql-resource: card_validation_data
      x-stackql-method: verify_card_validation_data
      x-stackql-verb: EXEC
  /mac/verify:
    post:
      operationId: VerifyMac
      description: 'Verifies a Message Authentication Code (MAC). You can use this operation to verify MAC for message data
        authentication such as . In this operation, you must use the same message data, secret encryption key and MAC algorithm
        that was used to generate MAC. You can use this operation to verify a DUPKT, CMAC, HMAC or EMV MAC by setting generation
        attributes and algorithm to the associated values. For information about valid keys for this operation, see Understanding
        key attributes and Key types for specific data operations in the Amazon Web Services Payment Cryptography User Guide.
        Cross-account use: This operation can''t be used across different Amazon Web Services accounts. Related operations:
        GenerateMac'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                KeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                MessageData:
                  $ref: '#/components/schemas/MessageDataType'
                Mac:
                  $ref: '#/components/schemas/MacType'
                VerificationAttributes:
                  $ref: '#/components/schemas/MacAttributes'
                MacLength:
                  $ref: '#/components/schemas/IntegerRangeBetween4And16'
              required:
              - KeyIdentifier
              - MessageData
              - Mac
              - VerificationAttributes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyMacOutput'
      x-stackql-resource: mac
      x-stackql-method: verify_mac
      x-stackql-verb: EXEC
  /pindata/verify:
    post:
      operationId: VerifyPinData
      description: 'Verifies pin-related data such as PIN and PIN Offset using algorithms including VISA PVV and IBM3624.
        For more information, see Verify PIN data in the Amazon Web Services Payment Cryptography User Guide. This operation
        verifies PIN data for user payment card. A card holder PIN data is never transmitted in clear to or from Amazon Web
        Services Payment Cryptography. This operation uses PIN Verification Key (PVK) for PIN or PIN Offset generation and
        then encrypts it using PIN Encryption Key (PEK) to create an EncryptedPinBlock for transmission from Amazon Web Services
        Payment Cryptography. For information about valid keys for this operation, see Understanding key attributes and Key
        types for specific data operations in the Amazon Web Services Payment Cryptography User Guide. Cross-account use:
        This operation can''t be used across different Amazon Web Services accounts. Related operations: GeneratePinData TranslatePinData'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                VerificationKeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                EncryptionKeyIdentifier:
                  $ref: '#/components/schemas/KeyArnOrKeyAliasType'
                VerificationAttributes:
                  $ref: '#/components/schemas/PinVerificationAttributes'
                EncryptedPinBlock:
                  $ref: '#/components/schemas/EncryptedPinBlockType'
                PrimaryAccountNumber:
                  $ref: '#/components/schemas/PrimaryAccountNumberType'
                PinBlockFormat:
                  $ref: '#/components/schemas/PinBlockFormatForPinData'
                PinDataLength:
                  $ref: '#/components/schemas/IntegerRangeBetween4And12'
                DukptAttributes:
                  $ref: '#/components/schemas/DukptAttributes'
                EncryptionWrappedKey:
                  $ref: '#/components/schemas/WrappedKey'
              required:
              - VerificationKeyIdentifier
              - EncryptionKeyIdentifier
              - VerificationAttributes
              - EncryptedPinBlock
              - PinBlockFormat
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPinDataOutput'
      x-stackql-resource: pin_data
      x-stackql-method: verify_pin_data
      x-stackql-verb: EXEC
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    KeyArnOrKeyAliasType:
      type: string
      minLength: 7
      maxLength: 322
      pattern: arn:aws:payment-cryptography:[a-z]{2}-[a-z]{1,16}-[0-9]+:[0-9]{12}:(key/[0-9a-zA-Z]{16,64}|alias/[a-zA-Z0-9/_-]+)$|^alias/[a-zA-Z0-9/_-]+
    CipherTextType:
      type: string
      minLength: 2
      maxLength: 4224
      pattern: (?:[0-9a-fA-F][0-9a-fA-F])+
    EncryptionDecryptionAttributes:
      description: Parameters that are required to perform encryption and decryption operations.
      type: object
      properties:
        Symmetric:
          $ref: '#/components/schemas/SymmetricEncryptionAttributes'
          description: Parameters that are required to perform encryption and decryption using symmetric keys.
        Asymmetric:
          $ref: '#/components/schemas/AsymmetricEncryptionAttributes'
        Dukpt:
          $ref: '#/components/schemas/DukptEncryptionAttributes'
        Emv:
          $ref: '#/components/schemas/EmvEncryptionAttributes'
          description: Parameters for plaintext encryption using EMV keys.
    SymmetricEncryptionAttributes:
      description: Parameters requried to encrypt plaintext data using symmetric keys.
      type: object
      properties:
        Mode:
          $ref: '#/components/schemas/EncryptionMode'
          description: The block cipher method to use for encryption.
        InitializationVector:
          $ref: '#/components/schemas/InitializationVectorType'
          description: An input used to provide the intial state. If no value is provided, Amazon Web Services Payment Cryptography
            defaults it to zero.
        PaddingType:
          $ref: '#/components/schemas/PaddingType'
          description: The padding to be included with the data.
      required:
      - Mode
    EncryptionMode:
      type: string
      enum:
      - ECB
      - CBC
      - CFB
      - CFB1
      - CFB8
      - CFB64
      - CFB128
      - OFB
    InitializationVectorType:
      type: string
      minLength: 16
      maxLength: 32
      pattern: (?:[0-9a-fA-F]{16}|[0-9a-fA-F]{32})
    PaddingType:
      type: string
      enum:
      - PKCS1
      - OAEP_SHA1
      - OAEP_SHA256
      - OAEP_SHA512
    AsymmetricEncryptionAttributes:
      description: Parameters for plaintext encryption using asymmetric keys.
      type: object
      properties:
        PaddingType:
          $ref: '#/components/schemas/PaddingType'
          description: The padding to be included with the data.
    DukptEncryptionAttributes:
      description: Parameters that are required to encrypt plaintext data using DUKPT.
      type: object
      properties:
        KeySerialNumber:
          $ref: '#/components/schemas/HexLength16Or20Or24'
          description: The unique identifier known as Key Serial Number (KSN) that comes from an encrypting device using DUKPT
            encryption method. The KSN is derived from the encrypting device unique identifier and an internal transaction
            counter.
        Mode:
          $ref: '#/components/schemas/DukptEncryptionMode'
          description: The block cipher method to use for encryption. The default is CBC.
        DukptKeyDerivationType:
          $ref: '#/components/schemas/DukptDerivationType'
          description: The key type encrypted using DUKPT from a Base Derivation Key (BDK) and Key Serial Number (KSN). This
            must be less than or equal to the strength of the BDK. For example, you can't use AES_128 as a derivation type
            for a BDK of AES_128 or TDES_2KEY
        DukptKeyVariant:
          $ref: '#/components/schemas/DukptKeyVariant'
          description: The type of use of DUKPT, which can be incoming data decryption, outgoing data encryption, or both.
        InitializationVector:
          $ref: '#/components/schemas/InitializationVectorType'
          description: An input used to provide the intial state. If no value is provided, Amazon Web Services Payment Cryptography
            defaults it to zero.
      required:
      - KeySerialNumber
    HexLength16Or20Or24:
      type: string
      minLength: 16
      maxLength: 24
      pattern: (?:[0-9a-fA-F]{16}|[0-9a-fA-F]{20}|[0-9a-fA-F]{24})
    DukptEncryptionMode:
      type: string
      enum:
      - ECB
      - CBC
    DukptDerivationType:
      type: string
      enum:
      - TDES_2KEY
      - TDES_3KEY
      - AES_128
      - AES_192
      - AES_256
    DukptKeyVariant:
      type: string
      enum:
      - BIDIRECTIONAL
      - REQUEST
      - RESPONSE
    EmvEncryptionAttributes:
      description: Parameters for plaintext encryption using EMV keys.
      type: object
      properties:
        MajorKeyDerivationMode:
          $ref: '#/components/schemas/EmvMajorKeyDerivationMode'
          description: The EMV derivation mode to use for ICC master key derivation as per EMV version 4.3 book 2.
        PrimaryAccountNumber:
          $ref: '#/components/schemas/PrimaryAccountNumberType'
          description: The Primary Account Number (PAN), a unique identifier for a payment credit or debit card and associates
            the card to a specific account holder.
        PanSequenceNumber:
          $ref: '#/components/schemas/NumberLengthEquals2'
          description: A number that identifies and differentiates payment cards with the same Primary Account Number (PAN).
            Typically 00 is used, if no value is provided by the terminal.
        SessionDerivationData:
          $ref: '#/components/schemas/SessionDerivationDataType'
          description: The derivation value used to derive the ICC session key. It is typically the application transaction
            counter value padded with zeros or previous ARQC value padded with zeros as per EMV version 4.3 book 2.
        Mode:
          $ref: '#/components/schemas/EmvEncryptionMode'
          description: The block cipher method to use for encryption.
        InitializationVector:
          $ref: '#/components/schemas/InitializationVectorType'
          description: An input used to provide the intial state. If no value is provided, Amazon Web Services Payment Cryptography
            defaults it to zero.
      required:
      - MajorKeyDerivationMode
      - PrimaryAccountNumber
      - PanSequenceNumber
      - SessionDerivationData
    EmvMajorKeyDerivationMode:
      type: string
      enum:
      - EMV_OPTION_A
      - EMV_OPTION_B
    PrimaryAccountNumberType:
      type: string
      minLength: 12
      maxLength: 19
      pattern: '[0-9]+'
    NumberLengthEquals2:
      type: string
      minLength: 2
      maxLength: 2
      pattern: '[0-9]+'
    SessionDerivationDataType:
      type: string
      minLength: 16
      maxLength: 16
      pattern: '[0-9a-fA-F]+'
    EmvEncryptionMode:
      type: string
      enum:
      - ECB
      - CBC
    WrappedKey:
      description: Parameter information of a WrappedKeyBlock for encryption key exchange.
      type: object
      properties:
        WrappedKeyMaterial:
          $ref: '#/components/schemas/WrappedKeyMaterial'
          description: Parameter information of a WrappedKeyBlock for encryption key exchange.
        KeyCheckValueAlgorithm:
          $ref: '#/components/schemas/KeyCheckValueAlgorithm'
          description: The algorithm that Amazon Web Services Payment Cryptography uses to calculate the key check value (KCV).
            It is used to validate the key integrity. For TDES keys, the KCV is computed by encrypting 8 bytes, each with
            value of zero, with the key to be checked and retaining the 3 highest order bytes of the encrypted result. For
            AES keys, the KCV is computed using a CMAC algorithm where the input data is 16 bytes of zero and retaining the
            3 highest order bytes of the encrypted result.
      required:
      - WrappedKeyMaterial
    WrappedKeyMaterial:
      description: Parameter information of a WrappedKeyBlock for encryption key exchange.
      type: object
      properties:
        Tr31KeyBlock:
          $ref: '#/components/schemas/Tr31WrappedKeyBlock'
          description: The TR-31 wrapped key block.
        DiffieHellmanSymmetricKey:
          $ref: '#/components/schemas/EcdhDerivationAttributes'
          description: The parameter information for deriving a ECDH shared key.
    Tr31WrappedKeyBlock:
      type: string
      minLength: 56
      maxLength: 9984
      pattern: '[0-9a-zA-Z]+'
    EcdhDerivationAttributes:
      description: Parameters required to establish ECDH based key exchange.
      type: object
      properties:
        CertificateAuthorityPublicKeyIdentifier:
          $ref: '#/components/schemas/KeyArnOrKeyAliasType'
          description: The keyArn of the certificate that signed the client's PublicKeyCertificate.
        PublicKeyCertificate:
          $ref: '#/components/schemas/CertificateType'
          description: The client's public key certificate in PEM format (base64 encoded) to use for ECDH key derivation.
        KeyAlgorithm:
          $ref: '#/components/schemas/SymmetricKeyAlgorithm'
          description: The key algorithm of the derived ECDH key.
        KeyDerivationFunction:
          $ref: '#/components/schemas/KeyDerivationFunction'
          description: The key derivation function to use for deriving a key using ECDH.
        KeyDerivationHashAlgorithm:
          $ref: '#/components/schemas/KeyDerivationHashAlgorithm'
          description: The hash type to use for deriving a key using ECDH.
        SharedInformation:
          $ref: '#/components/schemas/SharedInformation'
          description: A byte string containing information that binds the ECDH derived key to the two parties involved or
            to the context of the key. It may include details like identities of the two parties deriving the key, context
            of the operation, session IDs, and optionally a nonce. It must not contain zero bytes, and re-using shared information
            for multiple ECDH key derivations is not recommended.
      required:
      - CertificateAuthorityPublicKeyIdentifier
      - PublicKeyCertificate
      - KeyAlgorithm
      - KeyDerivationFunction
      - KeyDerivationHashAlgorithm
      - SharedInformation
    CertificateType:
      type: string
      minLength: 1
      maxLength: 32768
      pattern: '[^\[;\]<>]+'
    SymmetricKeyAlgorithm:
      type: string
      enum:
      - TDES_2KEY
      - TDES_3KEY
      - AES_128
      - AES_192
      - AES_256
      - HMAC_SHA256
      - HMAC_SHA384
      - HMAC_SHA512
      - HMAC_SHA224
    KeyDerivationFunction:
      type: string
      enum:
      - NIST_SP800
      - ANSI_X963
    KeyDerivationHashAlgorithm:
      type: string
      enum:
      - SHA_256
      - SHA_384
      - SHA_512
    SharedInformation:
      type: string
      minLength: 2
      maxLength: 2048
      pattern: (?:[0-9a-fA-F][0-9a-fA-F])+
    KeyCheckValueAlgorithm:
      type: string
      enum:
      - CMAC
      - ANSI_X9_24
      - HMAC
      - SHA_1
    DecryptDataOutput:
      type: object
      properties:
        KeyArn:
          $ref: '#/components/schemas/KeyArn'
          description: The keyARN of the encryption key that Amazon Web Services Payment Cryptography uses for ciphertext
            decryption.
        KeyCheckValue:
          $ref: '#/components/schemas/KeyCheckValue'
          description: The key check value (KCV) of the encryption key. The KCV is used to check if all parties holding a
            given key have the same key or to detect that a key has changed. Amazon Web Services Payment Cryptography computes
            the KCV according to the CMAC specification.
        PlainText:
          $ref: '#/components/schemas/PlainTextOutputType'
          description: The decrypted plaintext data in hexBinary format.
      required:
      - KeyArn
      - KeyCheckValue
      - PlainText
    KeyArn:
      type: string
      minLength: 70
      maxLength: 150
      pattern: arn:aws:payment-cryptography:[a-z]{2}-[a-z]{1,16}-[0-9]+:[0-9]{12}:key/[0-9a-zA-Z]{16,64}
    KeyCheckValue:
      type: string
      minLength: 4
      maxLength: 16
      pattern: '[0-9a-fA-F]+'
    PlainTextOutputType:
      type: string
      minLength: 2
      maxLength: 4224
      pattern: (?:[0-9a-fA-F][0-9a-fA-F])+
    PlainTextType:
      type: string
      minLength: 2
      maxLength: 4096
      pattern: (?:[0-9a-fA-F][0-9a-fA-F])+
    EncryptDataOutput:
      type: object
      properties:
        KeyArn:
          $ref: '#/components/schemas/KeyArn'
          description: The keyARN of the encryption key that Amazon Web Services Payment Cryptography uses for plaintext encryption.
        KeyCheckValue:
          $ref: '#/components/schemas/KeyCheckValue'
          description: The key check value (KCV) of the encryption key. The KCV is used to check if all parties holding a
            given key have the same key or to detect that a key has changed. Amazon Web Services Payment Cryptography computes
            the KCV according to the CMAC specification.
        CipherText:
          $ref: '#/components/schemas/CipherTextType'
          description: The encrypted ciphertext.
      required:
      - KeyArn
      - CipherText
    As2805KekValidationType:
      description: Parameter information for generating a random key for KEK validation to perform node-to-node initialization.
      type: object
      properties:
        KekValidationRequest:
          $ref: '#/components/schemas/KekValidationRequest'
          description: Parameter information for generating a KEK validation request during node-to-node initialization.
        KekValidationResponse:
          $ref: '#/components/schemas/KekValidationResponse'
          description: Parameter information for generating a KEK validation response during node-to-node initialization.
    KekValidationRequest:
      description: Parameter information for generating a KEK validation request during node-to-node initialization.
      type: object
      properties:
        DeriveKeyAlgorithm:
          $ref: '#/components/schemas/SymmetricKeyAlgorithm'
          description: The key derivation algorithm to use for generating a KEK validation request.
      required:
      - DeriveKeyAlgorithm
    KekValidationResponse:
      description: Parameter information for generating a KEK validation response during node-to-node initialization.
      type: object
      properties:
        RandomKeySend:
          $ref: '#/components/schemas/As2805RandomKeyMaterial'
          description: The random key for generating a KEK validation response.
      required:
      - RandomKeySend
    As2805RandomKeyMaterial:
      type: string
      minLength: 32
      maxLength: 48
      pattern: (?:[0-9a-fA-F]{32}|[0-9a-fA-F]{48})
    RandomKeySendVariantMask:
      type: string
      enum:
      - VARIANT_MASK_82C0
      - VARIANT_MASK_82
    GenerateAs2805KekValidationOutput:
      type: object
      properties:
        KeyArn:
          $ref: '#/components/schemas/KeyArn'
          description: The keyARN of sending KEK that Amazon Web Services Payment Cryptography validates for node-to-node
            initialization
        KeyCheckValue:
          $ref: '#/components/schemas/KeyCheckValue'
          description: The key check value (KCV) of the sending KEK that Amazon Web Services Payment Cryptography validates
            for node-to-node initialization.
        RandomKeySend:
          $ref: '#/components/schemas/As2805RandomKeyMaterial'
          description: The random key generated for sending KEK validation.
        RandomKeyReceive:
          $ref: '#/components/schemas/As2805RandomKeyMaterial'
          description: The random key generated for receiving KEK validation. The initiating node sends this key to its partner
            node for validation.
      required:
      - KeyArn
      - KeyCheckValue
      - RandomKeySend
      - RandomKeyReceive
    CardGenerationAttributes:
      description: Card data parameters that are required to generate Card Verification Values (CVV/CVV2), Dynamic Card Verification
        Values (dCVV/dCVV2), or Card Security Codes (CSC).
      type: object
      properties:
        AmexCardSecurityCodeVersion1:
          $ref: '#/components/schemas/AmexCardSecurityCodeVersion1'
        AmexCardSecurityCodeVersion2:
          $ref: '#/components/schemas/AmexCardSecurityCodeVersion2'
          description: Card data parameters that are required to generate a Card Security Code (CSC2) for an AMEX payment
            card.
        CardVerificationValue1:
          $ref: '#/components/schemas/CardVerificationValue1'
          description: Card data parameters that are required to generate Card Verification Value (CVV) for the payment card.
        CardVerificationValue2:
          $ref: '#/components/schemas/CardVerificationValue2'
          description: Card data parameters that are required to generate Card Verification Value (CVV2) for the payment card.
        CardHolderVerificationValue:
          $ref: '#/components/schemas/CardHolderVerificationValue'
          description: Card data parameters that are required to generate a cardholder verification value for the payment
            card.
        DynamicCardVerificationCode:
          $ref: '#/components/schemas/DynamicCardVerificationCode'
          description: Card data parameters that are required to generate CDynamic Card Verification Code (dCVC) for the payment
            card.
        DynamicCardVerificationValue:
          $ref: '#/components/schemas/DynamicCardVerificationValue'
          description: Card data parameters that are required to generate CDynamic Card Verification Value (dCVV) for the
            payment card.
    AmexCardSecurityCodeVersion1:
      description: Card data parameters that are required to generate a Card Security Code (CSC2) for an AMEX payment card.
      type: object
      properties:
        CardExpiryDate:
          $ref: '#/components/schemas/CardExpiryDateType'
          description: The expiry date of a payment card.
      required:
      - CardExpiryDate
    CardExpiryDateType:
      type: string
      minLength: 4
      maxLength: 4
      pattern: '[0-9]+'
    AmexCardSecurityCodeVersion2:
      description: Card data parameters that are required to generate a Card Security Code (CSC2) for an AMEX payment card.
      type: object
      properties:
        CardExpiryDate:
          $ref: '#/components/schemas/CardExpiryDateType'
          description: The expiry date of a payment card.
        ServiceCode:
          $ref: '#/components/schemas/ServiceCodeType'
          description: The service code of the AMEX payment card. This is different from the Card Security Code (CSC).
      required:
      - CardExpiryDate
      - ServiceCode
    ServiceCodeType:
      type: string
      minLength: 3
      maxLength: 3
      pattern: '[0-9]+'
    CardVerificationValue1:
      description: Card data parameters that are required to verify CVV (Card Verification Value) for the payment card.
      type: object
      properties:
        CardExpiryDate:
          $ref: '#/components/schemas/CardExpiryDateType'
          description: The expiry date of a payment card.
        ServiceCode:
          $ref: '#/components/schemas/ServiceCodeType'
          description: The service code of the payment card. This is different from Card Security Code (CSC).
      required:
      - CardExpiryDate
      - ServiceCode
    CardVerificationValue2:
      description: Card data parameters that are required to verify Card Verification Value (CVV2) for the payment card.
      type: object
      properties:
        CardExpiryDate:
          $ref: '#/components/schemas/CardExpiryDateType'
          description: The expiry date of a payment card.
      required:
      - CardExpiryDate
    CardHolderVerificationValue:
      description: Card data parameters that are required to generate a cardholder verification value for the payment card.
      type: object
      properties:
        UnpredictableNumber:
          $ref: '#/components/schemas/HexLengthBetween2And8'
          description: A random number generated by the issuer.
        PanSequenceNumber:
          $ref: '#/components/schemas/NumberLengthEquals2'
          description: A number that identifies and differentiates payment cards with the same Primary Account Number (PAN).
        ApplicationTransactionCounter:
          $ref: '#/components/schemas/HexLengthBetween2And4'
          description: The transaction counter value that comes from a point of sale terminal.
      required:
      - UnpredictableNumber
      - PanSequenceNumber
      - ApplicationTransactionCounter
    HexLengthBetween2And8:
      type: string
