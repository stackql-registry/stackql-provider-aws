    DynamicCardVerificationCode:
      description: Parameters that are required to generate or verify Dynamic Card Verification Value (dCVV).
      type: object
      properties:
        UnpredictableNumber:
          $ref: '#/components/schemas/HexLengthBetween2And8'
          description: A random number generated by the issuer.
        PanSequenceNumber:
          $ref: '#/components/schemas/NumberLengthEquals2'
          description: A number that identifies and differentiates payment cards with the same Primary Account Number (PAN).
        ApplicationTransactionCounter:
          $ref: '#/components/schemas/HexLengthBetween2And4'
          description: The transaction counter value that comes from the terminal.
        TrackData:
          $ref: '#/components/schemas/TrackDataType'
          description: The data on the two tracks of magnetic cards used for financial transactions. This includes the cardholder
            name, PAN, expiration date, bank ID (BIN) and several other numbers the issuing bank uses to validate the data
            received.
      required:
      - UnpredictableNumber
      - PanSequenceNumber
      - ApplicationTransactionCounter
      - TrackData
    TrackDataType:
      type: string
      minLength: 2
      maxLength: 160
      pattern: '[0-9a-fA-F]+'
    DynamicCardVerificationValue:
      description: Parameters that are required to generate or verify Dynamic Card Verification Value (dCVV).
      type: object
      properties:
        PanSequenceNumber:
          $ref: '#/components/schemas/NumberLengthEquals2'
          description: A number that identifies and differentiates payment cards with the same Primary Account Number (PAN).
        CardExpiryDate:
          $ref: '#/components/schemas/CardExpiryDateType'
          description: The expiry date of a payment card.
        ServiceCode:
          $ref: '#/components/schemas/ServiceCodeType'
          description: The service code of the payment card. This is different from Card Security Code (CSC).
        ApplicationTransactionCounter:
          $ref: '#/components/schemas/HexLengthBetween2And4'
          description: The transaction counter value that comes from the terminal.
      required:
      - PanSequenceNumber
      - CardExpiryDate
      - ServiceCode
      - ApplicationTransactionCounter
    IntegerRangeBetween3And5Type:
      type: integer
      minimum: 3
      maximum: 5
    GenerateCardValidationDataOutput:
      type: object
      properties:
        KeyArn:
          $ref: '#/components/schemas/KeyArn'
          description: The keyARN of the CVK encryption key that Amazon Web Services Payment Cryptography uses to generate
            CVV or CSC.
        KeyCheckValue:
          $ref: '#/components/schemas/KeyCheckValue'
          description: The key check value (KCV) of the encryption key. The KCV is used to check if all parties holding a
            given key have the same key or to detect that a key has changed. Amazon Web Services Payment Cryptography computes
            the KCV according to the CMAC specification.
        ValidationData:
          $ref: '#/components/schemas/ValidationDataType'
          description: The CVV or CSC value that Amazon Web Services Payment Cryptography generates for the card.
      required:
      - KeyArn
      - KeyCheckValue
      - ValidationData
    ValidationDataType:
      type: string
      minLength: 3
      maxLength: 5
      pattern: '[0-9]+'
    MessageDataType:
      type: string
      minLength: 2
      maxLength: 8192
      pattern: (?:[0-9a-fA-F][0-9a-fA-F])+
    MacAttributes:
      description: Parameters that are required for DUKPT, HMAC, or EMV MAC generation or verification.
      type: object
      properties:
        Algorithm:
          $ref: '#/components/schemas/MacAlgorithm'
          description: The encryption algorithm for MAC generation or verification.
        EmvMac:
          $ref: '#/components/schemas/MacAlgorithmEmv'
          description: Parameters that are required for MAC generation or verification using EMV MAC algorithm.
        DukptIso9797Algorithm1:
          $ref: '#/components/schemas/MacAlgorithmDukpt'
          description: Parameters that are required for MAC generation or verification using DUKPT ISO 9797 algorithm1.
        DukptIso9797Algorithm3:
          $ref: '#/components/schemas/MacAlgorithmDukpt'
          description: Parameters that are required for MAC generation or verification using DUKPT ISO 9797 algorithm3.
        DukptCmac:
          $ref: '#/components/schemas/MacAlgorithmDukpt'
          description: Parameters that are required for MAC generation or verification using DUKPT CMAC algorithm.
    MacAlgorithm:
      type: string
      enum:
      - ISO9797_ALGORITHM1
      - ISO9797_ALGORITHM3
      - CMAC
      - HMAC
      - HMAC_SHA224
      - HMAC_SHA256
      - HMAC_SHA384
      - HMAC_SHA512
      - AS2805_4_1
    MacAlgorithmEmv:
      description: Parameters that are required for EMV MAC generation and verification.
      type: object
      properties:
        MajorKeyDerivationMode:
          $ref: '#/components/schemas/MajorKeyDerivationMode'
          description: The method to use when deriving the master key for EMV MAC generation or verification.
        PrimaryAccountNumber:
          $ref: '#/components/schemas/PrimaryAccountNumberType'
          description: The Primary Account Number (PAN), a unique identifier for a payment credit or debit card and associates
            the card to a specific account holder.
        PanSequenceNumber:
          $ref: '#/components/schemas/NumberLengthEquals2'
          description: A number that identifies and differentiates payment cards with the same Primary Account Number (PAN).
        SessionKeyDerivationMode:
          $ref: '#/components/schemas/SessionKeyDerivationMode'
          description: The method of deriving a session key for EMV MAC generation or verification.
        SessionKeyDerivationValue:
          $ref: '#/components/schemas/SessionKeyDerivationValue'
          description: Parameters that are required to generate session key for EMV generation and verification.
      required:
      - MajorKeyDerivationMode
      - PrimaryAccountNumber
      - PanSequenceNumber
      - SessionKeyDerivationMode
      - SessionKeyDerivationValue
    MajorKeyDerivationMode:
      type: string
      enum:
      - EMV_OPTION_A
      - EMV_OPTION_B
    SessionKeyDerivationMode:
      type: string
      enum:
      - EMV_COMMON_SESSION_KEY
      - EMV2000
      - AMEX
      - MASTERCARD_SESSION_KEY
      - VISA
    SessionKeyDerivationValue:
      description: Parameters to derive session key value using a MAC EMV algorithm.
      type: object
      properties:
        ApplicationCryptogram:
          $ref: '#/components/schemas/ApplicationCryptogramType'
          description: The cryptogram provided by the terminal during transaction processing.
        ApplicationTransactionCounter:
          $ref: '#/components/schemas/HexLengthEquals4'
          description: The transaction counter that is provided by the terminal during transaction processing.
    ApplicationCryptogramType:
      type: string
      minLength: 16
      maxLength: 16
      pattern: '[0-9a-fA-F]+'
    HexLengthEquals4:
      type: string
      minLength: 4
      maxLength: 4
      pattern: '[0-9a-fA-F]+'
    MacAlgorithmDukpt:
      description: Parameters required for DUKPT MAC generation and verification.
      type: object
      properties:
        KeySerialNumber:
          $ref: '#/components/schemas/HexLength16Or20Or24'
          description: The unique identifier known as Key Serial Number (KSN) that comes from an encrypting device using DUKPT
            encryption method. The KSN is derived from the encrypting device unique identifier and an internal transaction
            counter.
        DukptKeyVariant:
          $ref: '#/components/schemas/DukptKeyVariant'
          description: The type of use of DUKPT, which can be MAC generation, MAC verification, or both.
        DukptDerivationType:
          $ref: '#/components/schemas/DukptDerivationType'
          description: The key type derived using DUKPT from a Base Derivation Key (BDK) and Key Serial Number (KSN). This
            must be less than or equal to the strength of the BDK. For example, you can't use AES_128 as a derivation type
            for a BDK of AES_128 or TDES_2KEY.
      required:
      - KeySerialNumber
      - DukptKeyVariant
    IntegerRangeBetween4And16:
      type: integer
      minimum: 4
      maximum: 16
    GenerateMacOutput:
      type: object
      properties:
        KeyArn:
          $ref: '#/components/schemas/KeyArn'
          description: The keyARN of the encryption key that Amazon Web Services Payment Cryptography uses for MAC generation.
        KeyCheckValue:
          $ref: '#/components/schemas/KeyCheckValue'
          description: The key check value (KCV) of the encryption key. The KCV is used to check if all parties holding a
            given key have the same key or to detect that a key has changed. Amazon Web Services Payment Cryptography computes
            the KCV according to the CMAC specification.
        Mac:
          $ref: '#/components/schemas/MacOutputType'
          description: The MAC cryptogram generated within Amazon Web Services Payment Cryptography.
      required:
      - KeyArn
      - KeyCheckValue
      - Mac
