          $ref: '#/components/schemas/KeyArnOrKeyAliasType'
          description: The keyARN of the asymmetric ECC key pair.
        CertificateAuthorityPublicKeyIdentifier:
          $ref: '#/components/schemas/KeyArnOrKeyAliasType'
          description: The keyArn of the certificate that signed the client's PublicKeyCertificate.
        PublicKeyCertificate:
          $ref: '#/components/schemas/CertificateType'
          description: The client's public key certificate in PEM format (base64 encoded) to use for ECDH key derivation.
        DeriveKeyAlgorithm:
          $ref: '#/components/schemas/SymmetricKeyAlgorithm'
          description: The key algorithm of the derived ECDH key.
        KeyDerivationFunction:
          $ref: '#/components/schemas/KeyDerivationFunction'
          description: The key derivation function to use for deriving a key using ECDH.
        KeyDerivationHashAlgorithm:
          $ref: '#/components/schemas/KeyDerivationHashAlgorithm'
          description: The hash type to use for deriving a key using ECDH.
        DerivationData:
          $ref: '#/components/schemas/DiffieHellmanDerivationData'
        WrappedKeyBlock:
          $ref: '#/components/schemas/Tr31WrappedKeyBlock'
          description: The WrappedKeyBlock containing the transaction key wrapped using an ECDH dervied key.
      required:
      - PrivateKeyIdentifier
      - CertificateAuthorityPublicKeyIdentifier
      - PublicKeyCertificate
      - DeriveKeyAlgorithm
      - KeyDerivationFunction
      - KeyDerivationHashAlgorithm
      - DerivationData
      - WrappedKeyBlock
    DiffieHellmanDerivationData:
      description: The shared information used when deriving a key using ECDH.
      type: object
      properties:
        SharedInformation:
          $ref: '#/components/schemas/SharedInformation'
          description: A string containing information that binds the ECDH derived key to the two parties involved or to the
            context of the key. It may include details like identities of the two parties deriving the key, context of the
            operation, session IDs, and optionally a nonce. It must not contain zero bytes. It is not recommended to reuse
            shared information for multiple ECDH key derivations, as it could result in derived key material being the same
            across different derivations.
