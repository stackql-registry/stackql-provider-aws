      maxLength: 1024
      pattern: (?:[0-9a-fA-F][0-9a-fA-F])+
    DerivationMethodAttributes:
      description: Parameters to derive the payment card specific confidentiality and integrity keys.
      type: object
      properties:
        EmvCommon:
          $ref: '#/components/schemas/EmvCommonAttributes'
          description: Parameters to derive the confidentiality and integrity keys for a payment card using Emv common derivation
