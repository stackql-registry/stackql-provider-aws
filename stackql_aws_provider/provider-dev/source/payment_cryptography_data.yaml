        KeyCheckValue:
          $ref: '#/components/schemas/KeyCheckValue'
          description: The key check value (KCV) of the key contained within the outgoing TR31WrappedKeyBlock. The KCV is
            used to check if all parties holding a given key have the same key or to detect that a key has changed. For more
            information on KCV, see KCV in the Amazon Web Services Payment Cryptography User Guide.
