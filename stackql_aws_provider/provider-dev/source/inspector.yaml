components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    AddRemoveAttributesFindingArnList:
      type: array
      items:
        $ref: '#/components/schemas/Arn'
    Arn:
      type: string
      minLength: 1
      maxLength: 300
    UserAttributeList:
      type: array
      items:
        $ref: '#/components/schemas/Attribute'
    Attribute:
      description: This data type is used as a request parameter in the AddAttributesToFindings and CreateAssessmentTemplate
        actions.
      type: object
      properties:
        key:
          $ref: '#/components/schemas/AttributeKey'
          description: The attribute key.
        value:
          $ref: '#/components/schemas/AttributeValue'
          description: The value assigned to the attribute key.
      required:
      - key
    AttributeKey:
      type: string
      minLength: 1
      maxLength: 128
    AttributeValue:
      type: string
      minLength: 1
      maxLength: 256
    AddAttributesToFindingsResponse:
      type: object
      properties:
        failedItems:
          type: object
          properties: {}
          description: Attribute details that cannot be described. An error code is provided for each failed item.
      required:
      - failedItems
    AssessmentTargetName:
      type: string
      minLength: 1
      maxLength: 140
    CreateAssessmentTargetResponse:
      type: object
      properties:
        assessmentTargetArn:
          $ref: '#/components/schemas/Arn'
          description: The ARN that specifies the assessment target that is created.
      required:
      - assessmentTargetArn
    AssessmentTemplateName:
      type: string
      minLength: 1
      maxLength: 140
    AssessmentRunDuration:
      type: integer
      minimum: 180
      maximum: 86400
    AssessmentTemplateRulesPackageArnList:
      type: array
      items:
        $ref: '#/components/schemas/Arn'
    CreateAssessmentTemplateResponse:
      type: object
      properties:
        assessmentTemplateArn:
          $ref: '#/components/schemas/Arn'
          description: The ARN that specifies the assessment template that is created.
      required:
      - assessmentTemplateArn
    CreateExclusionsPreviewResponse:
      type: object
      properties:
        previewToken:
          $ref: '#/components/schemas/UUID'
