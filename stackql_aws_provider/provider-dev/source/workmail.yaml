      description: Adds a new access control rule for the specified organization. The rule allows or denies access to the
        organization for the specified IPv4 addresses, access protocol actions, user IDs and impersonation IDs. Adding a new
        rule with the same name as an existing rule replaces the older rule.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.PutAccessControlRule
          default: WorkMailService.PutAccessControlRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Name:
                  $ref: '#/components/schemas/AccessControlRuleName'
                  description: The rule name.
                Effect:
                  $ref: '#/components/schemas/AccessControlRuleEffect'
                  description: The rule effect.
                Description:
                  $ref: '#/components/schemas/AccessControlRuleDescription'
                  description: The rule description.
                IpRanges:
                  $ref: '#/components/schemas/IpRangeList'
                  description: IPv4 CIDR ranges to include in the rule.
                NotIpRanges:
                  $ref: '#/components/schemas/IpRangeList'
                  description: IPv4 CIDR ranges to exclude from the rule.
                Actions:
                  $ref: '#/components/schemas/ActionsList'
                  description: Access protocol actions to include in the rule. Valid values include ActiveSync, AutoDiscover,
                    EWS, IMAP, SMTP, WindowsOutlook, and WebMail.
                NotActions:
                  $ref: '#/components/schemas/ActionsList'
                  description: Access protocol actions to exclude from the rule. Valid values include ActiveSync, AutoDiscover,
                    EWS, IMAP, SMTP, WindowsOutlook, and WebMail.
                UserIds:
                  $ref: '#/components/schemas/UserIdList'
                  description: User IDs to include in the rule.
                NotUserIds:
                  $ref: '#/components/schemas/UserIdList'
                  description: User IDs to exclude from the rule.
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The identifier of the organization.
                ImpersonationRoleIds:
                  $ref: '#/components/schemas/ImpersonationRoleIdList'
                  description: Impersonation role IDs to include in the rule.
                NotImpersonationRoleIds:
                  $ref: '#/components/schemas/ImpersonationRoleIdList'
                  description: Impersonation role IDs to exclude from the rule.
              required:
              - Name
              - Effect
              - Description
              - OrganizationId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutAccessControlRuleResponse'
      x-stackql-resource: access_control_rules
