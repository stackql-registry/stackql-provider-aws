openapi: 3.0.0
info:
  version: '2017-10-01'
  title: Amazon WorkMail
  description: Amazon WorkMail
  x-serviceName: workmail
  x-serviceAlias: workmail
  x-protocol: json
  x-apiVersion: '2017-10-01'
  x-endpointPrefix: workmail
  x-targetPrefix: WorkMailService
  x-jsonVersion: '1.1'
servers:
- url: https://workmail.{region}.amazonaws.com
  variables:
    region:
      default: us-east-1
      description: AWS region
  description: Regional endpoint for workmail
paths:
  /AssociateDelegateToResource:
    post:
      operationId: AssociateDelegateToResource
      description: Adds a member (user or group) to the resource's set of delegates.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.AssociateDelegateToResource
          default: WorkMailService.AssociateDelegateToResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The organization under which the resource exists.
                ResourceId:
                  $ref: '#/components/schemas/EntityIdentifier'
                  description: 'The resource for which members (users or groups) are associated. The identifier can accept
                    ResourceId, Resourcename, or email. The following identity formats are available: Resource ID: r-0123456789a0123456789b0123456789
                    Email address: resource@domain.tld Resource name: resource'
                EntityId:
                  $ref: '#/components/schemas/EntityIdentifier'
                  description: 'The member (user or group) to associate to the resource. The entity ID can accept UserId or
                    GroupID, Username or Groupname, or email. Entity: 12345678-1234-1234-1234-123456789012 or S-1-1-12-1234567890-123456789-123456789-1234
                    Email address: entity@domain.tld Entity: entity'
              required:
              - OrganizationId
              - ResourceId
              - EntityId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociateDelegateToResourceResponse'
      x-stackql-resource: delegate_to_resources
      x-stackql-method: associate_delegate_to_resource
      x-stackql-verb: UPDATE
  /AssociateMemberToGroup:
    post:
      operationId: AssociateMemberToGroup
      description: Adds a member (user or group) to the group's set.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.AssociateMemberToGroup
          default: WorkMailService.AssociateMemberToGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The organization under which the group exists.
                GroupId:
                  $ref: '#/components/schemas/EntityIdentifier'
                  description: 'The group to which the member (user or group) is associated. The identifier can accept GroupId,
                    Groupname, or email. The following identity formats are available: Group ID: 12345678-1234-1234-1234-123456789012
                    or S-1-1-12-1234567890-123456789-123456789-1234 Email address: group@domain.tld Group name: group'
                MemberId:
                  $ref: '#/components/schemas/EntityIdentifier'
                  description: 'The member (user or group) to associate to the group. The member ID can accept UserID or GroupId,
                    Username or Groupname, or email. Member: 12345678-1234-1234-1234-123456789012 or S-1-1-12-1234567890-123456789-123456789-1234
                    Email address: member@domain.tld Member name: member'
              required:
              - OrganizationId
              - GroupId
              - MemberId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociateMemberToGroupResponse'
      x-stackql-resource: member_to_groups
      x-stackql-method: associate_member_to_group
      x-stackql-verb: UPDATE
  /AssumeImpersonationRole:
    post:
      operationId: AssumeImpersonationRole
      description: Assumes an impersonation role for the given WorkMail organization. This method returns an authentication
        token you can use to make impersonated calls.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.AssumeImpersonationRole
          default: WorkMailService.AssumeImpersonationRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The WorkMail organization under which the impersonation role will be assumed.
                ImpersonationRoleId:
                  $ref: '#/components/schemas/ImpersonationRoleId'
                  description: The impersonation role ID to assume.
              required:
              - OrganizationId
              - ImpersonationRoleId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssumeImpersonationRoleResponse'
      x-stackql-resource: assume_impersonation_role
      x-stackql-method: assume_impersonation_role
      x-stackql-verb: EXEC
  /CancelMailboxExportJob:
    post:
      operationId: CancelMailboxExportJob
      description: Cancels a mailbox export job. If the mailbox export job is near completion, it might not be possible to
        cancel it.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.CancelMailboxExportJob
          default: WorkMailService.CancelMailboxExportJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ClientToken:
                  $ref: '#/components/schemas/IdempotencyClientToken'
                  description: The idempotency token for the client request.
                JobId:
                  $ref: '#/components/schemas/MailboxExportJobId'
                  description: The job ID.
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The organization ID.
              required:
              - ClientToken
              - JobId
              - OrganizationId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelMailboxExportJobResponse'
      x-stackql-resource: mailbox_export_job
      x-stackql-method: cancel_mailbox_export_job
      x-stackql-verb: EXEC
  /CreateAlias:
    post:
      operationId: CreateAlias
      description: Adds an alias to the set of a given member (user or group) of WorkMail.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.CreateAlias
          default: WorkMailService.CreateAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The organization under which the member (user or group) exists.
                EntityId:
                  $ref: '#/components/schemas/WorkMailIdentifier'
                  description: The member (user or group) to which this alias is added.
                Alias:
                  $ref: '#/components/schemas/EmailAddress'
                  description: The alias to add to the member set.
              required:
              - OrganizationId
              - EntityId
              - Alias
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAliasResponse'
      x-stackql-resource: alias
      x-stackql-method: create_alias
      x-stackql-verb: INSERT
  /CreateAvailabilityConfiguration:
    post:
      operationId: CreateAvailabilityConfiguration
      description: Creates an AvailabilityConfiguration for the given WorkMail organization and domain.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.CreateAvailabilityConfiguration
          default: WorkMailService.CreateAvailabilityConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ClientToken:
                  $ref: '#/components/schemas/IdempotencyClientToken'
                  description: An idempotent token that ensures that an API request is executed only once.
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The WorkMail organization for which the AvailabilityConfiguration will be created.
                DomainName:
                  $ref: '#/components/schemas/DomainName'
                  description: The domain to which the provider applies.
                EwsProvider:
                  $ref: '#/components/schemas/EwsAvailabilityProvider'
                  description: Exchange Web Services (EWS) availability provider definition. The request must contain exactly
                    one provider definition, either EwsProvider or LambdaProvider.
                LambdaProvider:
                  $ref: '#/components/schemas/LambdaAvailabilityProvider'
                  description: Lambda availability provider definition. The request must contain exactly one provider definition,
                    either EwsProvider or LambdaProvider.
              required:
              - OrganizationId
              - DomainName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAvailabilityConfigurationResponse'
      x-stackql-resource: availability_configurations
      x-stackql-method: create_availability_configuration
      x-stackql-verb: INSERT
  /CreateGroup:
    post:
      operationId: CreateGroup
      description: Creates a group that can be used in WorkMail by calling the RegisterToWorkMail operation.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.CreateGroup
          default: WorkMailService.CreateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The organization under which the group is to be created.
                Name:
                  $ref: '#/components/schemas/GroupName'
                  description: The name of the group.
                HiddenFromGlobalAddressList:
                  $ref: '#/components/schemas/Boolean'
                  description: If this parameter is enabled, the group will be hidden from the address book.
              required:
              - OrganizationId
              - Name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGroupResponse'
      x-stackql-resource: groups
      x-stackql-method: create_group
      x-stackql-verb: INSERT
  /CreateIdentityCenterApplication:
    post:
      operationId: CreateIdentityCenterApplication
      description: Creates the WorkMail application in IAM Identity Center that can be used later in the WorkMail - IdC integration.
        For more information, see PutIdentityProviderConfiguration. This action does not affect the authentication settings
        for any WorkMail organizations.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.CreateIdentityCenterApplication
          default: WorkMailService.CreateIdentityCenterApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Name:
                  $ref: '#/components/schemas/IdentityCenterApplicationName'
                  description: The name of the IAM Identity Center application.
                InstanceArn:
                  $ref: '#/components/schemas/InstanceArn'
                  description: The Amazon Resource Name (ARN) of the instance.
                ClientToken:
                  $ref: '#/components/schemas/IdempotencyClientToken'
                  description: The idempotency token associated with the request.
              required:
              - Name
              - InstanceArn
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIdentityCenterApplicationResponse'
      x-stackql-resource: identity_center_applications
      x-stackql-method: create_identity_center_application
      x-stackql-verb: INSERT
  /CreateImpersonationRole:
    post:
      operationId: CreateImpersonationRole
      description: Creates an impersonation role for the given WorkMail organization. Idempotency ensures that an API request
        completes no more than one time. With an idempotent request, if the original request completes successfully, any subsequent
        retries also complete successfully without performing any further actions.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.CreateImpersonationRole
          default: WorkMailService.CreateImpersonationRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ClientToken:
                  $ref: '#/components/schemas/IdempotencyClientToken'
                  description: The idempotency token for the client request.
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The WorkMail organization to create the new impersonation role within.
                Name:
                  $ref: '#/components/schemas/ImpersonationRoleName'
                  description: The name of the new impersonation role.
                Type:
                  $ref: '#/components/schemas/ImpersonationRoleType'
                  description: The impersonation role's type. The available impersonation role types are READ_ONLY or FULL_ACCESS.
                Description:
                  $ref: '#/components/schemas/ImpersonationRoleDescription'
                  description: The description of the new impersonation role.
                Rules:
                  $ref: '#/components/schemas/ImpersonationRuleList'
                  description: The list of rules for the impersonation role.
              required:
              - OrganizationId
              - Name
              - Type
              - Rules
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateImpersonationRoleResponse'
      x-stackql-resource: impersonation_roles
      x-stackql-method: create_impersonation_role
      x-stackql-verb: INSERT
  /CreateMobileDeviceAccessRule:
    post:
      operationId: CreateMobileDeviceAccessRule
      description: Creates a new mobile device access rule for the specified WorkMail organization.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.CreateMobileDeviceAccessRule
          default: WorkMailService.CreateMobileDeviceAccessRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The WorkMail organization under which the rule will be created.
                ClientToken:
                  $ref: '#/components/schemas/IdempotencyClientToken'
                  description: The idempotency token for the client request.
                Name:
                  $ref: '#/components/schemas/MobileDeviceAccessRuleName'
                  description: The rule name.
                Description:
                  $ref: '#/components/schemas/MobileDeviceAccessRuleDescription'
                  description: The rule description.
                Effect:
                  $ref: '#/components/schemas/MobileDeviceAccessRuleEffect'
                  description: The effect of the rule when it matches. Allowed values are ALLOW or DENY.
                DeviceTypes:
                  $ref: '#/components/schemas/DeviceTypeList'
                  description: Device types that the rule will match.
                NotDeviceTypes:
                  $ref: '#/components/schemas/DeviceTypeList'
                  description: Device types that the rule will not match. All other device types will match.
                DeviceModels:
                  $ref: '#/components/schemas/DeviceModelList'
                  description: Device models that the rule will match.
                NotDeviceModels:
                  $ref: '#/components/schemas/DeviceModelList'
                  description: Device models that the rule will not match. All other device models will match.
                DeviceOperatingSystems:
                  $ref: '#/components/schemas/DeviceOperatingSystemList'
                  description: Device operating systems that the rule will match.
                NotDeviceOperatingSystems:
                  $ref: '#/components/schemas/DeviceOperatingSystemList'
                  description: Device operating systems that the rule will not match. All other device operating systems will
                    match.
                DeviceUserAgents:
                  $ref: '#/components/schemas/DeviceUserAgentList'
                  description: Device user agents that the rule will match.
                NotDeviceUserAgents:
                  $ref: '#/components/schemas/DeviceUserAgentList'
                  description: Device user agents that the rule will not match. All other device user agents will match.
              required:
              - OrganizationId
              - Name
              - Effect
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMobileDeviceAccessRuleResponse'
      x-stackql-resource: mobile_device_access_rules
      x-stackql-method: create_mobile_device_access_rule
      x-stackql-verb: INSERT
  /CreateOrganization:
    post:
      operationId: CreateOrganization
      description: Creates a new WorkMail organization. Optionally, you can choose to associate an existing AWS Directory
        Service directory with your organization. If an AWS Directory Service directory ID is specified, the organization
        alias must match the directory alias. If you choose not to associate an existing directory with your organization,
        then we create a new WorkMail directory for you. For more information, see Adding an organization in the WorkMail
        Administrator Guide. You can associate multiple email domains with an organization, then choose your default email
        domain from the WorkMail console. You can also associate a domain that is managed in an Amazon Route 53 public hosted
        zone. For more information, see Adding a domain and Choosing the default domain in the WorkMail Administrator Guide.
        Optionally, you can use a customer managed key from AWS Key Management Service (AWS KMS) to encrypt email for your
        organization. If you don't associate an AWS KMS key, WorkMail creates a default, AWS managed key for you.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.CreateOrganization
          default: WorkMailService.CreateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                DirectoryId:
                  $ref: '#/components/schemas/DirectoryId'
                  description: The AWS Directory Service directory ID.
                Alias:
                  $ref: '#/components/schemas/OrganizationName'
                  description: The organization alias.
                ClientToken:
                  $ref: '#/components/schemas/IdempotencyClientToken'
                  description: The idempotency token associated with the request.
                Domains:
                  $ref: '#/components/schemas/Domains'
                  description: The email domains to associate with the organization.
                KmsKeyArn:
                  $ref: '#/components/schemas/KmsKeyArn'
                  description: The Amazon Resource Name (ARN) of a customer managed key from AWS KMS.
                EnableInteroperability:
                  $ref: '#/components/schemas/Boolean'
                  description: When true, allows organization interoperability between WorkMail and Microsoft Exchange. If
                    true, you must include a AD Connector directory ID in the request.
              required:
              - Alias
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrganizationResponse'
      x-stackql-resource: organizations
      x-stackql-method: create_organization
      x-stackql-verb: INSERT
  /CreateResource:
    post:
      operationId: CreateResource
      description: Creates a new WorkMail resource.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.CreateResource
          default: WorkMailService.CreateResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The identifier associated with the organization for which the resource is created.
                Name:
                  $ref: '#/components/schemas/ResourceName'
                  description: The name of the new resource.
                Type:
                  $ref: '#/components/schemas/ResourceType'
                  description: The type of the new resource. The available types are equipment and room.
                Description:
                  $ref: '#/components/schemas/ResourceDescription'
                  description: Resource description.
                HiddenFromGlobalAddressList:
                  $ref: '#/components/schemas/Boolean'
                  description: If this parameter is enabled, the resource will be hidden from the address book.
              required:
              - OrganizationId
              - Name
              - Type
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResourceResponse'
      x-stackql-resource: resources
      x-stackql-method: create_resource
      x-stackql-verb: INSERT
  /CreateUser:
    post:
      operationId: CreateUser
      description: Creates a user who can be used in WorkMail by calling the RegisterToWorkMail operation.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.CreateUser
          default: WorkMailService.CreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The identifier of the organization for which the user is created.
                Name:
                  $ref: '#/components/schemas/UserName'
                  description: The name for the new user. WorkMail directory user names have a maximum length of 64. All others
                    have a maximum length of 20.
                DisplayName:
                  $ref: '#/components/schemas/UserAttribute'
                  description: The display name for the new user.
                Password:
                  $ref: '#/components/schemas/Password'
                  description: The password for the new user.
                Role:
                  $ref: '#/components/schemas/UserRole'
                  description: The role of the new user. You cannot pass SYSTEM_USER or RESOURCE role in a single request.
                    When a user role is not selected, the default role of USER is selected.
                FirstName:
                  $ref: '#/components/schemas/UserAttribute'
                  description: The first name of the new user.
                LastName:
                  $ref: '#/components/schemas/UserAttribute'
                  description: The last name of the new user.
                HiddenFromGlobalAddressList:
                  $ref: '#/components/schemas/Boolean'
                  description: If this parameter is enabled, the user will be hidden from the address book.
                IdentityProviderUserId:
                  $ref: '#/components/schemas/IdentityProviderUserId'
                  description: User ID from the IAM Identity Center. If this parameter is empty it will be updated automatically
                    when the user logs in for the first time to the mailbox associated with WorkMail.
              required:
              - OrganizationId
              - Name
              - DisplayName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
      x-stackql-resource: users
      x-stackql-method: create_user
      x-stackql-verb: INSERT
  /DeleteAccessControlRule:
    post:
      operationId: DeleteAccessControlRule
      description: Deletes an access control rule for the specified WorkMail organization. Deleting already deleted and non-existing
        rules does not produce an error. In those cases, the service sends back an HTTP 200 response with an empty HTTP body.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.DeleteAccessControlRule
          default: WorkMailService.DeleteAccessControlRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The identifier for the organization.
                Name:
                  $ref: '#/components/schemas/AccessControlRuleName'
                  description: The name of the access control rule.
              required:
              - OrganizationId
              - Name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccessControlRuleResponse'
      x-stackql-resource: access_control_rules
      x-stackql-method: delete_access_control_rule
      x-stackql-verb: DELETE
  /DeleteAlias:
    post:
      operationId: DeleteAlias
      description: Remove one or more specified aliases from a set of aliases for a given user.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.DeleteAlias
          default: WorkMailService.DeleteAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The identifier for the organization under which the user exists.
                EntityId:
                  $ref: '#/components/schemas/WorkMailIdentifier'
                  description: The identifier for the member (user or group) from which to have the aliases removed.
                Alias:
                  $ref: '#/components/schemas/EmailAddress'
                  description: The aliases to be removed from the user's set of aliases. Duplicate entries in the list are
                    collapsed into single entries (the list is transformed into a set).
              required:
              - OrganizationId
              - EntityId
              - Alias
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAliasResponse'
      x-stackql-resource: alias
      x-stackql-method: delete_alias
      x-stackql-verb: DELETE
  /DeleteAvailabilityConfiguration:
    post:
      operationId: DeleteAvailabilityConfiguration
      description: Deletes the AvailabilityConfiguration for the given WorkMail organization and domain.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.DeleteAvailabilityConfiguration
          default: WorkMailService.DeleteAvailabilityConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The WorkMail organization for which the AvailabilityConfiguration will be deleted.
                DomainName:
                  $ref: '#/components/schemas/DomainName'
                  description: The domain for which the AvailabilityConfiguration will be deleted.
              required:
              - OrganizationId
              - DomainName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAvailabilityConfigurationResponse'
      x-stackql-resource: availability_configurations
      x-stackql-method: delete_availability_configuration
      x-stackql-verb: DELETE
  /DeleteEmailMonitoringConfiguration:
    post:
      operationId: DeleteEmailMonitoringConfiguration
      description: Deletes the email monitoring configuration for a specified organization.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
