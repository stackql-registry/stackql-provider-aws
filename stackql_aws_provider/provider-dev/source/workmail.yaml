                  description: The organization that contains the user, group, or resource to update.
                EntityId:
                  $ref: '#/components/schemas/EntityIdentifier'
                  description: 'The user, group, or resource to update. The identifier can accept UseriD, ResourceId, or GroupId,
                    Username, Resourcename, or Groupname, or email. The following identity formats are available: Entity ID:
                    12345678-1234-1234-1234-123456789012, r-0123456789a0123456789b0123456789, or S-1-1-12-1234567890-123456789-123456789-1234
                    Email address: entity@domain.tld Entity name: entity'
                Email:
                  $ref: '#/components/schemas/EmailAddress'
                  description: The value of the email to be updated as primary.
              required:
              - OrganizationId
              - EntityId
              - Email
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePrimaryEmailAddressResponse'
      x-stackql-resource: primary_email_address
      x-stackql-method: update_primary_email_address
      x-stackql-verb: UPDATE
  /UpdateResource:
    post:
      operationId: UpdateResource
      description: Updates data for the resource. To have the latest information, it must be preceded by a DescribeResource
        call. The dataset in the request should be the one expected when performing another DescribeResource call.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.UpdateResource
          default: WorkMailService.UpdateResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The identifier associated with the organization for which the resource is updated.
                ResourceId:
                  $ref: '#/components/schemas/EntityIdentifier'
                  description: 'The identifier of the resource to be updated. The identifier can accept ResourceId, Resourcename,
                    or email. The following identity formats are available: Resource ID: r-0123456789a0123456789b0123456789
                    Email address: resource@domain.tld Resource name: resource'
                Name:
                  $ref: '#/components/schemas/ResourceName'
                  description: The name of the resource to be updated.
                BookingOptions:
                  $ref: '#/components/schemas/BookingOptions'
                  description: The resource's booking options to be updated.
                Description:
                  $ref: '#/components/schemas/NewResourceDescription'
                  description: Updates the resource description.
                Type:
                  $ref: '#/components/schemas/ResourceType'
                  description: Updates the resource type.
                HiddenFromGlobalAddressList:
                  $ref: '#/components/schemas/BooleanObject'
                  description: If enabled, the resource is hidden from the global address list.
              required:
              - OrganizationId
              - ResourceId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResourceResponse'
      x-stackql-resource: resources
      x-stackql-method: update_resource
      x-stackql-verb: UPDATE
  /UpdateUser:
    post:
      operationId: UpdateUser
      description: Updates data for the user. To have the latest information, it must be preceded by a DescribeUser call.
        The dataset in the request should be the one expected when performing another DescribeUser call.
      parameters:
      - name: X-Amz-Target
        in: header
        description: Action Header
        required: false
        schema:
          type: string
          enum:
          - WorkMailService.UpdateUser
          default: WorkMailService.UpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                OrganizationId:
                  $ref: '#/components/schemas/OrganizationId'
                  description: The identifier for the organization under which the user exists.
                UserId:
                  $ref: '#/components/schemas/EntityIdentifier'
                  description: 'The identifier for the user to be updated. The identifier can be the UserId, Username, or
                    email. The following identity formats are available: User ID: 12345678-1234-1234-1234-123456789012 or
                    S-1-1-12-1234567890-123456789-123456789-1234 Email address: user@domain.tld User name: user'
                Role:
                  $ref: '#/components/schemas/UserRole'
                  description: Updates the user role. You cannot pass SYSTEM_USER or RESOURCE.
                DisplayName:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the display name of the user.
                FirstName:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's first name.
                LastName:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's last name.
                HiddenFromGlobalAddressList:
                  $ref: '#/components/schemas/BooleanObject'
                  description: If enabled, the user is hidden from the global address list.
                Initials:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's initials.
                Telephone:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's contact details.
                Street:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's street address.
                JobTitle:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's job title.
                City:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's city.
                Company:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's company.
                ZipCode:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's zip code.
                Department:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's department.
                Country:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's country.
                Office:
                  $ref: '#/components/schemas/UserAttribute'
                  description: Updates the user's office.
                IdentityProviderUserId:
                  $ref: '#/components/schemas/IdentityProviderUserIdForUpdate'
                  description: User ID from the IAM Identity Center. If this parameter is empty it will be updated automatically
                    when the user logs in for the first time to the mailbox associated with WorkMail.
              required:
              - OrganizationId
              - UserId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
      x-stackql-resource: users
      x-stackql-method: update_user
      x-stackql-verb: UPDATE
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    OrganizationId:
      type: string
      minLength: 34
      maxLength: 34
      pattern: ^m-[0-9a-f]{32}$
    EntityIdentifier:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[a-zA-Z0-9._%+@-]+'
    AssociateDelegateToResourceResponse:
      type: object
    AssociateMemberToGroupResponse:
      type: object
    ImpersonationRoleId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '[a-zA-Z0-9_-]+'
    AssumeImpersonationRoleResponse:
      type: object
      properties:
        Token:
          $ref: '#/components/schemas/ImpersonationToken'
          description: The authentication token for the impersonation role.
        ExpiresIn:
          $ref: '#/components/schemas/ExpiresIn'
          description: The authentication token's validity, in seconds.
    ImpersonationToken:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[\x21-\x7e]+'
    ExpiresIn:
      type: integer
      format: int64
    IdempotencyClientToken:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '[\x21-\x7e]+'
    MailboxExportJobId:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '[A-Za-z0-9-]+'
    CancelMailboxExportJobResponse:
      type: object
    WorkMailIdentifier:
      type: string
      minLength: 12
      maxLength: 256
    EmailAddress:
      type: string
      minLength: 1
      maxLength: 254
      pattern: '[a-zA-Z0-9._%+-]{1,64}@[a-zA-Z0-9.-]+\.[a-zA-Z-]{2,}'
    CreateAliasResponse:
      type: object
    DomainName:
      type: string
      minLength: 3
      maxLength: 255
      pattern: '[a-zA-Z0-9.-]+'
    EwsAvailabilityProvider:
      description: Describes an EWS based availability provider. This is only used as input to the service.
      type: object
      properties:
        EwsEndpoint:
          $ref: '#/components/schemas/Url'
          description: The endpoint of the remote EWS server.
        EwsUsername:
          $ref: '#/components/schemas/ExternalUserName'
          description: The username used to authenticate the remote EWS server.
        EwsPassword:
          $ref: '#/components/schemas/Password'
          description: The password used to authenticate the remote EWS server.
      required:
      - EwsEndpoint
      - EwsUsername
      - EwsPassword
    Url:
      type: string
      maxLength: 256
      pattern: https?://[A-Za-z0-9.-]+(:[0-9]+)?/.*
    ExternalUserName:
      type: string
      maxLength: 256
      pattern: '[\u0020-\u00FF]+'
    Password:
      type: string
      maxLength: 256
      pattern: '[\u0020-\u00FF]+'
    LambdaAvailabilityProvider:
      description: Describes a Lambda based availability provider.
      type: object
      properties:
        LambdaArn:
          $ref: '#/components/schemas/LambdaArn'
          description: The Amazon Resource Name (ARN) of the Lambda that acts as the availability provider.
      required:
      - LambdaArn
    LambdaArn:
      type: string
      minLength: 49
      maxLength: 256
      pattern: arn:aws:lambda:[a-z]{2}-[a-z]+-\d{1}:\d{12}:function:[a-zA-Z0-9\-_\.]+(:(\$LATEST|[a-zA-Z0-9\-_]+))?
    CreateAvailabilityConfigurationResponse:
      type: object
    GroupName:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[\u0020-\u00FF]+'
    Boolean:
      type: boolean
    CreateGroupResponse:
      type: object
      properties:
        GroupId:
          $ref: '#/components/schemas/WorkMailIdentifier'
          description: The identifier of the group.
    IdentityCenterApplicationName:
      type: string
      minLength: 0
      maxLength: 255
      pattern: ^[\w+=,.@-]+$
    InstanceArn:
      type: string
      minLength: 10
      maxLength: 1124
      pattern: ^arn:(aws|aws-us-gov|aws-cn|aws-iso|aws-iso-b):sso:::instance/(sso)?ins-[a-zA-Z0-9-.]{16}$
    CreateIdentityCenterApplicationResponse:
      type: object
      properties:
        ApplicationArn:
          $ref: '#/components/schemas/ApplicationArn'
          description: The Amazon Resource Name (ARN) of the application.
    ApplicationArn:
      type: string
      minLength: 10
      maxLength: 1224
      pattern: ^arn:(aws|aws-us-gov|aws-cn|aws-iso|aws-iso-b):sso::\d{12}:application/(sso)?ins-[a-zA-Z0-9-.]{16}/apl-[a-zA-Z0-9]{16}$
    ImpersonationRoleName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '[^\x00-\x1F\x7F\x3C\x3E\x5C]+'
    ImpersonationRoleType:
      type: string
      enum:
      - FULL_ACCESS
      - READ_ONLY
    ImpersonationRoleDescription:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[^\x00-\x09\x0B\x0C\x0E-\x1F\x7F\x3C\x3E\x5C]+'
    ImpersonationRuleList:
      type: array
      items:
        $ref: '#/components/schemas/ImpersonationRule'
    ImpersonationRule:
      description: The rules for the given impersonation role.
      type: object
      properties:
        ImpersonationRuleId:
          $ref: '#/components/schemas/ImpersonationRuleId'
          description: The identifier of the rule.
        Name:
          $ref: '#/components/schemas/ImpersonationRuleName'
          description: The rule name.
        Description:
          $ref: '#/components/schemas/ImpersonationRuleDescription'
          description: The rule description.
        Effect:
          $ref: '#/components/schemas/AccessEffect'
          description: The effect of the rule when it matches the input. Allowed effect values are ALLOW or DENY.
        TargetUsers:
          $ref: '#/components/schemas/TargetUsers'
          description: A list of user IDs that match the rule.
        NotTargetUsers:
          $ref: '#/components/schemas/TargetUsers'
          description: A list of user IDs that don't match the rule.
      required:
      - ImpersonationRuleId
      - Effect
    ImpersonationRuleId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '[a-zA-Z0-9_-]+'
    ImpersonationRuleName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '[^\x00-\x1F\x7F\x3C\x3E\x5C]+'
    ImpersonationRuleDescription:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[^\x00-\x09\x0B\x0C\x0E-\x1F\x7F\x3C\x3E\x5C]+'
    AccessEffect:
      type: string
      enum:
      - ALLOW
      - DENY
    TargetUsers:
      type: array
      items:
        $ref: '#/components/schemas/EntityIdentifier'
    CreateImpersonationRoleResponse:
      type: object
      properties:
        ImpersonationRoleId:
          $ref: '#/components/schemas/ImpersonationRoleId'
          description: The new impersonation role ID.
    MobileDeviceAccessRuleName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '[\S\s]+'
    MobileDeviceAccessRuleDescription:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[\S\s]+'
    MobileDeviceAccessRuleEffect:
      type: string
      enum:
      - ALLOW
      - DENY
    DeviceTypeList:
      type: array
      items:
        $ref: '#/components/schemas/DeviceType'
    DeviceType:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[\u0020-\u00FF]+'
    DeviceModelList:
      type: array
      items:
        $ref: '#/components/schemas/DeviceModel'
    DeviceModel:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[\u0020-\u00FF]+'
    DeviceOperatingSystemList:
      type: array
      items:
        $ref: '#/components/schemas/DeviceOperatingSystem'
    DeviceOperatingSystem:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[\u0020-\u00FF]+'
    DeviceUserAgentList:
      type: array
      items:
        $ref: '#/components/schemas/DeviceUserAgent'
    DeviceUserAgent:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[\u0020-\u00FF]+'
    CreateMobileDeviceAccessRuleResponse:
      type: object
      properties:
        MobileDeviceAccessRuleId:
          $ref: '#/components/schemas/MobileDeviceAccessRuleId'
          description: The identifier for the newly created mobile device access rule.
    MobileDeviceAccessRuleId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '[a-zA-Z0-9_-]+'
    DirectoryId:
      type: string
      minLength: 12
      maxLength: 12
      pattern: ^d-[0-9a-f]{10}$
    OrganizationName:
      type: string
      minLength: 1
      maxLength: 62
      pattern: ^(?!d-)([\da-zA-Z]+)([-][\da-zA-Z]+)*
    Domains:
      type: array
      items:
        $ref: '#/components/schemas/Domain'
    Domain:
      description: The domain to associate with an WorkMail organization. When you configure a domain hosted in Amazon Route
        53 (Route 53), all recommended DNS records are added to the organization when you create it. For more information,
        see Adding a domain in the WorkMail Administrator Guide.
      type: object
      properties:
        DomainName:
          $ref: '#/components/schemas/DomainName'
          description: The fully qualified domain name.
        HostedZoneId:
          $ref: '#/components/schemas/HostedZoneId'
          description: The hosted zone ID for a domain hosted in Route 53. Required when configuring a domain hosted in Route
            53.
      required:
      - DomainName
    HostedZoneId:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '[^/\\]*'
    KmsKeyArn:
      type: string
      minLength: 20
      maxLength: 2048
      pattern: arn:aws:kms:[a-z0-9-]*:[a-z0-9-]+:[A-Za-z0-9][A-Za-z0-9:_/+=,@.-]{0,1023}
    CreateOrganizationResponse:
      type: object
      properties:
        OrganizationId:
          $ref: '#/components/schemas/OrganizationId'
          description: The organization ID.
    ResourceName:
      type: string
      minLength: 1
      maxLength: 20
      pattern: '[\w\-.]+(@[a-zA-Z0-9.\-]+\.[a-zA-Z0-9-]{2,})?'
    ResourceType:
      type: string
      enum:
      - ROOM
      - EQUIPMENT
    ResourceDescription:
      type: string
      minLength: 1
      maxLength: 64
    CreateResourceResponse:
      type: object
      properties:
        ResourceId:
          $ref: '#/components/schemas/ResourceId'
          description: The identifier of the new resource.
    ResourceId:
      type: string
      minLength: 34
      maxLength: 34
      pattern: ^r-[0-9a-f]{32}$
    UserName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '[\w\-.]+(@[a-zA-Z0-9.\-]+\.[a-zA-Z0-9-]{2,})?'
    UserAttribute:
      type: string
      maxLength: 256
    UserRole:
      type: string
      enum:
      - USER
      - RESOURCE
      - SYSTEM_USER
      - REMOTE_USER
    IdentityProviderUserId:
      type: string
      minLength: 1
      maxLength: 47
      pattern: ^([0-9a-f]{10}-|)[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$
    CreateUserResponse:
      type: object
      properties:
        UserId:
          $ref: '#/components/schemas/WorkMailIdentifier'
          description: The identifier for the new user.
    AccessControlRuleName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '[a-zA-Z0-9_-]+'
    DeleteAccessControlRuleResponse:
      type: object
    DeleteAliasResponse:
      type: object
    DeleteAvailabilityConfigurationResponse:
      type: object
    DeleteEmailMonitoringConfigurationResponse:
      type: object
    DeleteGroupResponse:
      type: object
    DeleteIdentityCenterApplicationResponse:
      type: object
    DeleteIdentityProviderConfigurationResponse:
      type: object
    DeleteImpersonationRoleResponse:
      type: object
    DeleteMailboxPermissionsResponse:
      type: object
    DeviceId:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '[A-Za-z0-9]+'
    DeleteMobileDeviceAccessOverrideResponse:
      type: object
    DeleteMobileDeviceAccessRuleResponse:
      type: object
    DeleteOrganizationResponse:
      type: object
      properties:
        OrganizationId:
          $ref: '#/components/schemas/OrganizationId'
          description: The organization ID.
        State:
          $ref: '#/components/schemas/String'
          description: The state of the organization.
    String:
      type: string
      maxLength: 256
    PersonalAccessTokenId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '[a-zA-Z0-9_-]+'
    DeletePersonalAccessTokenResponse:
      type: object
    DeleteResourceResponse:
      type: object
    ShortString:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '[a-zA-Z0-9_-]+'
    DeleteRetentionPolicyResponse:
      type: object
    DeleteUserResponse:
      type: object
    DeregisterFromWorkMailResponse:
      type: object
    WorkMailDomainName:
      type: string
      minLength: 3
      maxLength: 209
      pattern: '[a-zA-Z0-9.-]+'
    DeregisterMailDomainResponse:
      type: object
    DescribeEmailMonitoringConfigurationResponse:
      type: object
      properties:
        RoleArn:
          $ref: '#/components/schemas/RoleArn'
          description: The Amazon Resource Name (ARN) of the IAM Role associated with the email monitoring configuration.
        LogGroupArn:
          $ref: '#/components/schemas/LogGroupArn'
          description: The Amazon Resource Name (ARN) of the CloudWatch Log group associated with the email monitoring configuration.
    RoleArn:
      type: string
      minLength: 20
      maxLength: 2048
      pattern: arn:aws:iam:[a-z0-9-]*:[a-z0-9-]+:[A-Za-z0-9][A-Za-z0-9:_/+=,@.-]{0,1023}
    LogGroupArn:
      type: string
      minLength: 47
      maxLength: 562
      pattern: arn:aws:logs:[a-z\-0-9]*:[0-9]{12}:log-group:([\.\-_/#A-Za-z0-9]+):\*$
    DescribeEntityResponse:
      type: object
      properties:
        EntityId:
          $ref: '#/components/schemas/WorkMailIdentifier'
          description: The entity ID under which the entity exists.
        Name:
          $ref: '#/components/schemas/String'
          description: Username, GroupName, or ResourceName based on entity type.
        Type:
          $ref: '#/components/schemas/EntityType'
          description: Entity type.
    EntityType:
      type: string
      enum:
      - GROUP
      - USER
      - RESOURCE
    DescribeGroupResponse:
      type: object
      properties:
        GroupId:
          $ref: '#/components/schemas/WorkMailIdentifier'
          description: The identifier of the described group.
        Name:
          $ref: '#/components/schemas/GroupName'
          description: The name of the described group.
        Email:
          $ref: '#/components/schemas/EmailAddress'
          description: The email of the described group.
        State:
          $ref: '#/components/schemas/EntityState'
          description: 'The state of the user: enabled (registered to WorkMail) or disabled (deregistered or never registered
            to WorkMail).'
        EnabledDate:
          $ref: '#/components/schemas/Timestamp'
          description: The date and time when a user was registered to WorkMail, in UNIX epoch time format.
        DisabledDate:
          $ref: '#/components/schemas/Timestamp'
          description: The date and time when a user was deregistered from WorkMail, in UNIX epoch time format.
        HiddenFromGlobalAddressList:
          $ref: '#/components/schemas/Boolean'
          description: If the value is set to true, the group is hidden from the address book.
    EntityState:
      type: string
      enum:
      - ENABLED
      - DISABLED
      - DELETED
    Timestamp:
      type: string
      format: date-time
    DescribeIdentityProviderConfigurationResponse:
      type: object
      properties:
        AuthenticationMode:
          $ref: '#/components/schemas/IdentityProviderAuthenticationMode'
          description: The authentication mode used in WorkMail.
        IdentityCenterConfiguration:
          $ref: '#/components/schemas/IdentityCenterConfiguration'
          description: The details of the IAM Identity Center configuration.
        PersonalAccessTokenConfiguration:
          $ref: '#/components/schemas/PersonalAccessTokenConfiguration'
          description: The details of the Personal Access Token configuration.
    IdentityProviderAuthenticationMode:
      type: string
      enum:
      - IDENTITY_PROVIDER_ONLY
      - IDENTITY_PROVIDER_AND_DIRECTORY
    IdentityCenterConfiguration:
      description: The IAM Identity Center configuration.
      type: object
      properties:
        InstanceArn:
          $ref: '#/components/schemas/InstanceArn'
          description: The Amazon Resource Name (ARN) of the of IAM Identity Center instance. Must be in the same AWS account
            and region as WorkMail organization.
        ApplicationArn:
          $ref: '#/components/schemas/ApplicationArn'
          description: The Amazon Resource Name (ARN) of IAMIdentity Center Application for WorkMail. Must be created by the
            WorkMail API, see CreateIdentityCenterApplication.
      required:
      - InstanceArn
      - ApplicationArn
    PersonalAccessTokenConfiguration:
      description: Displays the Personal Access Token status.
      type: object
      properties:
        Status:
          $ref: '#/components/schemas/PersonalAccessTokenConfigurationStatus'
          description: The status of the Personal Access Token allowed for the organization. Active - Mailbox users can login
            to the web application and choose Settings to see the new Personal Access Tokens page to create and delete the
            Personal Access Tokens. Mailbox users can use the Personal Access Tokens to set up mailbox connection from desktop
            or mobile email clients. Inactive - Personal Access Tokens are disabled for your organization. Mailbox users can’t
            create, list, or delete Personal Access Tokens and can’t use them to connect to their mailboxes from desktop or
            mobile email clients.
        LifetimeInDays:
          $ref: '#/components/schemas/PersonalAccessTokenLifetimeInDays'
          description: The validity of the Personal Access Token status in days.
      required:
      - Status
    PersonalAccessTokenConfigurationStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    PersonalAccessTokenLifetimeInDays:
      type: integer
      minimum: 1
      maximum: 3653
    DescribeInboundDmarcSettingsResponse:
      type: object
      properties:
        Enforced:
          $ref: '#/components/schemas/Boolean'
          description: Lists the enforcement setting of the applied policy.
    DescribeMailboxExportJobResponse:
      type: object
      properties:
        EntityId:
          $ref: '#/components/schemas/WorkMailIdentifier'
          description: The identifier of the user or resource associated with the mailbox.
        Description:
          $ref: '#/components/schemas/Description'
          description: The mailbox export job description.
        RoleArn:
          $ref: '#/components/schemas/RoleArn'
          description: The ARN of the AWS Identity and Access Management (IAM) role that grants write permission to the Amazon
            Simple Storage Service (Amazon S3) bucket.
        KmsKeyArn:
          $ref: '#/components/schemas/KmsKeyArn'
          description: The Amazon Resource Name (ARN) of the symmetric AWS Key Management Service (AWS KMS) key that encrypts
            the exported mailbox content.
        S3BucketName:
          $ref: '#/components/schemas/S3BucketName'
          description: The name of the S3 bucket.
        S3Prefix:
          $ref: '#/components/schemas/S3ObjectKey'
          description: The S3 bucket prefix.
        S3Path:
          $ref: '#/components/schemas/S3ObjectKey'
          description: The path to the S3 bucket and file that the mailbox export job is exporting to.
        EstimatedProgress:
          $ref: '#/components/schemas/Percentage'
          description: The estimated progress of the mailbox export job, in percentage points.
        State:
          $ref: '#/components/schemas/MailboxExportJobState'
          description: The state of the mailbox export job.
        ErrorInfo:
          $ref: '#/components/schemas/MailboxExportErrorInfo'
          description: Error information for failed mailbox export jobs.
        StartTime:
          $ref: '#/components/schemas/Timestamp'
          description: The mailbox export job start timestamp.
        EndTime:
          $ref: '#/components/schemas/Timestamp'
          description: The mailbox export job end timestamp.
    Description:
      type: string
      minLength: 0
      maxLength: 1023
      pattern: '[\S\s]*'
    S3BucketName:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '[A-Za-z0-9.-]+'
    S3ObjectKey:
      type: string
      minLength: 1
      maxLength: 1023
      pattern: '[A-Za-z0-9!_.*''()/-]+'
    Percentage:
      type: integer
      minimum: 0
      maximum: 100
    MailboxExportJobState:
      type: string
      enum:
      - RUNNING
      - COMPLETED
      - FAILED
      - CANCELLED
    MailboxExportErrorInfo:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '[\S\s]*'
    DescribeOrganizationResponse:
      type: object
      properties:
        OrganizationId:
          $ref: '#/components/schemas/OrganizationId'
          description: The identifier of an organization.
        Alias:
          $ref: '#/components/schemas/OrganizationName'
          description: The alias for an organization.
        State:
          $ref: '#/components/schemas/String'
          description: The state of an organization.
        DirectoryId:
          $ref: '#/components/schemas/String'
          description: The identifier for the directory associated with an WorkMail organization.
        DirectoryType:
          $ref: '#/components/schemas/String'
          description: The type of directory associated with the WorkMail organization.
        DefaultMailDomain:
          $ref: '#/components/schemas/String'
          description: The default mail domain associated with the organization.
        CompletedDate:
          $ref: '#/components/schemas/Timestamp'
          description: The date at which the organization became usable in the WorkMail context, in UNIX epoch time format.
        ErrorMessage:
          $ref: '#/components/schemas/String'
          description: (Optional) The error message indicating if unexpected behavior was encountered with regards to the
            organization.
        ARN:
          $ref: '#/components/schemas/AmazonResourceName'
          description: The Amazon Resource Name (ARN) of the organization.
        MigrationAdmin:
          $ref: '#/components/schemas/WorkMailIdentifier'
          description: The user ID of the migration admin if migration is enabled for the organization.
        InteroperabilityEnabled:
          $ref: '#/components/schemas/Boolean'
          description: Indicates if interoperability is enabled for this organization.
    AmazonResourceName:
      type: string
      minLength: 1
      maxLength: 1011
      pattern: arn:aws:workmail:[a-z0-9-]*:[a-z0-9-]+:[A-Za-z0-9][A-Za-z0-9:_/+=,@.-]{0,1023}
    DescribeResourceResponse:
      type: object
      properties:
        ResourceId:
          $ref: '#/components/schemas/ResourceId'
          description: The identifier of the described resource.
        Email:
          $ref: '#/components/schemas/EmailAddress'
          description: The email of the described resource.
        Name:
          $ref: '#/components/schemas/ResourceName'
          description: The name of the described resource.
        Type:
          $ref: '#/components/schemas/ResourceType'
          description: The type of the described resource.
        BookingOptions:
          $ref: '#/components/schemas/BookingOptions'
          description: The booking options for the described resource.
        State:
          $ref: '#/components/schemas/EntityState'
          description: 'The state of the resource: enabled (registered to WorkMail), disabled (deregistered or never registered
            to WorkMail), or deleted.'
        EnabledDate:
          $ref: '#/components/schemas/Timestamp'
          description: The date and time when a resource was enabled for WorkMail, in UNIX epoch time format.
        DisabledDate:
          $ref: '#/components/schemas/Timestamp'
          description: The date and time when a resource was disabled from WorkMail, in UNIX epoch time format.
        Description:
          $ref: '#/components/schemas/ResourceDescription'
          description: Description of the resource.
        HiddenFromGlobalAddressList:
          $ref: '#/components/schemas/Boolean'
          description: If enabled, the resource is hidden from the global address list.
    BookingOptions:
      description: At least one delegate must be associated to the resource to disable automatic replies from the resource.
      type: object
      properties:
        AutoAcceptRequests:
          $ref: '#/components/schemas/Boolean'
          description: The resource's ability to automatically reply to requests. If disabled, delegates must be associated
            to the resource.
        AutoDeclineRecurringRequests:
          $ref: '#/components/schemas/Boolean'
          description: The resource's ability to automatically decline any recurring requests.
        AutoDeclineConflictingRequests:
          $ref: '#/components/schemas/Boolean'
          description: The resource's ability to automatically decline any conflicting requests.
    DescribeUserResponse:
      type: object
      properties:
        UserId:
          $ref: '#/components/schemas/WorkMailIdentifier'
          description: The identifier for the described user.
        Name:
          $ref: '#/components/schemas/UserName'
          description: The name for the user.
        Email:
          $ref: '#/components/schemas/EmailAddress'
          description: The email of the user.
        DisplayName:
          $ref: '#/components/schemas/UserAttribute'
          description: The display name of the user.
        State:
          $ref: '#/components/schemas/EntityState'
          description: 'The state of a user: enabled (registered to WorkMail) or disabled (deregistered or never registered
            to WorkMail).'
        UserRole:
          $ref: '#/components/schemas/UserRole'
          description: In certain cases, other entities are modeled as users. If interoperability is enabled, resources are
            imported into WorkMail as users. Because different WorkMail organizations rely on different directory types, administrators
            can distinguish between an unregistered user (account is disabled and has a user role) and the directory administrators.
            The values are USER, RESOURCE, SYSTEM_USER, and REMOTE_USER.
        EnabledDate:
          $ref: '#/components/schemas/Timestamp'
          description: The date and time at which the user was enabled for WorkMailusage, in UNIX epoch time format.
        DisabledDate:
          $ref: '#/components/schemas/Timestamp'
          description: The date and time at which the user was disabled for WorkMail usage, in UNIX epoch time format.
        MailboxProvisionedDate:
          $ref: '#/components/schemas/Timestamp'
          description: The date when the mailbox was created for the user.
        MailboxDeprovisionedDate:
          $ref: '#/components/schemas/Timestamp'
          description: The date when the mailbox was removed for the user.
        FirstName:
          $ref: '#/components/schemas/UserAttribute'
          description: First name of the user.
        LastName:
          $ref: '#/components/schemas/UserAttribute'
          description: Last name of the user.
        HiddenFromGlobalAddressList:
          $ref: '#/components/schemas/Boolean'
          description: If enabled, the user is hidden from the global address list.
        Initials:
          $ref: '#/components/schemas/UserAttribute'
          description: Initials of the user.
        Telephone:
          $ref: '#/components/schemas/UserAttribute'
          description: User's contact number.
        Street:
          $ref: '#/components/schemas/UserAttribute'
          description: Street where the user is located.
        JobTitle:
          $ref: '#/components/schemas/UserAttribute'
          description: Job title of the user.
        City:
          $ref: '#/components/schemas/UserAttribute'
          description: City where the user is located.
        Company:
          $ref: '#/components/schemas/UserAttribute'
          description: Company of the user.
        ZipCode:
          $ref: '#/components/schemas/UserAttribute'
          description: Zip code of the user.
        Department:
          $ref: '#/components/schemas/UserAttribute'
          description: Department of the user.
        Country:
          $ref: '#/components/schemas/UserAttribute'
          description: Country where the user is located.
        Office:
          $ref: '#/components/schemas/UserAttribute'
          description: Office where the user is located.
        IdentityProviderUserId:
          $ref: '#/components/schemas/IdentityProviderUserId'
          description: User ID from the IAM Identity Center. If this parameter is empty it will be updated automatically when
            the user logs in for the first time to the mailbox associated with WorkMail.
        IdentityProviderIdentityStoreId:
          $ref: '#/components/schemas/IdentityProviderIdentityStoreId'
          description: Identity Store ID from the IAM Identity Center. If this parameter is empty it will be updated automatically
            when the user logs in for the first time to the mailbox associated with WorkMail.
    IdentityProviderIdentityStoreId:
      type: string
      minLength: 1
      maxLength: 36
      pattern: ^d-[0-9a-f]{10}$|^[0-9a-f]{8}\\b-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-\\b[0-9a-f]{12}$
    DisassociateDelegateFromResourceResponse:
