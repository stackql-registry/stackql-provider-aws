        $ref: '#/components/schemas/DomainNameAccessAssociation'
    DomainNames:
      description: Represents a collection of DomainName resources.
      type: object
      properties:
        position:
          $ref: '#/components/schemas/String'
        items_:
          $ref: '#/components/schemas/ListOfDomainName'
          description: The current page of elements from this collection.
    ListOfDomainName:
      type: array
      items:
        $ref: '#/components/schemas/DomainName'
    ExportResponse:
      description: The binary blob response to GetExport, which contains the generated SDK.
      type: object
      properties:
        contentType:
          $ref: '#/components/schemas/String'
          description: The content-type header value in the HTTP response. This will correspond to a valid 'accept' type in
            the request.
        contentDisposition:
          $ref: '#/components/schemas/String'
          description: The content-disposition header value in the HTTP response.
        body:
          $ref: '#/components/schemas/Blob'
          description: The binary blob response to GetExport, which contains the export.
    Blob:
      type: string
      format: byte
    GatewayResponse:
      description: A gateway response of a given response type and status code, with optional response parameters and mapping
        templates.
      type: object
      properties:
        responseType:
          $ref: '#/components/schemas/GatewayResponseType'
          description: The response type of the associated GatewayResponse.
        statusCode:
          $ref: '#/components/schemas/StatusCode'
          description: The HTTP status code for this GatewayResponse.
        responseParameters:
          type: object
          properties: {}
          description: Response parameters (paths, query strings and headers) of the GatewayResponse as a string-to-string
            map of key-value pairs.
        responseTemplates:
          type: object
          properties: {}
          description: Response templates of the GatewayResponse as a string-to-string map of key-value pairs.
        defaultResponse:
          $ref: '#/components/schemas/Boolean'
          description: A Boolean flag to indicate whether this GatewayResponse is the default gateway response (true) or not
            (false). A default gateway response is one generated by API Gateway without any customization by an API developer.
    GatewayResponses:
      description: The collection of the GatewayResponse instances of a RestApi as a responseType-to-GatewayResponse object
        map of key-value pairs. As such, pagination is not supported for querying this collection.
      type: object
      properties:
        position:
          $ref: '#/components/schemas/String'
        items_:
          $ref: '#/components/schemas/ListOfGatewayResponse'
          description: Returns the entire collection, because of no pagination support.
    ListOfGatewayResponse:
      type: array
      items:
        $ref: '#/components/schemas/GatewayResponse'
    Integration:
      description: Represents an HTTP, HTTP_PROXY, AWS, AWS_PROXY, or Mock integration.
      type: object
      properties:
        type_:
          $ref: '#/components/schemas/IntegrationType'
          description: 'Specifies an API method integration type. The valid value is one of the following: For the HTTP and
            HTTP proxy integrations, each integration can specify a protocol (http/https), port and path. Standard 80 and
            443 ports are supported as well as custom ports above 1024. An HTTP or HTTP proxy integration with a connectionType
            of VPC_LINK is referred to as a private integration and uses a VpcLink to connect API Gateway to a network load
            balancer of a VPC.'
        httpMethod:
          $ref: '#/components/schemas/String'
          description: Specifies the integration's HTTP method type. For the Type property, if you specify MOCK, this property
            is optional. For Lambda integrations, you must set the integration method to POST. For all other types, you must
            specify this property.
        uri:
          $ref: '#/components/schemas/String'
          description: Specifies Uniform Resource Identifier (URI) of the integration endpoint. For HTTP or HTTP_PROXY integrations,
            the URI must be a fully formed, encoded HTTP(S) URL according to the RFC-3986 specification for standard integrations.
            If connectionType is VPC_LINK specify the Network Load Balancer DNS name. For AWS or AWS_PROXY integrations, the
            URI is of the form arn:aws:apigateway:{region}:{subdomain.service|service}:path|action/{service_api}. Here, {Region}
            is the API Gateway region (e.g., us-east-1); {service} is the name of the integrated Amazon Web Services service
            (e.g., s3); and {subdomain} is a designated subdomain supported by certain Amazon Web Services service for fast
            host-name lookup. action can be used for an Amazon Web Services service action-based API, using an Action={name}&{p1}={v1}&p2={v2}...
            query string. The ensuing {service_api} refers to a supported action {name} plus any required input parameters.
            Alternatively, path can be used for an Amazon Web Services service path-based API. The ensuing service_api refers
            to the path to an Amazon Web Services service resource, including the region of the integrated Amazon Web Services
            service, if applicable. For example, for integration with the S3 API of GetObject, the uri can be either arn:aws:apigateway:us-west-2:s3:action/GetObject&Bucket={bucket}&Key={key}
            or arn:aws:apigateway:us-west-2:s3:path/{bucket}/{key}
        connectionType:
          $ref: '#/components/schemas/ConnectionType'
          description: The type of the network connection to the integration endpoint. The valid value is INTERNET for connections
            through the public routable internet or VPC_LINK for private connections between API Gateway and a network load
            balancer in a VPC. The default value is INTERNET.
        connectionId:
          $ref: '#/components/schemas/String'
          description: The ID of the VpcLink used for the integration when connectionType=VPC_LINK and undefined, otherwise.
        credentials:
          $ref: '#/components/schemas/String'
          description: Specifies the credentials required for the integration, if any. For AWS integrations, three options
            are available. To specify an IAM Role for API Gateway to assume, use the role's Amazon Resource Name (ARN). To
            require that the caller's identity be passed through from the request, specify the string arn:aws:iam::\*:user/\*.
            To use resource-based permissions on supported Amazon Web Services services, specify null.
        requestParameters:
          type: object
          properties: {}
          description: A key-value map specifying request parameters that are passed from the method request to the back end.
            The key is an integration request parameter name and the associated value is a method request parameter value
            or static value that must be enclosed within single quotes and pre-encoded as required by the back end. The method
            request parameter value must match the pattern of method.request.{location}.{name}, where location is querystring,
            path, or header and name must be a valid and unique method request parameter name.
        requestTemplates:
          type: object
          properties: {}
          description: Represents a map of Velocity templates that are applied on the request payload based on the value of
            the Content-Type header sent by the client. The content type value is the key in this map, and the template (as
            a String) is the value.
        passthroughBehavior:
          $ref: '#/components/schemas/String'
          description: 'Specifies how the method request body of an unmapped content type will be passed through the integration
            request to the back end without transformation. A content type is unmapped if no mapping template is defined in
            the integration or the content type does not match any of the mapped content types, as specified in requestTemplates.
            The valid value is one of the following: WHEN_NO_MATCH: passes the method request body through the integration
            request to the back end without transformation when the method request content type does not match any content
            type associated with the mapping templates defined in the integration request. WHEN_NO_TEMPLATES: passes the method
            request body through the integration request to the back end without transformation when no mapping template is
            defined in the integration request. If a template is defined when this option is selected, the method request
            of an unmapped content-type will be rejected with an HTTP 415 Unsupported Media Type response. NEVER: rejects
            the method request with an HTTP 415 Unsupported Media Type response when either the method request content type
            does not match any content type associated with the mapping templates defined in the integration request or no
            mapping template is defined in the integration request.'
        contentHandling:
          $ref: '#/components/schemas/ContentHandlingStrategy'
          description: 'Specifies how to handle request payload content type conversions. Supported values are CONVERT_TO_BINARY
            and CONVERT_TO_TEXT, with the following behaviors: If this property is not defined, the request payload will be
            passed through from the method request to integration request without modification, provided that the passthroughBehavior
            is configured to support payload pass-through.'
        timeoutInMillis:
          $ref: '#/components/schemas/Integer'
          description: Custom timeout between 50 and 29,000 milliseconds. The default value is 29,000 milliseconds or 29 seconds.
            You can increase the default value to longer than 29 seconds for Regional or private APIs only.
        cacheNamespace:
          $ref: '#/components/schemas/String'
          description: Specifies a group of related cached parameters. By default, API Gateway uses the resource ID as the
            cacheNamespace. You can specify the same cacheNamespace across resources to return the same cached data for requests
            to different resources.
        cacheKeyParameters:
          $ref: '#/components/schemas/ListOfString'
          description: A list of request parameters whose values API Gateway caches. To be valid values for cacheKeyParameters,
            these parameters must also be specified for Method requestParameters.
        integrationResponses:
          type: object
          properties: {}
          description: Specifies the integration's responses.
        tlsConfig:
          $ref: '#/components/schemas/TlsConfig'
          description: Specifies the TLS configuration for an integration.
        responseTransferMode:
          $ref: '#/components/schemas/ResponseTransferMode'
          description: The response transfer mode of the integration.
        integrationTarget:
          $ref: '#/components/schemas/String'
          description: The ALB or NLB listener to send the request to.
    IntegrationType:
      description: The integration type. The valid value is HTTP for integrating an API method with an HTTP backend; AWS with
        any Amazon Web Services service endpoints; MOCK for testing without actually invoking the backend; HTTP_PROXY for
        integrating with the HTTP proxy integration; AWS_PROXY for integrating with the Lambda proxy integration.
      type: string
      enum:
      - HTTP
      - AWS
      - MOCK
      - HTTP_PROXY
      - AWS_PROXY
    ConnectionType:
      type: string
      enum:
      - INTERNET
      - VPC_LINK
    ContentHandlingStrategy:
      type: string
      enum:
      - CONVERT_TO_BINARY
      - CONVERT_TO_TEXT
    TlsConfig:
      description: Specifies the TLS configuration for an integration.
      type: object
      properties:
        insecureSkipVerification:
          $ref: '#/components/schemas/Boolean'
          description: Specifies whether or not API Gateway skips verification that the certificate for an integration endpoint
            is issued by a supported certificate authority. This isn’t recommended, but it enables you to use certificates
            that are signed by private certificate authorities, or certificates that are self-signed. If enabled, API Gateway
            still performs basic certificate validation, which includes checking the certificate's expiration date, hostname,
            and presence of a root certificate authority. Supported only for HTTP and HTTP_PROXY integrations. Enabling insecureSkipVerification
            isn't recommended, especially for integrations with public HTTPS endpoints. If you enable insecureSkipVerification,
            you increase the risk of man-in-the-middle attacks.
    ResponseTransferMode:
      type: string
      enum:
      - BUFFERED
      - STREAM
    IntegrationResponse:
      description: Represents an integration response. The status code must map to an existing MethodResponse, and parameters
        and templates can be used to transform the back-end response.
      type: object
      properties:
        statusCode:
          $ref: '#/components/schemas/StatusCode'
          description: Specifies the status code that is used to map the integration response to an existing MethodResponse.
        selectionPattern:
          $ref: '#/components/schemas/String'
          description: Specifies the regular expression (regex) pattern used to choose an integration response based on the
            response from the back end. For example, if the success response returns nothing and the error response returns
            some string, you could use the .+ regex to match error response. However, make sure that the error response does
            not contain any newline (\n) character in such cases. If the back end is an Lambda function, the Lambda function
            error header is matched. For all other HTTP and Amazon Web Services back ends, the HTTP status code is matched.
        responseParameters:
          type: object
          properties: {}
          description: A key-value map specifying response parameters that are passed to the method response from the back
            end. The key is a method response header parameter name and the mapped value is an integration response header
            value, a static value enclosed within a pair of single quotes, or a JSON expression from the integration response
            body. The mapping key must match the pattern of method.response.header.{name}, where name is a valid and unique
            header name. The mapped non-static value must match the pattern of integration.response.header.{name} or integration.response.body.{JSON-expression},
            where name is a valid and unique response header name and JSON-expression is a valid JSON expression without the
            $ prefix.
        responseTemplates:
          type: object
          properties: {}
          description: Specifies the templates used to transform the integration response body. Response templates are represented
            as a key/value map, with a content-type as the key and a template as the value.
        contentHandling:
          $ref: '#/components/schemas/ContentHandlingStrategy'
          description: 'Specifies how to handle response payload content type conversions. Supported values are CONVERT_TO_BINARY
            and CONVERT_TO_TEXT, with the following behaviors: If this property is not defined, the response payload will
            be passed through from the integration response to the method response without modification.'
    Method:
      description: Represents a client-facing interface by which the client calls the API to access back-end resources. A
        Method resource is integrated with an Integration resource. Both consist of a request and one or more responses. The
        method request takes the client input that is passed to the back end through the integration request. A method response
        returns the output from the back end to the client through an integration response. A method request is embodied in
        a Method resource, whereas an integration request is embodied in an Integration resource. On the other hand, a method
        response is represented by a MethodResponse resource, whereas an integration response is represented by an IntegrationResponse
        resource.
      type: object
      properties:
        httpMethod:
          $ref: '#/components/schemas/String'
          description: The method's HTTP verb.
        authorizationType:
          $ref: '#/components/schemas/String'
          description: The method's authorization type. Valid values are NONE for open access, AWS_IAM for using AWS IAM permissions,
            CUSTOM for using a custom authorizer, or COGNITO_USER_POOLS for using a Cognito user pool.
        authorizerId:
          $ref: '#/components/schemas/String'
          description: The identifier of an Authorizer to use on this method. The authorizationType must be CUSTOM.
        apiKeyRequired:
          $ref: '#/components/schemas/NullableBoolean'
          description: A boolean flag specifying whether a valid ApiKey is required to invoke this method.
        requestValidatorId:
          $ref: '#/components/schemas/String'
          description: The identifier of a RequestValidator for request validation.
        operationName:
          $ref: '#/components/schemas/String'
          description: A human-friendly operation identifier for the method. For example, you can assign the operationName
            of ListPets for the GET /pets method in the PetStore example.
        requestParameters:
          type: object
          properties: {}
          description: A key-value map defining required or optional method request parameters that can be accepted by API
            Gateway. A key is a method request parameter name matching the pattern of method.request.{location}.{name}, where
            location is querystring, path, or header and name is a valid and unique parameter name. The value associated with
            the key is a Boolean flag indicating whether the parameter is required (true) or optional (false). The method
            request parameter names defined here are available in Integration to be mapped to integration request parameters
            or templates.
        requestModels:
          type: object
          properties: {}
          description: A key-value map specifying data schemas, represented by Model resources, (as the mapped value) of the
            request payloads of given content types (as the mapping key).
        methodResponses:
          type: object
          properties: {}
          description: Gets a method response associated with a given HTTP status code.
        methodIntegration:
          $ref: '#/components/schemas/Integration'
          description: Gets the method's integration responsible for passing the client-submitted request to the back end
            and performing necessary transformations to make the request compliant with the back end.
        authorizationScopes:
          $ref: '#/components/schemas/ListOfString'
          description: A list of authorization scopes configured on the method. The scopes are used with a COGNITO_USER_POOLS
            authorizer to authorize the method invocation. The authorization works by matching the method scopes against the
            scopes parsed from the access token in the incoming request. The method invocation is authorized if any method
            scopes matches a claimed scope in the access token. Otherwise, the invocation is not authorized. When the method
            scope is configured, the client must provide an access token instead of an identity token for authorization purposes.
    MethodResponse:
      description: Represents a method response of a given HTTP status code returned to the client. The method response is
        passed from the back end through the associated integration response that can be transformed using a mapping template.
      type: object
      properties:
        statusCode:
          $ref: '#/components/schemas/StatusCode'
          description: The method response's status code.
        responseParameters:
          type: object
          properties: {}
          description: A key-value map specifying required or optional response parameters that API Gateway can send back
            to the caller. A key defines a method response header and the value specifies whether the associated method response
            header is required or not. The expression of the key must match the pattern method.response.header.{name}, where
            name is a valid and unique header name. API Gateway passes certain integration response data to the method response
            headers specified here according to the mapping you prescribe in the API's IntegrationResponse. The integration
            response data that can be mapped include an integration response header expressed in integration.response.header.{name},
            a static value enclosed within a pair of single quotes (e.g., 'application/json'), or a JSON expression from the
            back-end response payload in the form of integration.response.body.{JSON-expression}, where JSON-expression is
            a valid JSON expression without the $ prefix.)
        responseModels:
          type: object
          properties: {}
          description: Specifies the Model resources used for the response's content-type. Response models are represented
            as a key/value map, with a content-type as the key and a Model name as the value.
    Template:
      description: Represents a mapping template used to transform a payload.
      type: object
      properties:
        value:
          $ref: '#/components/schemas/String'
          description: The Apache Velocity Template Language (VTL) template content used for the template resource.
    Models:
      description: Represents a collection of Model resources.
      type: object
      properties:
        position:
          $ref: '#/components/schemas/String'
        items_:
          $ref: '#/components/schemas/ListOfModel'
          description: The current page of elements from this collection.
    ListOfModel:
      type: array
      items:
        $ref: '#/components/schemas/Model'
    RequestValidators:
      description: A collection of RequestValidator resources of a given RestApi.
      type: object
      properties:
        position:
          $ref: '#/components/schemas/String'
        items_:
          $ref: '#/components/schemas/ListOfRequestValidator'
          description: The current page of elements from this collection.
    ListOfRequestValidator:
      type: array
      items:
        $ref: '#/components/schemas/RequestValidator'
    Resources:
      description: Represents a collection of Resource resources.
      type: object
      properties:
        position:
          $ref: '#/components/schemas/String'
        items_:
          $ref: '#/components/schemas/ListOfResource'
          description: The current page of elements from this collection.
    ListOfResource:
      type: array
      items:
        $ref: '#/components/schemas/Resource'
    RestApis:
      description: Contains references to your APIs and links that guide you in how to interact with your collection. A collection
        offers a paginated view of your APIs.
      type: object
      properties:
        position:
          $ref: '#/components/schemas/String'
        items_:
          $ref: '#/components/schemas/ListOfRestApi'
          description: The current page of elements from this collection.
    ListOfRestApi:
      type: array
      items:
        $ref: '#/components/schemas/RestApi'
    SdkResponse:
      description: The binary blob response to GetSdk, which contains the generated SDK.
      type: object
      properties:
        contentType:
          $ref: '#/components/schemas/String'
          description: The content-type header value in the HTTP response.
        contentDisposition:
          $ref: '#/components/schemas/String'
          description: The content-disposition header value in the HTTP response.
        body:
          $ref: '#/components/schemas/Blob'
          description: The binary blob response to GetSdk, which contains the generated SDK.
    SdkType:
      description: A type of SDK that API Gateway can generate.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/String'
          description: The identifier of an SdkType instance.
        friendlyName:
          $ref: '#/components/schemas/String'
          description: The user-friendly name of an SdkType instance.
        description:
          $ref: '#/components/schemas/String'
          description: The description of an SdkType.
        configurationProperties:
          $ref: '#/components/schemas/ListOfSdkConfigurationProperty'
          description: A list of configuration properties of an SdkType.
    ListOfSdkConfigurationProperty:
      type: array
      items:
        $ref: '#/components/schemas/SdkConfigurationProperty'
    SdkConfigurationProperty:
      description: A configuration property of an SDK type.
      type: object
      properties:
        name:
          $ref: '#/components/schemas/String'
          description: The name of a an SdkType configuration property.
        friendlyName:
          $ref: '#/components/schemas/String'
          description: The user-friendly name of an SdkType configuration property.
        description:
          $ref: '#/components/schemas/String'
          description: The description of an SdkType configuration property.
        required_:
          $ref: '#/components/schemas/Boolean'
          description: A boolean flag of an SdkType configuration property to indicate if the associated SDK configuration
            property is required (true) or not (false).
        defaultValue:
          $ref: '#/components/schemas/String'
          description: The default value of an SdkType configuration property.
    SdkTypes:
      description: The collection of SdkType instances.
      type: object
      properties:
        position:
          $ref: '#/components/schemas/String'
        items_:
          $ref: '#/components/schemas/ListOfSdkType'
          description: The current page of elements from this collection.
    ListOfSdkType:
      type: array
      items:
        $ref: '#/components/schemas/SdkType'
    Stages:
      description: A list of Stage resources that are associated with the ApiKey resource.
      type: object
      properties:
        item:
          $ref: '#/components/schemas/ListOfStage'
          description: The current page of elements from this collection.
    ListOfStage:
      type: array
      items:
        $ref: '#/components/schemas/Stage'
    Tags:
      description: The collection of tags. Each tag element is associated with a given resource.
      type: object
      properties:
        tags:
          type: object
          properties: {}
          description: The collection of tags. Each tag element is associated with a given resource.
    Usage:
      description: Represents the usage data of a usage plan.
      type: object
      properties:
        usagePlanId:
          $ref: '#/components/schemas/String'
          description: The plan Id associated with this usage data.
        startDate:
          $ref: '#/components/schemas/String'
          description: The starting date of the usage data.
        endDate:
          $ref: '#/components/schemas/String'
          description: The ending date of the usage data.
        position:
          $ref: '#/components/schemas/String'
        items_:
          type: object
          properties: {}
          description: 'The usage data, as daily logs of used and remaining quotas, over the specified time interval indexed
            over the API keys in a usage plan. For example, {..., "values" : { "{api_key}" : [ [0, 100], [10, 90], [100, 10]]},
            where {api_key} stands for an API key value and the daily log entry is of the format [used quota, remaining quota].'
    UsagePlanKeys:
      description: Represents the collection of usage plan keys added to usage plans for the associated API keys and, possibly,
        other types of keys.
      type: object
      properties:
        position:
          $ref: '#/components/schemas/String'
        items_:
          $ref: '#/components/schemas/ListOfUsagePlanKey'
          description: The current page of elements from this collection.
    ListOfUsagePlanKey:
      type: array
      items:
        $ref: '#/components/schemas/UsagePlanKey'
    UsagePlans:
      description: Represents a collection of usage plans for an AWS account.
      type: object
      properties:
        position:
          $ref: '#/components/schemas/String'
        items_:
          $ref: '#/components/schemas/ListOfUsagePlan'
          description: The current page of elements from this collection.
    ListOfUsagePlan:
      type: array
      items:
        $ref: '#/components/schemas/UsagePlan'
    VpcLinks:
      description: The collection of VPC links under the caller's account in a region.
      type: object
      properties:
        position:
          $ref: '#/components/schemas/String'
        items_:
          $ref: '#/components/schemas/ListOfVpcLink'
          description: The current page of elements from this collection.
    ListOfVpcLink:
      type: array
      items:
        $ref: '#/components/schemas/VpcLink'
    ApiKeysFormat:
      type: string
      enum:
      - csv
    ApiKeyIds:
      description: The identifier of an ApiKey used in a UsagePlan.
      type: object
      properties:
        ids:
          $ref: '#/components/schemas/ListOfString'
          description: A list of all the ApiKey identifiers.
        warnings:
          $ref: '#/components/schemas/ListOfString'
          description: A list of warning messages.
    PutMode:
      type: string
      enum:
      - merge
      - overwrite
    DocumentationPartIds:
      description: A collection of the imported DocumentationPart identifiers.
      type: object
      properties:
        ids:
          $ref: '#/components/schemas/ListOfString'
          description: A list of the returned documentation part identifiers.
        warnings:
          $ref: '#/components/schemas/ListOfString'
          description: A list of warning messages reported during import of documentation parts.
    MapOfStringToBoolean:
      type: object
      properties: {}
    MapOfStringToList:
      type: object
      properties: {}
    TestInvokeAuthorizerResponse:
      description: Represents the response of the test invoke request for a custom Authorizer
      type: object
      properties:
        clientStatus:
          $ref: '#/components/schemas/Integer'
          description: The HTTP status code that the client would have received. Value is 0 if the authorizer succeeded.
        log:
          $ref: '#/components/schemas/String'
          description: The API Gateway execution log for the test authorizer request.
        latency:
          $ref: '#/components/schemas/Long'
          description: The execution latency, in ms, of the test authorizer request.
        principalId:
          $ref: '#/components/schemas/String'
          description: The principal identity returned by the Authorizer
        policy:
          $ref: '#/components/schemas/String'
          description: The JSON policy document returned by the Authorizer
        authorization:
          type: object
          properties: {}
          description: The authorization response.
        claims:
          type: object
          properties: {}
          description: The open identity claims, with any supported custom attributes, returned from the Cognito Your User
            Pool configured for the API.
    Long:
      type: integer
      format: int64
    TestInvokeMethodResponse:
      description: Represents the response of the test invoke request in the HTTP method.
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Integer'
          description: The HTTP status code.
        body:
          $ref: '#/components/schemas/String'
          description: The body of the HTTP response.
        headers:
          type: object
          properties: {}
          description: The headers of the HTTP response.
        multiValueHeaders:
          type: object
          properties: {}
          description: The headers of the HTTP response as a map from string to list of values.
        log:
          $ref: '#/components/schemas/String'
          description: The API Gateway execution log for the test invoke request.
        latency:
          $ref: '#/components/schemas/Long'
          description: The execution latency, in ms, of the test invoke request.
    ListOfPatchOperation:
      description: A list of operations describing the updates to apply to the specified resource. The patches are applied
        in the order specified in the list.
      type: array
      items:
        $ref: '#/components/schemas/PatchOperation'
    PatchOperation:
      description: For more information about supported patch operations, see Patch Operations.
      type: object
      properties:
        op:
          $ref: '#/components/schemas/Op'
          description: An update operation to be performed with this PATCH request. The valid value can be add, remove, replace
            or copy. Not all valid operations are supported for a given resource. Support of the operations depends on specific
            operational contexts. Attempts to apply an unsupported operation on a resource will return an error message..
        path:
          $ref: '#/components/schemas/String'
          description: 'The op operation''s target, as identified by a JSON Pointer value that references a location within
            the targeted resource. For example, if the target resource has an updateable property of {"name":"value"}, the
            path for this property is /name. If the name property value is a JSON object (e.g., {"name": {"child/name": "child-value"}}),
            the path for the child/name property will be /name/child~1name. Any slash ("/") character appearing in path names
            must be escaped with "~1", as shown in the example above. Each op operation can have only one path associated
            with it.'
        value:
          $ref: '#/components/schemas/String'
          description: 'The new target value of the update operation. It is applicable for the add or replace operation. When
            using AWS CLI to update a property of a JSON value, enclose the JSON object with a pair of single quotes in a
            Linux shell, e.g., ''{"a": ...}''.'
        from:
          $ref: '#/components/schemas/String'
          description: The copy update operation's source as identified by a JSON-Pointer value referencing the location within
            the targeted resource to copy the value from. For example, to promote a canary deployment, you copy the canary
            deployment ID to the affiliated deployment ID by calling a PATCH request on a Stage resource with "op":"copy",
            "from":"/canarySettings/deploymentId" and "path":"/deploymentId".
    Op:
      type: string
      enum:
      - add
      - remove
      - replace
      - move
      - copy
      - test
