        street2:
          $ref: '#/components/schemas/street2'
        street3:
          $ref: '#/components/schemas/street3'
        APIVersion:
          $ref: '#/components/schemas/APIVersion'
      required:
      - jobIds
    GetStatusOutputDisplay:
      type: object
      properties:
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/GetStatusOutputDisplay'
    GetStatusInput:
      description: Input structure for the GetStatus operation.
      type: object
      properties:
        JobId:
          $ref: '#/components/schemas/JobId'
        APIVersion:
          $ref: '#/components/schemas/APIVersion'
      required:
      - JobId
    MaxJobs:
      description: Sets the maximum number of jobs returned in the response. If there are additional jobs that were not returned
        because MaxJobs was exceeded, the response contains `<IsTruncated>`true</IsTruncated>. To return the additional jobs,
        see Marker.
      type: integer
    Marker:
      description: Specifies the JOBID to start after when listing the jobs created with your account. AWS Import/Export lists
        your jobs in reverse chronological order. See MaxJobs.
      type: string
    JobDisplay:
      type: object
      properties:
        job_id:
          type: string
          description: A unique identifier which refers to a particular job.
        creation_date:
          type: string
          description: Timestamp of the CreateJob request in ISO8601 date format. For example "2010-03-28T20:27:35Z".
        is_canceled:
          type: boolean
          description: Indicates whether the job was canceled.
        job_type:
          type: string
          description: Specifies whether the job to initiate is an import or export job.
    ListJobsOutputDisplay:
      type: object
      properties:
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/JobDisplay'
    ListJobsInput:
      description: Input structure for the ListJobs operation.
      type: object
      properties:
        MaxJobs:
          $ref: '#/components/schemas/MaxJobs'
        Marker:
          $ref: '#/components/schemas/Marker'
        APIVersion:
          $ref: '#/components/schemas/APIVersion'
    UpdateJobOutputDisplay:
      type: object
      properties:
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateJobOutputDisplay'
    UpdateJobInput:
      description: Input structure for the UpateJob operation.
      type: object
      properties:
        JobId:
          $ref: '#/components/schemas/JobId'
        Manifest:
          $ref: '#/components/schemas/Manifest'
        JobType:
          $ref: '#/components/schemas/JobType'
        ValidateOnly:
          $ref: '#/components/schemas/ValidateOnly'
        APIVersion:
          $ref: '#/components/schemas/APIVersion'
      required:
      - JobId
      - Manifest
      - JobType
      - ValidateOnly
