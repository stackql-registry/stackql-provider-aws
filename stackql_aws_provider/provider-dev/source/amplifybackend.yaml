openapi: 3.0.0
info:
  version: '2020-08-11'
  title: AmplifyBackend
  description: AmplifyBackend
  x-serviceName: amplifybackend
  x-serviceAlias: amplifybackend
  x-protocol: rest-json
  x-apiVersion: '2020-08-11'
  x-endpointPrefix: amplifybackend
  x-jsonVersion: '1.1'
servers:
- url: https://amplifybackend.{region}.amazonaws.com
  variables:
    region:
      default: us-east-1
      description: AWS region
  description: Regional endpoint for amplifybackend
paths:
  /backend/{app_id}/environments/{backend_environment_name}/clone:
    post:
      operationId: CloneBackend
      description: This operation clones an existing backend.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                TargetEnvironmentName:
                  $ref: '#/components/schemas/__string'
              required:
              - TargetEnvironmentName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloneBackendResponse'
      x-stackql-resource: clone_backend
      x-stackql-method: clone_backend
      x-stackql-verb: EXEC
  /backend:
    post:
      operationId: CreateBackend
      description: This operation creates a backend for an Amplify app. Backends are automatically created at the time of
        app creation.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                AppId:
                  $ref: '#/components/schemas/__string'
                AppName:
                  $ref: '#/components/schemas/__string'
                BackendEnvironmentName:
                  $ref: '#/components/schemas/__string'
                ResourceConfig:
                  $ref: '#/components/schemas/ResourceConfig'
                ResourceName:
                  $ref: '#/components/schemas/__string'
              required:
              - AppId
              - AppName
              - BackendEnvironmentName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBackendResponse'
      x-stackql-resource: backends
      x-stackql-method: create_backend
      x-stackql-verb: INSERT
  /backend/{app_id}/api:
    post:
      operationId: CreateBackendAPI
      description: Creates a new backend API resource.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                BackendEnvironmentName:
                  $ref: '#/components/schemas/__string'
                ResourceConfig:
                  $ref: '#/components/schemas/BackendAPIResourceConfig'
                ResourceName:
                  $ref: '#/components/schemas/__string'
              required:
              - BackendEnvironmentName
              - ResourceConfig
              - ResourceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBackendAPIResponse'
      x-stackql-resource: backend_apis
      x-stackql-method: create_backend_api
      x-stackql-verb: INSERT
  /backend/{app_id}/auth:
    post:
      operationId: CreateBackendAuth
      description: Creates a new backend authentication resource.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                BackendEnvironmentName:
                  $ref: '#/components/schemas/__string'
                ResourceConfig:
                  $ref: '#/components/schemas/CreateBackendAuthResourceConfig'
                ResourceName:
                  $ref: '#/components/schemas/__string'
              required:
              - BackendEnvironmentName
              - ResourceConfig
              - ResourceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBackendAuthResponse'
      x-stackql-resource: backend_auths
      x-stackql-method: create_backend_auth
      x-stackql-verb: INSERT
  /backend/{app_id}/config:
    post:
      operationId: CreateBackendConfig
      description: Creates a config object for a backend.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                BackendManagerAppId:
                  $ref: '#/components/schemas/__string'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBackendConfigResponse'
      x-stackql-resource: backend_configs
      x-stackql-method: create_backend_config
      x-stackql-verb: INSERT
  /backend/{app_id}/storage:
    post:
      operationId: CreateBackendStorage
      description: Creates a backend storage resource.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                BackendEnvironmentName:
                  $ref: '#/components/schemas/__string'
                ResourceConfig:
                  $ref: '#/components/schemas/CreateBackendStorageResourceConfig'
                ResourceName:
                  $ref: '#/components/schemas/__string'
              required:
              - BackendEnvironmentName
              - ResourceConfig
              - ResourceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBackendStorageResponse'
      x-stackql-resource: backend_storages
      x-stackql-method: create_backend_storage
      x-stackql-verb: INSERT
  /backend/{app_id}/challenge:
    post:
      operationId: CreateToken
      description: Generates a one-time challenge code to authenticate a user into your Amplify Admin UI.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenResponse'
      x-stackql-resource: tokens
      x-stackql-method: create_token
      x-stackql-verb: INSERT
  /backend/{app_id}/environments/{backend_environment_name}/remove:
    post:
      operationId: DeleteBackend
      description: Removes an existing environment from your Amplify project.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBackendResponse'
      x-stackql-resource: backends
      x-stackql-method: delete_backend
      x-stackql-verb: DELETE
  /backend/{app_id}/api/{backend_environment_name}/remove:
    post:
      operationId: DeleteBackendAPI
      description: Deletes an existing backend API resource.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ResourceConfig:
                  $ref: '#/components/schemas/BackendAPIResourceConfig'
                ResourceName:
                  $ref: '#/components/schemas/__string'
              required:
              - ResourceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBackendAPIResponse'
      x-stackql-resource: backend_apis
      x-stackql-method: delete_backend_api
      x-stackql-verb: DELETE
  /backend/{app_id}/auth/{backend_environment_name}/remove:
    post:
      operationId: DeleteBackendAuth
      description: Deletes an existing backend authentication resource.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ResourceName:
                  $ref: '#/components/schemas/__string'
              required:
              - ResourceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBackendAuthResponse'
      x-stackql-resource: backend_auths
      x-stackql-method: delete_backend_auth
      x-stackql-verb: DELETE
  /backend/{app_id}/storage/{backend_environment_name}/remove:
    post:
      operationId: DeleteBackendStorage
      description: Removes the specified backend storage resource.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ResourceName:
                  $ref: '#/components/schemas/__string'
                ServiceName:
                  $ref: '#/components/schemas/ServiceName'
              required:
              - ResourceName
              - ServiceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBackendStorageResponse'
      x-stackql-resource: backend_storages
      x-stackql-method: delete_backend_storage
      x-stackql-verb: DELETE
  /backend/{app_id}/challenge/{session_id}/remove:
    post:
      operationId: DeleteToken
      description: Deletes the challenge token based on the given appId and sessionId.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The session ID.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTokenResponse'
      x-stackql-resource: tokens
      x-stackql-method: delete_token
      x-stackql-verb: DELETE
  /backend/{app_id}/api/{backend_environment_name}/generateModels:
    post:
      operationId: GenerateBackendAPIModels
      description: Generates a model schema for an existing backend API resource.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ResourceName:
                  $ref: '#/components/schemas/__string'
              required:
              - ResourceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateBackendAPIModelsResponse'
      x-stackql-resource: backend_api_models
      x-stackql-method: generate_backend_api_models
      x-stackql-verb: EXEC
  /backend/{app_id}/details:
    post:
      operationId: GetBackend
      description: Provides project-level details for your Amplify UI project.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                BackendEnvironmentName:
                  $ref: '#/components/schemas/__string'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBackendResponse'
      x-stackql-resource: backends
      x-stackql-method: get_backend
      x-stackql-verb: SELECT
  /backend/{app_id}/api/{backend_environment_name}/details:
    post:
      operationId: GetBackendAPI
      description: Gets the details for a backend API.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ResourceConfig:
                  $ref: '#/components/schemas/BackendAPIResourceConfig'
                ResourceName:
                  $ref: '#/components/schemas/__string'
              required:
              - ResourceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBackendAPIResponse'
      x-stackql-resource: backend_apis
      x-stackql-method: get_backend_api
      x-stackql-verb: SELECT
  /backend/{app_id}/api/{backend_environment_name}/getModels:
    post:
      operationId: GetBackendAPIModels
      description: Gets a model introspection schema for an existing backend API resource.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ResourceName:
                  $ref: '#/components/schemas/__string'
              required:
              - ResourceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBackendAPIModelsResponse'
      x-stackql-resource: backend_api_models
      x-stackql-method: get_backend_api_models
      x-stackql-verb: SELECT
  /backend/{app_id}/auth/{backend_environment_name}/details:
    post:
      operationId: GetBackendAuth
      description: Gets a backend auth details.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ResourceName:
                  $ref: '#/components/schemas/__string'
              required:
              - ResourceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBackendAuthResponse'
      x-stackql-resource: backend_auths
      x-stackql-method: get_backend_auth
      x-stackql-verb: SELECT
  /backend/{app_id}/job/{backend_environment_name}/{job_id}:
    get:
      operationId: GetBackendJob
      description: Returns information about a specific job.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The ID for the job.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBackendJobResponse'
      x-stackql-resource: backend_jobs
      x-stackql-method: get_backend_job
      x-stackql-verb: SELECT
    post:
      operationId: UpdateBackendJob
      description: Updates a specific job.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The ID for the job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Operation:
                  $ref: '#/components/schemas/__string'
                Status:
                  $ref: '#/components/schemas/__string'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBackendJobResponse'
      x-stackql-resource: backend_jobs
      x-stackql-method: update_backend_job
      x-stackql-verb: UPDATE
  /backend/{app_id}/storage/{backend_environment_name}/details:
    post:
      operationId: GetBackendStorage
      description: Gets details for a backend storage resource.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ResourceName:
                  $ref: '#/components/schemas/__string'
              required:
              - ResourceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBackendStorageResponse'
      x-stackql-resource: backend_storages
      x-stackql-method: get_backend_storage
      x-stackql-verb: SELECT
  /backend/{app_id}/challenge/{session_id}:
    get:
      operationId: GetToken
      description: Gets the challenge token based on the given appId and sessionId.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The session ID.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTokenResponse'
      x-stackql-resource: tokens
      x-stackql-method: get_token
      x-stackql-verb: SELECT
  /backend/{app_id}/auth/{backend_environment_name}/import:
    post:
      operationId: ImportBackendAuth
      description: Imports an existing backend authentication resource.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                IdentityPoolId:
                  $ref: '#/components/schemas/__string'
                NativeClientId:
                  $ref: '#/components/schemas/__string'
                UserPoolId:
                  $ref: '#/components/schemas/__string'
                WebClientId:
                  $ref: '#/components/schemas/__string'
              required:
              - NativeClientId
              - UserPoolId
              - WebClientId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBackendAuthResponse'
      x-stackql-resource: backend_auth
      x-stackql-method: import_backend_auth
      x-stackql-verb: EXEC
  /backend/{app_id}/storage/{backend_environment_name}/import:
    post:
      operationId: ImportBackendStorage
      description: Imports an existing backend storage resource.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                BucketName:
                  $ref: '#/components/schemas/__string'
                ServiceName:
                  $ref: '#/components/schemas/ServiceName'
              required:
              - ServiceName
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBackendStorageResponse'
      x-stackql-resource: backend_storage
      x-stackql-method: import_backend_storage
      x-stackql-verb: EXEC
  /backend/{app_id}/job/{backend_environment_name}:
    post:
      operationId: ListBackendJobs
      description: Lists the jobs for the backend of an Amplify app.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      - name: backend_environment_name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The name of the backend environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                JobId:
                  $ref: '#/components/schemas/__string'
                MaxResults:
                  $ref: '#/components/schemas/__integerMin1Max25'
                NextToken:
                  $ref: '#/components/schemas/__string'
                Operation:
                  $ref: '#/components/schemas/__string'
                Status:
                  $ref: '#/components/schemas/__string'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBackendJobsResponse'
      x-stackql-resource: backend_jobs
      x-stackql-method: list_backend_jobs
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.Jobs
  /s3Buckets:
    post:
      operationId: ListS3Buckets
      description: The list of S3 buckets in your account.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                NextToken:
                  $ref: '#/components/schemas/__string'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListS3BucketsResponse'
      x-stackql-resource: s3_buckets
      x-stackql-method: list_s3_buckets
      x-stackql-verb: SELECT
  /backend/{app_id}/remove:
    post:
      operationId: RemoveAllBackends
      description: Removes all backend environments from your Amplify project.
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/__string'
        description: The app ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                CleanAmplifyApp:
                  $ref: '#/components/schemas/__boolean'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveAllBackendsResponse'
      x-stackql-resource: all_backends
