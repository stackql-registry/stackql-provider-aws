          $ref: '#/components/schemas/CreateBackendAuthIdentityPoolConfig'
          description: Describes the authorization configuration for the Amazon Cognito identity pool, provisioned as a part
            of your auth resource in the Amplify project.
        Service:
          $ref: '#/components/schemas/Service'
          description: Defines the service name to use when configuring an authentication resource in your Amplify project.
        UserPoolConfigs:
          $ref: '#/components/schemas/CreateBackendAuthUserPoolConfig'
          description: Describes authentication configuration for the Amazon Cognito user pool, provisioned as a part of your
            auth resource in the Amplify project.
      required:
      - AuthResources
      - UserPoolConfigs
      - Service
