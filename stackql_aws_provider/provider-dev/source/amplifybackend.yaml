            as a part of your Amplify project.
        Mfa:
          $ref: '#/components/schemas/CreateBackendAuthMFAConfig'
          description: Describes whether to apply multi-factor authentication policies for your Amazon Cognito user pool configured
            as a part of your Amplify project.
