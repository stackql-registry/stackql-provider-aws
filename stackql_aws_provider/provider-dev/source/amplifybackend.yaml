            your data models.
        Description:
          $ref: '#/components/schemas/__string'
          description: The API key description for API_KEY, if it was used as an authentication mechanism to access your data
            models.
        ExpirationTime:
          $ref: '#/components/schemas/__double'
          description: The API key expiration time for API_KEY, if it was used as an authentication mechanism to access your
            data models.
        OpenIDAuthTTL:
          $ref: '#/components/schemas/__string'
          description: The expiry time for the OpenID authentication mechanism.
        OpenIDClientId:
          $ref: '#/components/schemas/__string'
          description: The clientID for openID, if openID was used as an authentication setting to access your data models.
        OpenIDIatTTL:
          $ref: '#/components/schemas/__string'
          description: The expiry time for the OpenID authentication mechanism.
        OpenIDIssueURL:
          $ref: '#/components/schemas/__string'
          description: The openID issuer URL, if openID was used as an authentication setting to access your data models.
        OpenIDProviderName:
          $ref: '#/components/schemas/__string'
