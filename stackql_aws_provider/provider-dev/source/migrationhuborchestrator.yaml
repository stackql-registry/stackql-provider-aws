openapi: 3.0.0
info:
  version: '2021-08-28'
  title: AWS Migration Hub Orchestrator
  description: AWS Migration Hub Orchestrator
  x-serviceName: migrationhub-orchestrator
  x-serviceAlias: migrationhuborchestrator
  x-protocol: rest-json
  x-apiVersion: '2021-08-28'
  x-endpointPrefix: migrationhub-orchestrator
  x-jsonVersion: '1.1'
servers:
- url: https://migrationhub-orchestrator.{region}.amazonaws.com
  variables:
    region:
      default: us-east-1
      description: AWS region
  description: Regional endpoint for migrationhuborchestrator
paths:
  /template:
    post:
      operationId: CreateTemplate
      description: Creates a migration workflow template.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateName:
                  $ref: '#/components/schemas/CreateTemplateRequestTemplateNameString'
                templateDescription:
                  $ref: '#/components/schemas/CreateTemplateRequestTemplateDescriptionString'
                templateSource:
                  $ref: '#/components/schemas/TemplateSource'
                clientToken:
                  $ref: '#/components/schemas/ClientToken'
                tags:
                  $ref: '#/components/schemas/TagMap'
              required:
              - templateName
              - templateSource
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTemplateResponse'
      x-stackql-resource: templates
      x-stackql-method: create_template
      x-stackql-verb: INSERT
  /migrationworkflow/:
    post:
      operationId: CreateWorkflow
      description: Create a workflow to orchestrate your migrations.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/CreateMigrationWorkflowRequestNameString'
                description:
                  $ref: '#/components/schemas/CreateMigrationWorkflowRequestDescriptionString'
                templateId:
                  $ref: '#/components/schemas/CreateMigrationWorkflowRequestTemplateIdString'
                applicationConfigurationId:
                  $ref: '#/components/schemas/CreateMigrationWorkflowRequestApplicationConfigurationIdString'
                inputParameters:
                  $ref: '#/components/schemas/StepInputParameters'
                stepTargets:
                  $ref: '#/components/schemas/StringList'
                tags:
                  $ref: '#/components/schemas/StringMap'
              required:
              - name
              - templateId
              - inputParameters
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMigrationWorkflowResponse'
      x-stackql-resource: workflows
      x-stackql-method: create_workflow
      x-stackql-verb: INSERT
  /workflowstep:
    post:
      operationId: CreateWorkflowStep
      description: Create a step in the migration workflow.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/MigrationWorkflowName'
                stepGroupId:
                  $ref: '#/components/schemas/StepGroupId'
                workflowId:
                  $ref: '#/components/schemas/MigrationWorkflowId'
                stepActionType:
                  $ref: '#/components/schemas/StepActionType'
                description:
                  $ref: '#/components/schemas/MigrationWorkflowDescription'
                workflowStepAutomationConfiguration:
                  $ref: '#/components/schemas/WorkflowStepAutomationConfiguration'
                stepTarget:
                  $ref: '#/components/schemas/StringList'
                outputs:
                  $ref: '#/components/schemas/WorkflowStepOutputList'
                previous:
                  $ref: '#/components/schemas/StringList'
                next:
                  $ref: '#/components/schemas/StringList'
              required:
              - name
              - stepGroupId
              - workflowId
              - stepActionType
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkflowStepResponse'
      x-stackql-resource: workflow_steps
      x-stackql-method: create_workflow_step
      x-stackql-verb: INSERT
  /workflowstepgroups:
    post:
      operationId: CreateWorkflowStepGroup
      description: Create a step group in a migration workflow.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflowId:
                  $ref: '#/components/schemas/MigrationWorkflowId'
                name:
                  $ref: '#/components/schemas/StepGroupName'
                description:
                  $ref: '#/components/schemas/StepGroupDescription'
                next:
                  $ref: '#/components/schemas/StringList'
                previous:
                  $ref: '#/components/schemas/StringList'
              required:
              - workflowId
              - name
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkflowStepGroupResponse'
      x-stackql-resource: workflow_step_groups
      x-stackql-method: create_workflow_step_group
      x-stackql-verb: INSERT
    get:
      operationId: ListWorkflowStepGroups
      description: List the step groups in a migration workflow.
      parameters:
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NextToken'
        description: The pagination token.
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The maximum number of results that can be returned.
      - name: workflowId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowStepGroupsResponse'
      x-stackql-resource: workflow_step_groups
      x-stackql-method: list_workflow_step_groups
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.workflowStepGroupsSummary
  /template/{id}:
    delete:
      operationId: DeleteTemplate
      description: Deletes a migration workflow template.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TemplateId'
        description: The ID of the request to delete a migration workflow template.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTemplateResponse'
      x-stackql-resource: templates
      x-stackql-method: delete_template
      x-stackql-verb: DELETE
    post:
      operationId: UpdateTemplate
      description: Updates a migration workflow template.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TemplateId'
        description: The ID of the request to update a migration workflow template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateName:
                  $ref: '#/components/schemas/UpdateTemplateRequestTemplateNameString'
                templateDescription:
                  $ref: '#/components/schemas/UpdateTemplateRequestTemplateDescriptionString'
                clientToken:
                  $ref: '#/components/schemas/ClientToken'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTemplateResponse'
      x-stackql-resource: templates
      x-stackql-method: update_template
      x-stackql-verb: UPDATE
  /migrationworkflow/{id}:
    delete:
      operationId: DeleteWorkflow
      description: Delete a migration workflow. You must pause a running workflow in Migration Hub Orchestrator console to
        delete it.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow you want to delete.
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMigrationWorkflowResponse'
      x-stackql-resource: workflows
      x-stackql-method: delete_workflow
      x-stackql-verb: DELETE
    get:
      operationId: GetWorkflow
      description: Get migration workflow.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMigrationWorkflowResponse'
      x-stackql-resource: workflows
      x-stackql-method: get_workflow
      x-stackql-verb: SELECT
    post:
      operationId: UpdateWorkflow
      description: Update a migration workflow.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/UpdateMigrationWorkflowRequestNameString'
                description:
                  $ref: '#/components/schemas/UpdateMigrationWorkflowRequestDescriptionString'
                inputParameters:
                  $ref: '#/components/schemas/StepInputParameters'
                stepTargets:
                  $ref: '#/components/schemas/StringList'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMigrationWorkflowResponse'
      x-stackql-resource: workflows
      x-stackql-method: update_workflow
      x-stackql-verb: UPDATE
  /workflowstep/{id}:
    delete:
      operationId: DeleteWorkflowStep
      description: Delete a step in a migration workflow. Pause the workflow to delete a running step.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StepId'
        description: The ID of the step you want to delete.
      - name: stepGroupId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/StepGroupId'
        description: The ID of the step group that contains the step you want to delete.
      - name: workflowId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowStepResponse'
      x-stackql-resource: workflow_steps
      x-stackql-method: delete_workflow_step
      x-stackql-verb: DELETE
    get:
      operationId: GetWorkflowStep
      description: Get a step in the migration workflow.
      parameters:
      - name: workflowId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      - name: stepGroupId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/StepGroupId'
        description: The ID of the step group.
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StepId'
        description: The ID of the step.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkflowStepResponse'
      x-stackql-resource: workflow_steps
      x-stackql-method: get_workflow_step
      x-stackql-verb: SELECT
    post:
      operationId: UpdateWorkflowStep
      description: Update a step in a migration workflow.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StepId'
        description: The ID of the step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stepGroupId:
                  $ref: '#/components/schemas/StepGroupId'
                workflowId:
                  $ref: '#/components/schemas/MigrationWorkflowId'
                name:
                  $ref: '#/components/schemas/StepName'
                description:
                  $ref: '#/components/schemas/StepDescription'
                stepActionType:
                  $ref: '#/components/schemas/StepActionType'
                workflowStepAutomationConfiguration:
                  $ref: '#/components/schemas/WorkflowStepAutomationConfiguration'
                stepTarget:
                  $ref: '#/components/schemas/StringList'
                outputs:
                  $ref: '#/components/schemas/WorkflowStepOutputList'
                previous:
                  $ref: '#/components/schemas/StringList'
                next:
                  $ref: '#/components/schemas/StringList'
                status:
                  $ref: '#/components/schemas/StepStatus'
              required:
              - stepGroupId
              - workflowId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWorkflowStepResponse'
      x-stackql-resource: workflow_steps
      x-stackql-method: update_workflow_step
      x-stackql-verb: UPDATE
  /workflowstepgroup/{id}:
    delete:
      operationId: DeleteWorkflowStepGroup
      description: Delete a step group in a migration workflow.
      parameters:
      - name: workflowId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StepGroupId'
        description: The ID of the step group you want to delete.
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkflowStepGroupResponse'
      x-stackql-resource: workflow_step_groups
      x-stackql-method: delete_workflow_step_group
      x-stackql-verb: DELETE
    get:
      operationId: GetWorkflowStepGroup
      description: Get the step group of a migration workflow.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StepGroupId'
        description: The ID of the step group.
      - name: workflowId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkflowStepGroupResponse'
      x-stackql-resource: workflow_step_groups
      x-stackql-method: get_workflow_step_group
      x-stackql-verb: SELECT
    post:
      operationId: UpdateWorkflowStepGroup
      description: Update the step group in a migration workflow.
      parameters:
      - name: workflowId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StepGroupId'
        description: The ID of the step group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/StepGroupName'
                description:
                  $ref: '#/components/schemas/StepGroupDescription'
                next:
                  $ref: '#/components/schemas/StringList'
                previous:
                  $ref: '#/components/schemas/StringList'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWorkflowStepGroupResponse'
      x-stackql-resource: workflow_step_groups
      x-stackql-method: update_workflow_step_group
      x-stackql-verb: UPDATE
  /migrationworkflowtemplate/{id}:
    get:
      operationId: GetTemplate
      description: Get the template you want to use for creating a migration workflow.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TemplateId'
        description: The ID of the template.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMigrationWorkflowTemplateResponse'
      x-stackql-resource: templates
      x-stackql-method: get_template
      x-stackql-verb: SELECT
  /templatestep/{id}:
    get:
      operationId: GetTemplateStep
      description: Get a specific step in a template.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StepId'
        description: The ID of the step.
      - name: templateId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/TemplateId'
        description: The ID of the template.
      - name: stepGroupId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/StepGroupId'
        description: The ID of the step group.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTemplateStepResponse'
      x-stackql-resource: template_steps
      x-stackql-method: get_template_step
      x-stackql-verb: SELECT
  /templates/{template_id}/stepgroups/{id}:
    get:
      operationId: GetTemplateStepGroup
      description: Get a step group in a template.
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TemplateId'
        description: The ID of the template.
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StepGroupId'
        description: The ID of the step group.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTemplateStepGroupResponse'
      x-stackql-resource: template_step_groups
      x-stackql-method: get_template_step_group
      x-stackql-verb: SELECT
  /plugins:
    get:
      operationId: ListPlugins
      description: List AWS Migration Hub Orchestrator plugins.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The maximum number of plugins that can be returned.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NextToken'
        description: The pagination token.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPluginsResponse'
      x-stackql-resource: plugins
      x-stackql-method: list_plugins
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.plugins
  /tags/{resource_arn}:
    get:
      operationId: ListTagsForResource
      description: List the tags added to a resource.
      parameters:
      - name: resource_arn
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ResourceArn'
        description: The Amazon Resource Name (ARN) of the resource.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTagsForResourceResponse'
      x-stackql-resource: tags_for_resources
      x-stackql-method: list_tags_for_resource
      x-stackql-verb: SELECT
    post:
      operationId: TagResource
      description: Tag a resource by specifying its Amazon Resource Name (ARN).
      parameters:
      - name: resource_arn
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ResourceArn'
        description: The Amazon Resource Name (ARN) of the resource to which you want to add tags.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  $ref: '#/components/schemas/TagMap'
              required:
              - tags
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResourceResponse'
      x-stackql-resource: resources
      x-stackql-method: tag_resource
      x-stackql-verb: UPDATE
    delete:
      operationId: UntagResource
      description: Deletes the tags for a resource.
      parameters:
      - name: resource_arn
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ResourceArn'
        description: The Amazon Resource Name (ARN) of the resource from which you want to remove tags.
      - name: tagKeys
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/TagKeyList'
        description: One or more tag keys. Specify only the tag keys, not the tag values.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UntagResourceResponse'
      x-stackql-resource: resources
      x-stackql-method: untag_resource
      x-stackql-verb: UPDATE
  /templatestepgroups/{template_id}:
    get:
      operationId: ListTemplateStepGroups
      description: List the step groups in a template.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The maximum number of results that can be returned.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NextToken'
        description: The pagination token.
      - name: template_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TemplateId'
        description: The ID of the template.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTemplateStepGroupsResponse'
      x-stackql-resource: template_step_groups
      x-stackql-method: list_template_step_groups
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.templateStepGroupSummary
  /templatesteps:
    get:
      operationId: ListTemplateSteps
      description: List the steps in a template.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The maximum number of results that can be returned.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NextToken'
        description: The pagination token.
      - name: templateId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/TemplateId'
        description: The ID of the template.
      - name: stepGroupId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/StepGroupId'
        description: The ID of the step group.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTemplateStepsResponse'
      x-stackql-resource: template_steps
      x-stackql-method: list_template_steps
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.templateStepSummaryList
  /migrationworkflowtemplates:
    get:
      operationId: ListTemplates
      description: List the templates available in Migration Hub Orchestrator to create a migration workflow.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The maximum number of results that can be returned.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NextToken'
        description: The pagination token.
      - name: name
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TemplateName'
        description: The name of the template.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMigrationWorkflowTemplatesResponse'
      x-stackql-resource: templates
      x-stackql-method: list_templates
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.templateSummary
  /workflow/{workflow_id}/workflowstepgroups/{step_group_id}/workflowsteps:
    get:
      operationId: ListWorkflowSteps
      description: List the steps in a workflow.
      parameters:
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NextToken'
        description: The pagination token.
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The maximum number of results that can be returned.
      - name: workflow_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      - name: step_group_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StepGroupId'
        description: The ID of the step group.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowStepsResponse'
      x-stackql-resource: workflow_steps
      x-stackql-method: list_workflow_steps
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.workflowStepsSummary
  /migrationworkflows:
    get:
      operationId: ListWorkflows
      description: List the migration workflows.
      parameters:
      - name: maxResults
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MaxResults'
        description: The maximum number of results that can be returned.
      - name: nextToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/NextToken'
        description: The pagination token.
      - name: templateId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TemplateId'
        description: The ID of the template.
      - name: adsApplicationConfigurationName
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ApplicationConfigurationName'
        description: The name of the application configured in Application Discovery Service.
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MigrationWorkflowStatusEnum'
        description: The status of the migration workflow.
      - name: name
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/String'
        description: The name of the migration workflow.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMigrationWorkflowsResponse'
      x-stackql-resource: workflows
      x-stackql-method: list_workflows
      x-stackql-verb: SELECT
      x-stackql-objectKey: $.migrationWorkflowSummary
  /retryworkflowstep/{id}:
    post:
      operationId: RetryWorkflowStep
      description: Retry a failed step in a migration workflow.
      parameters:
      - name: workflowId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      - name: stepGroupId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/StepGroupId'
        description: The ID of the step group.
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StepId'
        description: The ID of the step.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryWorkflowStepResponse'
      x-stackql-resource: retry_workflow_step
      x-stackql-method: retry_workflow_step
      x-stackql-verb: EXEC
  /migrationworkflow/{id}/start:
    post:
      operationId: StartWorkflow
      description: Start a migration workflow.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartMigrationWorkflowResponse'
      x-stackql-resource: workflow
      x-stackql-method: start_workflow
      x-stackql-verb: EXEC
  /migrationworkflow/{id}/stop:
    post:
      operationId: StopWorkflow
      description: Stop an ongoing migration workflow.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MigrationWorkflowId'
        description: The ID of the migration workflow.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopMigrationWorkflowResponse'
      x-stackql-resource: workflow
      x-stackql-method: stop_workflow
      x-stackql-verb: EXEC
components:
  parameters:
    X-Amz-Content-Sha256:
      in: header
      name: X-Amz-Content-Sha256
      required: false
      schema:
        type: string
    X-Amz-Date:
      in: header
      name: X-Amz-Date
      required: false
      schema:
        type: string
    X-Amz-Algorithm:
      in: header
      name: X-Amz-Algorithm
      required: false
      schema:
        type: string
    X-Amz-Credential:
      in: header
      name: X-Amz-Credential
      required: false
      schema:
        type: string
    X-Amz-Security-Token:
      in: header
      name: X-Amz-Security-Token
      required: false
      schema:
        type: string
    X-Amz-Signature:
      in: header
      name: X-Amz-Signature
      required: false
      schema:
        type: string
    X-Amz-SignedHeaders:
      in: header
      name: X-Amz-SignedHeaders
      required: false
      schema:
        type: string
  schemas:
    CreateTemplateRequestTemplateNameString:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '[ a-zA-Z0-9]*'
    CreateTemplateRequestTemplateDescriptionString:
      type: string
      minLength: 0
      maxLength: 250
      pattern: .*
    TemplateSource:
      description: The migration workflow template used as the source for the new template.
      type: object
      properties:
        workflowId:
          $ref: '#/components/schemas/MigrationWorkflowId'
          description: The ID of the workflow from the source migration workflow template.
    MigrationWorkflowId:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '[a-zA-Z0-9-]+'
    ClientToken:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '[-a-zA-Z0-9]*'
    TagMap:
      type: object
      properties: {}
    CreateTemplateResponse:
      type: object
      properties:
        templateId:
          $ref: '#/components/schemas/String'
          description: The ID of the migration workflow template.
        templateArn:
          $ref: '#/components/schemas/String'
          description: The Amazon Resource Name (ARN) of the migration workflow template. The format for an Migration Hub
            Orchestrator template ARN is arn:aws:migrationhub-orchestrator:region:account:template/template-abcd1234. For
            more information about ARNs, see Amazon Resource Names (ARNs) in the AWS General Reference.
        tags:
          type: object
          properties: {}
          description: The tags added to the migration workflow template.
    String:
      type: string
    CreateMigrationWorkflowRequestNameString:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '[-a-zA-Z0-9_.+]+[-a-zA-Z0-9_.+ ]*'
    CreateMigrationWorkflowRequestDescriptionString:
      type: string
      minLength: 0
      maxLength: 500
      pattern: '[-a-zA-Z0-9_.+, ]*'
    CreateMigrationWorkflowRequestTemplateIdString:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '[-a-zA-Z0-9_.+]+[-a-zA-Z0-9_.+ ]*'
    CreateMigrationWorkflowRequestApplicationConfigurationIdString:
      type: string
      minLength: 0
      maxLength: 100
      pattern: '[-a-zA-Z0-9_.+]*'
    StepInputParameters:
      type: object
      properties: {}
    StringList:
      type: array
      items:
        $ref: '#/components/schemas/StringListMember'
    StringListMember:
      type: string
      minLength: 0
      maxLength: 500
    StringMap:
      type: object
      properties: {}
    CreateMigrationWorkflowResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MigrationWorkflowId'
          description: The ID of the migration workflow.
        arn:
          $ref: '#/components/schemas/String'
          description: The Amazon Resource Name (ARN) of the migration workflow.
        name:
          $ref: '#/components/schemas/String'
          description: The name of the migration workflow.
        description:
          $ref: '#/components/schemas/String'
          description: The description of the migration workflow.
        templateId:
          $ref: '#/components/schemas/String'
          description: The ID of the template.
        adsApplicationConfigurationId:
          $ref: '#/components/schemas/String'
          description: The configuration ID of the application configured in Application Discovery Service.
        workflowInputs:
          type: object
          properties: {}
          description: The inputs for creating a migration workflow.
        stepTargets:
          $ref: '#/components/schemas/StringList'
          description: The servers on which a step will be run.
        status:
          $ref: '#/components/schemas/MigrationWorkflowStatusEnum'
          description: The status of the migration workflow.
        creationTime:
          $ref: '#/components/schemas/Timestamp'
          description: The time at which the migration workflow was created.
        tags:
          type: object
          properties: {}
          description: The tags to add on a migration workflow.
    MigrationWorkflowStatusEnum:
      type: string
      enum:
      - CREATING
      - NOT_STARTED
      - CREATION_FAILED
      - STARTING
      - IN_PROGRESS
      - WORKFLOW_FAILED
      - PAUSED
      - PAUSING
      - PAUSING_FAILED
      - USER_ATTENTION_REQUIRED
      - DELETING
      - DELETION_FAILED
      - DELETED
      - COMPLETED
    Timestamp:
      type: string
      format: date-time
    MigrationWorkflowName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '[-a-zA-Z0-9_.+]+[-a-zA-Z0-9_.+ ]*'
    StepGroupId:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '[a-zA-Z0-9-]+'
    StepActionType:
      type: string
      enum:
      - MANUAL
      - AUTOMATED
    MigrationWorkflowDescription:
      type: string
      minLength: 0
      maxLength: 500
      pattern: '[-a-zA-Z0-9_.+, ]*'
    WorkflowStepAutomationConfiguration:
      description: The custom script to run tests on source or target environments.
      type: object
      properties:
        scriptLocationS3Bucket:
          $ref: '#/components/schemas/S3Bucket'
          description: The Amazon S3 bucket where the script is located.
        scriptLocationS3Key:
          $ref: '#/components/schemas/PlatformScriptKey'
          description: The Amazon S3 key for the script location.
        command:
          $ref: '#/components/schemas/PlatformCommand'
          description: The command required to run the script.
        runEnvironment:
          $ref: '#/components/schemas/RunEnvironment'
          description: The source or target environment.
        targetType:
          $ref: '#/components/schemas/TargetType'
          description: The servers on which to run the script.
    S3Bucket:
      type: string
      minLength: 0
      maxLength: 63
      pattern: '[0-9a-z]+[0-9a-z\.\-]*[0-9a-z]+'
    PlatformScriptKey:
      description: The script location for a particular operating system.
      type: object
      properties:
        linux:
          $ref: '#/components/schemas/S3Key'
          description: The script location for Linux.
        windows:
          $ref: '#/components/schemas/S3Key'
          description: The script location for Windows.
    S3Key:
      type: string
      minLength: 0
      maxLength: 1024
    PlatformCommand:
      description: Command to be run on a particular operating system.
      type: object
      properties:
        linux:
          $ref: '#/components/schemas/String'
          description: Command for Linux.
        windows:
          $ref: '#/components/schemas/String'
          description: Command for Windows.
    RunEnvironment:
      type: string
      enum:
      - AWS
      - ONPREMISE
    TargetType:
      type: string
      enum:
      - SINGLE
      - ALL
      - NONE
    WorkflowStepOutputList:
      type: array
      items:
        $ref: '#/components/schemas/WorkflowStepOutput'
    WorkflowStepOutput:
      description: The output of a step.
      type: object
      properties:
        name:
          $ref: '#/components/schemas/WorkflowStepOutputName'
          description: The name of the step.
        dataType:
          $ref: '#/components/schemas/DataType'
          description: The data type of the output.
        required_:
          $ref: '#/components/schemas/Boolean'
          description: Determine if an output is required from a step.
        value:
          $ref: '#/components/schemas/WorkflowStepOutputUnion'
          description: The value of the output.
    WorkflowStepOutputName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '[-a-zA-Z0-9_.+]+[-a-zA-Z0-9_.+ ]*'
    DataType:
      type: string
      enum:
      - STRING
      - INTEGER
      - STRINGLIST
      - STRINGMAP
    Boolean:
      type: boolean
    WorkflowStepOutputUnion:
      description: A structure to hold multiple values of an output.
      type: object
      properties:
        integerValue:
          $ref: '#/components/schemas/Integer'
          description: The integer value.
        stringValue:
          $ref: '#/components/schemas/MaxStringValue'
          description: The string value.
        listOfStringValue:
          $ref: '#/components/schemas/MaxStringList'
          description: The list of string value.
    Integer:
      type: integer
    MaxStringValue:
      type: string
      minLength: 0
      maxLength: 2048
    MaxStringList:
      type: array
      items:
        $ref: '#/components/schemas/MaxStringValue'
    CreateWorkflowStepResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/String'
          description: The ID of the step.
        stepGroupId:
          $ref: '#/components/schemas/String'
          description: The ID of the step group.
        workflowId:
          $ref: '#/components/schemas/String'
          description: The ID of the migration workflow.
        name:
          $ref: '#/components/schemas/String'
          description: The name of the step.
    StepGroupName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '[-a-zA-Z0-9_.+]+[-a-zA-Z0-9_.+ ]*'
    StepGroupDescription:
      type: string
      minLength: 0
      maxLength: 500
      pattern: '[-a-zA-Z0-9_.+, ]*'
    CreateWorkflowStepGroupResponse:
      type: object
